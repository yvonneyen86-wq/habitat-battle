<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: full-bleed 3D stage for an interactive whiteboard; HUD plates float on top */
:root{color-scheme:light;--ink:#1e2433;--muted:#667085;--deep:#1f8a4c;--gold:#ffb703;--display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;--bg:#6fc8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a3a}}
:root[data-theme="dark"]{--bg:#1b2a3a}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:flex-start;pointer-events:none;flex-wrap:wrap}
.plate{background:#fff;border-radius:22px;padding:10px 18px;box-shadow:0 6px 0 rgba(0,0,0,.14);border:4px solid #ffe08a}
.plate h1{font-family:var(--display);margin:0;font-size:1.7rem;color:var(--deep);line-height:1.05}
.plate p{margin:0;font-size:.85rem;color:var(--muted)}
.sp{flex:1}
.sc{pointer-events:auto;display:flex;gap:6px;background:#fff;border:4px solid #a5d8ff;border-radius:20px;padding:6px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.sc button{font:inherit;font-family:var(--display);font-size:1rem;border:0;border-radius:12px;padding:8px 12px;cursor:pointer;background:#f1f3f5;color:var(--ink)}
.sc button.sel{background:#3b5bdb;color:#fff}
.q{background:#fff;border-radius:20px;padding:10px 16px;max-width:min(560px,100%);box-shadow:0 6px 0 rgba(0,0,0,.14);border:4px solid #a5d8ff}
.q .k{display:inline-block;background:#3b5bdb;color:#fff;border-radius:99px;padding:2px 12px;font-size:.75rem;letter-spacing:.05em}
.q .t{font-family:var(--display);font-size:1.3rem;line-height:1.1;margin-top:4px}
.teams{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:12px;justify-content:space-between;align-items:flex-end;pointer-events:none;flex-wrap:wrap}
.tcard{background:#fff;border-radius:20px;padding:10px 16px;border:4px solid var(--tc);min-width:170px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.tcard b{font-family:var(--display);font-size:1.2rem;color:var(--tc)}
.bar{height:12px;border-radius:99px;background:#e9ecef;overflow:hidden;margin-top:5px;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#8ce99a,#2f9e44);transition:width .5s}
.ctr{pointer-events:auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:#fff;border:4px solid #ffe08a;border-radius:22px;padding:10px;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.ctr button{font:inherit;font-family:var(--display);font-size:1.15rem;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;background:#f1f3f5;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.ctr button:active{transform:translateY(3px);box-shadow:none}
.ctr button.war{background:#e03131;color:#fff}.ctr button.gold{background:var(--gold);color:#3a2a00}.ctr button.boss{background:#7048e8;color:#fff}.ctr button.ok{background:#40c057;color:#fff}
.ctr button:focus-visible,.sc button:focus-visible{outline:3px solid #3b5bdb}
.banner{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;animation:ban 2s cubic-bezier(.2,1,.3,1) forwards}
.banner span{display:inline-block;font-family:var(--display);font-size:clamp(2.4rem,9vw,6rem);line-height:1;color:#fff;background:var(--bc,#e03131);padding:.18em .7em;border-radius:.45em;box-shadow:0 .22em 0 rgba(0,0,0,.22);border:.1em solid #fff;transform:rotate(-2deg)}
@keyframes ban{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.note{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + 84px);background:rgba(255,255,255,.9);border-radius:12px;padding:6px 10px;font-size:.78rem;color:var(--muted);pointer-events:none}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
</style>

<script>
(function(){
if(typeof THREE==='undefined'){document.querySelector('.note').textContent='3D library could not load.';return;}
/* ===== core: renderer, helpers, materials ===== */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,.1,500);
const sun=new THREE.DirectionalLight(0xfff6e0,1.5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0006;sun.shadow.normalBias=.03;
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:120});sun.shadow.camera.updateProjectionMatrix();scene.add(sun);
const hemi=new THREE.HemisphereLight(0xd6f0ff,0x5fae4a,.75);scene.add(hemi);
const fill=new THREE.DirectionalLight(0xbfe3ff,.35);fill.position.set(-20,10,-16);scene.add(fill);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6,metalness:0},o));
const GLOSS=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.35,metalness:.05},o));
const GLOW=(c,e,i=.8,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,emissive:e,emissiveIntensity:i,roughness:.4},o));
const rnd=(a,b)=>a+Math.random()*(b-a);
const mesh=(g,m,x=0,y=0,z=0,sh=true)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;return o;};
const SPH=(r,a=20,b=14)=>new THREE.SphereGeometry(r,a,b);
const CYL=(a,b,h,s=16)=>new THREE.CylinderGeometry(a,b,h,s);
const BOX=(a,b,c)=>new THREE.BoxGeometry(a,b,c);
const CONE=(r,h,s=16)=>new THREE.ConeGeometry(r,h,s);
function lathe(pts,seg=64){return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);}
function capsule(r,h,m){const g=new THREE.Group();g.add(mesh(CYL(r,r,h,20),m,0,0,0));g.add(mesh(SPH(r),m,0,h/2,0));g.add(mesh(SPH(r),m,0,-h/2,0));return g;}
/* sky dome with vertex gradient */
let sky=null;
function setSky(top,hor,fogCol,fogNear=60,fogFar=140){if(sky)scene.remove(sky);const g=new THREE.SphereGeometry(220,32,16);const pos=g.attributes.position,col=[];const T=new THREE.Color(top),H=new THREE.Color(hor);
 for(let i=0;i<pos.count;i++){const y=pos.getY(i)/220;const c=H.clone().lerp(T,Math.max(0,Math.min(1,(y+.1)*1.3)));col.push(c.r,c.g,c.b);}
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false}));scene.add(sky);scene.fog=new THREE.Fog(fogCol,fogNear,fogFar);}
/* canvas sprites */
function canvasTex(draw,w=512,h=160){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t;}
function rr(x,X,Y,W,H,R){if(x.roundRect){x.beginPath();x.roundRect(X,Y,W,H,R);x.fill();}else{x.fillRect(X,Y,W,H);}}
function labelSprite(name,color){const t=canvasTex((x,w,h)=>{x.fillStyle='#fff';rr(x,6,34,w-12,92,46);x.fillStyle=color;rr(x,14,42,w-28,76,38);x.fillStyle='#fff';x.font='900 56px Nunito,"Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(name,w/2,82);});const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(3.8,1.19,1);return s;}
function bubbleSprite(name,color){const t=canvasTex((x,w,h)=>{x.fillStyle=color;rr(x,10,8,w-20,132,46);x.fillStyle='#fff';rr(x,20,18,w-40,112,38);x.beginPath();x.moveTo(w/2-28,128);x.lineTo(w/2,170);x.lineTo(w/2+28,128);x.closePath();x.fillStyle='#fff';x.fill();x.fillStyle=color;x.font='900 64px Nunito,"Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(name,w/2,76);},512,176);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(3.6,1.24,1);return s;}
function hpSprite(){const c=document.createElement('canvas');c.width=512;c.height=72;const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(3.2,.45,1);
 s.userData.draw=(pct)=>{const x=c.getContext('2d');x.clearRect(0,0,512,72);x.fillStyle='#fff';rr(x,8,8,496,56,28);x.fillStyle='#e9ecef';rr(x,18,18,476,36,18);x.fillStyle=pct<.35?'#ff6b6b':'#51cf66';rr(x,18,18,Math.max(36,476*Math.max(0,pct)),36,18);t.needsUpdate=true;};s.userData.draw(1);return s;}
function textSprite(txt,size=1.7){const t=canvasTex((x,w,h)=>{x.font='200px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,w/2,h/2+10);},256,256);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(size,size,1);return s;}
/* animation + particles */
const anims=[];function animate(dur,fn,done){anims.push({t:0,dur,fn,done});}
const parts=[];const partGeos=[SPH(.16,8,6),BOX(.24,.24,.24),new THREE.OctahedronGeometry(.2)];const partMats={};
function spawn(pos,color,n=18,speed=6,up=5,life=1.1){const m=partMats[color]||(partMats[color]=GLOSS(color,{emissive:color,emissiveIntensity:.35}));for(let i=0;i<n;i++){const o=new THREE.Mesh(partGeos[i%3],m);o.position.copy(pos);o.userData={v:new THREE.Vector3(rnd(-1,1)*speed,rnd(.3,1)*up+2,rnd(-1,1)*speed),life:life*rnd(.7,1.3),rot:new THREE.Vector3(rnd(-5,5),rnd(-5,5),rnd(-5,5))};scene.add(o);parts.push(o);}}
function ring(pos,color){const r=new THREE.Mesh(new THREE.TorusGeometry(1,.12,10,48),GLOSS(color,{emissive:color,emissiveIntensity:.6,transparent:true}));r.rotation.x=Math.PI/2;r.position.copy(pos);r.position.y+=.3;scene.add(r);animate(.7,k=>{r.scale.setScalar(1+k*5);r.material.opacity=1-k;},()=>scene.remove(r));}
function banner(t,c){const b=document.createElement('div');b.className='banner';b.style.setProperty('--bc',c||'#e03131');b.innerHTML='<span></span>';b.firstChild.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),2000);}

/* ===== characters: chibi figures built from primitives. Each returns a Group ~2.3 units tall, facing +z ===== */
const EYE_W=GLOSS(0xffffff),EYE_B=GLOSS(0x111111),BLUSH=M(0xff8fa3,{transparent:true,opacity:.7});
function eyes(g,y,z,dx=.26,r=.17,pr=.09){for(const s of[-1,1]){g.add(mesh(SPH(r,14,10),EYE_W,s*dx,y,z));g.add(mesh(SPH(pr,10,8),EYE_B,s*dx,y+.01,z+r*.75));g.add(mesh(SPH(pr*.35,6,5),EYE_W,s*dx+pr*.3,y+pr*.35,z+r*.95));}}
function smile(g,y,z,w=.22){const t=new THREE.TorusGeometry(w,.035,6,16,Math.PI);const m=mesh(t,EYE_B,0,y,z);m.rotation.z=Math.PI;g.add(m);}
function blush(g,y,z,dx=.42){for(const s of[-1,1]){const b=mesh(SPH(.09,8,6),BLUSH,s*dx,y,z,false);b.scale.z=.4;g.add(b);}}
function limbs(g,bodyMat,y,dx,len=.5,r=.13){for(const s of[-1,1]){const a=mesh(CYL(r,r*.9,len,10),bodyMat,s*dx,y,0);a.rotation.z=s*.35;g.add(a);g.add(mesh(SPH(r*1.15,10,8),bodyMat,s*(dx+.12),y-len/2,0));}}
function feet(g,mat,dx=.28,z=.15){for(const s of[-1,1]){const f=mesh(SPH(.22,12,8),mat,s*dx,.12,z);f.scale.set(1,.55,1.3);g.add(f);}}
/* base body: returns {g, body material}. headY = center of head */
function base(bodyC,bellyC){const g=new THREE.Group();const bm=GLOSS(bodyC);const body=mesh(SPH(.62,22,16),bm,0,.95,0);body.scale.set(1,1.1,.9);g.add(body);
 if(bellyC!=null){const b=mesh(SPH(.45,18,12),GLOSS(bellyC),0,.85,.3);b.scale.set(1,1.1,.6);g.add(b);}
 feet(g,bm);limbs(g,bm,1.05,.62);const head=mesh(SPH(.78,24,18),bm,0,2.05,0);g.add(head);g.userData.head=head;g.userData.bm=bm;return g;}
const CHAR_BUILDERS={
 lion(){const g=base(0xf4c542,0xfff0c2);const mane=mesh(new THREE.TorusGeometry(.78,.34,14,28),GLOSS(0xe8742b),0,2.05,-.15);g.add(mane);for(let i=0;i<10;i++){const a=i/10*6.28;const t=mesh(CONE(.22,.5,8),GLOSS(0xe8742b),Math.cos(a)*1.05,2.05+Math.sin(a)*1.05,-.1);t.rotation.z=-a-Math.PI/2;g.add(t);}
  for(const s of[-1,1])g.add(mesh(SPH(.2,10,8),GLOSS(0xf4c542),s*.55,2.7,0));g.add(mesh(SPH(.3,14,10),GLOSS(0xfff0c2),0,1.85,.6)).scale.set(1.3,.8,.8);g.add(mesh(SPH(.1,8,6),GLOSS(0x3b2416),0,1.98,.86));eyes(g,2.2,.62);blush(g,1.95,.6,.5);
  const tail=mesh(CYL(.06,.06,1,8),GLOSS(0xf4c542),.4,.9,-.7);tail.rotation.x=1.1;g.add(tail);g.add(mesh(SPH(.16,10,8),GLOSS(0xe8742b),.4,1.3,-1.15));return g;},
 panda(){const g=base(0xffffff,null);const k=GLOSS(0x222222);for(const s of[-1,1]){g.add(mesh(SPH(.24,12,8),k,s*.6,2.65,0));const p=mesh(SPH(.26,12,8),k,s*.3,2.2,.62);p.scale.set(1,1.3,.5);g.add(p);}
  eyes(g,2.2,.75,.3,.13,.08);g.add(mesh(SPH(.1,8,6),k,0,1.95,.78));smile(g,1.82,.75,.16);limbs(g,k,1.05,.62);feet(g,k);blush(g,1.95,.72,.55);return g;},
 monkey(){const g=base(0x9a5f2e,0xf2cfa0);for(const s of[-1,1])g.add(mesh(SPH(.26,12,8),GLOSS(0x9a5f2e),s*.78,2.15,0)),g.add(mesh(SPH(.16,10,8),GLOSS(0xf2cfa0),s*.8,2.15,.12));
  const face=mesh(SPH(.5,18,12),GLOSS(0xf2cfa0),0,1.95,.45);face.scale.set(1.15,.9,.6);g.add(face);eyes(g,2.2,.7);smile(g,1.78,.85,.2);
  const tail=mesh(new THREE.TorusGeometry(.35,.06,8,20,4.5),GLOSS(0x9a5f2e),.3,1,-.75);tail.rotation.y=Math.PI/2;g.add(tail);return g;},
 elephant(){const g=base(0x9fb4d8,0xd6e2f5);for(const s of[-1,1]){const e=mesh(SPH(.5,16,12),GLOSS(0x9fb4d8),s*.85,2.15,-.1);e.scale.set(.35,1,1);g.add(e);const inner=mesh(SPH(.36,14,10),GLOSS(0xffc2d9),s*.9,2.15,-.1);inner.scale.set(.25,.8,.8);g.add(inner);}
  const trunk=mesh(CYL(.16,.22,.9,12),GLOSS(0x9fb4d8),0,1.65,.65);trunk.rotation.x=.5;g.add(trunk);g.add(mesh(SPH(.2,10,8),GLOSS(0x9fb4d8),0,1.25,.85));eyes(g,2.25,.68);blush(g,1.98,.65,.5);return g;},
 trex(){const g=base(0x5bc85b,0xd9f7b1);g.userData.head.scale.set(1.15,1,1.25);g.add(mesh(SPH(.42,16,12),GLOSS(0x5bc85b),0,1.85,.75)).scale.set(1.2,.7,1);
  for(let i=0;i<4;i++)g.add(mesh(CONE(.07,.18,6),EYE_W,-.3+i*.2,1.72,1.15)).rotation.x=Math.PI;eyes(g,2.3,.62,.3);for(let i=0;i<4;i++)g.add(mesh(CONE(.12,.3,6),GLOSS(0x2f9e44),0,2.6+i*-.0,-.25-i*.22)).rotation.x=-.6-i*.2;
  const tail=mesh(CONE(.25,1.3,10),GLOSS(0x5bc85b),0,.8,-.9);tail.rotation.x=-Math.PI/2+.4;g.add(tail);limbs(g,g.userData.bm,1.2,.55,.3,.09);return g;},
 bronto(){const g=base(0x74b9ff,0xdff4ff);g.remove(g.userData.head);const neck=mesh(CYL(.26,.4,1.6,14),GLOSS(0x74b9ff),0,2,-.1);neck.rotation.x=-.25;g.add(neck);const head=mesh(SPH(.5,18,12),GLOSS(0x74b9ff),0,2.95,.25);head.scale.set(1,.85,1.2);g.add(head);g.userData.head=head;
  eyes(g,3.05,.6,.22,.13,.07);smile(g,2.78,.72,.14);for(let i=0;i<5;i++)g.add(mesh(SPH(.1,8,6),GLOSS(0x3b5bdb),0,2.1+i*.2,-.45+i*.05));const tail=mesh(CONE(.25,1.4,10),GLOSS(0x74b9ff),0,.9,-.95);tail.rotation.x=-Math.PI/2+.5;g.add(tail);return g;},
 egg(){const g=new THREE.Group();const shell=GLOSS(0xfff3bf);const bottom=mesh(SPH(.8,24,18,0,6.28,1.2,2),shell,0,1.05,0);bottom.scale.set(1,1.3,1);g.add(bottom);for(let i=0;i<8;i++){const a=i/8*6.28;g.add(mesh(CONE(.22,.4,4),shell,Math.cos(a)*.78,1.35,Math.sin(a)*.78)).rotation.set(0,-a,0);}
  const chick=mesh(SPH(.62,20,14),GLOSS(0xffd43b),0,1.7,0);g.add(chick);g.userData.head=chick;const top=mesh(SPH(.6,24,18,0,6.28,0,1.2),shell,0,2.05,0);top.scale.set(1,1.2,1);g.add(top);eyes(g,1.8,.5,.22,.12,.07);g.add(mesh(CONE(.12,.25,6),GLOSS(0xff922b),0,1.6,.68)).rotation.x=Math.PI/2;feet(g,GLOSS(0xff922b),.25,.1);blush(g,1.6,.48,.42);return g;},

 ()=>{scene.remove(proj);trail.forEach(s=>scene.remove(s));spawn(b,0xff922b,28,7,6,1);spawn(b,0xffd43b,16,5,5,.9);ring(to.position,0xff922b);to.userData.shake=1;setHp(to,to.userData.hpv-dmg);shakeCam=.6;if(to.userData.hpv<=0&&!to.userData.down){knockOut(to);setTimeout(()=>banner('KO!','#495057'),150);}});}
function levelUp(g){const p=g.userData.p;if(p.lv>=3||g.userData.down)return false;const lv=p.lv;p.lv=lv+1;const old=g.userData.hab;jump(g);
 animate(.7,k=>{old.rotation.y=k*12;old.scale.setScalar(1-k*.9);old.position.y=.5+k*2.5;},()=>{g.remove(old);const h=habFor(p);h.position.y=.5;h.scale.setScalar(.01);g.add(h);g.userData.hab=h;g.userData.hp0=HPMAX[lv];setHp(g,HPMAX[lv]);spawn(g.position.clone().setY(3),0xffd43b,44,6,8,1.5);spawn(g.position.clone().setY(3),0xffffff,20,5,6,1.2);ring(g.position,0xffd43b);banner('LEVEL UP!','#f08c00');
  animate(1,k=>{const s=k<.6?k/.6*1.3:1.3-(k-.6)/.4*.3;h.scale.setScalar(Math.max(.01,s));h.rotation.y=(1-k)*6;});});return true;}
const BOSS_NAME={jungle:'Jungle Giant',dino:'Lava Dragon',space:'Galaxy Monster',town:'Grumpy Ogre'};
function summonBoss(){if(boss)return;boss=BOSS[current]();boss.position.set(0,1.2,-9);boss.scale.setScalar(.01);boss.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});world.add(boss);banner('BOSS BATTLE!','#7048e8');
 animate(.8,k=>{boss.scale.setScalar(Math.min(1.3,k*1.4));},()=>{animate(.3,k=>boss.scale.setScalar(1.3-k*.3));spawn(boss.position.clone().setY(1.5),0x9775fa,44,8,6,1.3);ring(boss.position,0x9775fa);shakeCam=1;setTimeout(bossAttack,900);});}
function bossAttack(){if(!boss)return;const alive=players.filter(p=>!p.userData.down);if(!alive.length)return;const target=alive[Math.floor(Math.random()*alive.length)];animate(.5,k=>{boss.scale.setScalar(1+Math.sin(k*Math.PI)*.25);boss.rotation.z=Math.sin(k*Math.PI*2)*.15;},()=>{const a=boss.position.clone().setY(5),b=target.position.clone().setY(2.6);const f=mesh(SPH(.6,14,10),GLOW(0xff6b6b,0xff922b,1));f.position.copy(a);scene.add(f);animate(.8,k=>{f.position.lerpVectors(a,b,k);f.position.y+=Math.sin(k*Math.PI)*5;f.scale.setScalar(1+Math.sin(k*20)*.15);},()=>{scene.remove(f);spawn(b,0xff6b6b,26,7,6,1);ring(target.position,0xff6b6b);target.userData.shake=1;setHp(target,target.userData.hpv-2);shakeCam=.8;if(target.userData.hpv<=0&&!target.userData.down)knockOut(target);});});}
function resetAll(){players.forEach(g=>{revive(g);setHp(g,g.userData.hp0);});if(boss){world.remove(boss);boss=null;}}
document.querySelector('.ctr').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='attack'){const reds=players.filter(p=>p.userData.p.team===0&&!p.userData.down),blues=players.filter(p=>p.userData.p.team===1&&!p.userData.down);if(!reds.length||!blues.length)return;const from=reds[Math.floor(Math.random()*reds.length)];const to=blues.sort((x,y)=>y.userData.hpv-x.userData.hpv)[0];attack(from,to,3);banner('ACTION!','#e03131');}
 if(a==='level'){const c=players.filter(p=>p.userData.p.lv<3&&!p.userData.down);if(c.length)levelUp(c[Math.floor(Math.random()*c.length)]);}
 if(a==='heal'){const c=players.filter(p=>p.userData.down||p.userData.hpv<p.userData.hp0);if(!c.length)return;const g=c[Math.floor(Math.random()*c.length)];if(g.userData.down)revive(g);else{setHp(g,g.userData.hpv+4);spawn(g.position.clone().setY(3),0x69db7c,16,4,5,1);ring(g.position,0x51cf66);}}
 if(a==='boss')summonBoss();if(a==='reset')resetAll();if(a==='cheer')players.forEach((g,i)=>setTimeout(()=>jump(g),i*120));});
document.querySelector('.sc').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&ENV[b.dataset.s])loadScene(b.dataset.s);});
/* camera: orbit, drag, pinch */
let theta=.55,phi=.46,radius=40,shakeCam=0,auto=true,idle=0;const ptrs=new Map();let pinch0=0,rad0=0;
const target=new THREE.Vector3(0,2.5,0);
stage.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});auto=false;idle=0;if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);rad0=radius;}});
const endPtr=e=>ptrs.delete(e.pointerId);addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;if(ptrs.size===1){theta-=(e.clientX-p.x)*.006;phi=Math.max(.18,Math.min(1.1,phi+(e.clientY-p.y)*.004));}p.x=e.clientX;p.y=e.clientY;if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0)radius=Math.max(18,Math.min(60,rad0*pinch0/d));}});
stage.addEventListener('wheel',e=>{radius=Math.max(18,Math.min(60,radius+e.deltaY*.03));},{passive:true});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
/* loop */
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 if(!ptrs.size){idle+=dt;if(idle>5)auto=true;}if(auto&&!RM)theta+=dt*.07;
 const sh=shakeCam>0?(shakeCam-=dt*1.6,Math.sin(t*60)*shakeCam*.35):0;
 camera.position.set(target.x+Math.sin(theta)*Math.cos(phi)*radius,target.y+Math.sin(phi)*radius+sh,target.z+Math.cos(theta)*Math.cos(phi)*radius);camera.lookAt(target);
 if(!RM){envAnim.trees.forEach(p=>{p.rotation.z=Math.sin(t*1.1+p.userData.sway)*.025;p.rotation.x=Math.cos(t*.9+p.userData.sway)*.02;});
  envAnim.clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>60)c.position.x=-60;});envAnim.coins.forEach(c=>{c.rotation.y=t*2.5+c.userData.ph;c.position.y+=Math.sin(t*2+c.userData.ph)*.004;});
  if(env&&env.tick)env.tick(dt,t);if(world)world.position.y=Math.sin(t*.5)*.25;
  players.forEach(g=>{const u=g.userData;if(!u.down){u.hab.position.y=.5+Math.sin(t*1.6+u.bob)*.05;const ch=u.ch;if(!anims.some(a=>a.g===g)){ch.position.y=.5+Math.abs(Math.sin(t*2.4+u.bob))*.18;}u.lab.position.y=4.9+Math.sin(t*2+u.bob)*.12;ch.rotation.y=.35+Math.sin(t*.8+u.bob)*.25;if(ch.userData.head)ch.userData.head.rotation.z=Math.sin(t*1.7+u.bob)*.08;ch.traverse(o=>{if(o.userData.flame)o.scale.y=1+Math.sin(t*25+o.position.x*9)*.4;});}
   const cl=u.flag.userData.cloth,pa=cl.geometry.attributes.position.array,ba=cl.userData.base;for(let i=0;i<pa.length;i+=3){pa[i+2]=Math.sin(t*5+ba[i]*3)*.12*ba[i];}cl.geometry.attributes.position.needsUpdate=true;
   if(u.shake>0){u.shake-=dt*2.2;g.rotation.z=Math.sin(t*50)*u.shake*.12;g.rotation.x=Math.cos(t*47)*u.shake*.08;}else{g.rotation.z=0;g.rotation.x=0;}});
  if(boss){boss.position.y=1.2+Math.abs(Math.sin(t*2))*.25;boss.rotation.y=Math.sin(t*.8)*.25;}}
 for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt;const k=Math.min(1,a.t/a.dur);a.fn(k);if(k>=1){anims.splice(i,1);a.done&&a.done();}}
 for(let i=parts.length-1;i>=0;i--){const o=parts[i],u=o.userData;u.life-=dt;if(u.life<=0||o.position.y<-4){scene.remove(o);parts.splice(i,1);continue;}u.v.y-=18*dt;o.position.addScaledVector(u.v,dt);o.rotation.x+=u.rot.x*dt;o.rotation.y+=u.rot.y*dt;o.scale.setScalar(Math.min(1,u.life*2));}
 renderer.render(scene,camera);}
loadScene('jungle');loop();

})();

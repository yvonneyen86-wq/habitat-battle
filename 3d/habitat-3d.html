<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habitat Battle 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: full-bleed 3D stage for an interactive whiteboard; HUD plates float on top */
:root{color-scheme:light;--ink:#1e2433;--muted:#667085;--deep:#1f8a4c;--gold:#ffb703;--display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;--bg:#6fc8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a3a}}
:root[data-theme="dark"]{--bg:#1b2a3a}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:12px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:none;transition:opacity .45s,transform .45s}
.glass{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(30,36,51,.16)}
.plate{border-radius:99px;padding:6px 16px 6px 10px;display:flex;align-items:center;gap:8px}
.plate h1{font-family:var(--display);margin:0;font-size:1.25rem;color:var(--deep);line-height:1}
.plate p{display:none}
.sp{flex:1}
.q{border-radius:18px;padding:8px 14px;max-width:min(460px,60vw)}
.q .k{display:inline-block;background:#3b5bdb;color:#fff;border-radius:99px;padding:1px 10px;font-size:.68rem;letter-spacing:.05em}
.q .t{font-family:var(--display);font-size:1.12rem;line-height:1.1;margin-top:3px}
.fab{pointer-events:auto;font:inherit;font-family:var(--display);font-size:1rem;border-radius:99px;padding:8px 16px;cursor:pointer;color:var(--ink);border:1px solid rgba(255,255,255,.9)}
.fab:hover{background:#fff}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:20;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto;border-radius:24px 0 0 24px;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between}.drawer .dh b{font-family:var(--display);font-size:1.3rem}
.drawer .dh button{font:inherit;border:0;background:#f1f3f5;border-radius:99px;width:36px;height:36px;cursor:pointer;font-size:1rem}
.drawer h3{margin:4px 0 0;font-family:var(--display);font-size:1rem;color:var(--muted)}
.sc{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc button{font:inherit;font-family:var(--display);font-size:1rem;border:2px solid #e9ecef;border-radius:14px;padding:10px;cursor:pointer;background:#fff;color:var(--ink)}
.sc button.sel{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
.bases{pointer-events:auto;display:grid;gap:10px;font-size:.88rem}
.bases .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.bases .row>b{font-family:var(--display);margin-right:4px}
.bases .chip{font-family:var(--display);color:#fff;background:var(--tc);border-radius:99px;padding:3px 12px;min-width:70px;text-align:center}
.bases button{font:inherit;font-size:.84rem;border:2px solid #e9ecef;background:#fff;border-radius:10px;padding:5px 10px;cursor:pointer;color:var(--ink)}
.bases button.sel{background:var(--tc);border-color:var(--tc);color:#fff}.bases button.taken{opacity:.35}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(20,24,40,.18);opacity:0;pointer-events:none;transition:opacity .3s}.scrim.open{opacity:1;pointer-events:auto}
/* bottom: slim team chips + control dock */
.teams{position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;justify-content:space-between;align-items:flex-end;pointer-events:none;flex-wrap:wrap;transition:opacity .45s,transform .45s}
.tcards{display:flex;gap:8px;flex-wrap:wrap}
.tcard{border-radius:16px;padding:6px 12px;min-width:132px;border-left:6px solid var(--tc)}
.tcard b{font-family:var(--display);font-size:1rem;color:var(--tc)}.tcard small{display:block;color:var(--muted);font-size:.72rem;line-height:1.1}
.bar{height:8px;border-radius:99px;background:#e9ecef;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#8ce99a,#2f9e44);transition:width .5s}
.ctr{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-radius:20px;padding:8px}
.ctr button{font:inherit;font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:10px 16px;cursor:pointer;background:#f1f3f5;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.16)}
.ctr button:active{transform:translateY(3px);box-shadow:none}
.ctr button.war{background:#e03131;color:#fff}.ctr button.gold{background:var(--gold);color:#3a2a00}.ctr button.boss{background:#7048e8;color:#fff}.ctr button.ok{background:#40c057;color:#fff}
.ctr button:focus-visible,.sc button:focus-visible,.fab:focus-visible{outline:3px solid #3b5bdb}
/* cinematic mode: HUD slides away, letterbox bars slide in */
.lb{position:fixed;left:0;right:0;height:9vh;background:#0b0d14;z-index:15;pointer-events:none;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.lb.top{top:0;transform:translateY(-100%)}.lb.bot{bottom:0;transform:translateY(100%)}
body.cine .lb{transform:none}
body.cine .hud{opacity:0;transform:translateY(-30px)}
body.cine .teams{opacity:0;transform:translateY(30px);pointer-events:none}
body.cine .teams *{pointer-events:none}
.banner{position:fixed;left:0;right:0;top:30%;z-index:16;text-align:center;pointer-events:none;animation:ban 2s cubic-bezier(.2,1,.3,1) forwards}
.banner span{display:inline-block;font-family:var(--display);font-size:clamp(2.4rem,9vw,6rem);line-height:1;color:#fff;background:var(--bc,#e03131);padding:.18em .7em;border-radius:.45em;box-shadow:0 .22em 0 rgba(0,0,0,.22);border:.1em solid #fff;transform:rotate(-2deg)}
@keyframes ban{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="lb top"></div><div class="lb bot"></div>
<div class="hud"><div class="plate glass"><h1 id="title">🌴 Jungle Safari</h1><p class="note">3D prototype with sample students</p></div><span class="sp"></span><div class="q glass"><span class="k">⌨️ TYPE A FULL SENTENCE · ROUND 3</span><div class="t">What did you do last weekend?</div></div><button class="fab glass" id="fab">🗺️ Worlds &amp; Bases</button></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer glass" id="drawer" aria-label="Worlds and bases"><div class="dh"><b>🗺️ Worlds &amp; Bases</b><button id="dclose" aria-label="Close">✕</button></div>
 <h3>World</h3><div class="sc"><button data-s="jungle" class="sel">🌴 Jungle</button><button data-s="dino">🌋 Dino</button><button data-s="space">🪐 Solar System</button><button data-s="town">🏙️ Hsinchu</button></div>
 <h3>Teams &amp; bases</h3><div class="bases" id="bases"></div></aside>
<div class="teams">
  <div class="tcards" id="tcards"></div>
  <div class="ctr glass"><button class="war" data-a="attack">⚔️ Attack</button><button class="gold" data-a="level">🔨 Level up</button><button class="ok" data-a="heal">❤️ Repair</button><button class="boss" data-a="boss">👹 Boss</button><button data-a="cheer">🎉 Cheer</button><button data-a="reset">↺ Reset</button></div>
</div>
<script>
(function(){
if(typeof THREE==='undefined'){document.querySelector('.note').textContent='3D library could not load.';return;}
/* ===== core: renderer, helpers, materials ===== */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(31,1,.1,900);
const sun=new THREE.DirectionalLight(0xfff3dc,1.25);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0006;sun.shadow.normalBias=.03;
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:120});sun.shadow.camera.updateProjectionMatrix();scene.add(sun);
const hemi=new THREE.HemisphereLight(0xdfeef5,0x8a7a5a,.9);scene.add(hemi);
const fill=new THREE.DirectionalLight(0xbfe3ff,.35);fill.position.set(-20,10,-16);scene.add(fill);
/* hex colours are authored in sRGB; convert so they stay saturated under sRGB output + ACES */
/* low-poly look: flat-shaded facets + a softened (slightly desaturated) palette like a papercraft diorama */
const SOFT=new THREE.Color(0x9c9890);
const col=c=>{const k=new THREE.Color(c);return k.lerp(SOFT,.16).convertSRGBToLinear();};
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:col(c),roughness:.85,metalness:0,flatShading:true},o));
const GLOSS=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:col(c),roughness:.6,metalness:0,flatShading:true},o));
const GLOW=(c,e,i=.8,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:col(c),emissive:col(e),emissiveIntensity:i,roughness:.6,flatShading:true},o));
function outline(root){return root;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const mesh=(g,m,x=0,y=0,z=0,sh=true)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;return o;};
const SPH=(r,a=9,b=7)=>new THREE.SphereGeometry(r,a,b);
const CYL=(a,b,h,s=10)=>new THREE.CylinderGeometry(a,b,h,s);
const BOX=(a,b,c)=>new THREE.BoxGeometry(a,b,c);
const CONE=(r,h,s=8)=>new THREE.ConeGeometry(r,h,s);
function lathe(pts,seg=24){return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);}
function capsule(r,h,m){const g=new THREE.Group();g.add(mesh(CYL(r,r,h,20),m,0,0,0));g.add(mesh(SPH(r),m,0,h/2,0));g.add(mesh(SPH(r),m,0,-h/2,0));return g;}
/* sky dome with vertex gradient */
let sky=null;
function setSky(top,hor,fogCol,fogNear=60,fogFar=140){if(sky)scene.remove(sky);const g=new THREE.SphereGeometry(220,32,16);const pos=g.attributes.position,cols=[];const T=col(top),H=col(hor);
 for(let i=0;i<pos.count;i++){const y=pos.getY(i)/220;const c=H.clone().lerp(T,Math.max(0,Math.min(1,(y+.1)*1.3)));cols.push(c.r,c.g,c.b);}
 g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false}));scene.add(sky);scene.fog=new THREE.Fog(col(fogCol),fogNear,fogFar);}
/* canvas sprites */
function canvasTex(draw,w=512,h=160){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t;}
function rr(x,X,Y,W,H,R){if(x.roundRect){x.beginPath();x.roundRect(X,Y,W,H,R);x.fill();}else{x.fillRect(X,Y,W,H);}}
function labelSprite(name,color){const t=canvasTex((x,w,h)=>{x.fillStyle='#fff';rr(x,6,34,w-12,92,46);x.fillStyle=color;rr(x,14,42,w-28,76,38);x.fillStyle='#fff';x.font='900 56px Nunito,"Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(name,w/2,82);});const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(3.8,1.19,1);return s;}
function bubbleSprite(name,color){const t=canvasTex((x,w,h)=>{x.fillStyle=color;rr(x,10,8,w-20,132,46);x.fillStyle='#fff';rr(x,20,18,w-40,112,38);x.beginPath();x.moveTo(w/2-28,128);x.lineTo(w/2,170);x.lineTo(w/2+28,128);x.closePath();x.fillStyle='#fff';x.fill();x.fillStyle=color;x.font='900 64px Nunito,"Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(name,w/2,76);},512,176);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(3.6,1.24,1);return s;}
function hpSprite(){const c=document.createElement('canvas');c.width=512;c.height=72;const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(3.2,.45,1);
 s.userData.draw=(pct)=>{const x=c.getContext('2d');x.clearRect(0,0,512,72);x.fillStyle='#fff';rr(x,8,8,496,56,28);x.fillStyle='#e9ecef';rr(x,18,18,476,36,18);x.fillStyle=pct<.35?'#ff6b6b':'#51cf66';rr(x,18,18,Math.max(36,476*Math.max(0,pct)),36,18);t.needsUpdate=true;};s.userData.draw(1);return s;}
function textSprite(txt,size=1.7){const t=canvasTex((x,w,h)=>{x.font='200px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,w/2,h/2+10);},256,256);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true}));s.scale.set(size,size,1);return s;}
/* animation + particles */
const anims=[];function animate(dur,fn,done){anims.push({t:0,dur,fn,done});}
const parts=[];const partGeos=[SPH(.16,8,6),BOX(.24,.24,.24),new THREE.OctahedronGeometry(.2)];const partMats={};
function spawn(pos,color,n=18,speed=6,up=5,life=1.1){const m=partMats[color]||(partMats[color]=GLOW(color,color,.35));for(let i=0;i<n;i++){const o=new THREE.Mesh(partGeos[i%3],m);o.position.copy(pos);o.userData={v:new THREE.Vector3(rnd(-1,1)*speed,rnd(.3,1)*up+2,rnd(-1,1)*speed),life:life*rnd(.7,1.3),rot:new THREE.Vector3(rnd(-5,5),rnd(-5,5),rnd(-5,5))};scene.add(o);parts.push(o);}}
function ring(pos,color,size=5,dur=.7){const r=new THREE.Mesh(new THREE.TorusGeometry(1,.18,8,40),GLOW(color,color,.8,{transparent:true}));r.rotation.x=Math.PI/2;r.position.copy(pos);r.position.y+=.3;scene.add(r);animate(dur,k=>{r.scale.setScalar(1+k*size);r.material.opacity=1-k;},()=>scene.remove(r));}
function banner(t,c){const b=document.createElement('div');b.className='banner';b.style.setProperty('--bc',c||'#e03131');b.innerHTML='<span></span>';b.firstChild.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),2000);}

/* ===== characters: low-poly diorama people (round head, hair cap, blocky body) ~2.7 units tall, facing +z ===== */
const EYE_W=GLOSS(0xffffff),EYE_B=GLOSS(0x1e1a18),BLUSH=M(0xff8fa3,{transparent:true,opacity:.6});
const SKINS=[0xffd9b3,0xf2c29b,0xe0a97e,0xc98a5e];
function trapezoid(wTop,wBot,h,dTop,dBot){const g=new THREE.BufferGeometry();const t=wTop/2,b=wBot/2,dt=dTop/2,db=dBot/2;
 const v=[[-b,0,db],[b,0,db],[t,h,dt],[-t,h,dt],[-b,0,-db],[b,0,-db],[t,h,-dt],[-t,h,-dt]];
 const f=[[0,1,2,3],[5,4,7,6],[1,5,6,2],[4,0,3,7],[3,2,6,7],[4,5,1,0]];const pos=[];f.forEach(q=>{const[a,b2,c,d]=q.map(i=>v[i]);pos.push(...a,...b2,...c,...a,...c,...d);});
 g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.computeVertexNormals();return g;}
function dotEyes(h,y=.08,z=.44,dx=.17,r=.055){for(const s of[-1,1])h.add(mesh(SPH(r,6,5),EYE_B,s*dx,y,z));}
function mouth(h,y=-.12,z=.47){const m=mesh(new THREE.TorusGeometry(.08,.02,5,10,Math.PI),EYE_B,0,y,z);m.rotation.z=Math.PI;h.add(m);}
/* body: legs + torso + arms + round head; returns group with userData.head (head group, y 0 = head centre) */
function person(o={}){const g=new THREE.Group();const skin=o.skin??SKINS[0],legC=o.legs??0x3b5bdb,torC=o.torso??0xe03131,armC=o.arms??torC,shoeC=o.shoes??0x3b2a22;
 for(const s of[-1,1]){g.add(mesh(BOX(.4,.78,.46),GLOSS(legC),s*.24,.5,0));g.add(mesh(BOX(.44,.2,.6),GLOSS(shoeC),s*.24,.1,.05));}
 g.add(mesh(trapezoid(1.02,.84,.95,.56,.5),GLOSS(torC),0,.88,0));
 if(o.print){g.add(mesh(BOX(.46,.4,.04),GLOSS(o.print),0,1.32,.28));}
 for(const s of[-1,1]){const arm=mesh(CYL(.14,.13,.8,7),GLOSS(armC),s*.62,1.32,0);arm.rotation.z=s*.22;g.add(arm);g.add(mesh(SPH(.15,7,5),GLOSS(skin),s*.7,.9,.02));}
 g.add(mesh(CYL(.16,.16,.16,8),GLOSS(skin),0,1.9,0));
 const head=new THREE.Group();head.position.set(0,2.4,0);g.add(head);g.userData.head=head;
 head.add(mesh(SPH(.52,10,8),GLOSS(skin),0,0,0));
 if(o.hair!==null){const hairC=o.hair??0x3b2a22;const cap=mesh(SPH(.56,10,8,0,6.28,0,1.35),GLOSS(hairC),0,.05,-.03);head.add(cap);if(o.bangs!==false)head.add(mesh(BOX(.6,.18,.2),GLOSS(hairC),0,.3,.42));}
 dotEyes(head);if(o.mouth!=='none')mouth(head);for(const s of[-1,1]){const b=mesh(SPH(.09,6,5),BLUSH,s*.3,-.08,.42,false);b.scale.z=.4;head.add(b);}
 g.userData.skin=skin;return g;}
/* animal hoods keep the human face visible (costume style) */
function hood(head,color,extra){head.add(mesh(SPH(.6,10,8,0,6.28,0,1.95),GLOSS(color),0,.08,-.04));extra&&extra(head);}
const CHAR_BUILDERS={
 /* ---- jungle animals and dinosaurs are real creatures (quadrupeds / birds), not people in costumes ---- */
 monkey(){const g=new THREE.Group();const fur=GLOSS(0x9a5f2e),skin=GLOSS(0xf2cfa0);g.add(mesh(SPH(.62,9,7),fur,0,1.15,0)).scale.set(1,1.15,.9);g.add(mesh(SPH(.42,8,6),skin,0,1.05,.35)).scale.set(1,1.1,.5);
  for(const s of[-1,1]){const a=mesh(CYL(.13,.12,1.2,7),fur,s*.62,1.05,.1);a.rotation.z=s*.5;g.add(a);g.add(mesh(SPH(.17,7,5),skin,s*.92,.45,.15));g.add(mesh(BOX(.34,.5,.34),fur,s*.3,.35,0));g.add(mesh(BOX(.4,.16,.5),skin,s*.3,.08,.08));}
  const head=new THREE.Group();head.position.set(0,2.2,.05);g.add(head);g.userData.head=head;head.add(mesh(SPH(.55,9,7),fur));const face=mesh(SPH(.46,8,6),skin,0,-.05,.3);face.scale.set(1.15,.9,.6);head.add(face);for(const s of[-1,1]){head.add(mesh(SPH(.2,7,5),fur,s*.6,.05,0));head.add(mesh(SPH(.12,7,5),skin,s*.62,.05,.1));}dotEyes(head,.08,.6,.18,.06);mouth(head,-.2,.62);
  const tail=mesh(new THREE.TorusGeometry(.5,.07,6,14,4.2),fur,.2,1,-.7);tail.rotation.y=Math.PI/2;g.add(tail);return g;},
 elephant(){const g=new THREE.Group();const sk=GLOSS(0x9fb4d8),pk=GLOSS(0xffc2d9);g.add(mesh(SPH(.95,9,7),sk,0,1.25,-.1)).scale.set(1,.85,1.25);for(const s of[-1,1])for(const u of[-1,1]){g.add(mesh(CYL(.26,.3,.95,8),sk,s*.5,.5,u*.6));g.add(mesh(CYL(.3,.3,.14,8),GLOSS(0xdfe6f2),s*.5,.07,u*.6));}

/* ===== environments: a cluster of hexagonal islands on the water (board-game diorama). ENV[key]() builds into `world`, returns {sites, bossAt, tick} ===== */
let world=null;const envAnim={trees:[],clouds:[],coins:[],extra:[]};
const randDir=()=>{const u=rnd(-1,1),t=rnd(0,6.283),r=Math.sqrt(1-u*u);return new THREE.Vector3(r*Math.cos(t),u,r*Math.sin(t));};
function clearWorld(){if(world){scene.remove(world);}world=new THREE.Group();scene.add(world);envAnim.trees=[];envAnim.clouds=[];envAnim.coins=[];envAnim.extra=[];}
function inst(geo,mat,n,place,opts={}){const im=new THREE.InstancedMesh(geo,mat,n);const d=new THREE.Object3D();for(let i=0;i<n;i++){d.position.set(0,0,0);d.rotation.set(0,0,0);d.scale.set(1,1,1);place(d,i);d.updateMatrix();im.setMatrixAt(i,d.matrix);}im.castShadow=!!opts.shadow;im.receiveShadow=opts.receive!==false;world.add(im);return im;}
function cloudsAt(colA,n=9,yMin=16,yMax=26){for(let i=0;i<n;i++){const g=new THREE.Group();[[0,0,0,2.2],[-2,-.3,.4,1.6],[2.1,-.2,-.3,1.7],[.6,.9,.2,1.5],[-.9,.8,-.5,1.3]].forEach(([x,y,z,r])=>g.add(mesh(SPH(r,8,6),M(colA),x,y,z,false)));g.position.set(rnd(-120,120),rnd(yMin,yMax),rnd(-120,60));g.scale.setScalar(rnd(1,2.4));g.userData.v=rnd(.6,1.4);envAnim.clouds.push(g);world.add(g);}}

function volcano(x,z,sc=1,o={}){const g=new THREE.Group();const prof=[[0,0],[15,0],[13.4,1.6],[10.8,4.6],[8.4,8],[6.6,11],[5.4,13.6],[4.8,15],[3.6,15.2],[2.2,14.4],[0,14.2]];
 const geo=lathe(prof,40);const pos=geo.attributes.position,cols=[];const dark=col(0x3a2820),mid=col(0x5c3a2a),low=col(0x7a5236),ash=col(0x4d4a48);
 for(let i=0;i<pos.count;i++){const px=pos.getX(i),py=pos.getY(i),pz=pos.getZ(i);const th=Math.atan2(pz,px),rr=Math.hypot(px,pz);const n=1+.07*Math.sin(th*5+py*.6)+.05*Math.sin(th*11-py*.9)+.04*Math.sin(th*23+py*1.7);const f=rr>.01&&py<15?n:1;pos.setXYZ(i,px*f,py+(rr>1?Math.sin(th*7)*.25:0),pz*f);
  const k=Math.min(1,py/15);const c=k<.35?low.clone().lerp(mid,k/.35):k<.8?mid.clone().lerp(dark,(k-.35)/.45):dark.clone().lerp(ash,(k-.8)/.2);cols.push(c.r,c.g,c.b);}
 geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));geo.computeVertexNormals();g.add(mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.95,flatShading:true}),0,0,0));
 const rAt=y=>{for(let i=1;i<prof.length;i++){if(prof[i][1]>=y){const[a,b]=[prof[i-1],prof[i]];const t=(y-a[1])/Math.max(.001,b[1]-a[1]);return a[0]+(b[0]-a[0])*t;}}return 0;};
 g.add(mesh(CYL(3.4,3.4,.5,12),GLOW(0xff7b2e,0xff5c1a,2),0,14.3,0,false));g.add(mesh(SPH(2.6,9,7),GLOW(0xff6b35,0xff5c1a,1.6),0,14.4,0,false)).scale.set(1,.45,1);
 const lava=[];(o.flows||[0.4,2.3,4.1]).forEach(a=>{for(let k=0;k<13;k++){const y=14-k*1.05,r=rAt(y)+.25;const b=mesh(SPH(.75,7,5),GLOW(0xff7b2e,0xff5c1a,1.4),Math.cos(a+k*.03)*r,y,Math.sin(a+k*.03)*r,false);b.scale.set(1.1,.45,1.6);b.rotation.y=-a;g.add(b);lava.push(b);}});
 for(let i=0;i<8;i++){const a=rnd(0,6.28),r=rnd(10.5,14.5);const rk=mesh(new THREE.DodecahedronGeometry(rnd(.7,1.5),0),M(0x5c4a40),Math.cos(a)*r,.4,Math.sin(a)*r);rk.rotation.set(rnd(0,3),rnd(0,6),0);g.add(rk);}
 const smoke=[];for(let i=0;i<9;i++){const s=mesh(SPH(1,7,5),M(0x8a8580,{transparent:true,opacity:.75}),0,15,0,false);s.userData={t:i/9,drift:rnd(-.4,.4),drift2:rnd(-.4,.4)};g.add(s);smoke.push(s);}
 const light=new THREE.PointLight(0xff6b35,1.6,40*sc,2);light.position.set(0,15.5,0);g.add(light);
 g.position.set(x,o.y??.6,z);g.scale.setScalar(sc);(o.parent||world).add(g);
 g.userData.tick=(dt,t)=>{lava.forEach((l,i)=>{l.material.emissiveIntensity=1.1+Math.sin(t*4+i)*.5;});light.intensity=1.4+Math.sin(t*6)*.5;smoke.forEach(s=>{const u=s.userData;u.t+=dt*.14;if(u.t>1)u.t=0;const k=u.t;s.position.set(u.drift*k*8,15+k*12,u.drift2*k*8);const sz=.8+k*3.2;s.scale.setScalar(sz);s.material.opacity=.8*(1-k)*(k<.08?k/.08:1);});};
 return g;}

const HEX_R=11,HEX_D=20.6;
const hexAngle=k=>(30+60*k)*Math.PI/180;
const hexPos=k=>{const a=hexAngle(k);return{x:Math.sin(a)*HEX_D,z:Math.cos(a)*HEX_D};};
function ocean(color,y=0){const s=mesh(new THREE.CircleGeometry(340,40),M(color),0,y,0,false);s.rotation.x=-Math.PI/2;s.receiveShadow=true;world.add(s);return s;}

const BOSS_NAME={jungle:'Jungle Giant',dino:'Lava Dragon',space:'Galaxy Monster',town:'Grumpy Ogre'};
function summonBoss(){if(boss)return;cinema(4200);boss=BOSS[current]();const bp=env.bossAt||{x:0,z:-9};boss.position.set(bp.x,1.2,bp.z);boss.scale.setScalar(.01);boss.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});world.add(boss);banner('BOSS BATTLE!','#7048e8');
 animate(.8,k=>{boss.scale.setScalar(Math.min(1.3,k*1.4));},()=>{animate(.3,k=>boss.scale.setScalar(1.3-k*.3));spawn(boss.position.clone().setY(1.5),0x9775fa,44,8,6,1.3);ring(boss.position,0x9775fa);shakeCam=1;setTimeout(bossAttack,900);});}
function bossAttack(){if(!boss)return;const alive=players.filter(p=>!p.userData.down);if(!alive.length)return;const target=alive[Math.floor(Math.random()*alive.length)];animate(.5,k=>{boss.scale.setScalar(1+Math.sin(k*Math.PI)*.25);boss.rotation.z=Math.sin(k*Math.PI*2)*.15;},()=>{const a=boss.position.clone().setY(5),b=target.position.clone().setY(2.6);const f=mesh(SPH(.6,14,10),GLOW(0xff6b6b,0xff922b,1));f.position.copy(a);scene.add(f);animate(.8,k=>{f.position.lerpVectors(a,b,k);f.position.y+=Math.sin(k*Math.PI)*5;f.scale.setScalar(1+Math.sin(k*20)*.15);},()=>{scene.remove(f);spawn(b,0xff6b6b,26,7,6,1);ring(target.position,0xff6b6b);target.userData.shake=1;setHp(target,target.userData.hpv-2);shakeCam=.8;if(target.userData.hpv<=0&&!target.userData.down)knockOut(target);});});}
function resetAll(){players.forEach(g=>{revive(g);setHp(g,g.userData.hp0);});if(boss){world.remove(boss);boss=null;}}
document.querySelector('.ctr').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='attack'){const ti=Math.floor(Math.random()*teamCount),tj=(ti+1+Math.floor(Math.random()*(teamCount-1)))%teamCount;const A=players.filter(p=>p.userData.p.team===ti&&!p.userData.down),B=players.filter(p=>p.userData.p.team===tj&&!p.userData.down);if(!A.length||!B.length)return;const from=A[Math.floor(Math.random()*A.length)];const to=B.sort((x,y)=>y.userData.hpv-x.userData.hpv)[0];attack(from,to,3);banner('ACTION!',TEAMS[ti].css);}
 if(a==='level'){const c=players.filter(p=>p.userData.p.lv<3&&!p.userData.down);if(c.length)levelUp(c[Math.floor(Math.random()*c.length)]);}
 if(a==='heal'){const c=players.filter(p=>p.userData.down||p.userData.hpv<p.userData.hp0);if(!c.length)return;const g=c[Math.floor(Math.random()*c.length)];if(g.userData.down)revive(g);else{setHp(g,g.userData.hpv+4);spawn(g.position.clone().setY(3),0x69db7c,16,4,5,1);ring(g.position,0x51cf66);}}
 if(a==='boss')summonBoss();if(a==='reset')resetAll();if(a==='cheer')players.forEach((g,i)=>setTimeout(()=>jump(g),i*120));});
document.querySelector('.sc').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&ENV[b.dataset.s])loadScene(b.dataset.s);});
document.getElementById('bases').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ov)overview();else if(b.dataset.n)setTeamCount(+b.dataset.n);else chooseSite(+b.dataset.t,+b.dataset.k);});
document.getElementById('tcards').addEventListener('click',e=>{const c=e.target.closest('.tcard');if(!c)return;const i=[...c.parentNode.children].indexOf(c);focusSite(siteOf(env.sites,teamSite[i]));});
/* camera: orbit, drag, pinch */
let theta=.5,phi=.5,radius=64,shakeCam=0,auto=true,idle=0;const ptrs=new Map();let pinch0=0,rad0=0;
const target=new THREE.Vector3(0,2,0);const camGoal={t:new THREE.Vector3(0,2,0),r:64,phi:.5};
/* panorama → zoom: the whole world first, then fly to a base when it is chosen */
function overview(){const v=(env&&env.view)||{};camGoal.t.set(v.x||0,v.y??2,v.z||0);camGoal.r=v.r||64;camGoal.phi=v.phi||.5;}
function focusSite(site){if(!site)return;camGoal.t.set(site.x,(site.yAt?site.yAt(0,0):site.y)+1.5,site.z);camGoal.r=(env&&env.focusR)||30;camGoal.phi=.42;}
stage.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});auto=false;idle=0;camGoal.r=radius;camGoal.phi=phi;if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);rad0=radius;}});
const endPtr=e=>ptrs.delete(e.pointerId);addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;if(ptrs.size===1){theta-=(e.clientX-p.x)*.006;phi=Math.max(.2,Math.min(1.05,phi+(e.clientY-p.y)*.004));camGoal.phi=phi;}p.x=e.clientX;p.y=e.clientY;if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0){radius=Math.max(16,Math.min(190,rad0*pinch0/d));camGoal.r=radius;}}});
stage.addEventListener('wheel',e=>{radius=Math.max(16,Math.min(190,radius+e.deltaY*.05));camGoal.r=radius;},{passive:true});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
/* loop */
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
 if(!ptrs.size){idle+=dt;if(idle>5)auto=true;}if(auto&&!RM)theta+=dt*.07;
 const kk=1-Math.exp(-3*dt);target.lerp(camGoal.t,kk);radius+=(camGoal.r-radius)*kk;phi+=(camGoal.phi-phi)*kk;
 const sh=shakeCam>0?(shakeCam-=dt*1.6,Math.sin(t*60)*shakeCam*.35):0;
 camera.position.set(target.x+Math.sin(theta)*Math.cos(phi)*radius,target.y+Math.sin(phi)*radius+sh,target.z+Math.cos(theta)*Math.cos(phi)*radius);camera.lookAt(target);
 if(!RM){envAnim.trees.forEach(p=>{p.rotation.z=Math.sin(t*1.1+p.userData.sway)*.025;p.rotation.x=Math.cos(t*.9+p.userData.sway)*.02;});
  envAnim.clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>130)c.position.x=-130;});envAnim.extra.forEach(o=>{if(o.userData&&o.userData.ph!=null&&o.position)o.position.y=.1+Math.sin(t*1.3+o.userData.ph)*.12;});envAnim.coins.forEach(c=>{c.rotation.y=t*2.5+c.userData.ph;c.position.y+=Math.sin(t*2+c.userData.ph)*.004;});
  if(env&&env.tick)env.tick(dt,t);
  baseDecos.forEach(d=>{if(d.children[1])d.children[1].visible=!cleanShot;});players.forEach(g=>{const u=g.userData;u.lab.visible=!cleanShot;u.hp.visible=!cleanShot||g===lvTarget;if(!u.down){u.hab.position.y=.5+Math.sin(t*1.6+u.bob)*.05;const ch=u.ch;if(!anims.some(a=>a.g===g)){ch.position.y=.5+Math.abs(Math.sin(t*2.4+u.bob))*.18;}u.lab.position.y=4.9+Math.sin(t*2+u.bob)*.12;ch.rotation.y=.35+Math.sin(t*.8+u.bob)*.25;if(ch.userData.head)ch.userData.head.rotation.z=Math.sin(t*1.7+u.bob)*.08;ch.traverse(o=>{if(o.userData.flame)o.scale.y=1+Math.sin(t*25+o.position.x*9)*.4;});}
   const cl=u.flag.userData.cloth,pa=cl.geometry.attributes.position.array,ba=cl.userData.base;for(let i=0;i<pa.length;i+=3){pa[i+2]=Math.sin(t*5+ba[i]*3)*.12*ba[i];}cl.geometry.attributes.position.needsUpdate=true;
   if(u.shake>0){u.shake-=dt*2.2;g.rotation.z=Math.sin(t*50)*u.shake*.12;g.rotation.x=Math.cos(t*47)*u.shake*.08;}else{g.rotation.z=0;g.rotation.x=0;}});
  if(boss){boss.position.y=1.2+Math.abs(Math.sin(t*2))*.25;boss.rotation.y=Math.sin(t*.8)*.25;}}
 for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt;const k=Math.min(1,a.t/a.dur);a.fn(k);if(k>=1){anims.splice(i,1);a.done&&a.done();}}
 for(let i=parts.length-1;i>=0;i--){const o=parts[i],u=o.userData;u.life-=dt;if(u.life<=0||o.position.y<-4){scene.remove(o);parts.splice(i,1);continue;}u.v.y-=(u.g??18)*dt;o.position.addScaledVector(u.v,dt);o.rotation.x+=u.rot.x*dt;o.rotation.y+=u.rot.y*dt;o.scale.setScalar(Math.min(1,u.life*2));}
 renderer.render(scene,camera);}
loadScene('jungle');loop();

})();
</script>
</body>
</html>

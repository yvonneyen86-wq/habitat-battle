<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habitat Battle 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: full-bleed 3D stage for an interactive whiteboard; HUD plates float on top */
:root{color-scheme:light;--ink:#1e2433;--muted:#667085;--deep:#1f8a4c;--gold:#ffb703;--display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;--bg:#6fc8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a3a}}
:root[data-theme="dark"]{--bg:#1b2a3a}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:700;overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:12px max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:flex-start;pointer-events:none;transition:opacity .45s,transform .45s}
.glass{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px rgba(30,36,51,.16)}
.plate{border-radius:99px;padding:6px 16px 6px 10px;display:flex;align-items:center;gap:8px}
.plate h1{font-family:var(--display);margin:0;font-size:1.25rem;color:var(--deep);line-height:1}
.plate p{display:none}
.sp{flex:1}
.q{border-radius:18px;padding:8px 14px;max-width:min(460px,60vw)}
.q .k{display:inline-block;background:#3b5bdb;color:#fff;border-radius:99px;padding:1px 10px;font-size:.68rem;letter-spacing:.05em}
.q .t{font-family:var(--display);font-size:1.12rem;line-height:1.1;margin-top:3px}
.fab{pointer-events:auto;font:inherit;font-family:var(--display);font-size:1rem;border-radius:99px;padding:8px 16px;cursor:pointer;color:var(--ink);border:1px solid rgba(255,255,255,.9)}
.fab:hover{background:#fff}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:20;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto;border-radius:24px 0 0 24px;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;justify-content:space-between}.drawer .dh b{font-family:var(--display);font-size:1.3rem}
.drawer .dh button{font:inherit;border:0;background:#f1f3f5;border-radius:99px;width:36px;height:36px;cursor:pointer;font-size:1rem}
.drawer h3{margin:4px 0 0;font-family:var(--display);font-size:1rem;color:var(--muted)}
.sc{pointer-events:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc button{font:inherit;font-family:var(--display);font-size:1rem;border:2px solid #e9ecef;border-radius:14px;padding:10px;cursor:pointer;background:#fff;color:var(--ink)}
.sc button.sel{background:#3b5bdb;border-color:#3b5bdb;color:#fff}
.bases{pointer-events:auto;display:grid;gap:10px;font-size:.88rem}
.bases .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.bases .row>b{font-family:var(--display);margin-right:4px}
.bases .chip{font-family:var(--display);color:#fff;background:var(--tc);border-radius:99px;padding:3px 12px;min-width:70px;text-align:center}
.bases button{font:inherit;font-size:.84rem;border:2px solid #e9ecef;background:#fff;border-radius:10px;padding:5px 10px;cursor:pointer;color:var(--ink)}
.bases button.sel{background:var(--tc);border-color:var(--tc);color:#fff}.bases button.taken{opacity:.35}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(20,24,40,.18);opacity:0;pointer-events:none;transition:opacity .3s}.scrim.open{opacity:1;pointer-events:auto}
/* bottom: slim team chips + control dock */
.teams{position:fixed;left:0;right:0;bottom:0;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;gap:10px;justify-content:space-between;align-items:flex-end;pointer-events:none;flex-wrap:wrap;transition:opacity .45s,transform .45s}
.tcards{display:flex;gap:8px;flex-wrap:wrap}
.tcard{border-radius:16px;padding:6px 12px;min-width:132px;border-left:6px solid var(--tc)}
.tcard b{font-family:var(--display);font-size:1rem;color:var(--tc)}.tcard small{display:block;color:var(--muted);font-size:.72rem;line-height:1.1}
.bar{height:8px;border-radius:99px;background:#e9ecef;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#8ce99a,#2f9e44);transition:width .5s}
.ctr{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;border-radius:20px;padding:8px}
.ctr button{font:inherit;font-family:var(--display);font-size:1.05rem;border:0;border-radius:14px;padding:10px 16px;cursor:pointer;background:#f1f3f5;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.16)}
.ctr button:active{transform:translateY(3px);box-shadow:none}
.ctr button.war{background:#e03131;color:#fff}.ctr button.gold{background:var(--gold);color:#3a2a00}.ctr button.boss{background:#7048e8;color:#fff}.ctr button.ok{background:#40c057;color:#fff}
.ctr button.sky{background:#1c7ed6;color:#fff}.ctr button.back{display:none;background:#343a40;color:#fff}body.spot .ctr button.back{display:inline-block}
.spottag{position:fixed;left:50%;top:96px;transform:translateX(-50%);z-index:6;display:none;font-family:var(--display);font-size:1.5rem;font-weight:900;color:#fff;background:var(--tc,#1c7ed6);padding:10px 26px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 -4px 0 rgba(0,0,0,.15);pointer-events:none}body.spot .spottag{display:block}body.spot .tcards{opacity:0;pointer-events:none}
.ctr button:focus-visible,.sc button:focus-visible,.fab:focus-visible{outline:3px solid #3b5bdb}
/* cinematic mode: HUD slides away, letterbox bars slide in */
.lb{position:fixed;left:0;right:0;height:9vh;background:#0b0d14;z-index:15;pointer-events:none;transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.lb.top{top:0;transform:translateY(-100%)}.lb.bot{bottom:0;transform:translateY(100%)}
body.cine .lb{transform:none}
body.cine .hud{opacity:0;transform:translateY(-30px)}
body.cine .teams{opacity:0;transform:translateY(30px);pointer-events:none}
body.cine .teams *{pointer-events:none}
.banner{position:fixed;left:0;right:0;top:30%;z-index:16;text-align:center;pointer-events:none;animation:ban 2s cubic-bezier(.2,1,.3,1) forwards}
.banner span{display:inline-block;font-family:var(--display);font-size:clamp(2.4rem,9vw,6rem);line-height:1;color:#fff;background:var(--bc,#e03131);padding:.18em .7em;border-radius:.45em;box-shadow:0 .22em 0 rgba(0,0,0,.22);border:.1em solid #fff;transform:rotate(-2deg)}
@keyframes ban{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.1)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.banner{animation:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="lb top"></div><div class="lb bot"></div>
<div class="hud"><div class="plate glass"><h1 id="title">🌴 Jungle Safari</h1><p class="note">3D prototype with sample students</p></div><span class="sp"></span><div class="q glass"><span class="k">⌨️ TYPE A FULL SENTENCE · ROUND 3</span><div class="t">What did you do last weekend?</div></div><button class="fab glass" id="fab">🗺️ Worlds &amp; Bases</button></div>
<div class="scrim" id="scrim"></div>
<div class="spottag" id="spottag"></div>
<aside class="drawer glass" id="drawer" aria-label="Worlds and bases"><div class="dh"><b>🗺️ Worlds &amp; Bases</b><button id="dclose" aria-label="Close">✕</button></div>
 <h3>World</h3><div class="sc"><button data-s="jungle" class="sel">🌴 Jungle</button><button data-s="dino">🌋 Dino</button><button data-s="space">🪐 Solar System</button><button data-s="town">🏙️ Hsinchu</button></div>
 <h3>Teams &amp; bases</h3><div class="bases" id="bases"></div></aside>
<div class="teams">
  <div class="tcards" id="tcards"></div>
  <div class="ctr glass"><button class="war" data-a="attack">⚔️ Attack</button><button class="gold" data-a="level">🔨 Level up</button><button class="ok" data-a="heal">❤️ Repair</button><button class="boss" data-a="boss">👹 Boss</button><button class="sky" data-a="one">🎤 Student</button><button class="sky" data-a="team">👥 Team</button><button class="ok" data-a="ok">✅ Correct</button><button data-a="no">❌ Wrong</button><button class="back" data-a="back">↩ Island</button><button data-a="reset">↺ Reset</button></div>
</div>
<script>
(function(){
if(typeof THREE==='undefined'){document.querySelector('.note').textContent='3D library could not load.';return;}
/* ===== core: renderer, helpers, materials ===== */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(31,1,.1,900);
const sun=new THREE.DirectionalLight(0xfff0d0,1.35);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0006;sun.shadow.normalBias=.03;sun.shadow.radius=4;
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:120});sun.shadow.camera.updateProjectionMatrix();scene.add(sun);
const hemi=new THREE.HemisphereLight(0xd8f0ff,0x9cc36a,1.05);scene.add(hemi);
const fill=new THREE.DirectionalLight(0xbfe3ff,.35);fill.position.set(-20,10,-16);scene.add(fill);
/* cozy island-life look: smooth rounded shapes, bright pastel colours, warm light,
   and a "rolling horizon" — the ground bends away with distance (vertex bend in view space) */
const col=c=>new THREE.Color(c).convertSRGBToLinear();
const BEND={value:0};
const PV=(THREE.ShaderChunk&&typeof THREE.ShaderChunk.project_vertex==='string')?THREE.ShaderChunk.project_vertex:'';
const PV_BENT=PV.replace('mvPosition = modelViewMatrix * mvPosition;','mvPosition = modelViewMatrix * mvPosition;\nmvPosition.y -= bendK * mvPosition.z * mvPosition.z;');
function bendMat(m){if(!m||!PV)return m;m.userData=m.userData||{};if(m.userData.bent)return m;m.userData.bent=true;const prev=m.onBeforeCompile;
 m.onBeforeCompile=(sh,r)=>{prev&&prev.call(m,sh,r);sh.uniforms.bendK=BEND;sh.vertexShader='uniform float bendK;\n'+(m.isSpriteMaterial?sh.vertexShader.replace('vec4 mvPosition = modelViewMatrix * vec4( 0.0, 0.0, 0.0, 1.0 );','vec4 mvPosition = modelViewMatrix * vec4( 0.0, 0.0, 0.0, 1.0 );\nmvPosition.y -= bendK * mvPosition.z * mvPosition.z;'):sh.vertexShader.replace('#include <project_vertex>',PV_BENT));};
 const key=m.customProgramCacheKey?m.customProgramCacheKey.bind(m):()=> '';m.customProgramCacheKey=()=>key()+'|bend';return m;}
/* bend everything already in a subtree (materials made with `new THREE.*Material` directly) */
function bendTree(root){root.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(bendMat);}});return root;}
const M=(c,o={})=>bendMat(new THREE.MeshStandardMaterial(Object.assign({color:col(c),roughness:.92,metalness:0},o)));
const GLOSS=(c,o={})=>bendMat(new THREE.MeshStandardMaterial(Object.assign({color:col(c),roughness:.7,metalness:0},o)));
const GLOW=(c,e,i=.8,o={})=>bendMat(new THREE.MeshStandardMaterial(Object.assign({color:col(c),emissive:col(e),emissiveIntensity:i,roughness:.6},o)));
function outline(root){return root;}
const rnd=(a,b)=>a+Math.random()*(b-a);
/* tweak-then-return: `par.add(tw(m,o=>o.rotation.x=1))` (Object3D.add returns the PARENT, so chaining on add() is a trap) */
const tw=(o,f)=>{f(o);return o;};
const mesh=(g,m,x=0,y=0,z=0,sh=true)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;return o;};
const SPH=(r,a=9,b=7)=>new THREE.SphereGeometry(r,Math.max(18,a*2),Math.max(12,b*2));
const CYL=(a,b,h,s=10)=>new THREE.CylinderGeometry(a,b,h,s===6?6:Math.max(20,s*2));
const BOX=(a,b,c)=>new THREE.BoxGeometry(a,b,c);
const CONE=(r,h,s=8)=>new THREE.ConeGeometry(r,h,s<=4?s:Math.max(16,s*2));
function lathe(pts,seg=24){seg=Math.max(40,seg);return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);}
function capsule(r,h,m){const g=new THREE.Group();g.add(mesh(CYL(r,r,h,20),m,0,0,0));g.add(mesh(SPH(r),m,0,h/2,0));g.add(mesh(SPH(r),m,0,-h/2,0));return g;}
/* sky dome with vertex gradient */
let sky=null;
function setSky(top,hor,fogCol,fogNear=60,fogFar=140){if(sky)scene.remove(sky);const g=new THREE.SphereGeometry(220,32,16);const pos=g.attributes.position,cols=[];const T=col(top),H=col(hor);
 for(let i=0;i<pos.count;i++){const y=pos.getY(i)/220;const c=H.clone().lerp(T,Math.max(0,Math.min(1,(y+.02)*2.4)));cols.push(c.r,c.g,c.b);}
 g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));sky=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false}));scene.add(sky);scene.fog=new THREE.Fog(col(fogCol),fogNear,fogFar);}
/* canvas sprites */
function canvasTex(draw,w=512,h=160){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=8;t.encoding=THREE.sRGBEncoding;return t;}
function rr(x,X,Y,W,H,R){if(x.roundRect){x.beginPath();x.roundRect(X,Y,W,H,R);x.fill();}else{x.fillRect(X,Y,W,H);}}
function labelSprite(name,color){const t=canvasTex((x,w,h)=>{x.fillStyle='#fff';rr(x,6,34,w-12,92,46);x.fillStyle=color;rr(x,14,42,w-28,76,38);x.fillStyle='#fff';x.font='900 56px Nunito,"Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(name,w/2,82);});const s=new THREE.Sprite(bendMat(new THREE.SpriteMaterial({map:t,transparent:true})));s.scale.set(3.8,1.19,1);return s;}
function bubbleSprite(name,color){const t=canvasTex((x,w,h)=>{x.fillStyle=color;rr(x,10,8,w-20,132,46);x.fillStyle='#fff';rr(x,20,18,w-40,112,38);x.beginPath();x.moveTo(w/2-28,128);x.lineTo(w/2,170);x.lineTo(w/2+28,128);x.closePath();x.fillStyle='#fff';x.fill();x.fillStyle=color;x.font='900 64px Nunito,"Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(name,w/2,76);},512,176);const s=new THREE.Sprite(bendMat(new THREE.SpriteMaterial({map:t,transparent:true})));s.scale.set(3.6,1.24,1);return s;}
function hpSprite(){const c=document.createElement('canvas');c.width=512;c.height=72;const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const s=new THREE.Sprite(bendMat(new THREE.SpriteMaterial({map:t,transparent:true})));s.scale.set(3.2,.45,1);
 s.userData.draw=(pct)=>{const x=c.getContext('2d');x.clearRect(0,0,512,72);x.fillStyle='#fff';rr(x,8,8,496,56,28);x.fillStyle='#e9ecef';rr(x,18,18,476,36,18);x.fillStyle=pct<.35?'#ff6b6b':'#51cf66';rr(x,18,18,Math.max(36,476*Math.max(0,pct)),36,18);t.needsUpdate=true;};s.userData.draw(1);return s;}
function textSprite(txt,size=1.7){const t=canvasTex((x,w,h)=>{x.font='200px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,w/2,h/2+10);},256,256);const s=new THREE.Sprite(bendMat(new THREE.SpriteMaterial({map:t,transparent:true})));s.scale.set(size,size,1);return s;}
/* animation + particles */
const anims=[];function animate(dur,fn,done){anims.push({t:0,dur,fn,done});}
const parts=[];const partGeos=[SPH(.16,8,6),BOX(.24,.24,.24),new THREE.OctahedronGeometry(.2)];const partMats={};
function spawn(pos,color,n=18,speed=6,up=5,life=1.1){const m=partMats[color]||(partMats[color]=GLOW(color,color,.35));for(let i=0;i<n;i++){const o=new THREE.Mesh(partGeos[i%3],m);o.position.copy(pos);o.userData={v:new THREE.Vector3(rnd(-1,1)*speed,rnd(.3,1)*up+2,rnd(-1,1)*speed),life:life*rnd(.7,1.3),rot:new THREE.Vector3(rnd(-5,5),rnd(-5,5),rnd(-5,5))};scene.add(o);parts.push(o);}}
function ring(pos,color,size=5,dur=.7){const r=new THREE.Mesh(new THREE.TorusGeometry(1,.18,8,40),GLOW(color,color,.8,{transparent:true}));r.rotation.x=Math.PI/2;r.position.copy(pos);r.position.y+=.3;scene.add(r);animate(dur,k=>{r.scale.setScalar(1+k*size);r.material.opacity=1-k;},()=>scene.remove(r));}
function banner(t,c){const b=document.createElement('div');b.className='banner';b.style.setProperty('--bc',c||'#e03131');b.innerHTML='<span></span>';b.firstChild.textContent=t;document.body.appendChild(b);setTimeout(()=>b.remove(),2000);}

/* ===== characters: big-head island villagers with hand-drawn faces, cute jungle animals, film-style dinosaurs; ~2.9 units tall, facing +z ===== */
const EYE_W=GLOSS(0xffffff),EYE_B=GLOSS(0x1e1a18);
const SKINS=[0xffdcc0,0xf5c9a3,0xd9a27a,0xa8724d];
const hex6=c=>'#'+(c>>>0).toString(16).padStart(6,'0');
const rgba=(c,a)=>`rgba(${c>>16&255},${c>>8&255},${c&255},${a})`;
/* ---- drawn faces: a thin sphere patch on the front of the head carries a canvas face, so expressions can switch instantly ---- */
const FACE_TEX={};
function faceTex(o,e){const key=(o.style||'human')+'|'+(o.iris||'')+'|'+(o.mouth===false?0:1)+'|'+e;if(FACE_TEX[key])return FACE_TEX[key];
 const t=canvasTex((x,W,H)=>{const st=o.style||'human',iris=o.iris||'#3b2414',ink='#2a1a12';const ey=H*.42,ex=[W*.33,W*.67];
  x.lineCap='round';x.lineJoin='round';
  /* cheeks */
  x.fillStyle='rgba(255,120,140,.42)';for(const cx of[W*.2,W*.8]){x.beginPath();x.ellipse(cx,H*.63,26,13,0,0,6.283);x.fill();}
  /* eyes */
  const open=['smile','talk','sad','wow'].includes(e);
  ex.forEach((cx,i)=>{const s=i?1:-1;x.strokeStyle=ink;x.fillStyle=ink;
   if(open){if(st==='alien'){x.save();x.translate(cx,ey);x.rotate(-s*.45);x.fillStyle='#10131a';x.beginPath();x.ellipse(0,0,26,40,0,0,6.283);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-7,-14,8,0,6.283);x.fill();x.restore();return;}
    if(st==='human'){x.fillStyle='#fff';x.beginPath();x.ellipse(cx,ey,28,36,0,0,6.283);x.fill();x.lineWidth=4;x.stroke();}
    x.fillStyle=st==='human'?iris:'#1b120c';x.beginPath();x.ellipse(cx,ey+(st==='human'?4:0),st==='human'?21:19,st==='human'?28:27,0,0,6.283);x.fill();
    if(st==='human'){x.fillStyle=ink;x.beginPath();x.ellipse(cx,ey+6,11,15,0,0,6.283);x.fill();}
    x.fillStyle='#fff';x.beginPath();x.arc(cx-7,ey-9,8.5,0,6.283);x.fill();x.beginPath();x.arc(cx+7,ey+12,3.6,0,6.283);x.fill();
    if(st==='human'){x.lineWidth=5;x.beginPath();x.moveTo(cx-26,ey-30);x.quadraticCurveTo(cx,ey-44,cx+26,ey-30);x.stroke();}}
   else if(e==='happy'){x.lineWidth=9;x.beginPath();x.arc(cx,ey+12,21,Math.PI*1.12,Math.PI*1.88);x.stroke();}
   else if(e==='blink'){x.lineWidth=7;x.beginPath();x.arc(cx,ey-6,18,Math.PI*.15,Math.PI*.85);x.stroke();}
   else if(e==='ouch'){x.lineWidth=8;x.beginPath();x.moveTo(cx-s*16,ey-16);x.lineTo(cx+s*14,ey);x.lineTo(cx-s*16,ey+16);x.stroke();}
   else if(e==='ko'){x.lineWidth=8;x.beginPath();x.moveTo(cx-14,ey-14);x.lineTo(cx+14,ey+14);x.moveTo(cx+14,ey-14);x.lineTo(cx-14,ey+14);x.stroke();}

 const body=mesh(slab(R-.4,2.4,2.4,.5),M(side),0,.3-2.9,0,false);g.add(body);
 const grass=mesh(slab(R-.55,2.3,.22,.28),M(top),0,.7-.78,0,false);grass.castShadow=false;g.add(grass);
 const shallow=mesh(new THREE.ShapeGeometry(hexShape(R+2.2,3.4),8),M(0x9fe6e4,{transparent:true,opacity:.55}),0,.04,0,false);shallow.rotation.x=-Math.PI/2;shallow.receiveShadow=false;g.add(shallow);
 g.position.set(x,0,z);world.add(g);g.userData.R=R;return g;}
function hexFence(h,R=HEX_R,colP=0xfaf3e6,colR=0xf1e6d2){const r=R-.6;for(let e=0;e<6;e++){const a0=e/6*6.283,a1=(e+1)/6*6.283;const ax=Math.sin(a0)*r,az=Math.cos(a0)*r,bx=Math.sin(a1)*r,bz=Math.cos(a1)*r;const len=Math.hypot(bx-ax,bz-az);const rail=mesh(BOX(.12,.1,len-1),GLOSS(colR),(ax+bx)/2,1.45,(az+bz)/2,false);rail.rotation.y=Math.atan2(bx-ax,bz-az);h.add(rail);
  for(let k=0;k<4;k++){const t=k/4+.125;h.add(mesh(BOX(.18,1,.18),GLOSS(colP),ax+(bx-ax)*t,1.15,az+(bz-az)*t));}}}
function bridgeTo(k,col=0xc9a070,post=0x9a7048){const a=hexAngle(k);const g=new THREE.Group();g.add(mesh(BOX(3.2,.26,4.6),GLOSS(col),0,.64,0));for(const s of[-1,1]){g.add(mesh(BOX(.14,.9,4.6),GLOSS(post),s*1.5,1.05,0,false));for(const u of[-1,0,1])g.add(mesh(BOX(.2,1.1,.2),GLOSS(post),s*1.5,1.1,u*1.9));}g.position.set(Math.sin(a)*HEX_D/2,0,Math.cos(a)*HEX_D/2);g.rotation.y=a;world.add(g);return g;}
/* scatter helpers that stay inside a hex */
const inHex=(d,cx,cz,rMin,rMax,y)=>{const a=rnd(0,6.28),r=rnd(rMin,rMax);d.position.set(cx+Math.cos(a)*r,y,cz+Math.sin(a)*r);return d;};
function tuftsAt(cx,cz,color,n=40,rMax=8.5){inst(CONE(.22,.7,5),M(color),n,d=>{inHex(d,cx,cz,1,rMax,1);d.rotation.set(rnd(-.2,.2),rnd(0,6),rnd(-.2,.2));d.scale.set(1,rnd(.7,1.4),1);});}
function flowersAt(cx,cz,cols,n=14,rMax=8){const petal=SPH(.2,6,4);petal.scale(1,.45,1);cols.forEach(c=>inst(petal,M(c),n,d=>{inHex(d,cx,cz,1,rMax,.9);d.rotation.set(0,rnd(0,6),0);d.scale.setScalar(rnd(.8,1.4));}));}
function rocksAt(cx,cz,col,n,rMin,rMax,sMin=.5,sMax=1.4){inst(new THREE.DodecahedronGeometry(1,0),M(col),n,d=>{inHex(d,cx,cz,rMin,rMax,.9);const s=rnd(sMin,sMax);d.scale.set(s,s*.7,s);d.rotation.set(rnd(0,3),rnd(0,6),0);});}
function ringTrees(cx,cz,n,kind,R=HEX_R-2.4){for(let i=0;i<n;i++){const a=i/n*6.28+rnd(-.2,.2),r=rnd(R-1.5,R);kind(cx+Math.cos(a)*r,cz+Math.sin(a)*r);}}
/* islets: little round islands with a thing on them, scattered to the horizon */
function islet(x,z,r,top,side,deco){const g=new THREE.Group();g.add(mesh(CYL(r,r*1.08,2.2,24),M(side),0,-.5,0,false));g.add(mesh(CYL(r-.35,r-.25,.3,24),M(top),0,.62,0,false));const halo=mesh(new THREE.CircleGeometry(r+1.8,32),M(0x9fe6e4,{transparent:true,opacity:.55}),0,.03,0,false);halo.rotation.x=-Math.PI/2;g.add(halo);g.position.set(x,0,z);g.rotation.y=rnd(0,6);world.add(g);deco&&deco(g,r);return g;}
function lighthouse(g){g.add(mesh(CYL(1.1,1.4,6,8),GLOSS(0xf8f9fa),0,3.6,0));for(let i=0;i<3;i++)g.add(mesh(CYL(1.15+i*.04,1.2+i*.04,.7,8),GLOSS(0xe03131),0,1.6+i*1.8,0));g.add(mesh(CYL(1.3,1.3,.3,8),GLOSS(0x495057),0,6.7,0));g.add(mesh(CYL(.7,.7,.8,8),GLOW(0xfff3bf,0xffd43b,1),0,7.2,0));g.add(mesh(CONE(1,.9,8),GLOSS(0xe03131),0,8,0));}
function boat(x,z,col=0xe8744a){const g=new THREE.Group();g.add(mesh(BOX(3,.7,1.3),GLOSS(col),0,.35,0));g.add(mesh(BOX(2.6,.2,1),GLOSS(0xf2cfa0),0,.75,0));g.add(mesh(CYL(.06,.06,3,5),GLOSS(0x8d6e4a),-.2,2.2,0));const sail=mesh(new THREE.PlaneGeometry(1.8,2.2),M(0xfff6e0,{side:THREE.DoubleSide}),.7,2.4,0,false);g.add(sail);g.position.set(x,.1,z);g.rotation.y=rnd(0,6);g.userData.ph=rnd(0,6);world.add(g);return g;}
function buoys(n,rMin,rMax){for(let i=0;i<n;i++){const a=rnd(0,6.28),r=rnd(rMin,rMax);const g=new THREE.Group();g.add(mesh(CYL(.35,.45,.9,7),GLOSS(0xe03131),0,.45,0));g.add(mesh(CYL(.36,.36,.3,7),GLOSS(0xf8f9fa),0,.6,0));g.add(mesh(CYL(.08,.08,1.2,5),GLOSS(0x495057),0,1.4,0));g.add(mesh(SPH(.14,6,5),GLOW(0xfff3bf,0xffd43b,.8),0,2,0));g.position.set(Math.cos(a)*r,.1,Math.sin(a)*r);g.userData.ph=rnd(0,6);world.add(g);envAnim.extra.push(g);}}
function archipelago(n,top,side,deco){const list=[];for(let i=0;i<n;i++){const a=i/n*6.28+rnd(-.25,.25),r=rnd(50,125),rad=rnd(4,9);list.push(islet(Math.cos(a)*r,Math.sin(a)*r,rad,top,side,deco));}return list;}

function fernTree(x,z,s=1,parent){const g=new THREE.Group();g.add(mesh(CYL(.22,.32,3.2,7),GLOSS(0x7a5236),0,1.6,0));for(let k=0;k<8;k++){const a=k/8*6.28;const fr=mesh(CONE(.5,2.8,4),M(k%2?0x4e8f3a:0x6aa84f),Math.cos(a)*1.1,3.4,Math.sin(a)*1.1);fr.rotation.set(Math.sin(a)*1.25,0,-Math.cos(a)*1.25);fr.scale.set(1,1,.35);g.add(fr);}g.scale.setScalar(s);g.position.set(x,.6,z);g.userData.sway=rnd(0,6);(parent||world).add(g);envAnim.trees.push(g);return g;}

function geyser(x,z){const g=new THREE.Group();g.add(mesh(CYL(1.4,1.8,.5,8),M(0xb8a080),0,.25,0));g.add(mesh(CYL(.6,.6,.2,8),GLOSS(0x74c0d6),0,.55,0,false));const puffs=[];for(let i=0;i<6;i++){const p=mesh(SPH(.5,7,5),M(0xf1f3f5,{transparent:true,opacity:.8}),0,1,0,false);p.userData={t:i/6};g.add(p);puffs.push(p);}g.position.set(x,.7,z);world.add(g);

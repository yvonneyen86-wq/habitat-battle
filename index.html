u like to live? | B: I'd like to live {at the top of the mountain}. | A: Why would you like to live there? | B: Because if I lived there, I could ski down the slopes every day. | at the top of the mountain / at the bottom of the mountain / in a valley / on a hill / near a glacier / on a steep slope","SW | Mountains give us many things: {water}, {food}, and {homes for animals}. I like to do these activities in the mountains: {hiking, skiing, and camping}. | Write two sentences with a colon and a list of at least three things."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":12,"title":"The Lost Explorer","bq":"Why are mountains important?","learn":["What does \"jagged\" mean? | with sharp, uneven points","What does \"scowl\" mean? | to make an angry face","What does \"mutter\" mean? | to speak quietly so that it is hard to hear","Spell the word \"miniature\". | m-i-n-i-a-t-u-r-e","Spell the word \"stammer\". | s-t-a-m-m-e-r","Change to the past passive: Someone broke my mom's favorite vase. | My mom's favorite vase was broken.","Change to the past passive: Someone showed the weather forecasts on TV. | The weather forecasts were shown on TV.","What did Robert think the old stone tower was? | Sir Geoffrey Entwhistle's secret fort.","Who lived in the tower on the mountain? | A scientist who made the weather forecasts for over twenty years.","Do you think it is a good idea to explore a mountain alone? Why or why not?"],"battle":["T | When was Mount Everest climbed for the first time? | Mount Everest was climbed for the first time in 1953.","B | The weather forecasts were shown on TV.","B | Samantha heard the musical sound of a waterfall.","F | My mom's favorite vase was break. | My mom's favorite vase was broken.","F | The castle were built in the mountains. | The castle was built in the mountains.","W | squirm | Make a sentence with the word squirm.","P | ⛰️🗼⛈️☕ | What happened to Samantha and Robert? Tell the story.","C | Is a weather station or a secret fort more exciting? | A weather station | A secret fort","Z | Name three things you can find on a mountain.","S | Tell us about a party using the past passive. Say three sentences."],"words":["endless | end·less | end/less | ♾️","stammer | stam·mer | stam/mer | 😰","awestruck | awe·struck | awe/struck | 😮","jagged | jag·ged | jag/ged | 🪨","pointy | point·y | point/y | 🦊","miniature | min·i·a·ture | min/i/a/ture | 🐜","stern | stern | st/ern | 😠","arch | arch | ar/ch | 🌉","mutter | mut·ter | mut/ter | 🤫","squirm | squirm | squ/irm | 🪱","scowl | scowl | sc/owl | 😡","stretch | stretch | str/etch | 🙆","silhouette | sil·hou·ette | sil/hou/ette | 👤","distant | dis·tant | dis/tant | 🔭"],"reading":["> The Lost Explorer","> \"Listen, a waterfall!\" Samantha said.","> Her brother Robert listened. There was the tinkling, musical sound of water from somewhere up the path. The dark silhouette of Entwhistle Peak, a jagged mountain in the Andes range, towered above them against the sky.","> Samantha looked for her parents, who were picnicking in the field below, and then dashed off after Robert. They stopped beside an outcrop of pointy rocks and a beautiful, deep pool. From high above, a thin stream of water tumbled, catching the light.","> \"It's so beautiful here,\" Samantha sighed. Robert shielded his eyes, scanning the sky. Miniature birds circled the summit of the mountain.","> \"There's an old stone tower up there,\" Robert said. \"I bet it's Sir Geoffrey Entwhistle's secret fort.\"","> Samantha knew the mountain was named for the famous explorer, but she also had read her nature guide back at the lodge.","> \"It's hardly a secret on top of the mountain,\" Samantha said, teasing. \"Besides, it's an old weather station.\" \"We'll see about that,\" Robert muttered. \"Wait!\" she called, but he was gone.","> The thin path disappeared around a rocky bend, and when Samantha finally scrambled up, her brother was nowhere to be seen. The open sky was slate gray and filled with clouds; a storm was rolling in. Behind her, the descent to the valley was very steep.","> My brother and his crazy ideas, she thought.","> A stick snapped and Samantha jumped. Robert was bounding out from beneath some trees.","> She scowled at her brother and folded her arms across her chest. \"You scared me!\"","> \"I told you it was his secret fort!\" Robert said, pointing.","> A set of stone stairs was carved into the side of the mountain beneath a gated arch. The steps twisted around the peak.","> \"This is it!\" he called over his shoulder. Samantha scrambled after him, and they emerged before a stern-looking tower. \"The explorer's hiding place!\" Robert said, triumphant.","> \"The weather station,\" Samantha corrected. As she spoke, the tower door swung open, and a kind-looking old man stood in the doorway. \"Hello there,\" the man said. \"It's not often I get visitors.\"","> \"Who ... who are you?\" Robert stammered.","> \"I am a scientist. The mountain is a great place to observe nature and weather patterns. For over twenty years, the weather forecasts that were shown on TV were mine.\" He smiled at the pair. \"And who are you?\"","> \"I am Samantha,\" she said. \"And this is my brother Robert.\"","> Robert scowled; his face was flushed and embarrassed.","> \"Don't mind him. He thought you were a lost explorer. Sir Geoffrey Entwhistle.\"","> \"Lost, is he? He must not be a very good explorer,\" the old man said. \"Well, Samantha and Robert, come in for a cup of hot cocoa. The storm will clear soon.\" Inside there was a crackling fire, and shelves held old books and strange metal objects.","> \"I have the best job in the world,\" the old man said. \"This mountain is not only a scientific outpost, it is a place of great beauty. I've been here for many years.\" Just then, the sun peeked out from behind the storm clouds. The view was breathtaking; the mountain range stretched out in all directions and the sky was reflected in a distant lake. Samantha and Robert marveled at the sight.","> \"I'll show you the way home,\" the old man said, opening the door. \"If you trust me to not get lost.\" He winked at Robert.","> \"Wait,\" Samantha said. \"We haven't learned your name!\"","> \"Ah,\" he said. \"My friends call me Geoffrey.\"","RC | What did Robert think the old stone tower was? | a secret fort | a weather station | a hotel","RC | Where were Samantha and Robert's parents? | having a picnic | at the lodge | at home","RC | What is the old man's job? | a scientist | a doctor | a teacher","RT | Why did Robert's face flush when Samantha introduced him? | His face flushed because he was embarrassed.","RT | What did the old man offer the children? | He offered them a cup of hot cocoa.","RT | Who was Entwhistle Peak named for? | It was named for the famous explorer Sir Geoffrey Entwhistle.","RS | Why is the mountain a good place for the scientist to work? Tell us one reason.","RS | What did Samantha and Robert see from the tower when the sun came out?"],"grammar":["GT | Past Passive","R | active:  Someone **broke** my mom's favorite vase.  →  passive:  My mom's favorite vase **was broken**.","R | active:  Someone **showed** the weather forecasts on TV.  →  passive:  The weather forecasts **were shown** on TV.","G | Mount Everest was climbed in 1953.","G | Sir Edmund Hillary and Tenzing Norgay climbed Mount Everest.","G | My mom's favorite vase was broken.","G | The weather forecasts were shown on TV.","G | Last year, a big party was organized in my town.","G | A lot of candy and cakes were eaten.","G | Was the mountain named for a famous explorer?","G | The stone stairs were carved into the mountain."],"sw":["SP | A: I'm going to the mountains on a cold and snowy day. Do you think I should {take a warm coat}? | B: Yes, I think you should. | A: Would it be a good idea to take some climbing equipment? | B: Yes, that sounds like a good idea. | take a warm coat / wear boots / take a map / bring hot cocoa / take an umbrella / go hiking","SW | A book was {written} about {the mountain climber}. After many years, the name of the explorer was {known} all over the world. | Write two sentences in the past passive using irregular past participles."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":13,"title":"The Sound of Money and the Smell of Soup","bq":"Why do we use money?","learn":["What does \"greedy\" mean? | always wanting more of everything","What does \"wise\" mean? | able to make good decisions","What does \"fierce\" mean? | looking angry and ready to attack","Spell the word \"politely\". | p-o-l-i-t-e-l-y","Spell the word \"nervously\". | n-e-r-v-o-u-s-l-y","Is \"aggressively\" an adjective or an adverb? | an adverb","Add an adverb of manner: \"Three gold coins!\" repeated the man ___. | aggressively","How many gold coins did Erman have when he arrived in the city? | Only three gold coins.","Who was the Hodja? | A wise man and a judge who decided who was right and wrong.","Was the Hodja's decision fair? Why or why not?"],"battle":["T | Why did the rude man take Erman to court? | He said Erman had stolen the smells of his soup.","B | A terrifying man with huge muscles opened the door.","B | Erman turned to the man bravely and spoke.","F | The man shouted rude at Erman. | The man shouted rudely at Erman.","F | The Hodja answered calm. | The Hodja answered calmly.","W | delicate | Make a sentence about something delicate.","P | 🍲👃💰⚖️ | What is the problem in this story? Explain.","C | Should people pay for smells and sounds? | Yes | No","Z | Give the adverb for these adjectives: polite, brave, calm.","S | Describe a person you know using two adjectives and two adverbs."],"words":["terrifying | ter·ri·fy·ing | ter/ri/fy/ing | 😱","nervously | ner·vous·ly | ner/vous/ly | 😰","rudely | rude·ly | rude/ly | 😠","politely | po·lite·ly | po/lite/ly | 🙏","fierce | fierce | f/ierce | 🦁","aggressively | ag·gres·sive·ly | ag/gres/sive/ly | 👊","delicate | del·i·cate | del/i/cate | 🏺","bravely | brave·ly | brave/ly | 🦸","greedy | greed·y | greed/y | 🤑","shyly | shy·ly | shy/ly | 😳","wise | wise | w/ise | 🦉","calmly | calm·ly | calm/ly | 😌","muscles | mus·cles | mus/cles | 💪","tempting | tempt·ing | tempt/ing | 🍲"],"reading":["> The Sound of Money and the Smell of Soup","> Many more years ago than anyone can remember, there was a young man named Erman who lived in a village in the Kingdom of Atinka, a country far away from everywhere.","> Erman had little money. In fact, he only had three gold coins. One day, Erman went on a journey to find a job. He traveled over land and sea, through deserts and forests, across rivers and mountains, until he arrived in a city. As he looked around, he was fascinated by the sights, sounds, and smells of the market. There were people selling jewels, spices, leather, delicate vases, and clothes. There were donkeys, sheep, goats, and camels. There were musicians banging drums and playing flutes. Surely here Erman would find a job!","> Erman saw a sign: ROOM TO RENT. Very nervously, he knocked at the door. A terrifying man with huge muscles opened it.","> \"What do you want?\" the man hollered rudely.","> \"A room, please, sir,\" answered Erman politely.","> \"Three gold coins!\" replied the man. He looked fierce. Erman began to shake.","> \"But, but...,\" said Erman.","> \"Three gold coins!\" repeated the man aggressively. Erman had no choice. Handing the man the only three coins he had, he went up to his room.","> The next morning, Erman woke up early. He was starving! What was that delicious smell? It was a tasty mixture of chicken, carrots, spices, herbs, and garlic. Erman's stomach made a growling noise like a tiger. He galloped down the staircase, following the smell with his nose in the air.","> In the kitchen, the rude man was stirring a pot of soup as big as a bathtub with a wooden spoon. Several people were waiting to pay for their lunches. Erman turned to the man bravely and said, \"May I have some of that mouth-watering soup?\"","> \"Three gold coins,\" yelled the man threateningly.","> \"But, but...,\" said Erman. He didn't have any gold coins left, so he went back up to his room. He pulled a chair onto his balcony. From there, he could smell the soup with all its tempting flavors.","> Sniff, sniff, sniff. Erman sucked in the air and imagined he was eating the greedy man's soup.","> \"What are you doing?\" yelled the man. He was standing on the street, staring up at Erman. \"Nothing,\" said Erman shyly. \"I was just smelling your delicious soup.\"","> \"You are a thief!\" screamed the man. \"You have stolen my smells! I will take you to court and make you pay for the smell of my soup!\"","> He dragged Erman down the staircase, along the street, and straight into the law court.","> In the court, the Hodja, who was a wise man and a judge, was reading a newspaper, as he often did. Everybody asked him to decide who was right and who was wrong. That was the Hodja's job. The Hodja looked at Erman, and then he looked at the terrifying man. \"What's the problem?\" he asked.","> \"This boy has stolen my smells!\" screamed the man. His face was purple with anger.","> \"And you want to be paid for the smells?\" asked the Hodja.","> \"Yes, I do!\" bellowed the man.","> \"Then I will pay you,\" said the Hodja calmly. He took three gold coins from his pocket and, one by one, he threw them into a metal bowl.","> CLANG! CLANG! CLANG!","> \"There you are,\" said the Hodja, returning to his newspaper. \"You can leave now.\"","> \"But... but... where's my money?\" cried the man. The Hodja looked at the man over the top of his newspaper.","> \"I have paid you for the smell of soup with the sound of money,\" the Hodja said fiercely. \"Now, go away!\"","RC | How much money did Erman have when he left home? | three gold coins | a bag of jewels | no money at all","RC | What did the rude man say Erman had stolen? | his smells | his soup | his gold coins","RC | Who was the Hodja? | a wise judge | a soup maker | a musician","RT | Why did Erman go on a journey? | Erman went on a journey to find a job.","RT | What was the rude man doing in the kitchen? | He was stirring a big pot of soup with a wooden spoon.","RT | How did the Hodja pay the man? | He paid for the smell of soup with the sound of money.","RS | Why did Erman sit on his balcony and sniff the air?","RS | What lesson can we learn from this folk tale? Tell us your idea."],"grammar":["GT | Adjectives and Adverbs","R | adjective  →  about a noun:  A **terrifying** man with **huge** muscles opened the door.","R | adverb of manner  →  how:  \"Three gold coins!\" repeated the man **aggressively**.","R | adverb of frequency  →  how often:  The Hodja was reading a newspaper, as he **often** did.","G | A terrifying man with huge muscles opened the door.","G | The man repeated the price aggressively.","G | The Hodja often read a newspaper in court.","G | Erman knocked at the door very nervously.","G | The little boy greedily ate all the grapes.","G | My sister can paint beautiful pictures.","G | Police officers often chase thieves quickly.","G | May I have some of your delicious soup, please?"],"sw":["SP | A: What do you want right now? | B: Now, I want to save for a {game}. What about you? | A: I want to save for a magazine. What about the future? | B: I need to invest money for a computer. | game / magazine / pair of sneakers / T-shirt / bike / book","SW | My {brother} is {extremely} {funny}. He tells jokes {really} well. | Write two sentences about a person you know, using adverbs of degree like very, really, or extremely."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":14,"title":"The History of Money","bq":"Why do we use money?","learn":["What does \"barter\" mean? | to exchange one thing for another thing without money","What does \"currency\" mean? | the money used in a country","What does \"owe\" mean? | to need to pay money back to someone","Spell the word \"borrow\". | b-o-r-r-o-w","Spell the word \"exchange\". | e-x-c-h-a-n-g-e","Complete the unreal conditional: If I ___ (have) a plane, I would fly to Peru. | If I had a plane, I would fly to Peru.","Complete: If my friend could fly a plane, we ___ go to the North Pole. | would","Why did people use shells as money about 3,000 years ago? | Shells are beautiful, hard, last a long time and are hard to find.","Where was the first coin invented? | In China.","Do you think we will stop using coins and bills one day? Why?"],"battle":["T | How did the Chinese first print money? | The Chinese first printed money on leather from animals' skins.","B | People barter one thing for another thing.","B | If I had a plane, I would fly to Peru.","F | If I have a bike, I would get to school quicker. | If I had a bike, I would get to school quicker.","F | If I won a prize, I will be very happy. | If I won a prize, I would be very happy.","W | lend | Make a sentence with the word lend.","P | 🐄🌾🐚🪙 | How did money change over time? Explain the pictures.","C | Is paper money or electronic money better? | Paper money | Electronic money","Z | Name three things people used as money before coins.","S | What would you do if you had a million dollars? Say two sentences."],"words":["bank | bank | b/ank | 🏦","currency | cur·ren·cy | cur/ren/cy | 💱","coins | coins | c/oins | 🪙","barter | bar·ter | bar/ter | 🔄","copy | cop·y | cop/y | 📄","bill | bill | b/ill | 💵","spend | spend | sp/end | 🛍️","pay | pay | p/ay | 💳","borrow | bor·row | bor/row | 🤝","exchange | ex·change | ex/change | ↔️","owe | owe | o/we | 🧾","lend | lend | l/end | 💸","shells | shells | sh/ells | 🐚","valuable | val·u·a·ble | val/u/a/ble | 💎"],"reading":["> The History of Money","> When Did It All Start? Between 11,000 and 6,000 years ago (no one is completely sure when), people started exchanging cows, sheep, camels, and crops to get the things they needed. This is called bartering. People barter one thing for another thing. Here's how it worked in the beginning:","> \"Hi. I need some flour to make bread. You have wheat. Hmm! What can we exchange?\" \"Well, I have cows. How about I give you a cow for a field of wheat?\" \"It's a deal!\"","> From Shells and Feathers to Coins: Around 3,000 years ago, people decided that shells were a good form of money. But why? The answer is simple. Shells are beautiful, they're hard, and they don't break easily, so they last a long time. You can't find shells everywhere, and that makes them precious, so shells became valuable. If people wanted something, they would give shells for it. Other people did the same thing with feathers.","> Next, about two hundred years later, the first coin was invented in China. The coins were made out of metal. Nowadays, we have small, round coins, but back then, they were made into different shapes in different countries.","> Later, people used precious metals, like gold and silver, to make coins. In Lydia, which is now part of the country we call Turkey, a mixture of silver and gold was used to make coins. But guess what? Coins are heavy! If you had a lot of coins in your pocket all the time, they would make a hole!","> Printed Money and Paper Money: About 1,200 years ago, the Chinese started to print money, but it wasn't paper money. They used leather from animals' skins. It wasn't until the seventh century that they decided to use paper. At last the world had its first paper currency. Paper is light and easy to carry. If you had paper money, you wouldn't need so many coins. Strangely enough, it took many more centuries for other countries around the world to start using paper money.","> One of the problems with paper money was that it was easy to copy. Early banknotes, or bills, were printed in black and white. People who could draw well could easily copy them. Now bills are colorful. They have complicated designs, which are often pictures or portraits of people, and metal threads - long, thin lines that go across the bill. That makes them very difficult for anyone to copy.","> Invisible Money: We still have paper money and coins, but now we also pay for things electronically. Many people do their shopping online because now you can buy almost anything you want on the Internet. To spend money electronically, we can use cell phones and plastic cards, such as credit and debit cards. Using one of these ways tells the bank to pay another person, store, or restaurant for goods or services. We can borrow money from the bank this way, too. The bank lends us money for a certain amount of time, and we pay back what we owe them later. Maybe one day we won't need coins and bills at all!","RC | What were the first coins made out of? | metal | paper | leather","RC | Where was a mixture of silver and gold used to make coins? | in Lydia | in China | in Peru","RC | What did the Chinese first print money on? | leather | paper | shells","RT | Why did shells become valuable? | You can't find shells everywhere, so they became precious and valuable.","RT | Why was early paper money easy to copy? | Early bills were printed in black and white.","RT | What can we use to spend money electronically? | We can use cell phones and plastic cards.","RS | What is bartering? Give an example from the text.","RS | Why is paper money better than coins? Tell us one reason."],"grammar":["GT | Unreal Conditional","R | **If** + past,  **would** + verb  →  not possible now","R | **If** I **had** a plane, I **would fly** to Peru.","G | If I had a plane, I would fly to Peru.","G | If I had a bike, I would get to school quicker.","G | If my friend could fly a plane, we would go to the North Pole.","G | If I won a prize, I would be very happy.","G | If I could drive a car, I would drive around the world.","G | If I had some money, I would buy a new game.","G | What would you do if you met someone famous?","G | If you had a plane, I would go with you."],"sw":["SP | A: You have 100 dollars to donate. Who would you help? | B: I would donate the money to a {hospital}. | A: Who would the money help? | B: It would help sick people. What about you? | hospital / school / children's charity / animal clinic / library / zoo","SW | My {bedroom} is like {a nest}, all cozy and warm. I am as {happy} as {a puppy}. | Write two sentences with similes using as ... as and like."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":15,"title":"One Man's Self-Expression: Underwater Sculptures","bq":"How do we express ourselves?","learn":["What does \"artificial\" mean? | made by people, not natural","What does \"ambitious\" mean? | big and needing a lot of effort to achieve","What does \"permanent\" mean? | lasting for a very long time, not temporary","Spell the word \"innovative\". | i-n-n-o-v-a-t-i-v-e","Spell the word \"remarkable\". | r-e-m-a-r-k-a-b-l-e","Complete with an adjective: The sculptures look ___ and rough. | bumpy","Correct the sentence: This lemon smells well. | This lemon smells good.","Where does Jason deCaires Taylor put his sculptures? | Underwater, in clear and shallow water.","How many sculptures are in The Silent Evolution? | 400 life-size sculptures of people.","Is underwater art a good way to express yourself? Why or why not?"],"battle":["T | What happens to Taylor's sculptures over time? | Algae and coral grow on them and they become an artificial reef.","B | The sculptures look bumpy and rough.","B | This lemon smells good, but it tastes bitter.","F | I felt sickly this morning, but I'm OK now. | I felt sick this morning, but I'm OK now.","F | Your new song sounds fantastically! | Your new song sounds fantastic!","W | design | Make a sentence about a design you like.","P | 🗿🌊🐠🐚 | What is this art? Describe what you see.","C | Which is better for art, a gallery or the ocean? | A gallery | The ocean","Z | Name the five sense verbs.","S | Describe your favorite food using three sense verbs."],"words":["design | de·sign | de/sign | ✏️","innovative | in·no·va·tive | in/no/va/tive | 💡","remarkable | re·mark·a·ble | re/mark/a/ble | 🌟","ambitious | am·bi·tious | am/bi/tious | 🏆","permanent | per·ma·nent | per/ma/nent | 🗿","settle | set·tle | set/tle | 🏡","emerge | e·merge | e/merge | 🌱","artificial | ar·ti·fi·cial | ar/ti/fi/cial | 🤖","promote | pro·mote | pro/mote | 📣","enclose | en·close | en/close | 🔒","suitable | suit·a·ble | suit/a/ble | ✅","beneficial | ben·e·fi·cial | ben/e/fi/cial | 💚","algae | al·gae | al/gae | 🟢","crustaceans | crus·ta·ceans | crus/ta/ceans | 🦀"],"reading":["> One Man's Self-Expression: The Mysterious Underwater World of Jason deCaires Taylor","> Humans never cease to find innovative ways of expressing themselves. From the early cave paintings that our ancestors drew to the present day, there are millions of examples of self-expression, ranging from music to painting, poetry to dance. They express our feelings as we explore what it means to be human.","> Imagine swimming in the sea and suddenly, beneath you, seeing a sculpture of a man sitting at a desk with a typewriter! If you went to Grenada, in the West Indies, that's exactly what you'd see. It's just one of the remarkable ideas that has come out of the mind of Jason deCaires Taylor.","> Taylor is a sculptor, but a sculptor with a difference. Instead of putting his sculptures in a park or an art gallery, he puts them underwater and creates \"living\" sculptures. Taylor chooses areas of the world where there is clear, shallow water. His underwater exhibitions can be seen in Mexico, Grenada, and the United Kingdom. Scuba divers, snorkelers, swimmers, and tourists in glass-bottomed boats can all see this mysterious world that Taylor has created. Underwater, everything is magnified (it looks bigger) and colors change because the only light underwater is from the surface.","> One of Taylor's most ambitious exhibitions is The Silent Evolution, a permanent artificial reef in Mexico that occupies an underwater space of 420 square meters. It's made up of 400 life-size sculptures of people.","> The amazing thing about Taylor's work is that, over time, his sculptures become \"living.\" Algae, a type of ocean plant, begins to grow on the figures, as does coral. Fish swim in between the sculptures; starfish cling to them. The surface of the sculptures changes. At first they look smooth, but later they look bumpy and rough. Different colors emerge as the marine plants settle on their new, man-made habitat. Effectively, the exhibition turns into an artificial coral reef.","> Taylor's art is a combination of art and science. He works with marine biologists to create habitats for specific species of marine animals. Each sculpture is made from environmentally friendly materials that promote coral growth, and is designed to last for hundreds of years. In an interview, Taylor said, \"The coral applies the paint. The fish supply the atmosphere. The water provides the mood. People ask me when it's going to be finished. This is just the beginning.\"","> So, what is Taylor's self-expression? His work looks at humans and nature, loss, and hope. Human activity has destroyed some of the largest, most beautiful coral reefs in the world. In just a few decades, 40 percent of them have disappeared, and scientists predict that 80 percent will have vanished by 2050. By creating artificial reefs, Taylor hopes to draw people away from the natural ones and save them. Taylor also feels that modern technology has meant we have lost things that will never return, like the typewriter, which no one uses anymore because we have computers. His Lost Correspondent exhibit expresses this loss.","> In his exhibition The Anthropocene, which lies on the seabed at a depth of eight meters, Taylor used materials to attract crustaceans such as lobsters, crabs, and shrimp. A life-size copy of a Volkswagen Beetle car encloses a \"lobster city.\" The holes in the bottom part of the car act as doors for the lobsters to swim through, while the holes in the windows are suitable for small fish species to enter the car to hide and to breed. Inside the car, there are living spaces for lobsters. And so, this innovative example of human art turns into something that is positive and beneficial to marine life.","RC | Where does Taylor put his sculptures? | underwater | in a park | in an art gallery","RC | What begins to grow on the sculptures over time? | algae and coral | grass and flowers | moss and mushrooms","RC | What does the Volkswagen Beetle car enclose? | a lobster city | a typewriter | a starfish garden","RT | What kind of water does Taylor choose for his exhibitions? | He chooses areas with clear, shallow water.","RT | How many sculptures are in The Silent Evolution? | It is made up of 400 life-size sculptures of people.","RT | Why does Taylor create artificial reefs? | He hopes to draw people away from the natural reefs and save them.","RS | How do the sculptures change over time? Tell us two things.","RS | What does the Lost Correspondent exhibit express? Why?"],"grammar":["GT | Sense Verb + Adjective","R | look · feel · sound · smell · taste  +  **adjective**  (not an adverb)","R | The sculptures **look bumpy** and **rough**.      I **felt sick** this morning.","R | This lemon **smells good**, but it **tastes bitter**.","G | The sculptures look bumpy and rough.","G | I felt sick this morning, but I'm OK now.","G | This lemon smells good, but it tastes bitter.","G | Your new song sounds fantastic!","G | That machine sounds like a plane taking off.","G | The pillow feels very soft.","G | Why do you look so angry today?","G | That chocolate cake tastes delicious!"],"sw":["SP | A: What kind of self-expression do you think is the most important? | B: I think {art} is the most important form of self-expression. | A: Why do you say that? | B: I think it's important because it shows our feelings. | art / music / poetry / dance / painting / singing","SW | Most of my {friends} live in {an apartment}. Many of my classmates {play soccer}. There are several {big buildings} in my town. | Write three sentences about people and places you know, using most, many, and several."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":16,"title":"The Tempest","bq":"How do we express ourselves?","learn":["What does \"playwright\" mean? | a person who writes plays","What does \"tempest\" mean? | a violent storm","What does \"villain\" mean? | a bad person in a story","Spell the word \"advisor\". | a-d-v-i-s-o-r","Spell the word \"grateful\". | g-r-a-t-e-f-u-l","Rewrite using an infinitive as subject: Climbing a tree is fun. | It's fun to climb a tree.","Rewrite using an infinitive as subject: Saving the passengers and crew is difficult. | It's difficult to save the passengers and crew.","Who wrote The Tempest? | William Shakespeare.","Where was the ship sailing from at the beginning of the play? | From Tunis, in North Africa, to Italy.","Would you rather be an actor or a playwright? Why?"],"battle":["T | Why does the sailor tell the king's men to go to their cabins? | They are preventing the sailors from doing their work.","B | It's difficult to calm down in a storm.","B | Actors bring the playwright's words to life.","F | It's difficult save the passengers and crew. | It's difficult to save the passengers and crew.","F | Is fun to climb a tree. | It's fun to climb a tree. / It is fun to climb a tree.","W | stage | Make a sentence about a stage.","P | ⛵🌩️👑😱 | What is happening on the ship? Tell the story.","C | Is it better to watch a play or a movie? | A play | A movie","Z | Name three people who help make a play happen.","S | Say three opinions using \"It's easy to\" or \"It's difficult to\"."],"words":["cabin | cab·in | cab/in | 🛏️","advisor | ad·vi·sor | ad/vi/sor | 🧑‍💼","deck | deck | d/eck | 🚢","grateful | grate·ful | grate/ful | 🙏","tempest | tem·pest | tem/pest | ⛈️","save | save | s/ave | 🛟","react | re·act | re/act | 😮","villain | vil·lain | vil/lain | 😈","stage | stage | st/age | 🎭","playwright | play·wright | play/wright | ✍️","massive | mas·sive | mas/sive | 🐘","petrified | pet·ri·fied | pet/ri/fied | 😱","crew | crew | cr/ew | ⚓","elderly | el·der·ly | el/der/ly | 👴"],"reading":["> The Tempest","> Drama is another form of self-expression, but it can only happen with the aid of different people. First, a playwright writes a play. A play expresses the playwright's feelings about a topic or about life in general. Next, actors perform the play. They bring the playwright's words to life. Actors perform on a stage, and set designers decide how the stage will look. Finally, an audience watches the play. The audience reacts to the words the playwright has written, but also to the way the actors are performing the play.","> One man, who was both a poet and playwright, became the most famous writer in the English language: William Shakespeare. His plays have been performed all over the world, and in many languages.","> One of Shakespeare's plays is called The Tempest. A tempest is a violent storm. At the beginning of the play, a ship is sailing from Tunis, in North Africa, to Italy. The ship is carrying some extremely important people. When a massive storm starts at sea, everybody on board is petrified that the waves and wind will break up the ship and throw the passengers and crew into the water. The captain and all the sailors are doing their very best to save the ship and its passengers from the storm.","> Cast of The Tempest: Alonso, King of Naples (a city in Italy). Ferdinand, Alonso's son. Sebastian, Alonso's son and brother of Ferdinand. Antonio, Duke of Milan (another city in Italy). Gonzalo, an elderly man who is an advisor to the king. Sailors.","> Act 1, Scene 1. Loud noises of thunder and lightning can be heard because of the terrible storm. A ship's captain and a sailor walk onto the stage.","> CAPTAIN: Sailor!","> SAILOR: I'm here, captain. How can I help you?","> CAPTAIN: Oh, good! Please go and talk to the other sailors. We're in trouble. Talk to the sailors; get them ready. Hurry, before the ship runs into the rocks! Hurry! Go!","> The captain leaves the stage, fast. More sailors enter the stage.","> SAILOR: Come on, sailors! Good job! Quickly, quickly! You need to take in the big sail. And listen carefully to the captain's orders. Blow until you burst, wind, but leave enough room for us!","> Alonso, Sebastian, Antonio, Ferdinand, Gonzalo, and some others enter the stage.","> ALONSO: Watch out, good sailor! Where's the captain? Make sure the other sailors do their work.","> SAILOR: Please go back under the deck, Sir!","> ANTONIO: Sailor, where's the captain?","> SAILOR: The captain is busy giving people orders. Can't you hear him? You're preventing us from doing our work. Go back to your cabins. You're helping the storm, not us!","> GONZALO: Calm down, good sailor!","> SAILOR: It's difficult to calm down in a storm! I'll calm down when the sea calms down! Now go! These big waves don't care about kings and their advisors. Go to your cabin and keep quiet! Don't add to our problems.","> GONZALO: I'll do what you say, but just remember, you have important people on board.","> SAILOR: The most important person on board is me! If you're so important, then order the storm to stop. If you can calm this weather, and make the sea peaceful, we can put down our ropes and rest. If you cannot, then be grateful for your long life, go to your cabin, and get ready for the worst. Come on, men! Now get out of our way.","> The sailor leaves the stage.","> GONZALO: That sailor makes me feel better. He'll never die on a ship at sea. We're lucky to be here with a terrible villain like him. If he survives this storm, we all will.","> Gonzalo and the other king's advisors leave the stage.","RC | Who wrote The Tempest? | William Shakespeare | Gonzalo | the captain","RC | Where is the ship sailing to? | Italy | North Africa | England","RC | Where does the sailor tell Alonso and Gonzalo to go? | to their cabins | to the big sail | to the rocks","RT | Why is the captain worried? | He is worried because the ship might run into the rocks.","RT | What is a tempest? | A tempest is a violent storm.","RT | Who is Gonzalo? | Gonzalo is an elderly man who is an advisor to the king.","RS | Why is the sailor angry with Gonzalo and the other important people?","RS | Why does the sailor make Gonzalo feel better?"],"grammar":["GT | Infinitive as Subject","R | **It's** + adjective + **to** + verb  →  an opinion","R | It's difficult **to save** the passengers and crew.","R | It's fun **to climb** a tree.","G | It's difficult to save the passengers and crew.","G | It's fun to climb a tree.","G | It's fun to act in a play.","G | It's easy to learn English if you read a lot of books.","G | It's dangerous to climb a mountain in a storm.","G | Is it easy to learn to swim?","G | It's exciting to ride a horse.","G | It's nice to cook a meal for your family."],"sw":["SP | A: Hey, let me help you with your {math homework}. | B: Thanks so much! That's very kind of you. | A: No problem. I'm happy to help. | B: I really appreciate it. | math homework / science project / heavy bags / English test / bike / lost phone","SW | Last week I saw {a play} at {the theater}; it was {very funny}. My favorite character was {the villain}; everyone reacted by laughing. | Write about a play or show you saw, and join two related sentences with a semicolon."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":17,"title":"The World's Most Extraordinary Buildings","bq":"Why do we make buildings?","learn":["What does \"skyscraper\" mean? | a very tall building with many floors","What does \"warehouse\" mean? | a large building where goods are stored","What does \"lighthouse\" mean? | a tower with a light that guides ships","Spell the word \"stadium\". | s-t-a-d-i-u-m","Spell the word \"theater\". | t-h-e-a-t-e-r","Add the article: It's ___ shark. | It's a shark.","Correct the sentence: I play the tennis on Saturdays. | I play tennis on Saturdays.","What is special about the hotel in Finland? | It is made entirely of glass igloos where guests sleep under the stars.","What does an architect do before a building can be built? | The architect designs the shape and plans how the building will be used.","Which building in the article would you most like to visit? Why?"],"battle":["T | Why do people build houses, apartments and hotels? | Everybody needs a place to sleep, eat and stay protected from the weather.","B | The museum is built in the shape of a saucer.","B | I saw Jim at lunch in the office.","F | Can I have apple, please? | Can I have an apple, please?","F | We went to the Spain last summer. | We went to Spain last summer.","W | palace | Make a sentence about a palace.","P | 🏟️🏙️🏛️🏰 | What are these buildings for? Explain.","C | Is it better to build tall skyscrapers or wide, low buildings? | Tall skyscrapers | Wide, low buildings","Z | Name three buildings where people work.","S | Describe your dream building in three sentences."],"words":["stadium | sta·di·um | sta/di/um | 🏟️","lighthouse | light·house | light/house | 🔦","tower | tow·er | tow/er | 🗼","skyscraper | sky·scrap·er | sky/scrap/er | 🏙️","warehouse | ware·house | ware/house | 📦","palace | pal·ace | pal/ace | 🏰","courthouse | court·house | court/house | ⚖️","theater | the·a·ter | the/a/ter | 🎭","office | of·fice | of/fice | 🏢","showroom | show·room | show/room | 🚗","architect | ar·chi·tect | ar/chi/tect | 📐","steel | steel | st/eel | 🔩","construction | con·struc·tion | con/struc/tion | 🏗️","countless | count·less | count/less | 🔢"],"reading":["> The World's Most Extraordinary Buildings","> So, a building is just a building, right? Wrong! Buildings have many different purposes. People use buildings for living, for working, for manufacturing, and also for going to school or to the movies. Here are some of the key reasons we build buildings.","> Buildings for Shelter: Everybody needs a place to sleep, eat, and keep themselves protected from the weather, so we build houses, apartments, and hotels. Have a look at a few exceptional ones from around the world. The Palais Bulles (Bubble Palace) is a \"palace\" that's used for conferences and other big events. It reminds people of caves; there aren't any straight lines at all. There's a hotel in Finland that's made entirely of glass igloos where guests can sleep under the stars. And take a look at this hotel in the Maldives. Its bedrooms are almost 5 meters underwater!","> Buildings for Work: People have jobs, so they need places where they can work. People work in factories, warehouses, lighthouses, offices, schools, hospitals, courthouses, restaurants, airports, barns, showrooms, libraries, skyscrapers, and bus, train, fire, and police stations. This is the headquarters of the Longaberger Company in Ohio, which manufactures wooden baskets. Here's an office with a difference! It recycles water and uses the power of the sun. There are even trees growing on a terrace on one of the floors.","> Buildings for Leisure and Fun: Everyone likes to have fun, so we need buildings for that purpose, too, whether we want to listen to a concert, go to a play, or play some sports. Shopping malls, movie theaters, and museums are all buildings that we use for having fun. This incredible museum is built in the shape of a saucer. It's set on a clifftop above a beach in Niteroi, Brazil.","> What Do Architects Do? Before a building can be built, an architect needs to design the shape of the building and plan exactly how it will be used. First, the architect has to consider how many people will need to work or live inside the building, and what activities these people will be doing. This is called the function of the building. Then the architect draws detailed plans and makes a model of the building so that clients can see what the finished structure will look like. This also helps the architect decide how much steel will be needed. When the planning is finished and approved, construction can begin.","> Zaha Hadid, Architect: Zaha Hadid was an architect who designed countless buildings: concert halls, theaters, towers, museums, art galleries, stadiums, ski jumps with cafes... you name it! Here are some of Zaha's most famous buildings.","> The Dorobanti Tower, in the heart of Bucharest, Romania, is an apartment block that was designed using diamond shapes and stands 200 meters tall. It's visible from several kilometers away, and has been designed to be extremely strong, since Bucharest is located in an earthquake zone.","> In 2010, construction of the Sheikh Zayed Bridge in Abu Dhabi, UAE, was completed. Zaha designed the arches of the bridge to look like wavy sand dunes in the desert. By night, the bridge is lit with colored lights that change little by little, giving an amazing impression of movement. Standing 64 meters above the water, the bridge is one of the most complex ever built. Zaha was also the architect for the London Olympics Aquatics Centre, where all the swimming and diving competitions took place.","> Check this out! It's part of the Dongdaemun Design Plaza and Park, designed by Zaha to bring inspiration to the people of Seoul, South Korea. It has a design museum, a library, and lecture theaters. It's surrounded by a 30,000-square-meter park laid out in the traditional Korean way, with reflecting pools, lotus ponds, and bamboo plants.","RC | What does an architect do before a building can be built? | design the building | paint the walls | sell the building","RC | What is the hotel in Finland made of? | glass igloos | wooden baskets | steel towers","RC | Where did the London Olympics swimming competitions take place? | the Aquatics Centre | the Dorobanti Tower | the Sheikh Zayed Bridge","RT | What is the function of a building? | The function is how many people will use the building and what activities they will do inside it.","RT | Why was the Dorobanti Tower designed to be extremely strong? | It was designed to be strong because Bucharest is located in an earthquake zone.","RT | What do the arches of the Sheikh Zayed Bridge look like? | The arches look like wavy sand dunes in the desert.","RS | What are the three key reasons we build buildings? Tell us one and give an example.","RS | Which building in the article would you most like to live or work in? Why?"],"grammar":["GT | A, An, The, and No Article","R | **a / an**  →  the first time, not special:  It's **a** shark.","R | **the**  →  talking about it again, the person knows which:  It's in **the** pool.","R | no article  →  sports, meals, most countries, school subjects:  I play tennis.  We went to Spain.","G | Before a building can be built, the building needs to be designed.","G | I go to the pool every weekend.","G | Can I have an apple, please?","G | There's an apple in the fridge.","G | Do you like swimming?","G | We went to Spain last summer.","G | I saw a shark in the pool.","G | The sandwiches my mom makes are great."],"sw":["SP | A: Where would you like to live? | B: I'd like to live in {a lighthouse}. | A: Why do you want to live there? | B: I think it's because I love the view. | a lighthouse / an apartment / a palace / a house / a skyscraper / a tower","SW | People make buildings for {shelter}. My favorite building is {the stadium} because {I love sports}; it is {huge and exciting}. | Write three sentences about why people make buildings and which building is your favorite."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":18,"title":"The Mystery of Peril Castle","bq":"Why do we make buildings?","learn":["What does \"moat\" mean? | a deep, wide ditch filled with water around a castle","What does \"drawbridge\" mean? | a bridge that can be pulled up to stop people entering a castle","What does \"ramparts\" mean? | the high walls around a castle that defend it","Spell the word \"courtyard\". | c-o-u-r-t-y-a-r-d","Spell the word \"turret\". | t-u-r-r-e-t","Which tense is this sentence: I will see the castles of Wales someday. | future with will","Change to the past: I need to find the coin. | I needed to find the coin.","Why was Peril Castle built in the 15th century? | To defend Hellenbore City.","What did Uncle Robert find in the attic? | Half a gold coin with the letters D-A-W and half an eagle.","Would you like to explore an empty castle at night? Why or why not?"],"battle":["T | Where did Thomas find the other half of the coin? | He found it in a secret passageway behind the ramparts.","B | Peril Castle had been empty for over a hundred years.","B | They renamed the castle Peril-Dawson Castle.","F | Yesterday, Thomas climbs onto the ramparts. | Yesterday, Thomas climbed onto the ramparts.","F | Someday I see the castles of Wales. | Someday I will see the castles of Wales.","W | tremble | Make a sentence with the word tremble.","P | 🏰🪙🐦🔑 | What is the mystery? Tell the story.","C | Should old castles be restored or left as ruins? | Restored | Left as ruins","Z | Name three parts of a castle.","S | Talk about yesterday, today and tomorrow. Say one sentence for each."],"words":["turret | tur·ret | tur/ret | 🏰","stable | sta·ble | sta/ble | 🐴","courtyard | court·yard | court/yard | 🏛️","gatehouse | gate·house | gate/house | 🚪","moat | moat | m/oat | 🌊","drawbridge | draw·bridge | draw/bridge | 🌉","hall | hall | h/all | 🍽️","rampart | ram·part | ram/part | 🧱","mumble | mum·ble | mum/ble | 🤐","stiffen | stif·fen | stif/fen | 🧍","missing | miss·ing | miss/ing | ❓","tremble | trem·ble | trem/ble | 😨","padlock | pad·lock | pad/lock | 🔒","mysterious | mys·te·ri·ous | mys/te/ri/ous | 🕵️"],"reading":["> The Mystery of Peril Castle","> Peril Castle was built in the 15th century to defend Hellenbore City, but now it was deserted. It had been empty for over a hundred years. The local people didn't dare go near it. Its turrets looked terrifying against the evening sky.","> \"Thomas!\" shouted Thomas's uncle Robert from the attic, where he'd been looking through old boxes.","> \"What is it?\" asked Thomas.","> \"Look! It's proof that Peril Castle belongs to us!\" replied Uncle Robert. \"Here's the first half of our name!\" In his trembling hand was half a gold coin with the letters D-A-W clearly visible on it. Thomas and Robert's last name was Dawson. Also on the coin was half of an eagle's body, with its left wing spread wide. Thomas had known all his life that Peril Castle was his family's castle, but without proof, Uncle Robert couldn't claim it.","> \"We need the other half of the coin. Let's see if we can find it,\" said Uncle Robert urgently. They ran out of the house and up the hill toward Peril Castle.","> Thomas felt nervous, but they had to solve the mystery of the missing half-coin. His knees were trembling as he walked toward the deep moat that surrounded the castle. It was filled with green algae. Robert pulled a lever and the drawbridge swung down, making Thomas jump. They scurried across the drawbridge. Thomas and Uncle Robert searched the gatehouse and the stables, but they found nothing. Then they went into the hall. Hurriedly, they checked every corner, searching for clues that would bring them closer to their goal.","> Where shall we look now? thought Thomas, staring at the courtyard. He gazed at the gray stones of the walls and looked up at the ramparts. Then he spotted an ancient metal ladder.","> Thomas climbed quickly, listening to his heart thumping. Pulling himself onto the ramparts, he saw a box with a rusty padlock on it.","> \"I've found a box!\" shouted Thomas, shaking the lock. As his uncle scrambled up the ladder, the lid sprang open. At first the box looked empty, but on closer examination, Thomas saw a secret drawer. He slid it open and found an old map of the castle.","> Uncle Robert and Thomas studied the map, which showed the castle as it had originally been built.","> \"Look!\" yelled Thomas. \"There's a secret passageway behind the ramparts. It goes right inside the eleventh turret.\"","> As they walked round the ramparts, Thomas noticed a magpie flying back and forth from the eleventh turret. His heart started to thump again, and his body stiffened with anticipation.","> Halfway along the ramparts, the pair saw a mysterious crack in the wall. Uncle Robert reached into his bag and took out a hammer. He hit the crack several times, and suddenly a narrow door swung open. As Thomas was watching Uncle Robert, the magpie returned and vanished through a small hole above their heads. \"It's the passageway!\" said Thomas, squeezing through the narrow door.","> \"I can't hear you. Don't mumble! What do you see?\" asked Uncle Robert anxiously. \"Nothing. It's too dark!\" replied Thomas.","> He fumbled around for several minutes until he felt something. It was a pile of objects of different shapes and sizes. Thomas filled his pockets and crawled back out.","> \"Look at these shiny things the magpie has collected!\" he shouted.","> There was a key, a Roman coin, a piece of silver, a ring, a spoon, and a tiny mirror. \"What's this?\" said Thomas, brushing dirt off a lump of metal. \"Wait! I don't believe it!\"","> Thomas turned the metal over, and there, clear as day, were the letters S-O-N and an eagle's right wing. Uncle Robert passed Thomas the other half of the coin that he'd found in the attic. The two halves clicked together as if they'd never been parted. DAWSON! This was the proof they needed!","> For a year, Uncle Robert and Thomas proudly restored the fortress. Once the job was done, they renamed it Peril-Dawson Castle. Flying the family flag from the eleventh turret, they invited all the local people to celebrate Hellenbore's ancient castle with them.","RC | What did Thomas want to find? | the other half of a coin | a golden eagle | an old sword","RC | What was Thomas and Robert's last name? | Dawson | Peril | Hellenbore","RC | What had the magpie collected? | shiny things | old maps | gold keys","RT | Where const BANK_SECTIONS={'# learn':'learn','# battle':'battle','# words':'words','# reading':'reading','# grammar':'grammar','# speak-write':'sw','# sound':'sound','# story':'story','# sort':'sort','# pairs':'pairs','# build':'build'};
function parseBankText(txt){
  const units=[];let cur=null,mode=null;
  for(const raw of String(txt).split('\n')){const l=raw.trim();
    if(l.startsWith('## ')){const parts=l.slice(3).split('|').map(x=>x.trim());const m=parts[0].match(/\d+/);if(!m)continue;const partial=/\(partial\)/.test(parts[0]+(parts[1]||''));
      cur={n:+m[0],title:(parts[1]||'').replace('(partial)','').trim(),bq:parts[2]||'',learn:[],battle:[],words:[],reading:[],grammar:[],sw:[],sound:[],story:[],sort:[],pairs:[],build:[],partial};units.push(cur);mode=null;continue;}
    const sec=BANK_SECTIONS[l];if(sec){mode=sec;continue;}
    if(!l||l.startsWith('===')||l.startsWith('//')||!cur||!mode)continue;
    cur[mode].push(l);}
  units.sort((a,b)=>a.n-b.n);return units;
}
async function loadLiveBank(){
  if(location.protocol==='file:')return;
  let n=0;
  for(const lv of ['OD1','OD2','OD3','OD4','OD5','OD6','OPW1','OPW2','OPW3','OPW4','OPW5']){
    try{const r=await fetch('bank/'+lv+'.txt',{cache:'no-store'});if(!r.ok)continue;const units=parseBankText(await r.text());if(units.length){OD_BANK[lv]={units};n++;}}catch(e){}
  }
  if(n){OD_LEVELS=Object.keys(OD_BANK).sort();H.bankLive=n;if(typeof renderHeader==='function'&&S)renderHeader();}
}

function gatherQs(){return lines(S.qText).map(l=>{let t=l;const m=/^\s*U\d{1,2}\s*\|/i.exec(t);if(m)t=t.slice(m[0].length);const k=t.indexOf('|');const o=k<0?{q:t.trim(),a:''}:{q:t.slice(0,k).trim(),a:t.slice(k+1).trim()};o.src=l;return o;}).filter(x=>x.q);}
function battleQs(){return lines(S.bText).map(parseQ).filter(Boolean);}
function pick(listFn,orderKey,ptrKey){const qs=listFn();if(!qs.length)return null;if(!S[orderKey].length||S[ptrKey]>=S[orderKey].length||S[orderKey].length!==qs.length){S[orderKey]=qs.map((_,i)=>i).sort(()=>Math.random()-.5);S[ptrKey]=0;}return qs[S[orderKey][S[ptrKey]++]]||qs[0];}
function skey(){return CR.inRunner&&CR.init&&CR.init.session?'habitat-cr-'+CR.init.session.id:'habitat-host';}
function save(){store(skey(),S);}
let bcastT=null;
function changed(){render();save();clearTimeout(bcastT);bcastT=setTimeout(broadcast,40);}
function pub(){
  const b=S.battle;let bp=null;
  if(b){const q=b.q;bp={round:b.round,step:b.step,qid:b.qid,endsIn:b.endsAt-Date.now(),
    q:q?{type:q.type,text:q.text,word:q.word||'',pic:q.pic||'',opts:q.opts||null,tiles:q.tiles||null,ci:q.ci}:null,
    choiceN:[0,1].map(i=>Object.values(b.choice||{}).filter(v=>v===i).length),buzz:(b.buzz||[]).slice(0,3),
    def:b.def?{teams:b.def.teams,q:b.def.q}:null,
    boss:b.boss?{name:b.boss.name,e:b.boss.e,hp:b.boss.hp,max:b.boss.max,defeated:!!b.boss.defeated}:null,
    vote:b.vote?{items:b.vote.items.map(x=>x.text),revealed:b.vote.revealed,counts:b.vote.revealed?voteCounts():null,winner:b.vote.revealed?b.vote.winner:-1,n:Object.keys(b.vote.votes).length}:null};}
  return{code:S.code,scene:S.scene,phase:S.phase,teams:S.teams.slice(0,S.teamCount),teamCount:S.teamCount,players:S.players,log:S.log.slice(-4),battle:bp,results:S.results,tab3d:!!S.tab3d,lt:ltPub()};
}
function myView(pid){const b=S.battle,lt=ltMy(pid);if(!pid||!b)return lt?{lt}:null;const sb=b.subs[pid],v=b.vote,p=P(pid);
  return{qid:b.qid,ok:b.ok[pid]||0,act:b.acts[pid]||null,sub:sb?{text:sb.text,ok:sb.ok}:null,choice:b.choice[pid]??-1,buzz:b.buzz.indexOf(pid),
    defender:!!(b.def&&p&&b.def.teams.includes(p.team)),blocked:!!(b.def&&b.def.blocks[pid]),spell:!!b.spells[pid],
    vote:v?{mine:v.items.findIndex(x=>x.pid===pid),voted:v.votes[pid]??-1}:null,lt};}
function broadcast(){const s=pub();for(const[conn,info]of H.conns){if(conn.open){const me=info.pid&&S.players[info.pid]?info.pid:null;try{conn.send({t:'state',s,me,my:myView(me)});}catch(e){}}}}
function sendTo(pid,m){for(const[conn,info]of H.conns)if(info.pid===pid&&conn.open)try{conn.send(m);}catch(e){}}
const sendErr=(pid,msg)=>sendTo(pid,{t:'toast',msg});

function newPlayer(name,char,team,manual){const pid='p'+(S.nextId++);S.players[pid]={pid,name,char,team,coins:0,lv:1,hp:HPMAX[1],armor:0,inv:{atk:0,def:0,heal:0},items:0,powers:0,dash:false,warp:false,down:false,pts:0,streak:0,online:true,manual:!!manual};return pid;}

function giveCoins(pid,n,why){const p=P(pid);if(!p)return;p.coins=Math.max(0,p.coins+n);if(n>0){log(`${p.name} ${why||'answered well'}! +${n} 🪙`);beep(720);floatText(pid,`+${n} 🪙`);burst(pid,['🪙'],Math.min(8,n*3),{speed:22});}else{log(`${p.name}: ${n} 🪙`);floatText(pid,`${n} 🪙`,'#d9480f');}flashRow(pid);changed();}
function greatJob(pid){const p=P(pid);if(!p)return;const c=classOf(p);p.coins++;p.items++;let m=`${p.name}: Great job! +1 🪙 +1 ${c.icon}`;
  if(p.items>=3){p.items=0;p.powers++;m+=` — ${c.power} charged!`;chime();burst(pid,['⚡','✨',c.icon],20,{ring:true,g:0,speed:20,drag:.96});}else beep(760);
  floatText(pid,`+1 🪙 ${c.icon}`);log(m);flashRow(pid);changed();}
function teamCoins(ti){Object.values(S.players).filter(p=>p.team===ti).forEach(p=>{p.coins++;if(p.crId)crEvent('points',{student:p.crId,delta:1,reason:'team bonus'});floatText(p.pid,'+1 🪙');});log(`${teamName(ti)}: everyone +1 🪙`);chime();changed();}
function allCoins(){Object.values(S.players).forEach(p=>{p.coins++;if(p.crId)crEvent('points',{student:p.crId,delta:1,reason:'class bonus'});floatText(p.pid,'+1 🪙');});log('Everyone gets +1 🪙!');chime();changed();}
function buy(pid,item){
  const p=P(pid);if(!p)return;const c=classOf(p);
  if(item==='upgrade'){if(p.lv>=3)return sendErr(pid,'Your habitat is already the biggest!');const cost=UPGRADE_COST[p.lv];if(p.coins<cost)return sendErr(pid,`You need ${cost} 🪙.`);
    p.coins-=cost;p.lv++;p.hp=HPMAX[p.lv];p.down=false;if(p.crId)crEvent('points',{student:p.crId,delta:-cost,reason:'upgrade'});const h=habOf(p);log(`${p.name} built a ${h[0]}! ${h[1]} (❤️ ${HPMAX[p.lv]})`);chime();
    setTimeout(()=>{popHab(pid);burst(pid,['🔨','✨',h[1]],16,{ring:true,g:0,speed:18,drag:.95});confetti(pid,[teamColor(p.team),'#ffd43b'],24);},60);}
  else if(['atk','def','heal'].includes(item)){if(p.inv[item]>=INV_CAP)return sendErr(pid,`You can carry ${INV_CAP} at most.`);if(p.coins<GEAR_COST)return sendErr(pid,`You need ${GEAR_COST} 🪙.`);
    p.coins-=GEAR_COST;p.inv[item]++;if(p.crId)crEvent('points',{student:p.crId,delta:-GEAR_COST,reason:'gear:'+item});const g=c[item];log(`${p.name} got a ${g[0]} ${g[1]}`);beep(880);setTimeout(()=>burst(pid,[g[1]],6,{speed:18}),60);}
  else return;
  changed();
}

/* ----- battle ----- */
const bossOn=()=>!!(S.battle&&S.battle.boss&&!S.battle.boss.defeated);
function freshBattle(){return{round:0,step:'idle',q:null,qid:0,ok:{},subs:{},acts:{},approved:[],choice:{},buzz:[],tries:{},def:null,boss:null,vote:null,spells:{},endsAt:Date.now()+S.battleMin*60000,timeUpShown:false};}
function ensureBattle(b){const f=freshBattle();for(const k in f)if(b[k]===undefined)b[k]=f[k];return b;}
function startBattle(){
  if(!Object.keys(S.players).length)return toast('Add players first.');
  S.phase='battle';S.showQR=false;S.card=null;S.lt=null;S.results=null;S.battle=freshBattle();crStart();
  Object.values(S.players).forEach(p=>{p.hp=maxHp(p);p.down=false;p.pts=0;p.streak=0;});
  log(`⚔️ Battle start! ${S.battleMin} minutes. Answer to attack, build or repair!`);
  changed();fanfare();banner('BATTLE START!',`${S.battleMin} minutes · Team vs Team`);
  setTimeout(()=>confetti(stageMid(),PARTY,60,{speed:55}),300);
}
async function nextRound(custom){
  const b=S.battle;if(!b||H.busy)return;
  const q=custom||pick(battleQs,'bOrder','bPtr');if(!q)return toast('Add battle questions in Setup.');
  H.busy=true;
  if(b.round>0)Object.values(S.players).forEach(p=>{p.streak=b.ok[p.pid]?(p.streak||0)+1:0;});
  q.ci=crIndex(q.src);b.round++;b.qid++;b.q=q;crStart();Object.assign(b,{ok:{},subs:{},acts:{},choice:{},buzz:[],tries:{},def:null,vote:null,spells:{}});b.step='question';H.showModel=false;
  const revived=Object.values(S.players).filter(p=>p.down);
  revived.forEach(p=>{p.down=false;p.hp=Math.ceil(maxHp(p)/2);p.armor=0;});
  let drop=null;
  if(b.round>1&&!bossOn()){const ts=teamStats(S).filter(t=>t.count>0);if(ts.length>1){ts.sort((x,y)=>x.pct-y.pct);if(ts[0].pct<ts[ts.length-1].pct-.05){drop=ts[0];Object.values(S.players).filter(p=>p.team===drop.ti).forEach(p=>{p.armor=Math.min(ARMOR_CAP,p.armor+2);});log(`📦 Supply drop! ${drop.name} gets +2 🛡️ each.`);}}}
  log(`Round ${b.round}: ${QTYPES[q.type]}`);
  changed();beep(500,.1);setTimeout(()=>beep(750,.15),120);
  banner(`ROUND ${b.round}`,QTYPES[q.type]);
  for(const p of revived){await sleep(120);popHab(p.pid);burst(p.pid,['🔨','✨'],10,{ring:true,g:0,speed:16,drag:.95});floatText(p.pid,'Rebuilt!');}
  if(drop){await sleep(700);Object.values(S.players).filter(p=>p.team===drop.ti).forEach(p=>{burst(p.pid,['📦','🛡️'],6,{speed:16});floatText(p.pid,'+2 🛡️','#495057');});}
  H.busy=false;
}
function markCorrect(pid,tier=1,auto=false){
  const b=S.battle,p=P(pid);if(!b||!['question','defense'].includes(b.step)||!p)return;
  if(tier&&(b.ok[pid]||0)!==tier&&p.crId)crEvent('grade',{student:p.crId,question:b.q&&b.q.ci,level:['','good','great','amazing'][tier],points:0,auto:!!auto});
  if(tier){const prev=b.ok[pid]||0;b.ok[pid]=tier;
    if(b.subs[pid]){b.subs[pid].ok=tier;if(!prev&&b.q&&TYPED.has(b.q.type)){b.approved.push({pid,text:b.subs[pid].text,round:b.round});if(b.approved.length>40)b.approved.shift();}}
    if(prev!==tier){beep(tier===3?990:820);floatText(pid,tier===3?'🌟 AMAZING!':tier===2?'⭐ GREAT!':'✓',tier===3?'#e8590c':tier===2?'#f08c00':'#2f9e44');burst(pid,tier===3?['🌟','✨','⚡']:tier===2?['⭐','⚡']:['⚡'],tier===3?18:tier===2?10:5,{speed:18});
      if(!prev)log(`${p.name} ${tier===3?'gave an AMAZING answer! 🌟':tier===2?'gave a great answer! ⭐':'can take an action! ⚡'}`);if(ui3d())H.hb3d.correct(pid,tier);sendTo(pid,{t:'fx',k:'cheer',tier});}
  }else{delete b.ok[pid];delete b.acts[pid];if(b.subs[pid])b.subs[pid].ok=false;}
  changed();
}
function approveAllGood(){const b=S.battle;if(!b||!b.q)return;Object.entries(b.subs).forEach(([pid,sb])=>{if(sb.ok!=null||!P(pid))return;if(!checkOK(sentenceCheck(sb.text)))return;if(b.q.type==='W'&&!wordHit(sb.text,b.q.word))return;markCorrect(pid,meter(sb.text).score>=5?2:1);});}
function onAnswer(pid,text){
  const b=S.battle,p=P(pid);if(!b||b.step!=='question'||!b.q||!TYPED.has(b.q.type)||!p)return;
  if(b.ok[pid])return;text=String(text||'').replace(/\s+/g,' ').trim().slice(0,200);if(!text)return;
  const sub={text,ok:null,at:Date.now(),meter:meter(text).score};if(b.q.type==='W')sub.word=wordHit(text,b.q.word);
  b.subs[pid]=sub;beep(600,.05);
  if(b.q.type==='F'&&b.q.model&&b.q.model.split(/\s+\/\s+/).some(x=>norm(x)===norm(text))){sub.auto=true;log(`${p.name} fixed the mistake! 🔍`);markCorrect(pid,2,true);return;}
  changed();
}
function onBuild(pid,words){
  const b=S.battle,p=P(pid);if(!b||b.step!=='question'||!b.q||b.q.type!=='B'||!p||b.ok[pid])return;
  const ans=(Array.isArray(words)?words:[]).slice(0,40).map(String).join(' ');
  if(norm(ans)===norm(b.q.model)){const t=b.tries[pid]?1:2;log(`${p.name} built the sentence${t===2?' on the first try':''}! 🧩`);sendTo(pid,{t:'fx',k:'right'});markCorrect(pid,t,true);}
  else{b.tries[pid]=(b.tries[pid]||0)+1;sendTo(pid,{t:'fx',k:'wrong'});changed();}
}
function onChoose(pid,i){const b=S.battle;if(!b||b.step!=='question'||!b.q||b.q.type!=='C'||!P(pid))return;if(b.choice[pid]!==undefined)return;b.choice[pid]=+i?1:0;beep(700,.05);changed();}
function onBuzz(pid){const b=S.battle;if(!b||b.step!=='question'||!b.q||b.q.type!=='Z'||!P(pid))return;if(b.buzz.includes(pid))return;b.buzz.push(pid);const r=b.buzz.length;if(r<=3){beep(1250-r*180,.14,'square',.1);floatText(pid,['🥇','🥈','🥉'][r-1]);burst(pid,['🔔'],4,{speed:14});}changed();}
function onAct(pid,kind,target){
  const b=S.battle,p=P(pid);if(!b||!['question','defense'].includes(b.step)||!p)return;
  if(!b.ok[pid])return sendErr(pid,'Answer the question first!');if(b.acts[pid])return sendErr(pid,'You already chose. Watch the screen!');
  if(kind==='attack'){if(bossOn())target='boss';else{target=+target;if(!(target>=0&&target<S.teamCount)||target===p.team)return;}}
  else if(!['build','repair'].includes(kind))return;
  b.acts[pid]={kind,target:kind==='attack'?target:null};beep(900,.06);changed();
}
function startDefense(){
  const b=S.battle;if(!b||b.step!=='question'||H.busy)return;
  let teams;if(bossOn())teams=[...Array(S.teamCount).keys()].filter(ti=>Object.values(S.players).some(p=>p.team===ti));
  else teams=[...new Set(Object.values(b.acts).filter(a=>a.kind==='attack').map(a=>a.target))];
  if(!teams.length)return toast('No team is under attack yet. Wait for students to choose Attack.');
  b.def={teams,q:DEF_Q[rnd(DEF_Q.length)],blocks:{}};b.step='defense';
  log(`🛡️ Defense Challenge! ${teams.map(teamName).join(' & ')}: answer to block attacks!`);changed();
  banner('DEFENSE!',teams.map(teamName).join(' & ')+' — answer to block!','#1971c2');beep(440,.15);setTimeout(()=>beep(660,.2),150);
}
function toggleBlock(pid){const b=S.battle,p=P(pid);if(!b||b.step!=='defense'||!p||!b.def.teams.includes(p.team))return;
  if(b.def.blocks[pid])delete b.def.blocks[pid];else{b.def.blocks[pid]=true;floatText(pid,'🛡️ Block!','#1971c2');burst(pid,['🛡️'],6,{ring:true,g:0,speed:14,drag:.95});beep(700,.08);log(`${p.name} will block an attack! 🛡️`);}changed();}
function critical(){banner('CRITICAL HIT!','🌟 Amazing answer!','#e8590c');confetti(stageMid(),['#ffd43b','#ff922b','#fff'],40,{speed:50});}
async function resolveRound(){
  const b=S.battle;if(!b||!['question','defense'].includes(b.step)||H.busy)return;
  H.busy=true;const blocks={};if(b.def)Object.keys(b.def.blocks).forEach(pid=>{const p=P(pid);if(p)blocks[p.team]=(blocks[p.team]||0)+1;});
  b.step='resolving';changed();
  const acts=Object.entries(b.acts).filter(([pid])=>P(pid));
  if(!acts.length)log('No actions this round.');
  const support=acts.filter(([,a])=>a.kind!=='attack'),attacks=acts.filter(([,a])=>a.kind==='attack').sort(()=>Math.random()-.5);
  if(acts.length)banner('ACTION!','',teamColor(0));
  await sleep(acts.length?900:100);
  for(const[pid,a]of support){
    const p=P(pid),c=classOf(p),m=(b.ok[pid]||1)>=2?2:1;
    if(p.down||a.kind==='repair'){
      const use=p.inv.heal>0;if(use)p.inv.heal--;const amt=(use?4:1)*m;
      if(p.down){p.down=false;p.hp=Math.max(Math.ceil(maxHp(p)/2),Math.min(maxHp(p),amt));log(`${p.name} rebuilt the ${habOf(p)[0]}! 🔨`);}
      else{p.hp=Math.min(maxHp(p),p.hp+amt);log(`${p.name} repaired: +${amt} ❤️${use?' '+c.heal[1]:''}${m>1?' (×2)':''}`);}
      p.pts+=1;changed();burst(pid,use?[c.heal[1],'💚']:['💚'],use?10:5,{speed:18});floatText(pid,`+${amt} ❤️`,'#2f9e44');beep(660,.08);
    }else{
      const use=p.inv.def>0;if(use)p.inv.def--;const amt=(use?3:1)*m;p.armor=Math.min(ARMOR_CAP,p.armor+amt);p.pts+=1;
      log(`${p.name} built a wall: +${amt} 🛡️${use?' '+c.def[1]:''}${m>1?' (×2)':''}`);changed();popHab(pid);burst(pid,use?[c.def[1],'🧱']:['🧱'],use?10:5,{speed:16});floatText(pid,`+${amt} 🛡️`,'#495057');beep(520,.08);
    }
    await sleep(380);
  }
  for(const[pid,a]of attacks){
    const p=P(pid);if(!p)continue;const c=classOf(p),tier=b.ok[pid]||1;
    const use=p.inv.atk>0;if(use)p.inv.atk--;let dmg=(use?3:1)*(tier>=2?2:1),note=tier===3?' 🌟 Critical!':tier===2?' ⭐ ×2':'';
    if((p.streak||0)>=2){dmg+=1;note+=' 🔥 Streak!';}
    if(p.dash){dmg*=2;p.dash=false;note+=' Dino Dash!';}
    const pierce=p.warp||tier===3;if(p.warp)note+=' Warp Strike!';p.warp=false;
    if(a.target==='boss'){
      if(!bossOn())continue;const bo=b.boss;beep(300,.1,'square',.06);
      if(ui3d())await H.hb3d.attack(pid,'boss',dmg);else await projectileP(habPt(pid),bossPt(),use?c.atk[1]:'💥');
      bo.hp=Math.max(0,bo.hp-dmg);bo.dmg[p.team]=(bo.dmg[p.team]||0)+dmg;p.pts+=dmg;
      log(`${p.name} hit the ${bo.name}: −${dmg}${note}`);changed();boom();
      anim($('#boss-e'),[{transform:'none'},{transform:'translateX(-8%) rotate(-10deg) scale(.92)'},{transform:'translateX(8%) rotate(8deg)'},{transform:'none'}],{duration:450});
      burst(bossPt(),['💥','✨'],12,{speed:26});floatText(bossPt(),`−${dmg}`,'#d9480f');if(tier===3)critical();
      if(bo.hp<=0){await bossDefeated();}
      await sleep(380);continue;
    }
    const alive=Object.values(S.players).filter(q=>q.team===a.target&&!q.down);
    if(!alive.length){log(`${p.name}'s attack missed. ${teamName(a.target)} is already down!`);continue;}
    const best=Math.max(...alive.map(q=>q.hp+q.armor)),top=alive.filter(q=>q.hp+q.armor===best),v=top[rnd(top.length)];
    beep(300,.1,'square',.06);
    if(ui3d())await H.hb3d.attack(pid,v.pid,dmg);else await projectile(pid,v.pid,use?c.atk[1]:'💥');
    if(blocks[a.target]>0){blocks[a.target]--;if(ui3d())H.hb3d.blocked(v.pid);log(`🛡️ ${teamName(a.target)} blocked ${p.name}'s attack!`);changed();burst(v.pid,['🛡️','✨'],12,{ring:true,g:0,speed:18,drag:.95});floatText(v.pid,'BLOCKED!','#1971c2');beep(900,.1);await sleep(380);continue;}
    let rest=dmg;if(!pierce){const ab=Math.min(v.armor,rest);v.armor-=ab;rest-=ab;}
    v.hp=Math.max(0,v.hp-rest);p.pts+=dmg;
    let ko=false;if(v.hp<=0&&!v.down){v.down=true;v.armor=0;ko=true;p.pts+=3;}
    log(`${p.name} hit ${v.name}'s ${habOf(v)[0]}: −${dmg}${note}${ko?' 💤 KO! +3 🏆':''}`);
    changed();boom();shakeHab(v.pid);burst(v.pid,['💥','✨'],10,{speed:24});floatText(v.pid,`−${dmg}`,'#d9480f');if(tier===3)critical();
    if(ko){await sleep(200);burst(v.pid,['💨','💤','⭐'],14,{speed:20});floatText(pid,'+3 🏆','#c92a2a');}
    await sleep(420);
  }
  if(bossOn())await bossAttack(blocks);
  b.step='done';b.acts={};H.busy=false;changed();
  if(acts.length&&!b.boss){const ts=teamStats(S).sort((x,y)=>y.pts-x.pts);if(ts[0])log(`After round ${b.round}: ${ts[0].name} leads with ${ts[0].pts} 🏆`);changed();}
}
function bossPt(){return elCenter($('#boss-e'));}

  const b=S.battle;if(!b||bossOn())return;const n=Math.max(1,Object.keys(S.players).length);const[name,e]=BOSSES[S.scene]||BOSSES.jungle;const max=Math.max(20,n*8);
  b.boss={name,e,hp:max,max,dmg:{},defeated:false};log(`👹 The ${name} appears! Work together to defeat it!`);changed();
  banner('BOSS BATTLE!',`The ${name} appears! Work together!`,'#5f3dc4');boom();setTimeout(boom,350);
  setTimeout(()=>{anim($('#boss-e'),[{transform:'scale(0)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:700,easing:'cubic-bezier(.2,1.4,.4,1)'});burst(bossPt(),['💥','⚡'],18,{ring:true,g:0,speed:30,drag:.95});},60);
}
async function bossAttack(blocks){
  const b=S.battle,bo=b.boss;const alive=Object.values(S.players).filter(p=>!p.down);if(!alive.length)return;await sleep(500);

function startHost(){
  if(typeof Peer==='undefined'){H.status='off';H.statusText='Offline mode (no internet)';renderHeader();if(CR.inRunner&&!H.crReady){H.crReady=true;CR.ready(null);}return;}
  try{H.peer&&H.peer.destroy();}catch(e){}
  H.status='wait';H.statusText='Connecting…';renderHeader();
  const peer=new Peer(peerIdFor(S.code),peerOpts());H.peer=peer;
  peer.on('open',()=>{H.status='on';H.statusText='Ready for players';H.retries=0;renderHeader();if(CR.inRunner&&!H.crReady){H.crReady=true;CR.ready(S.code);}});
  peer.on('connection',conn=>{H.conns.set(conn,{pid:null,cid:null});conn.on('data',m=>{try{onStudent(conn,m);}catch(e){console.error(e);}});conn.on('close',()=>dropConn(conn));conn.on('error',()=>dropConn(conn));});
  peer.on('disconnected',()=>{if(!peer.destroyed){H.status='wait';H.statusText='Reconnecting…';renderHeader();setTimeout(()=>{try{peer.reconnect();}catch(e){}},1500);}});
  peer.on('error',e=>{if(['unavailable-id','network','server-error','socket-error','socket-closed'].includes(e.type)){H.status='wait';H.statusText=e.type==='unavailable-id'?'Re-opening the room…':'Network problem, retrying…';renderHeader();H.retries=(H.retries||0)+1;clearTimeout(H.rt);H.rt=setTimeout(startHost,Math.min(10000,2000+H.retries*1000));}});
}
function dropConn(conn){const info=H.conns.get(conn);H.conns.delete(conn);if(info&&info.pid&&S.players[info.pid]){if(![...H.conns.values()].some(x=>x.pid===info.pid)&&!S.players[info.pid].manual){S.players[info.pid].online=false;changed();}}}
function onStudent(conn,m){
  const info=H.conns.get(conn);if(!info||!m||typeof m!=='object')return;
  if(m.t==='hello'){info.cid=String(m.cid||'').slice(0,40);const pid=S.cidMap[info.cid];info.pid=pid&&S.players[pid]?pid:null;if(info.pid)S.players[info.pid].online=true;conn.send({t:'state',s:pub(),me:info.pid,my:myView(info.pid)});render();return;}
  if(!info.cid)return;
  if(m.t==='join'){
    const name=String(m.name||'').replace(/\s+/g,' ').trim().slice(0,14),team=+m.team;
    if(!name||!CHARS.some(c=>c.id===m.char)||!(team>=0&&team<S.teamCount))return conn.send({t:'toast',msg:'Please type your name, pick a team and a character.'});
    let pid=S.cidMap[info.cid];
    if(!pid||!S.players[pid]){pid=newPlayer(name,m.char,team);S.cidMap[info.cid]=pid;log(`${name} joined ${teamName(team)}! ${charById(m.char).e}`);chime();setTimeout(()=>{popHab(pid);burst(pid,['✨','🎉'],12,{ring:true,g:0,speed:16,drag:.95});},120);}
    else Object.assign(S.players[pid],{name,char:m.char,team,online:true});
    S.players[pid].av=cleanAv(m.av,name);
    info.pid=pid;changed();return;
  }
  if(m.t==='claim'&&m.crId){const p=Object.values(S.players).find(x=>x.crId===m.crId);if(!p)return conn.send({t:'toast',msg:'Your name is not in this class. Ask your teacher.'});p.pre=false;p.online=true;p.av=cleanAv(m.av,p.name);S.cidMap[info.cid]=p.pid;info.pid=p.pid;if(!S.crSeen)S.crSeen={};if(!S.crSeen[p.pid]){S.crSeen[p.pid]=1;log(`${p.name} is here! ${charById(p.char).e}`);chime();}changed();return;}
  if(m.t==='claim'){const p=S.players[m.pid];if(!p||!p.pre)return conn.send({t:'toast',msg:'That name is already taken. Ask your teacher.'});
    const old=S.cidMap[info.cid];if(old&&old!==m.pid&&S.players[old]&&S.players[old].pre===false&&![...H.conns.values()].some(x=>x!==info&&x.pid===old))S.players[old].online=false;
    p.pre=false;p.online=true;p.av=cleanAv(m.av,p.name);S.cidMap[info.cid]=m.pid;info.pid=m.pid;log(`${p.name} joined ${teamName(p.team)}! ${charById(p.char).e}`);chime();setTimeout(()=>{popHab(m.pid);burst(m.pid,['✨','🎉'],12,{ring:true,g:0,speed:16,drag:.95});},120);changed();return;}
  const pid=info.pid;if(!pid||!S.players[pid])return;
  if(m.t==='buy')buy(pid,m.item);
  if(m.t==='lt')ltMsg(pid,m);
  if(m.t==='look'){S.players[pid].av=cleanAv(m.av,S.players[pid].name);changed();return;}
  if(m.t==='answer')onAnswer(pid,m.text);
  if(m.t==='build')onBuild(pid,m.words);
  if(m.t==='choose')onChoose(pid,m.i);
  if(m.t==='buzz')onBuzz(pid);
  if(m.t==='vote')onVote(pid,m.i);
  if(m.t==='act')onAct(pid,m.kind,m.target);
  if(m.t==='power')usePower(pid);
}

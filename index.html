<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habitat Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: projector = battle stage (team territories) + teacher console; tablet = one-column habitat card */
:root{
  color-scheme: light;
  --ink:#1e2433; --muted:#667085; --paper:#fffdf8; --line:#e6dfcf; --white:#ffffff;
  --scene-bg:#cfeebd; --scene-deep:#2b7a3d; --scene-soft:#eef8e4;
  --ok:#2f9e44; --bad:#d9480f; --gold:#f2a900; --hp:#40c057; --hp-low:#fa5252; --armor:#868e96;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  --sky1:#7fd0f2; --sky2:#dff6c8; --mound:#7cc576; --mound2:#4f9e4c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--scene-bg);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--scene-deep);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
.hab .he,.hab .av,.hab .spark,.hab .zz,.home .he,.home .av,.char-pick .e,.shop .it .e,.st-head .big,.s-amb span,.pfx,.overlay .who .av,.prow .av,.conn .e{font-family:var(--emoji)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--white);font-size:.85rem}
.btn{background:var(--white);padding:8px 14px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--scene-deep);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff0e6;color:var(--bad)}
.btn.gold{background:var(--gold);color:#3a2a00}
.btn.war{background:#c92a2a;color:#fff}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hp);border-radius:99px;transition:width .5s ease}
.bar i.low{background:var(--hp-low)}

/* ---------- HOST ---------- */
.host{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--scene-deep);color:#fff}
.brand{font-family:var(--display);font-size:1.55rem;font-weight:800;letter-spacing:.3px}
.topbar .sp{flex:1}
.topbar .chip{background:rgba(255,255,255,.18);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:#aaa;display:inline-block}
.dot.on{background:#69db7c}.dot.wait{background:#ffd43b}.dot.off{background:#ff8787}
.topbar .btn{background:rgba(255,255,255,.95);color:var(--ink);font-size:.92rem;padding:7px 12px}
.topbar .btn.war{background:#ffe3e3;color:#c92a2a}
.main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.stage-wrap{padding:12px;min-width:0;min-height:0;display:flex}
.stage{position:relative;flex:1;min-width:0;container-type:size;border-radius:22px;background:linear-gradient(var(--sky1),var(--sky2));border:6px solid var(--scene-deep);box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column;gap:1.6cqmin;padding:2.2cqmin 2.4cqmin}
.stage>*:not(canvas){position:relative;z-index:1}
.stage>.overlay{position:absolute;z-index:10}
.stage>.banner{position:absolute;z-index:25}
.amb-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.fx-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30!important}
.st-head{display:flex;align-items:center;gap:1.6cqmin}
.plate{display:flex;align-items:center;gap:1.4cqmin;background:rgba(255,255,255,.88);border-radius:2.2cqmin;padding:.6cqmin 2.2cqmin .6cqmin 1.2cqmin;box-shadow:0 .5cqmin 0 rgba(0,0,0,.12);backdrop-filter:blur(6px)}
.st-head .big{font-size:7cqmin;line-height:1;animation:bob2 3.4s ease-in-out infinite}
.st-head h1{font-size:4.8cqmin;color:var(--scene-deep)}
.st-head p{margin:0;font-size:1.8cqmin;color:var(--muted)}
.st-head .sp{flex:1}
.phase{font-family:var(--display);font-size:3cqmin;background:#fff;border-radius:2cqmin;padding:.8cqmin 2cqmin;display:flex;gap:1.4cqmin;align-items:center;box-shadow:0 .4cqmin 0 rgba(0,0,0,.08)}
.phase.battle{background:#c92a2a;color:#fff}
.phase .tm{font-variant-numeric:tabular-nums;background:rgba(0,0,0,.2);border-radius:1.2cqmin;padding:0 1.2cqmin}
.phase .tm.warn{background:#ffd43b;color:#5c3d00;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.toprow{display:flex;gap:1.6cqmin;min-height:0}
.qr-box{background:#fff;border-radius:1.6cqmin;padding:1.4cqmin;display:flex;flex-direction:column;align-items:center;gap:.6cqmin;flex:0 0 auto}
.qr-box .qr{width:19cqmin;height:19cqmin}
.qr-box .qr img,.qr-box .qr canvas{width:100%!important;height:100%!important}
.qr-box .code{font-family:var(--display);font-size:3.6cqmin;letter-spacing:.5cqmin;line-height:1}
.qr-box small{font-size:1.3cqmin;color:var(--muted);max-width:22cqmin;text-align:center;word-break:break-all}
.infocard{flex:1;min-width:0;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);border-radius:1.6cqmin;padding:1.4cqmin 2cqmin;display:grid;gap:.8cqmin;align-content:start;font-size:2cqmin}
.infocard h3{font-size:2.8cqmin;color:var(--scene-deep)}
.infocard .rules{display:flex;flex-wrap:wrap;gap:.8cqmin}
.infocard .rules span{background:var(--scene-soft);border-radius:1cqmin;padding:.5cqmin 1.2cqmin}
.logline{display:grid;gap:.3cqmin;color:#374151;font-size:1.8cqmin}
.logline div:last-child{color:var(--ink);font-weight:900}
.qbar{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:1.8cqmin;padding:1.4cqmin 2cqmin;display:grid;gap:.8cqmin;box-shadow:0 .5cqmin 0 rgba(0,0,0,.08)}
.qbar .qt{display:flex;gap:1cqmin;align-items:center;flex-wrap:wrap;font-size:1.9cqmin}
.qbar .qt .kind{background:var(--scene-deep);color:#fff;border-radius:99px;padding:.3cqmin 1.4cqmin;font-weight:900;letter-spacing:.2cqmin}
.qbar .qt .kind.type{background:#3b5bdb}
.qbar .qt .cnt{margin-left:auto;color:var(--muted)}
.qbar .qp{font-family:var(--display);font-size:3.8cqmin;line-height:1.1}
.qbar .model{font-size:2.1cqmin;color:var(--ok)}
.qbar.idle .qp{color:var(--muted);font-size:3cqmin}
.terr-grid{flex:1;min-height:0;display:grid;gap:1.6cqmin;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;align-content:end;padding-bottom:2cqmin}
.terr{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.12));border:.4cqmin solid rgba(255,255,255,.75);border-radius:2cqmin;padding:0 1.4cqmin 1.2cqmin;display:flex;flex-direction:column;gap:1cqmin;min-height:0;overflow:hidden;box-shadow:0 1cqmin 2.4cqmin rgba(0,0,0,.14)}
.terr-h{display:flex;align-items:center;gap:1.2cqmin;font-size:2.4cqmin;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 85%,#fff),var(--tc));color:#fff;margin:0 -1.4cqmin;padding:.8cqmin 1.6cqmin;box-shadow:0 .4cqmin 0 rgba(0,0,0,.12)}
.terr-h .tn{font-family:var(--display);font-size:3cqmin;color:#fff;text-shadow:0 .3cqmin 0 rgba(0,0,0,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.terr-h .bar{flex:1;height:1.6cqmin;min-width:6cqmin;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 .25cqmin rgba(255,255,255,.6)}
.terr-h .pts{font-family:var(--display);font-size:3cqmin;white-space:nowrap}
.terr-h .hpt{font-size:1.8cqmin;color:rgba(255,255,255,.95);white-space:nowrap;font-variant-numeric:tabular-nums}
.habs{display:flex;flex-wrap:wrap;gap:1cqmin;align-content:flex-start;min-height:0}
.hab{width:var(--hw,12cqmin);position:relative;border-radius:1.4cqmin;padding:calc(var(--hw,12cqmin)*.1) .5cqmin .8cqmin;display:grid;justify-items:center;gap:.2cqmin;transition:filter .3s,opacity .3s}
.hab::before{content:'';position:absolute;left:4%;right:4%;top:calc(var(--hw,12cqmin)*.5);height:calc(var(--hw,12cqmin)*.24);border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--mound) 0 55%,var(--mound2) 70%,transparent 72%);z-index:0}
.hab::after{content:'';position:absolute;left:18%;right:18%;top:calc(var(--hw,12cqmin)*.62);height:calc(var(--hw,12cqmin)*.08);border-radius:50%;background:rgba(0,0,0,.18);filter:blur(2px);z-index:0}
.hab>*{position:relative;z-index:1}
.hab .flag{position:absolute;top:calc(var(--hw,12cqmin)*.02);right:14%;width:calc(var(--hw,12cqmin)*.025);height:calc(var(--hw,12cqmin)*.34);background:#6b4f3a;border-radius:2px;z-index:2}
.hab .flag::after{content:'';position:absolute;left:100%;top:0;border-left:calc(var(--hw,12cqmin)*.17) solid var(--tc);border-top:calc(var(--hw,12cqmin)*.065) solid transparent;border-bottom:calc(var(--hw,12cqmin)*.065) solid transparent;transform-origin:left center;animation:wave 1.3s ease-in-out infinite}
@keyframes wave{50%{transform:scaleX(.72) skewY(10deg)}}
.hab .lvl{font-size:calc(var(--hw,12cqmin)*.1);color:#f59f00;letter-spacing:.1em;line-height:1;text-shadow:0 1px 0 #fff}
.hab .spark{position:absolute;top:calc(var(--hw,12cqmin)*.06);left:22%;font-size:calc(var(--hw,12cqmin)*.13);animation:twinkle 1.8s ease-in-out infinite;z-index:2}
@keyframes twinkle{50%{transform:scale(1.4) rotate(20deg);opacity:.5}}
.hab .he{font-size:calc(var(--hw,12cqmin)*.46);line-height:1.05;animation:bob2 3.2s ease-in-out infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 .4cqmin .3cqmin rgba(0,0,0,.25))}
.hab .av{position:absolute;top:calc(var(--hw,12cqmin)*.34);left:2%;font-size:calc(var(--hw,12cqmin)*.24);line-height:1;filter:drop-shadow(0 .3cqmin .2cqmin rgba(0,0,0,.3));animation:hopidle 2.2s ease-in-out infinite;animation-delay:var(--d,0s);z-index:3}
@keyframes hopidle{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-22%) rotate(-6deg)}80%{transform:translateY(0)}}
.hab .hn{font-size:calc(var(--hw,12cqmin)*.12);font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--tc);color:#fff;border-radius:99px;padding:0 .8cqmin;margin-top:calc(var(--hw,12cqmin)*.04);box-shadow:0 .25cqmin 0 rgba(0,0,0,.15)}
.hab .bar{width:88%;height:calc(var(--hw,12cqmin)*.075);background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 .2cqmin rgba(255,255,255,.7)}
.bar i{background:linear-gradient(180deg,#69db7c,#2f9e44)}
.bar i.low{background:linear-gradient(180deg,#ff8787,#e03131)}
.wi{height:1.05em;width:auto;vertical-align:-.15em;display:inline-block}
.hab .wall{position:absolute;left:5%;right:5%;top:calc(var(--hw,12cqmin)*.5);--rh:calc(var(--hw,12cqmin)*.075);height:calc(var(--rh)*var(--r,1));background:var(--wall-img) repeat;background-size:calc(var(--rh)*8) calc(var(--rh)*2);border-radius:.5cqmin;box-shadow:0 .25cqmin .3cqmin rgba(0,0,0,.35);z-index:2;pointer-events:none;transition:height .3s}
.dio .wall{position:absolute;left:8%;right:8%;bottom:19%;--rh:min(3.6cqi,18px);height:calc(var(--rh)*var(--r,1));background:var(--wall-img) repeat;background-size:calc(var(--rh)*8) calc(var(--rh)*2);border-radius:6px;box-shadow:0 4px 5px rgba(0,0,0,.35);z-index:2;pointer-events:none;transition:height .3s}
.hab .ar{position:absolute;top:calc(var(--hw,12cqmin)*.02);left:2%;box-shadow:0 .2cqmin 0 rgba(0,0,0,.12);z-index:2;font-size:calc(var(--hw,12cqmin)*.12);background:#fff;border-radius:99px;padding:0 .6cqmin}
.hab .st{position:absolute;bottom:calc(var(--hw,12cqmin)*.3);right:.3cqmin;font-size:calc(var(--hw,12cqmin)*.16)}
.hab.down{opacity:.75}
.hab.down .he{filter:grayscale(1) brightness(.8)}
.hab .zz{position:absolute;top:8%;left:50%;font-size:calc(var(--hw,12cqmin)*.24);animation:zz 2s ease-in-out infinite;z-index:3}
@keyframes zz{0%{transform:translate(-50%,10%) scale(.8);opacity:.4}50%{transform:translate(-30%,-20%) scale(1.1);opacity:1}100%{transform:translate(-50%,10%) scale(.8);opacity:.4}}
.hab.ready{box-shadow:0 0 0 .5cqmin var(--gold);animation:readyglow 1.2s ease-in-out infinite}
@keyframes readyglow{50%{box-shadow:0 0 0 1cqmin color-mix(in srgb,var(--gold) 45%,transparent)}}
.terr .empty-t{color:var(--muted);font-size:1.8cqmin}
.foot{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:1.4cqmin;padding:1cqmin 1.6cqmin;font-size:1.9cqmin;display:grid;gap:.4cqmin}
.foot b{color:var(--scene-deep)}
.foot .sent{display:flex;gap:1cqmin;align-items:baseline}
.foot .sent .who{color:var(--muted);white-space:nowrap}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--scene-soft) 88%,transparent);backdrop-filter:blur(8px);padding:4cqmin;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqmin;text-align:center;z-index:10!important}
.overlay:not([hidden]){animation:popin .38s cubic-bezier(.2,1.4,.4,1)}
.overlay .kind{font-family:var(--display);font-size:2.6cqmin;text-transform:uppercase;letter-spacing:.4cqmin;color:var(--scene-deep)}
.overlay .q{font-family:var(--display);font-size:5.4cqmin;line-height:1.1;max-width:80cqmin}
.overlay .ans{font-size:3cqmin;color:var(--ok);min-height:3.6cqmin}
.overlay .acts{display:flex;flex-wrap:wrap;gap:1.4cqmin;justify-content:center}
.overlay .acts .btn{font-size:2.4cqmin;padding:1.2cqmin 2.4cqmin;border-radius:1.4cqmin}
.overlay .hint{font-size:2cqmin;color:var(--muted)}
.podium{display:grid;gap:1.2cqmin;width:min(80cqmin,100%)}
.podium .pr{display:flex;align-items:center;gap:1.6cqmin;background:#fff;border-radius:1.6cqmin;padding:1.2cqmin 2cqmin;border-left:1.4cqmin solid var(--tc);font-size:3cqmin}
.podium .pr .m{font-size:4.6cqmin}
.podium .pr b{margin-left:auto;font-family:var(--display);font-size:4cqmin}
.podium .pr.first{transform:scale(1.04);box-shadow:0 1cqmin 2cqmin rgba(0,0,0,.12)}
.mvp{font-size:3cqmin;background:#fff3bf;border-radius:1.6cqmin;padding:1cqmin 2.4cqmin}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:25!important;pointer-events:none;animation:banner 1.9s cubic-bezier(.2,1,.3,1) forwards}
.banner .t{display:inline-block;font-family:var(--display);font-size:10cqmin;line-height:1;color:#fff;background:var(--bc,#c92a2a);padding:1.4cqmin 5cqmin;border-radius:3cqmin;box-shadow:0 1.4cqmin 0 rgba(0,0,0,.18);transform:rotate(-2deg)}
.banner .s{font-family:var(--display);font-size:3.4cqmin;margin-top:1.6cqmin;color:var(--ink)}
@keyframes banner{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.12)}25%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes popin{from{opacity:0;transform:scale(.86)}}
@keyframes bob2{50%{transform:translateY(-6%) rotate(-3deg)}}

.console{background:var(--paper);overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px 16px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.console h2{font-size:1.25rem;display:flex;align-items:center;gap:8px}
.console h2 .sp{flex:1}
.console h2 .btn{font-family:var(--body);font-size:.8rem;padding:5px 10px}
.panel{background:#fff;border-radius:14px;padding:12px;display:grid;gap:10px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel .big{font-size:1.05rem;padding:11px 14px;flex:1}
.panel input{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:8px 10px;flex:1;min-width:0}
.panel small{color:var(--muted)}
.subs{display:grid;gap:8px}
.sub{border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:6px}
.sub.ok{border-color:var(--ok);background:#ebfbee}
.sub.no{border-color:#ffc9c9;background:#fff5f5}
.sub .who{font-weight:900;display:flex;gap:6px;align-items:center}
.sub .txt{font-size:1.02rem;font-weight:700;color:#212529;word-break:break-word}
.sub .chk{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem}
.sub .chk span{border-radius:99px;padding:2px 8px;background:#ebfbee;color:#2b8a3e}
.sub .chk span.x{background:#fff0f0;color:#c92a2a}
.sub .row{display:flex;gap:6px}
.sub .row .btn{padding:6px 12px;font-size:.88rem}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{background:#fff;border-radius:12px;padding:8px 10px;border-top:6px solid var(--tc);display:grid;gap:6px}
.tcard .tn{font-weight:900}
.tcard .ts{font-size:.88rem;color:var(--muted)}
.tcard .ts b{color:var(--ink);font-size:1.1rem}
.tcard .ta{display:flex;gap:6px}
.tcard .ta .btn{font-size:.8rem;padding:5px 8px;flex:1}
.plist{display:grid;gap:8px}
.prow{background:#fff;border-radius:12px;padding:8px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;border-left:6px solid var(--tc)}
.prow.off{opacity:.55}
.prow.flash{animation:flash .9s ease}
@keyframes flash{30%{background:#fff3bf}}
.prow .av{font-size:1.9rem;grid-row:span 2}
.prow .nm{font-weight:900;display:flex;gap:6px;align-items:baseline;min-width:0}
.prow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm small{color:var(--muted);font-weight:700;white-space:nowrap}
.prow .nm .stt{margin-left:auto;font-size:.8rem;white-space:nowrap}
.prow .stats{font-size:.86rem;color:var(--muted);display:flex;gap:9px;flex-wrap:wrap}
.prow .stats b{color:var(--ink)}
.prow .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.prow .acts .btn{padding:6px 9px;font-size:.85rem;background:#f4f1ea}
.prow .acts .btn.coin{background:#fff3bf}
.prow .acts .btn.star{background:#ffe8cc}
.prow .acts .btn.okb{background:#d3f9d8}
.prow .acts .btn.okb.on{background:var(--ok);color:#fff}
.prow .acts .x{margin-left:auto;background:transparent;color:var(--muted)}
.empty{background:#fff;border-radius:12px;padding:14px;color:var(--muted);font-size:.95rem;line-height:1.45}
.legend{font-size:.85rem;color:var(--muted);line-height:1.5;background:#fff;border-radius:12px;padding:10px 12px}
.legend b{color:var(--ink)}

.modal-bg{position:fixed;inset:0;background:rgba(20,24,35,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--paper);border-radius:18px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px;display:grid;gap:14px}
.modal h2{font-size:1.6rem}
.modal label{font-size:.9rem;color:var(--muted);display:grid;gap:4px}
.modal input,.modal textarea,.modal select{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);width:100%}
.modal textarea{min-height:160px;font-size:.9rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:500}
.scene-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.scene-pick button{background:#fff;padding:12px;text-align:left;border:3px solid transparent;display:grid;gap:2px}
.scene-pick button.sel{border-color:var(--scene-deep)}
.scene-pick .e{font-size:2rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:#fff;padding:8px 14px;border:2px solid var(--line)}
.seg button.sel{background:var(--scene-deep);color:#fff;border-color:var(--scene-deep)}
.tname-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.danger{display:flex;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px}
.bigqr{display:grid;place-items:center;gap:10px;text-align:center}
.bigqr .qr{width:min(70vh,80vw);height:min(70vh,80vw);background:#fff;padding:14px;border-radius:14px}
.bigqr .qr img,.bigqr .qr canvas{width:100%!important;height:100%!important}
.bigqr .code{font-family:var(--display);font-size:3rem;letter-spacing:8px}
.warn{background:#fff3bf;border-radius:10px;padding:8px 10px;font-size:.85rem;color:#5c4400}

.sv{display:none}
body.sv-on .main{grid-template-columns:minmax(0,1fr) 360px 400px}
body.sv-on .sv{display:flex;flex-direction:column;gap:8px;min-height:0;background:#1e2433;padding:10px 12px 12px}
.sv-bar{display:flex;gap:8px;align-items:center;color:#fff;font-size:.95rem}
.sv-bar b{white-space:nowrap}
.sv-bar select{flex:1;min-width:0;font:inherit;font-weight:800;border-radius:10px;border:0;padding:7px 8px}
.sv-bar .btn{padding:6px 10px;color:var(--ink)}
.sv-screen{flex:1;min-height:0;overflow:auto;border-radius:26px;border:7px solid #000;background:linear-gradient(var(--sky1),var(--sky2) 70%,var(--mound));position:relative}
.sv-screen .student{min-height:auto;padding:12px 12px 24px}
.sv-screen .s-col{gap:10px}
.sv-note{color:#adb5bd;font-size:.78rem;text-align:center}
@media (max-width:1000px){
  .host{height:auto}
  .main,body.sv-on .main{grid-template-columns:1fr}
  .sv-screen{height:80vh}
  .stage-wrap{height:min(80vw,92vh)}
  .console{border-left:0}
}

/* ---------- STUDENT ---------- */
.student{min-height:100%;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center;position:relative;z-index:1}
.s-col{width:100%;max-width:620px;display:flex;flex-direction:column;gap:14px}
.s-head{display:flex;align-items:center;gap:10px}
.s-head .brand{font-size:1.45rem;color:var(--scene-deep)}
.s-head .sp{flex:1}
.card{background:rgba(255,253,248,.95);backdrop-filter:blur(6px);border-radius:20px;padding:18px;display:grid;gap:12px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.card h2{font-size:1.5rem}
.card .hint{color:var(--muted);font-size:.95rem;margin:0}
.name-in{font:inherit;font-size:1.4rem;font-weight:900;border:3px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;background:#fff;color:var(--ink)}
.team-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.team-pick button{padding:14px 10px;background:color-mix(in srgb,var(--tc) 14%,#fff);border:3px solid transparent;font-weight:900;font-size:1.05rem}
.team-pick button.sel{border-color:var(--tc);background:var(--tc);color:#fff}
.class-block{display:grid;gap:8px}
.class-block .cl{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.class-block .cl b{font-family:var(--display);font-size:1.15rem}
.class-block .cl span{font-size:.85rem;color:var(--muted)}
.char-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.char-pick button{background:#fff;padding:10px 4px;display:grid;justify-items:center;gap:2px;border:3px solid transparent}
.char-pick button .e{font-size:2.4rem;line-height:1.1}
.char-pick button small{font-size:.78rem}
.char-pick button.sel{border-color:var(--scene-deep);background:var(--scene-soft)}
.join-btn{font-size:1.4rem;padding:16px;font-family:var(--display)}
.me{display:flex;align-items:center;gap:14px}
.me .home{position:relative;width:118px;height:118px;border-radius:26px;display:grid;place-items:center;background:linear-gradient(var(--sky1),var(--sky2) 58%,var(--mound) 58%,var(--mound2));border:5px solid var(--tc);flex:0 0 auto;font-size:3.9rem;overflow:visible}
.me .home .he{filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
.me .home .flag{position:absolute;top:8px;right:14px;width:3px;height:34px;background:#6b4f3a}
.me .home .flag::after{content:'';position:absolute;left:100%;top:0;border-left:18px solid var(--tc);border-top:7px solid transparent;border-bottom:7px solid transparent;transform-origin:left center;animation:wave 1.3s ease-in-out infinite}
@keyframes wave{50%{transform:scaleX(.72) skewY(10deg)}}
.me .home .lv{position:absolute;bottom:-12px;right:-6px;background:#fff;border-radius:99px;padding:0 8px;font-size:.85rem;color:#f59f00;border:3px solid var(--tc)}
.me .home .he{animation:bob2 3s ease-in-out infinite}
.me .home .av{position:absolute;left:-12px;bottom:-12px;width:50px;height:50px;border-radius:50%;background:#fff;border:4px solid var(--tc);display:grid;place-items:center;font-size:1.8rem;animation:hopidle 2.4s ease-in-out infinite}
@keyframes hopidle{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-22%) rotate(-6deg)}80%{transform:translateY(0)}}
.me .home.down{filter:grayscale(1)}
.me h2{font-size:1.9rem}
.me .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.me .chips .chip{background:color-mix(in srgb,var(--tc) 18%,#fff)}
.me .info{flex:1;min-width:0}
.hpline{display:flex;align-items:center;gap:8px;font-size:.95rem}
.hpline .bar{flex:1;height:14px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#fff;border-radius:14px;padding:8px 4px;text-align:center}
.stat .v{font-family:var(--display);font-size:1.9rem;line-height:1}
.stat .l{font-size:.78rem;color:var(--muted)}
.phasebox{border-radius:18px;padding:16px;display:grid;gap:12px;text-align:center;background:#fff}
.phasebox.gather{background:#e6fcf5}
.phasebox.battle{background:#fff5f5;border:3px solid #ffc9c9}
.phasebox h3{font-size:1.45rem}
.phasebox .qp{font-size:1.35rem;font-weight:900;line-height:1.3}
.phasebox .tag{display:inline-block;justify-self:center;background:#3b5bdb;color:#fff;border-radius:99px;padding:3px 12px;font-size:.85rem}
.phasebox .tag.speak{background:var(--scene-deep)}
.phasebox textarea{font:inherit;font-size:1.25rem;font-weight:700;border:3px solid #bac8ff;border-radius:14px;padding:12px;min-height:110px;width:100%;resize:vertical;background:#fff;color:var(--ink)}
.phasebox .mine{background:#fff;border-radius:12px;padding:10px;font-size:1.15rem;text-align:left}
.phasebox .big{font-family:var(--display);font-size:1.5rem;padding:14px}
.acts3{display:grid;gap:10px}
.acts3 .att{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.acts3 .att button{padding:16px 8px;font-family:var(--display);font-size:1.25rem;background:var(--tc);color:#fff}
.acts3 .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts3 .two button{padding:14px 8px;font-size:1.1rem;background:#fff;border:3px solid var(--line)}
.acts3 small{display:block;font-size:.8rem;color:var(--muted);font-weight:700}
.acts3 .att button small{color:rgba(255,255,255,.85)}
.shop{display:grid;gap:8px}
.shop .it{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:10px 12px}
.shop .it .e{font-size:2rem;width:44px;text-align:center}
.shop .it .d{flex:1;min-width:0}
.shop .it .d b{display:block}
.shop .it .d small{color:var(--muted);font-size:.85rem}
.shop .it .btn{white-space:nowrap}
.power{display:grid;gap:8px;background:#fff;border-radius:16px;padding:12px}
.power .pt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.power .pt b{font-family:var(--display);font-size:1.2rem}
.power p{margin:0;color:var(--muted);font-size:.9rem}
.items{display:flex;gap:4px;font-size:1.5rem}
.items .no{filter:grayscale(1);opacity:.25}
.mini-stand{display:grid;gap:6px}
.mini-stand>div{display:flex;gap:8px;align-items:center;background:#fff;border-radius:10px;padding:8px 12px;border-left:6px solid var(--tc)}
.mini-stand>div .bar{flex:1;height:8px}
.mini-stand>div b{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;z-index:80;max-width:90vw;text-align:center}
.conn{text-align:center;padding:40px 16px}
.conn .e{font-size:4rem}
.s-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.s-amb{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.s-head .brand{background:rgba(255,255,255,.9);border-radius:14px;padding:2px 12px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.s-amb span{position:absolute;bottom:-70px;opacity:.36;animation:floatup linear infinite}
@keyframes floatup{to{transform:translateY(-125vh) rotate(30deg)}}
.glow:not(:disabled){animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--scene-deep) 22%,transparent)}}
.bump{animation:bump .65s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{30%{transform:scale(1.16)}}
.pfx{position:fixed;left:0;top:0;pointer-events:none;z-index:70;font-size:30px;line-height:1}
.shake{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
/* tablet: scene-first layout */
.em{font-family:var(--emoji)}
.sv2{container-type:inline-size;position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:12px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));overflow:hidden}
.sv-screen .sv2{min-height:100%}
.sv-screen .s-bg{position:absolute}
.s-top{display:flex;align-items:center;gap:8px;position:relative;z-index:30}
.s-top .who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);border-radius:18px;padding:4px 12px 4px 4px;box-shadow:0 3px 0 rgba(0,0,0,.12);min-width:0}
.s-top .who .av{font-family:var(--emoji);font-size:1.7rem;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--tc);flex:0 0 auto}
.s-top .who b{display:block;font-size:1.05rem;line-height:1.1;max-width:28cqi;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-top .who small{display:block;font-size:.75rem;color:var(--tc);font-weight:900;white-space:nowrap}
.s-top .sp{flex:1}
.coins{background:#fff7d6;border:3px solid #f2c94c;border-radius:99px;padding:3px 12px 3px 8px;font-family:var(--display);font-size:1.35rem;display:flex;gap:4px;align-items:center;box-shadow:0 3px 0 rgba(0,0,0,.12);line-height:1.2}
.coins.small{font-size:1.1rem;padding:2px 10px 2px 6px}
.supply{position:relative;display:flex;flex-direction:column;align-items:center;background:linear-gradient(#ffc14d,#f08c00);color:#fff;border-radius:18px;padding:5px 12px 6px;box-shadow:0 4px 0 #b35c00;font-family:var(--display);font-size:.95rem;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.supply .bag{font-family:var(--emoji);font-size:2rem;line-height:1.15;text-shadow:none}
.supply.has{animation:wiggle 1.8s ease-in-out infinite}
@keyframes wiggle{0%,68%,100%{transform:rotate(0)}74%{transform:rotate(-9deg) scale(1.08)}82%{transform:rotate(9deg) scale(1.08)}90%{transform:rotate(-4deg) scale(1.04)}}
.supply .badge{position:absolute;top:-9px;right:-9px;min-width:26px;height:26px;border-radius:99px;background:#e03131;color:#fff;font-style:normal;font-family:var(--body);font-weight:900;font-size:.9rem;display:grid;place-items:center;border:3px solid #fff;padding:0 5px;animation:pulse 1.2s ease-in-out infinite}
.s-teams{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap;position:relative;z-index:2}
.s-teams span{background:rgba(255,255,255,.88);border-radius:99px;padding:2px 10px;font-size:.8rem;border-left:5px solid var(--tc)}
.s-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;padding:8px 0 14px;z-index:2}
.dio{position:relative;width:min(74cqi,360px);aspect-ratio:1.2;display:grid;place-items:center}
.dio .mound{position:absolute;left:4%;right:4%;bottom:4%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--mound) 0 55%,var(--mound2) 70%,transparent 72%);filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
.dio .hab-e{position:relative;font-family:var(--emoji);font-size:min(34cqi,170px);line-height:1;filter:drop-shadow(0 10px 6px rgba(0,0,0,.28));z-index:2;margin-bottom:14%;animation:bob2 3.2s ease-in-out infinite;display:inline-block}
.dio .char{position:absolute;left:2%;bottom:12%;font-family:var(--emoji);font-size:min(15cqi,74px);z-index:3;animation:hopidle 2.4s ease-in-out infinite;filter:drop-shadow(0 5px 3px rgba(0,0,0,.3))}
.dio .flag{position:absolute;top:2%;right:15%;width:5px;height:30%;background:#6b4f3a;border-radius:3px;z-index:1}
.dio .flag::after{content:'';position:absolute;left:100%;top:0;border-left:38px solid var(--tc);border-top:14px solid transparent;border-bottom:14px solid transparent;transform-origin:left center;animation:wave 1.3s ease-in-out infinite}
.dio .zz{position:absolute;top:4%;left:46%;font-family:var(--emoji);font-size:min(12cqi,56px);z-index:4;animation:zz 2s ease-in-out infinite}
.dio.down .hab-e{filter:grayscale(1) brightness(.8) drop-shadow(0 10px 6px rgba(0,0,0,.28))}
.rays{position:absolute;inset:-25%;border-radius:50%;background:repeating-conic-gradient(rgba(255,244,170,.75) 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);opacity:0;z-index:0;pointer-events:none}
.flash{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,#fff 0 40%,rgba(255,255,255,0) 70%);z-index:5;pointer-events:none}
.hitflash{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,60,60,.7) 0 35%,rgba(255,60,60,0) 70%);z-index:5;pointer-events:none}
.lvup{position:absolute;left:50%;top:-6%;z-index:6;display:grid;justify-items:center;pointer-events:none}
.lvup b{font-family:var(--display);font-size:2.4rem;line-height:1;color:#fff;background:linear-gradient(#ffd43b,#f08c00);padding:6px 22px;border-radius:16px;box-shadow:0 5px 0 #b35c00;white-space:nowrap;transform:rotate(-3deg)}
.lvup span{font-family:var(--display);font-size:1.3rem;background:#fff;border-radius:99px;padding:0 14px;margin-top:6px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.sfloat{position:absolute;left:50%;top:30%;z-index:7;font-family:var(--display);font-size:2rem;white-space:nowrap;-webkit-text-stroke:5px #fff;paint-order:stroke fill;pointer-events:none}
.hname{font-family:var(--display);font-size:1.35rem;background:var(--tc);color:#fff;border-radius:99px;padding:2px 18px;box-shadow:0 3px 0 rgba(0,0,0,.15);line-height:1.4}
.hname .st{color:#ffe066;letter-spacing:.08em}
.hp{display:flex;align-items:center;gap:8px;width:min(80cqi,390px);background:rgba(255,255,255,.92);border-radius:99px;padding:5px 14px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.hp .bar{flex:1;height:14px}
.inv{display:flex;gap:8px}
.inv span{background:rgba(255,255,255,.94);border-radius:14px;padding:3px 12px 3px 8px;font-family:var(--display);font-size:1.25rem;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.inv span i{font-style:normal;font-family:var(--emoji);font-size:1.5rem}
.pow{background:linear-gradient(#ffe066,#f2a900);color:#3a2a00;border-radius:99px;padding:9px 20px;font-family:var(--display);font-size:1.1rem;box-shadow:0 4px 0 #b37b00}
.pow:not(:disabled){animation:glow 1.6s ease-in-out infinite}
.s-pop{position:absolute;left:12px;right:12px;top:118px;z-index:20;background:#fff;border-radius:24px;padding:16px 18px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.28);border:5px solid var(--scene-deep);display:grid;gap:8px}
.s-pop.in{animation:dropin .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes dropin{0%{transform:translateY(-80px) scale(.5) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.s-pop .qtag{justify-self:center;background:#3b5bdb;color:#fff;border-radius:99px;padding:3px 14px;font-size:.85rem}
.s-pop .qtag.speak{background:var(--scene-deep)}
.s-pop .qp{font-family:var(--display);font-size:1.6rem;line-height:1.15}
.s-dock{position:sticky;bottom:0;z-index:25;background:rgba(255,255,255,.96);border-radius:24px 24px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 22px rgba(0,0,0,.16);display:grid;gap:10px;text-align:center;margin:0 -12px}
.dock-msg{display:grid;gap:4px;justify-items:center}
.dock-msg b{font-family:var(--display);font-size:1.35rem;font-weight:800}
.dock-msg span{color:var(--muted);font-size:.95rem}
.dock-h{font-family:var(--display);font-size:1.3rem}
.hand{font-family:var(--emoji);font-size:3rem;display:inline-block;animation:raise 1.1s ease-in-out infinite;color:inherit!important}
@keyframes raise{50%{transform:translateY(-12px) rotate(-14deg)}}
.answer{display:flex;gap:8px;align-items:stretch}
.answer textarea{flex:1;min-width:0;font:inherit;font-size:1.2rem;font-weight:700;border:3px solid #bac8ff;border-radius:16px;padding:10px 12px;resize:none;background:#fff;color:var(--ink)}
.answer .send{font-family:var(--display);font-size:1.25rem;padding:0 18px}
@container (max-width:520px){.answer{flex-direction:column}.answer .send{padding:12px}}
.mine{background:#f1f3f5;border-radius:12px;padding:10px;font-size:1.1rem;text-align:left}
.s-sheet-bg{position:absolute;inset:0;background:rgba(20,24,35,.45);z-index:40}
.s-sheet{position:absolute;top:66px;right:10px;left:10px;z-index:41;background:#fffdf8;border-radius:24px;padding:14px;max-height:calc(100% - 80px);overflow:auto;transform-origin:92% 0;animation:sheetin .38s cubic-bezier(.2,1.4,.4,1);box-shadow:0 18px 40px rgba(0,0,0,.3);border:4px solid #f08c00;display:grid;gap:10px}
@keyframes sheetin{from{transform:scale(.2);opacity:0}}
.sh-h{display:flex;align-items:center;gap:8px}
.sh-h .bag{font-family:var(--emoji);font-size:1.8rem}
.sh-h b{font-family:var(--display);font-size:1.5rem}
.sh-h .sp{flex:1}
.shop .it.big{background:linear-gradient(135deg,#fff3bf,#ffe8cc);border:3px solid #f2a900}
.shop .it.big .e{font-size:2.6rem}
.s-sheet .hint{margin:0;text-align:center;color:var(--muted);font-size:.9rem}
.gearfly{width:120px;display:grid;justify-items:center;gap:2px}
.gearfly span{font-family:var(--emoji);font-size:64px;line-height:1;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3))}
.gearfly small{font-family:var(--body);font-weight:900;font-size:13px;background:#fff;border-radius:99px;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15)}
body.nofx *,body.nofx *::before,body.nofx *::after{animation:none!important}
/* textbook bank */
.modal.bank{max-width:820px}
.seg.lv button{font-family:var(--display);font-size:1.1rem;padding:8px 18px}
.bk-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:12px;padding:8px 12px}

const CONNECTORS=/\b(because|and|but|so|then|when|after|before|if|or|while|until|although)\b/i;
function meter(t){const c=sentenceCheck(t);const conn=CONNECTORS.test(String(t||''));const r={cap:c.cap,end:c.end,w5:c.words>=5,w8:c.words>=8,conn,words:c.words};r.score=[r.cap,r.end,r.w5,r.w8,r.conn].filter(Boolean).length;return r;}
const norm=t=>String(t||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
const escRe=t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const wordHit=(text,w)=>!!w&&new RegExp('\\b'+escRe(String(w).toLowerCase().trim()),'i').test(String(text||''));
function shuffleWords(sent){const w=String(sent).replace(/\s+/g,' ').trim().split(' ');let out=w,n=0;do{out=w.slice().sort(()=>Math.random()-.5);n++;}while(out.join(' ')===w.join(' ')&&n<12&&w.length>1);return out;}
function parseQ(l){const parts=l.split('|').map(x=>x.trim());const type=(parts[0]||'').toUpperCase();
  if(!QTYPES[type])return parts[0]?{type:'T',text:parts[0],model:parts[1]||''}:null;
  const a=parts[1]||'',b=parts[2]||'',c=parts[3]||'';if(!a)return null;
  switch(type){
    case 'S':case 'T':case 'Z':return{type,text:a,model:b};
    case 'B':return{type,text:'Put the words in order.',model:a,tiles:shuffleWords(a)};
    case 'F':return{type,text:a,model:b};
    case 'W':return{type,word:a,text:b||`Make a sentence with the word "${a}".`,model:''};
    case 'P':case 'PT':return{type,pic:a,text:b||'What do you see? What is happening?',model:''};
    case 'C':return{type,text:a,opts:[b||'Yes',c||'No'],model:''};
  }return null;}

 editor.","W | hero | Make a sentence about a hero.","P | 💻🏠🔥👵 | A kid reporter investigates an old house. Tell the story.","C | Should the city tear down old houses to build new things? | Yes, build new things | No, keep old houses","Z | Name three things a reporter does.","F | Smartphones has changed the news business. | Smartphones have changed the news business."],"partial":false},{"n":15,"title":"Forces of Nature","bq":"What can we learn from nature's power?","learn":["What does \"tsunami\" mean? | a huge wave caused by an earthquake under the ocean","What does \"blizzard\" mean? | a very heavy snowstorm with strong winds","What does \"collapse\" mean? | to fall down suddenly, like a building in an earthquake","Spell the word \"hurricane\". | h-u-r-r-i-c-a-n-e","Spell the word \"tornado\". | t-o-r-n-a-d-o","Add \"ever\" to the question: \"Have you seen a tornado?\" | Have you ever seen a tornado?","Answer with \"never\": \"Have you ever felt an earthquake?\" | No, I haven't. I've never felt an earthquake.","Where does a hurricane form? | over warm ocean water","Which place has more tornadoes than any other place in the world? | North America","Which force of nature do you think is the most dangerous? Why?"],"battle":["T | Ask your partner about a life experience with \"Have you ever\". | Have you ever experienced an earthquake?","S | Explain what causes a tsunami and what happens after it.","B | Have you ever seen a real tornado?","F | Have you ever saw a hurricane? | Have you ever seen a hurricane?","W | rescue worker | Make a sentence about rescue workers after a disaster.","P | 🌪️🌊❄️⚡ | Describe a force of nature and what people do to stay safe.","C | Which is more frightening, an earthquake or a hurricane? | An earthquake | A hurricane","Z | Name three forces of nature.","PT | 📱⚠️🏃 | Type a sentence about a warning system."],"partial":false},{"n":16,"title":"Staying Calm Before the Storm","bq":"What can we learn from nature's power?","learn":["What does \"e /* Live bank: on the hosted site, bank/OD1.txt … OD5.txt next to this page override the built-in copy, so questions can be edited on GitHub without touching the game. */
function parseBankText(txt){
  const units=[];let cur=null,mode=null;
  for(const raw of String(txt).split('\n')){const l=raw.trim();
    if(l.startsWith('## ')){const parts=l.slice(3).split('|').map(x=>x.trim());const m=parts[0].match(/\d+/);if(!m)continue;const partial=/\(partial\)/.test(parts[0]+(parts[1]||''));
      cur={n:+m[0],title:(parts[1]||'').replace('(partial)','').trim(),bq:parts[2]||'',learn:[],battle:[],partial};units.push(cur);mode=null;continue;}
    if(l==='# learn'){mode='L';continue;}if(l==='# battle'){mode='B';continue;}
    if(!l||l.startsWith('===')||l.startsWith('//')||!cur||!mode)continue;
    (mode==='L'?cur.learn:cur.battle).push(l);}
  units.sort((a,b)=>a.n-b.n);return units;
}
async function loadLiveBank(){
  if(location.protocol==='file:')return;
  let n=0;
  for(const lv of ['OD1','OD2','OD3','OD4','OD5','OD6']){
    try{const r=await fetch('bank/'+lv+'.txt',{cache:'no-store'});if(!r.ok)continue;const units=parseBankText(await r.text());if(units.length){OD_BANK[lv]={units};n++;}}catch(e){}
  }
  if(n){OD_LEVELS=Object.keys(OD_BANK).sort();H.bankLive=n;if(typeof renderHeader==='function'&&S)renderHeader();}
}

    if(sp.kind==='cross'||sp.kind==='drift'){a.x=dir>0?-40:W+40;a.y=Hh*(.08+Math.random()*.3);a.vx=dir*(sp.kind==='drift'?4:12+Math.random()*8)*u;if(sp.kind==='drift'){a.s*=1.4;a.y=Hh*(.15+Math.random()*.7);}}
    if(sp.kind==='cloud'){a.x=dir>0?-60:W+60;a.y=Hh*(.05+Math.random()*.2);a.vx=dir*(2.5+Math.random()*3)*u;a.s*=1.8;}
    if(sp.kind==='drive'){a.x=dir>0?-40:W+40;a.y=Hh*.935;a.vx=dir*(14+Math.random()*10)*u;}
    if(sp.kind==='walk'){a.x=dir>0?-50:W+50;a.y=Hh*.9;a.vx=dir*(4+Math.random()*3)*u;a.s*=1.5;}
    if(sp.kind==='meteor'){a.x=W*(.4+Math.random()*.7);a.y=-20;a.vx=-(40+Math.random()*25)*u;a.vy=(25+Math.random()*12)*u;}
    FX.amb.push(a);
  });
  c.textAlign='center';c.textBaseline='middle';
  FX.amb=FX.amb.filter(a=>{
    a.age+=dt;let y=a.y,rot=0,flip=false,alpha=.55;
    switch(a.kind){

      case 'rise':a.y+=a.vy*dt;a.x+=Math.sin(t*1.2+a.ph)*6*u*dt;alpha=sc==='dino'?.6*Math.min(1,a.y/(Hh*.2)):.55*Math.min(1,a.y/(Hh*.35));if(sc==='dino')a.s+=dt*1.5*u;y=a.y;break;
      case 'flutter':a.x+=a.vx*dt;a.y+=Math.sin(t*4+a.ph)*14*u*dt;rot=Math.sin(t*14+a.ph)*.25;flip=a.vx>0;y=a.y;break;
      case 'cross':case 'cloud':case 'drive':a.x+=a.vx*dt;if(a.kind==='cross')a.y+=Math.sin(t*5+a.ph)*4*u*dt;y=a.y;flip=a.vx>0&&a.kind!=='cloud';alpha=a.kind==='cloud'?.45:.6;break;
      case 'drift':a.x+=a.vx*dt;rot=Math.sin(t*.8+a.ph)*.3;y=a.y+Math.sin(t+a.ph)*3*u;break;
      case 'walk':a.x+=a.vx*dt;y=a.y-Math.abs(Math.sin(t*5))*1.4*u;flip=a.vx>0;alpha=.65;break;
      case 'meteor':a.x+=a.vx*dt;a.y+=a.vy*dt;y=a.y;c.save();c.globalAlpha=.45;c.strokeStyle='#fff8d6';c.lineWidth=Math.max(2,u*.6);c.lineCap='round';c.beginPath();c.moveTo(a.x,a.y);c.lineTo(a.x-a.vx*.18,a.y-a.vy*.18);c.stroke();c.restore();break;
    }
    c.save();c.globalAlpha=Math.max(0,alpha);c.translate(a.x,y);c.rotate(rot);if(flip)c.scale(-1,1);c.font=`${a.s}px ${EMOJI_FONT}`;c.fillText(a.e,0,0);c.restore();
    return a.x>-120&&a.x<W+120&&a.y>-60&&a.y<Hh+60&&a.age<60;
  });
}

async function nextRound(custom){

function markCorrect(pid,tier=1){

    if(b.subs[pid]){b.subs[pid].ok=tier;if(!prev&&b.q&&TYPED.has(b.q.type)){b.approved.push({pid,text:b.subs[pid].text,round:b.round});if(b.approved.length>40)b.approved.shift();}}
    if(prev!==tier){beep(tier===3?990:820);floatText(pid,tier===3?'🌟 AMAZING!':tier===2?'⭐ GREAT!':'✓',tier===3?'#e8590c':tier===2?'#f08c00':'#2f9e44');burst(pid,tier===3?['🌟','✨','⚡']:tier===2?['⭐','⚡']:['⚡'],tier===3?18:tier===2?10:5,{speed:18});
      if(!prev)log(`${p.name} ${tier===3?'gave an AMAZING answer! 🌟':tier===2?'gave a great answer! ⭐':'can take an action! ⚡'}`);}
  }else{delete b.ok[pid];delete b.acts[pid];if(b.subs[pid])b.subs[pid].ok=false;}

}
function approveAllGood(){const b=S.battle;if(!b||!b.q)return;Object.entries(b.subs).forEach(([pid,sb])=>{if(sb.ok!=null||!P(pid))return;if(!checkOK(sentenceCheck(sb.text)))return;if(b.q.type==='W'&&!wordHit(sb.text,b.q.word))return;markCorrect(pid,meter(sb.text).score>=5?2:1);});}
function onAnswer(pid,text){
  const b=S.battle,p=P(pid);if(!b||b.step!=='question'||!b.q||!TYPED.has(b.q.type)||!p)return;

  changed();
}

  banner('DEFENSE!',teams.map(teamName).join(' & ')+' — answer to block!','#1971c2');beep(440,.15);setTimeout(()=>beep(660,.2),150);

async function resolveRound(){
  const b=S.battle;if(!b||!['question','defense'].includes(b.step)||H.busy)return;
  H.busy=true;const blocks={};if(b.def)Object.keys(b.def.blocks).forEach(pid=>{const p=P(pid);if(p)blocks[p.team]=(blocks[p.team]||0)+1;});
  b.step='resolving';changed();
  const acts=Object.entries(b.acts).filter(([pid])=>P(pid));
  if(!acts.length)log('No actions this round.');
  const support=acts.filter(([,a])=>a.kind!=='attack'),attacks=acts.filter(([,a])=>a.kind==='attack').sort(()=>Math.random()-.5);
  if(acts.length)banner('ACTION!','',teamColor(0));
  await sleep(acts.length?900:100);
  for(const[pid,a]of support){
    const p=P(pid),c=classOf(p),m=(b.ok[pid]||1)>=2?2:1;
    if(p.down||a.kind==='repair'){
      const use=p.inv.heal>0;if(use)p.inv.heal--;const amt=(use?4:1)*m;
      if(p.down){p.down=false;p.hp=Math.max(Math.ceil(maxHp(p)/2),Math.min(maxHp(p),amt));log(`${p.name} rebuilt the ${habOf(p)[0]}! 🔨`);}
      else{p.hp=Math.min(maxHp(p),p.hp+amt);log(`${p.name} repaired: +${amt} ❤️${use?' '+c.heal[1]:''}${m>1?' (×2)':''}`);}

    }else{
      const use=p.inv.def>0;if(use)p.inv.def--;const amt=(use?3:1)*m;p.armor=Math.min(ARMOR_CAP,p.armor+amt);p.pts+=1;
      log(`${p.name} built a wall: +${amt} 🛡️${use?' '+c.def[1]:''}${m>1?' (×2)':''}`);changed();popHab(pid);burst(pid,use?[c.def[1],'🧱']:['🧱'],use?10:5,{speed:16});floatText(pid,`+${amt} 🛡️`,'#495057');beep(520,.08);
    }

  }
  for(const[pid,a]of attacks){

    const use=p.inv.atk>0;if(use)p.inv.atk--;let dmg=(use?3:1)*(tier>=2?2:1),note=tier===3?' 🌟 Critical!':tier===2?' ⭐ ×2':'';
    if((p.streak||0)>=2){dmg+=1;note+=' 🔥 Streak!';}
    if(p.dash){dmg*=2;p.dash=false;note+=' Dino Dash!';}
    const pierce=p.warp||tier===3;if(p.warp)note+=' Warp Strike!';p.warp=false;
    if(a.target==='boss'){
      if(!bossOn())continue;const bo=b.boss;beep(300,.1,'square',.06);
      await projectileP(habPt(pid),bossPt(),use?c.atk[1]:'💥');
      bo.hp=Math.max(0,bo.hp-dmg);bo.dmg[p.team]=(bo.dmg[p.team]||0)+dmg;p.pts+=dmg;
      log(`${p.name} hit the ${bo.name}: −${dmg}${note}`);changed();boom();
      anim($('#boss-e'),[{transform:'none'},{transform:'translateX(-8%) rotate(-10deg) scale(.92)'},{transform:'translateX(8%) rotate(8deg)'},{transform:'none'}],{duration:450});
      burst(bossPt(),['💥','✨'],12,{speed:26});floatText(bossPt(),`−${dmg}`,'#d9480f');if(tier===3)critical();
      if(bo.hp<=0){await bossDefeated();}
      await sleep(380);continue;
    }
    const alive=Object.values(S.players).filter(q=>q.team===a.target&&!q.down);
    if(!alive.length){log(`${p.name}'s attack missed. ${teamName(a.target)} is already down!`);continue;}
    const best=Math.max(...alive.map(q=>q.hp+q.armor)),top=alive.filter(q=>q.hp+q.armor===best),v=top[rnd(top.length)];
    beep(300,.1,'square',.06);
    await projectile(pid,v.pid,use?c.atk[1]:'💥');
    if(blocks[a.target]>0){blocks[a.target]--;log(`🛡️ ${teamName(a.target)} blocked ${p.name}'s attack!`);changed();burst(v.pid,['🛡️','✨'],12,{ring:true,g:0,speed:18,drag:.95});floatText(v.pid,'BLOCKED!','#1971c2');beep(900,.1);await sleep(380);continue;}
    let rest=dmg;if(!pierce){const ab=Math.min(v.armor,rest);v.armor-=ab;rest-=ab;}
    v.hp=Math.max(0,v.hp-rest);p.pts+=dmg;
    let ko=false;if(v.hp<=0&&!v.down){v.down=true;v.armor=0;ko=true;p.pts+=3;}
    log(`${p.name} hit ${v.name}'s ${habOf(v)[0]}: −${dmg}${note}${ko?' 💤 KO! +3 🏆':''}`);
    changed();boom();shakeHab(v.pid);burst(v.pid,['💥','✨'],10,{speed:24});floatText(v.pid,`−${dmg}`,'#d9480f');if(tier===3)critical();
    if(ko){await sleep(200);burst(v.pid,['💨','💤','⭐'],14,{speed:20});floatText(pid,'+3 🏆','#c92a2a');}
    await sleep(420);
  }
  if(bossOn())await bossAttack(blocks);
  b.step='done';b.acts={};H.busy=false;changed();
  if(acts.length&&!b.boss){const ts=teamStats(S).sort((x,y)=>y.pts-x.pts);if(ts[0])log(`After round ${b.round}: ${ts[0].name} leads with ${ts[0].pts} 🏆`);changed();}
}

/* ----- connections ----- */
function startHost(){
  if(typeof Peer==='undefined'){H.status='off';H.statusText='Offline mode (no internet)';renderHeader();return;}
  try{H.peer&&H.peer.destroy();}catch(e){}
  H.status='wait';H.statusText='Connecting…';renderHeader();
  const peer=new Peer(peerIdFor(S.code),peerOpts());H.peer=peer;
  peer.on('open',()=>{H.status='on';H.statusText='Ready for players';H.retries=0;renderHeader();});
  peer.on('connection',conn=>{H.conns.set(conn,{pid:null,cid:null});conn.on('data',m=>{try{onStudent(conn,m);}catch(e){console.error(e);}});conn.on('close',()=>dropConn(conn));conn.on('error',()=>dropConn(conn));});
  peer.on('disconnected',()=>{if(!peer.destroyed){H.status='wait';H.statusText='Reconnecting…';renderHeader();setTimeout(()=>{try{peer.reconnect();}catch(e){}},1500);}});
  peer.on('error',e=>{if(['unavailable-id','network','server-error','socket-error','socket-closed'].includes(e.type)){H.status='wait';H.statusText=e.type==='unavailable-id'?'Re-opening the room…':'Network problem, retrying…';renderHeader();H.retries=(H.retries||0)+1;clearTimeout(H.rt);H.rt=setTimeout(startHost,Math.min(10000,2000+H.retries*1000));}});
}
function dropConn(conn){const info=H.conns.get(conn);H.conns.delete(conn);if(info&&info.pid&&S.players[info.pid]){if(![...H.conns.values()].some(x=>x.pid===info.pid)&&!S.players[info.pid].manual){S.players[info.pid].online=false;changed();}}}
function onStudent(conn,m){
  const info=H.conns.get(conn);if(!info||!m||typeof m!=='object')return;
  if(m.t==='hello'){info.cid=String(m.cid||'').slice(0,40);const pid=S.cidMap[info.cid];info.pid=pid&&S.players[pid]?pid:null;if(info.pid)S.players[info.pid].online=true;conn.send({t:'state',s:pub(),me:info.pid,my:myView(info.pid)});render();return;}
  if(!info.cid)return;
  if(m.t==='join'){
    const name=String(m.name||'').replace(/\s+/g,' ').trim().slice(0,14),team=+m.team;
    if(!name||!CHARS.some(c=>c.id===m.char)||!(team>=0&&team<S.teamCount))return conn.send({t:'toast',msg:'Please type your name, pick a team and a character.'});
    let pid=S.cidMap[info.cid];
    if(!pid||!S.players[pid]){pid=newPlayer(name,m.char,team);S.cidMap[info.cid]=pid;log(`${name} joined ${teamName(team)}! ${charById(m.char).e}`);chime();setTimeout(()=>{popHab(pid);burst(pid,['✨','🎉'],12,{ring:true,g:0,speed:16,drag:.95});},120);}
    else Object.assign(S.players[pid],{name,char:m.char,team,online:true});
    info.pid=pid;changed();return;
  }
  const pid=info.pid;if(!pid||!S.players[pid])return;
  if(m.t==='buy')buy(pid,m.item);
  if(m.t==='answer')onAnswer(pid,m.text);
  if(m.t==='build')onBuild(pid,m.words);
  if(m.t==='choose')onChoose(pid,m.i);
  if(m.t==='buzz')onBuzz(pid);
  if(m.t==='vote')onVote(pid,m.i);
  if(m.t==='act')onAct(pid,m.kind,m.target);
  if(m.t==='power')usePower(pid);
}

const ST={s:null,me:null,my:null,view:'',team:null,char:null,name:'',peer:null,conn:null,status:'Connecting to the game…',retry:null,qKey:'',draft:'',prev:null};
function cid(){let c=store('habitat-cid-'+JOIN);if(!c){c=Math.random().toString(36).slice(2)+Date.now().toString(36);store('habitat-cid-'+JOIN,c);}return c;}

function studentConnect(){
  if(typeof Peer==='undefined'){ST.status='No internet connection. Check the Wi-Fi and reload.';sRender();return;}
  clearTimeout(ST.retry);try{ST.peer&&ST.peer.destroy();}catch(e){}
  const peer=new Peer(undefined,peerOpts());ST.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect(peerIdFor(JOIN),{reliable:true,serialization:'json'});ST.conn=conn;
    const to=setTimeout(()=>{if(!conn.open){ST.status='Still trying to reach the teacher…';sRender();retrySoon();}},9000);
    conn.on('open',()=>{clearTimeout(to);conn.send({t:'hello',cid:cid()});});
    conn.on('data',sRecv);
    conn.on('close',()=>{ST.status='Connection lost. Reconnecting…';ST.s=null;ST.view='';sRender();retrySoon();});
  });
  peer.on('error',e=>{ST.status=e.type==='peer-unavailable'?`Game ${JOIN} is not open yet. Waiting for the teacher…`:'Connection problem. Retrying…';sRender();retrySoon();});
}
function sRecv(m){if(!m)return;if(m.t==='state'){ST.s=m.s;ST.me=m.me;ST.my=m.my;if(m.s.battle)ST.deadline=Date.now()+m.s.battle.endsIn;sRender();}if(m.t==='toast')toast(m.msg);if(m.t==='fx'){if(m.k==='wrong'){toast('Not quite! Try again.');const l=$('#bline');if(l&&!RM){l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');}}if(m.k==='right')sBurst($('#s-dock'),['🧩','✨','⭐'],14);}}

function sBurst(el,emojis,n=10){
  if(RM||!el||!el.animate)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;

    const a=-Math.PI/2+(Math.random()-.5)*2.6,d=60+Math.random()*90;
    s.animate([{transform:`translate(${cx-15}px,${cy-15}px) scale(.6)`,opacity:1},{transform:`translate(${cx-15+Math.cos(a)*d}px,${cy-15+Math.sin(a)*d}px) scale(1.1)`,opacity:1,offset:.6},{transform:`translate(${cx-15+Math.cos(a)*d*1.2}px,${cy+20+Math.sin(a)*d}px) scale(.8)`,opacity:0}],{duration:1000+rnd(300),easing:'ease-out'}).finished.then(()=>s.remove());}
}

  ${item('def',ico(c.def[1]),c.def[0],`Defense: +3 🛡️ instead of +1 · ${me.inv.def}/${INV_CAP}`,GEAR_COST,me.coins<GEAR_COST||me.inv.def>=INV_CAP)}
  ${item('heal',c.heal[1],c.heal[0],`Supplies: +4 ❤️ instead of +1 · ${me.inv.heal}/${INV_CAP}`,GEAR_COST,me.coins<GEAR_COST||me.inv.heal>=INV_CAP)}</div>
  <p class="hint">Answer questions to earn more 🪙!</p>`;
}
function sOpenShop(open){ST.shopOpen=open;$('#s-sheet').hidden=!open;$('#s-sheet-bg').hidden=!open;const me=ST.s&&ST.s.players[ST.me];if(open&&me)sShop(me,classOf(me));}
function sShake(){const d=$('#h-dio');if(!d||RM||!d.animate)return;d.animate([{transform:'none'},{transform:'translateX(-6%) rotate(-5deg)'},{transform:'translateX(6%) rotate(5deg)'},{transform:'translateX(-4%) rotate(-3deg)'},{transform:'none'}],{duration:500});const f=document.createElement('div');f.className='hitflash';d.appendChild(f);f.animate([{opacity:0},{opacity:.7},{opacity:0}],{duration:450}).finished.then(()=>f.remove());}
function sFloat(txt,col){const d=$('#h-dio');if(!d||RM||!d.animate)return;const e=document.createElement('div');e.className='sfloat';e.textContent=txt;e.style.color=col;d.appendChild(e);e.animate([{transform:'translate(-50%,0) scale(.6)',opacity:0},{transform:'translate(-50%,-30px) scale(1.15)',opacity:1,offset:.25},{transform:'translate(-50%,-80px) scale(1)',opacity:0}],{duration:1600,easing:'ease-out'}).finished.then(()=>e.remove());}
function sGear(emoji,label,toSel){
  const to=$(toSel),from=$('#h-dio');if(!to||!from)return;if(RM||!document.body.animate){sBump(toSel);return;}
  const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
  const el=document.createElement('div');el.className='pfx gearfly';el.innerHTML=`<span>${emoji}</span><small>+1 ${esc(label)}</small>`;document.body.appendChild(el);
  const x0=a.left+a.width/2-60,y0=a.top+a.height*.35-50,x1=b.left+b.width/2-60,y1=b.top+b.height/2-50;
  el.animate([{transform:`translate(${x0}px,${y0}px) scale(.2) rotate(-30deg)`,opacity:0},{transform:`translate(${x0}px,${y0}px) scale(1.3) rotate(8deg)`,opacity:1,offset:.25},{transform:`translate(${x0}px,${y0-12}px) scale(1.2) rotate(-4deg)`,opacity:1,offset:.6},{transform:`translate(${x1}px,${y1}px) scale(.35)`,opacity:.9}],{duration:1400,easing:'ease-in-out'}).finished.then(()=>{el.remove();sBump(toSel);sBurst(to,['✨'],5);});
}
async function sTransform(oldE,newE,name){
  const he=$('#h-hab'),dio=$('#h-dio'),rays=$('#h-rays');if(!he)return;
  if(RM||!he.animate){he.textContent=newE;return;}
  ST.anim=true;he.textContent=oldE;
  try{
    await he.animate([{transform:'none',filter:'brightness(1)'},{transform:'translateX(-4%) rotate(-4deg)',filter:'brightness(1.3)',offset:.2},{transform:'translateX(4%) rotate(4deg)',filter:'brightness(1.7)',offset:.4},{transform:'translateX(-6%) rotate(-6deg) scale(1.05)',filter:'brightness(2.3)',offset:.6},{transform:'translateX(6%) rotate(6deg) scale(1.1)',filter:'brightness(3)',offset:.8},{transform:'scale(1.15)',filter:'brightness(5)'}],{duration:1200,easing:'ease-in'}).finished;
    const fl=document.createElement('div');fl.className='flash';dio.appendChild(fl);fl.animate([{opacity:0},{opacity:1,offset:.3},{opacity:0}],{duration:600}).finished.then(()=>fl.remove());
    await sleep(180);he.textContent=newE;
    rays.animate([{opacity:0,transform:'rotate(0) scale(.4)'},{opacity:1,transform:'rotate(80deg) scale(1)',offset:.25},{opacity:1,transform:'rotate(220deg) scale(1.05)',offset:.8},{opacity:0,transform:'rotate(280deg) scale(1.15)'}],{duration:2800,easing:'ease-out'});
    sBurst(dio,['✨','⭐','🎉',newE],26);
    const rb=document.createElement('div');rb.className='lvup';rb.innerHTML=`<b>LEVEL UP!</b><span>${esc(name)}</span>`;dio.appendChild(rb);
    rb.animate([{transform:'translate(-50%,-40px) scale(.4)',opacity:0},{transform:'translate(-50%,0) scale(1.2)',opacity:1,offset:.2},{transform:'translate(-50%,0) scale(1)',opacity:1,offset:.85},{transform:'translate(-50%,-14px) scale(1)',opacity:0}],{duration:2800}).finished.then(()=>rb.remove());
    await he.animate([{transform:'scale(0) rotate(-200deg)',filter:'brightness(3)'},{transform:'scale(1.4) rotate(12deg)',filter:'brightness(1.4)',offset:.6},{transform:'scale(1)',filter:'brightness(1)'}],{duration:900,easing:'cubic-bezier(.2,1.4,.4,1)'}).finished;
  }finally{ST.anim=false;const me=ST.s&&ST.s.players[ST.me];if(me)he.textContent=classOf(me).hab[me.lv-1][1];}
}
function sPlayClick(e){
  if(ST.view!=='play')return;const b=e.target.closest('[data-sact]');if(!b||b.disabled)return;const a=b.dataset.sact;
  if(a==='shop'){sOpenShop(true);return;}
  if(a==='shop-close'){sOpenShop(false);return;}
  if(a==='buy'){if(b.dataset.item==='upgrade')sOpenShop(false);sSend({t:'buy',item:b.dataset.item});}
  if(a==='power')sSend({t:'power'});
  if(a==='act'){b.disabled=true;sSend({t:'act',kind:b.dataset.k,target:b.dataset.t});}
  const q=ST.s&&ST.s.battle&&ST.s.battle.q;
  if(a==='tile-add'&&ST.bld){ST.bld.order.push(+b.dataset.i);sRefreshDock();}
  if(a==='tile-rm'&&ST.bld){ST.bld.order.splice(+b.dataset.i,1);sRefreshDock();}
  if(a==='tile-reset'&&ST.bld){ST.bld.order=[];sRefreshDock();}
  if(a==='tile-check'&&ST.bld&&q&&q.tiles)sSend({t:'build',words:ST.bld.order.map(i=>q.tiles[i])});
  if(a==='choose'){b.disabled=true;sSend({t:'choose',i:+b.dataset.i});}
  if(a==='buzz'){b.disabled=true;sSend({t:'buzz'});}
  if(a==='vote')sSend({t:'vote',i:+b.dataset.i});
  if(a==='send'){const t=($('#ans')?.value||'').trim();if(t.split(/\s+/).length<2)return toast('Write a complete sentence, please!');if(sSend({t:'answer',text:t})){ST.draft='';}}
}

/* ============================================================
   BOOT
   ============================================================ */
if(MODE==='host')initHost();else{sRender();studentConnect();}
</script>

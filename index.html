he parts that help fish breathe in water","What does \"mammals\" mean? | animals with fur or hair whose babies drink milk","What does \"amphibians\" mean? | animals that can live on land and in water, like frogs","Spell the word \"feathers\". | f-e-a-t-h-e-r-s","Spell the word \"scales\". | s-c-a-l-e-s","Complete: Fish have gills. ___ help them breathe. | They","Complete: Do gills help fish breathe? Yes, gills help ___ breathe. | them","What do birds have on their bodies? | feathers and wings","Where do fish lay their eggs? | in water","Which animal group do you like best? Why?"],"battle":["T | How are fish different from birds? | Fish have gills and birds have wings.","B | Birds have two wings and feathers.","F | Fish have gills. Gills help they breathe. | Fish have gills. Gills help them breathe.","F | Amphibians lay its eggs in water. | Amphibians lay their eggs in water.","W | fur | Make a sentence with the word fur.","W | wings | Make a sentence with the word wings.","P | 🐟🐸🐦🐘 | Which animal groups do you see? Tell us about one.","C | Which is a better pet, a fish or a mammal? | A fish | A mammal","Z | Name three animals that are mammals.","S | Describe your favorite animal in two sentences."],"words":["feathers | fea·thers | fea/thers | 🪶","wings | wings | w/ings | 🕊️","gills | gills | g/ills | 🐟","scales | scales | sc/ales | 🐠","mammals | mam·mals | mam/mals | 🐘","amphibians | am·phib·i·ans | am/phib/i/ans | 🐸","eggs | eggs | e/ggs | 🥚","skin | skin | sk/in | 🖐️","fur | fur | f/ur | 🐻","body | bod·y | bod/y | 🧍","head | head | h/ead | 🙂","mouth | mouth | m/outh | 👄"],"reading":["> Amazing Animals","> All animals can breathe and move, but they're different in many amazing ways. Here, we look at how they are the same and how they are different. This helps us put them into groups.","> Birds: All birds have two legs, two wings, and feathers, and most birds can fly. The wings and feathers help them fly, and the feathers help keep them warm. Birds lay eggs with hard shells. They keep the baby birds inside safe from animals that want to eat them.","> Fish: Fish have gills to help them breathe in water. Scales all over their bodies help keep them safe from dangerous fish that want to bite them. They don't have legs, but their fins and tails help them swim. Fish lay their eggs in water, and their eggs are soft.","> Amphibians: Amphibians are very interesting because they can live on land and in water. Amphibians need to have wet skin, so they live in wet places. They lay their soft eggs in water. They have gills when they're young and the gills help them breathe in water. Most amphibians, like frogs, have legs that help them walk and jump on land.","> Mammals: Some mammals live on land and some live in water. Whales are water mammals, and cats, rabbits, and lions are land mammals. Hair or fur covers most land mammals' bodies and this helps keep them warm. People are mammals too! Mammals don't lay eggs. Their babies drink milk from their mothers.","RC | What helps fish breathe in water? | gills | fins | scales","RC | What do birds have on their bodies? | feathers | fur | scales","RC | Where do amphibians lay their eggs? | in water | on land | in a nest","RT | Where do fish lay their eggs? | Fish lay their eggs in water.","RT | What do baby mammals drink? | Baby mammals drink milk from their mothers.","RT | What covers most land mammals' bodies? | Hair or fur covers their bodies.","RS | How are birds and fish different? Tell us one thing.","RS | Why do birds' eggs have hard shells?"],"grammar":["GT | Pronouns – Subject and Object","R | **Fish** have gills.  →  **They** have gills.","R | Gills help **fish** breathe.  →  Gills help **them** breathe.","R | **Do** gills help fish breathe?  Yes, gills help **them** breathe.","R | **How** do gills help fish?  Gills help **them** breathe.","G | Fish have gills.","G | Gills help them breathe.","G | Do gills help fish breathe?","G | Yes, gills help them breathe.","G | Birds have wings and feathers.","G | They lay eggs with hard shells.","G | Mammals have fur to keep them warm."],"sw":["SP | A: Ouch! | B: Are you OK? | A: No. My {leg} hurts! | B: Oh, no! That's awful. | leg / head / ear / mouth / body / eye","SW | My favorite animal group is {birds}. They have {wings and feathers}. They can {fly}. | Write three things about your favorite animal group."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":2,"title":"Leo and Lily's Adventure","bq":"How are animals different from one another?","learn":["What does \"escape\" mean? | to get away from danger","What does \"creep\" mean? | to move very slowly and quietly","What does \"squawk\" mean? | to make a loud bird sound","Spell the word \"berries\". | b-e-r-r-i-e-s","Spell the word \"pinecone\". | p-i-n-e-c-o-n-e","Complete: Lily ___ escapes. (every time) | always","Complete: Leo and Lily ___ fight now. (not at any time) | never","Who is Leo, and who is Lily? | Leo is a cat and Lily is a bird.","What falls on the fox's head? | a pinecone","Can a cat and a bird be friends? Why or why not?"],"battle":["T | What does Lily eat? | Lily eats worms, nuts, and berries.","B | Lily is usually very nervous.","F | Leo tries sometimes to catch Lily. | Leo sometimes tries to catch Lily.","F | Lily escapes always. | Lily always escapes.","W | hunt | Make a sentence with the word hunt.","W | fight | Make a sentence with the word fight.","P | 🐱🐦🦊🌲 | Tell the story of Leo and Lily.","C | Who is braver, Leo or Lily? | Leo | Lily","Z | Say three adverbs of frequency.","S | Tell us something you always do and something you never do."],"words":["worm | worm | w/orm | 🪱","berries | ber·ries | ber/ries | 🫐","hunt | hunt | h/unt | 🏹","escape | es·cape | es/cape | 🏃","creep | creep | cr/eep | 🐾","fight | fight | f/ight | 🥊","peck | peck | p/eck | 🐦","pinecone | pine·cone | pine/cone | 🌲","squawk | squawk | squ/awk | 🦜","strong | strong | str/ong | 💪","gentle | gen·tle | gen/tle | 🐰","smart | smart | sm/art | 🧠","calm | calm | c/alm | 😌","fierce | fierce | f/ierce | 🦁"],"reading":["> Leo and Lily's Adventure","> Leo and Lily live in a big garden near a forest. Lily is red and yellow. She's friendly, but she is usually very nervous. Lily flies from tree to tree in the garden, and she hops in the grass. She eats worms, nuts, and berries. Leo is black and white. He is very fast and very clever. He's brave, too. He climbs trees in the garden, and he hunts for mice... and birds! Leo sometimes tries to catch Lily, but Lily always escapes. Leo can run fast, but Lily can fly. This makes Leo angry!","> One day, Leo sees Lily in the garden. Leo wants to catch Lily. He creeps through the garden very slowly and quietly. But Lily sees Leo, and she flies away into the forest. Leo chases Lily. Lily flies and flies, and Leo runs and runs. Soon they are a long way from the garden, and they don't know the way home. It's dark in the forest. Leo and Lily are scared.","> Leo and Lily hear a noise. It's a fox! The fox is hungry. It wants some dinner. It wants to eat Leo! Leo tries to fight the fox, but the fox is very big.","> Lily is in a tree. She pecks a pinecone. The pinecone falls and hits the fox on the head! Leo escapes and climbs up the tree. The fox is angry. It can't climb trees.","> Leo and Lily wait in the tree for a long time. At last, the fox goes away. Leo and Lily are safe, but they want to go home now. Lily flies up very high. She sees the garden! She squawks happily. Lily shows Leo the way home. But Lily is small and her wings are tired. She sits on Leo's back, and Leo carries Lily home. Leo and Lily are safe at home in their garden again. They're friends now. Lily flies around the garden, and Leo never tries to catch her... Well, hardly ever!","RC | What does Lily eat? | worms and berries | mice and birds | fish and nuts","RC | Who wants to eat Leo in the forest? | a fox | a dog | a bird","RC | What hits the fox on the head? | a pinecone | a worm | a nut","RT | Why can't Leo catch Lily in the garden? | Leo can run fast, but Lily can fly.","RT | Why can't the fox catch Leo in the tree? | The fox can't climb trees.","RT | How does Lily get home? | She sits on Leo's back, and Leo carries her home.","RS | How are Leo and Lily different? Tell us one thing.","RS | Why are Leo and Lily friends at the end of the story?"],"grammar":["GT | Adverbs of Frequency","R | **always** ✓✓✓✓   **usually** ✓✓✓   **sometimes** ✓✓   **hardly ever** ✓   **never** ✗","R | Lily **always** escapes.  ·  Lily is **usually** very nervous.","R | Leo **sometimes** tries to catch Lily.  ·  Leo **hardly ever** tries to catch Lily now.","R | Leo and Lily **never** fight now.","G | Lily always escapes from Leo.","G | Lily is usually very nervous.","G | Leo sometimes tries to catch Lily.","G | Leo hardly ever tries to catch Lily now.","G | Leo and Lily never fight now.","G | Why can't my cat and bird be friends?","G | I always eat ice cream in the summer.","G | He sometimes watches TV in the evening."],"sw":["SP | A: {Eagles} have feathers and wings to help them fly. | B: What animal group are they in? | A: They're in the bird group. | B: That's right! | eagles / parrots / owls / ducks / penguins / chickens","SW | I know a {dog}. It is {gentle} and {smart}. It can {run fast}. | Write about an animal you know and say what it is like."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":3,"title":"What Is Our World Made Of?","bq":"How do things change?","learn":["What does \"liquid\" mean? | something that can flow, like water or juice","What does \"solid\" mean? | something hard or soft that we can see and feel, like a tree","What does \"melt\" mean? | to change from a solid to a liquid when it gets warm","Spell the word \"freeze\". | f-r-e-e-z-e","Spell the word \"steam\". | s-t-e-a-m","Complete: It ___ a liquid. Now it's a gas. | was","Complete: They ___ hard. Now they're soft. | were","What are the three states of things in our world? | solid, liquid, and gas","What happens when we heat water? | It boils and changes to steam.","What is your favorite liquid to drink? Why?"],"battle":["T | What happens when we make water very cold? | It freezes and changes to ice.","B | The air that you breathe is a gas.","F | The water were a liquid and now it's a solid. | The water was a liquid and now it's a solid.","F | They was hard. Now they're soft. | They were hard. Now they're soft.","W | ice | Make a sentence with the word ice.","W | heat | Make a sentence with the word heat.","P | 🧊💧☁️🔥 | What is happening? Tell us how water changes.","C | Which is more fun, a snowy day or a hot day? | A snowy day | A hot day","Z | Name three liquids.","S | Tell us about something that changed from one state to another."],"words":["flow | flow | fl/ow | 🌊","solid | sol·id | sol/id | 🧱","liquid | liq·uid | liq/uid | 💧","gas | gas | g/as | 💨","heat | heat | h/eat | 🔥","steam | steam | st/eam | ♨️","ice | ice | i/ce | 🧊","freeze | freeze | fr/eeze | 🥶","melt | melt | m/elt | 🫠","balloon | bal·loon | bal/loon | 🎈","kettle | ket·tle | ket/tle | 🫖","popcorn | pop·corn | pop/corn | 🍿","icicle | i·ci·cle | i/ci/cle | ❄️","candle | can·dle | can/dle | 🕯️"],"reading":["> What Is Our World Made Of?","> Everything in our world comes in three different states: solid, liquid, or gas.","> Solids: We can see and feel solids. Some solids are hard, and some solids are soft. Trees and feathers are solids. You're a solid, too!","> Liquids: A liquid is a thing that can flow. Some liquids are thick, and some liquids are thin. Juice and milkshakes are liquids. Can you think of other kinds of liquid?","> Gases: The air that you breathe is a gas. We can't usually see a gas, but sometimes we can feel it when it moves. On a windy day, we can feel the wind on our bodies.","> Things can change from one state to another when we make them hot or cold. When we make water very cold, it freezes and changes to ice. When ice or snow heats up, it melts and changes back to water. When we heat water, it boils and changes to steam.","> Look at these three pictures of things changing from one state to another. The snow was a solid and now it's a liquid. The water was a liquid and now it's a solid. The water was a liquid and now it's a gas.","RC | Which things are solids? | trees and feathers | juice and milkshakes | air and wind","RC | What happens when we heat water? | it boils | it freezes | it flows","RC | Which one is a gas? | steam | snow | honey","RT | What happens when we make water very cold? | It freezes and changes to ice.","RT | What happens when ice or snow heats up? | It melts and changes back to water.","RT | What is a liquid? | A liquid is a thing that can flow.","RS | What is the cause of the snow melting? What is the effect?","RS | Tell us one solid, one liquid, and one gas in our classroom."],"grammar":["GT | Simple Past of Verb To Be","R | It **was** a liquid.  →  Now it**'s** a gas.","R | They **were** hard.  →  Now they**'re** soft.","R | I / he / she / it → **was**      you / we / they → **were**","R | then: **was / were**      now: **is / are**","G | It was a liquid.","G | Now it's a gas.","G | They were hard before.","G | Now they're very soft.","G | What was it then?","G | What is it now?","G | It was an orange.","G | Now it's orange juice."],"sw":["SP | A: Please pass the {juice}. | B: Sure. Here you go. | A: Thanks. | B: You're welcome. | juice / chips / cookies / popcorn / water / milk","SW | {Water} is a {liquid}. When it gets very cold, it {freezes} and changes to {ice}. Now it's a solid. | Write about a thing that can change state."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":4,"title":"Let's Make Ice Cream!","bq":"How do things change?","learn":["What does \"mixture\" mean? | two or more things mixed together","What does \"pour\" mean? | to make a liquid flow out of something","What does \"freezer\" mean? | a very cold box that makes things freeze","Spell the word \"sugar\". | s-u-g-a-r","Spell the word \"cream\". | c-r-e-a-m","Complete: ___ the freezer door open? Yes, it was. | Was","Complete: Were the students happy? No, they ___. | weren't","Why did the ice cream melt? | The freezer door was open all night.","What do the students put in the big bag? | salt and ice cubes","Do you like ice cream? What is your favorite kind?"],"battle":["T | Where was the ice cream? | It was in the freezer.","B | Was the freezer door open all night?","F | Was the students happy? No, they weren't. | Were the students happy? No, they weren't.","F | Where were the ice cream? | Where was the ice cream?","W | salt | Make a sentence with the word salt.","W | plastic bags | Make a sentence with the words plastic bags.","P | 🍦🧊🥛🥳 | What are the students doing? Tell the story.","C | Is ice cream better in summer or in winter? | In summer | In winter","Z | Name three things you need to make ice cream.","S | Tell us about a party you went to. Where was it?"],"words":["cream | cream | cr/eam | 🍦","sugar | sug·ar | sug/ar | 🍬","salt | salt | s/alt | 🧂","pour | pour | p/our | 🫗","mixture | mix·ture | mix/ture | 🥣","open | o·pen | o/pen | 🚪","closed | closed | cl/osed | 🔒","freezer | freez·er | freez/er | 🧊","coffee | cof·fee | cof/fee | ☕","tea | tea | t/ea | 🍵","salad | sal·ad | sal/ad | 🥗","fruit | fruit | fr/uit | 🍎","vegetables | veg·e·ta·bles | veg/e/ta/bles | 🥕","pasta | pas·ta | pas/ta | 🍝"],"reading":["> Let's Make Ice Cream!","> Scene 1. Ms. Woods: Today is our school party. Let's go to the cafeteria and get the ice cream you bought yesterday. It's in the freezer. Students: Oh, no! It's liquid! Luis: Yuck! Judy: That was our ice cream! Mark: Was the freezer door open? Ms. Woods: Yes, it was. It was open all night. Now there's no ice cream for the party.","> Scene 2. Mr. Jenkins: What's wrong? Why's everyone so sad? Ms. Woods: It was our job to bring the ice cream for the party, but it melted. Now we can't have ice cream. Mr. Jenkins: Sure you can! You can make ice cream. I can teach you! Students: Yippee! Mr. Jenkins: OK, kids. Get big and small plastic bags, cream, sugar, vanilla, and salt. Then come to my classroom.","> Scene 3. Students: Ready, Mr. Jenkins! Mr. Jenkins: My freezer was closed all night, so I have ice. Now, let's make ice cream. Students: Yes! Let's make ice cream! Mr. Jenkins: Mix the sugar, and vanilla, and cream. Students: Mix the sugar, and vanilla, and cream. Done! Mr. Jenkins: Pour the cream, sugar, and vanilla mixture into the small bag. Students: Pour the mixture into the small bag. Done! Mr. Jenkins: Put the salt and the ice cubes into the big bag. Students: Put the salt and the ice cubes into the big bag. Done! Mr. Jenkins: Now put the small bag in the big bag. Students: Put the small bag in the big bag. Done! Mr. Jenkins: Now shake, shake, shake! What do you have? Luis: Hey! Look! We have ice cream! And we didn't use a freezer!","> Scene 4. Students: How is the ice cream, Mr. Jenkins? Mr. Jenkins: It's great! Can I have some more?","RC | Why did the ice cream melt? | the door was open | it was too sweet | the party was late","RC | Who teaches the students to make ice cream? | Mr. Jenkins | Ms. Woods | Luis","RC | What goes into the big bag? | salt and ice cubes | cream and sugar | vanilla and milk","RT | What is in the mixture? | The mixture is cream, sugar, and vanilla.","RT | Where do the students pour the mixture? | They pour the mixture into the small bag.","RT | What do the students do after they put the small bag in the big bag? | They shake, shake, shake the bag.","RS | What is the effect of shaking the mixture?","RS | Why did Mr. Jenkins help the students? What do you think?"],"grammar":["GT | Was / Were – Questions","R | **Was** the freezer door open?  Yes, it **was**.","R | **Were** the students happy?  No, they **weren't**.","R | **Where was** the ice cream?  It **was** in the freezer.","R | **Where were** you yesterday?  We **were** at a party.","G | Was the freezer door open?","G | Yes, it was open all night.","G | Were the students happy?","G | No, they weren't happy.","G | Where was the ice cream?","G | It was in the freezer.","G | Where were you yesterday?","G | We were at a party."],"sw":["SP | A: Tell me about the party. | B: My friends were there. | A: How was the {ice cream}? | B: It was tasty! | ice cream / pasta / salad / fruit / cake / juice","SW | My favorite food is {salad}. It's a mixture. It has {tomatoes}, {cucumbers}, and {salt} in it. | Write about one of your favorite foods and say what is in it."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":5,"title":"Then and Now","bq":"How are things different now from long ago?","learn":["What does \"communication\" mean? | sharing news or ideas with other people","What does \"travel\" mean? | to go from one place to another place","What does \"text message\" mean? | a short written message on a cell phone","Spell the word \"airplane\". | a-i-r-p-l-a-n-e","Spell the word \"letter\". | l-e-t-t-e-r","Complete: People ___ to the news on the radio. (listen) | listened","Complete: They ___ watch the news on TV. (negative) | didn't","How did people get news before newspapers? | They talked to each other.","How did people travel long distances long ago? | by train or ship","Would you like to live 100 years ago? Why or why not?"],"battle":["T | How did people communicate long ago? | Long ago, people used letters to communicate.","B | People listened to the news on the radio.","F | People traveled by horse and didn't traveled by airplane. | People traveled by horse and didn't travel by airplane.","F | They didn't watched the news on TV. | They didn't watch the news on TV.","W | news | Make a sentence with the word news.","W | e-mail | Make a sentence with the word e-mail.","P | 🐴📻✉️✈️ | Which things are from long ago? Which are from today?","C | Which is better, a letter or an e-mail? | A letter | An e-mail","Z | Name three ways to travel today.","S | Tell us two things you did yesterday."],"words":["travel | trav·el | trav/el | 🧳","communication | com·mu·ni·ca·tion | com/mu/ni/ca/tion | 💬","airplane | air·plane | air/plane | ✈️","news | news | n/ews | 📰","letter | let·ter | let/ter | ✉️","internet | in·ter·net | in/ter/net | 🌐","radio | ra·di·o | ra/di/o | 📻","boat | boat | b/oat | ⛵","bus | bus | b/us | 🚌","motorcycle | mo·tor·cy·cle | mo/tor/cy/cle | 🏍️","truck | truck | tr/uck | 🚚","horse | horse | h/orse | 🐴"],"reading":["> Then and Now","> Today, communication and travel are fast, and it's easy to get news. But a long time ago, things were very different.","> Communication: Long ago, people used letters to communicate. They mailed letters to friends and families. Letters were carried by horse and cart, and later by train or boat. Today, communication is different and letters are carried by airplane. We can use e-mail, text messages, or phone calls to communicate quickly with friends and family all over the world.","> My great-grandma mailed a letter to her friend in London. It took two months to get there. Today I send e-mails to my friend in London. She can read them right away.","> News: Before newspapers, people talked to each other to get news. Then people printed the news on paper and newspapers started. Later they listened to the radio for news. Today we can get news any time we want.","> Long ago, people listened to the news on the radio at 6 o'clock every day. Now they watch the news on TV and read it on the Internet anytime they want.","> Travel: People long ago walked from place to place or traveled by horse and cart. When they traveled long distances they went by train or ship. It was slow and difficult. Today we can travel in cars, fast trains, buses, or airplanes to go to places that are far away. We can travel to places across the ocean, or across the world, in a day. Travel is fast and easy now.","> Long ago, people traveled for two days from New York to Boston. It takes 30 minutes to travel from New York to Boston today.","RC | How were letters carried long ago? | by horse and cart | by airplane | by e-mail","RC | Which came first, newspapers or the radio? | newspapers | the radio | the Internet","RC | How long did great-grandma's letter take to get to London? | two months | two days | 30 minutes","RT | How can people communicate quickly today? | We can use e-mail, text messages, or phone calls.","RT | What was it like traveling by train and ship long ago? | It was slow and difficult.","RT | What is traveling like today? | Travel is fast and easy now.","RS | How did people get news before newspapers?","RS | How is travel different now from long ago? Tell us one thing."],"grammar":["GT | Simple Past – Regular Verbs","R | verb + **-ed**  →  listen**ed**, travel**ed**, walk**ed**","R | **didn't** + verb  →  didn't watch, didn't travel","R | watch → watch**ed**,  play → play**ed**,  clean → clean**ed**,  talk → talk**ed**","R | time words: long ago, many years ago, last night","G | People listened to the news on the radio.","G | They didn't watch the news on TV.","G | People traveled by horse and cart.","G | They didn't travel by airplane.","G | Great Grandma traveled on a ship.","G | I cleaned my room last night.","G | I talked to my friend last night.","G | What did you do last night?"],"sw":["SP | A: What country do you come from? | B: I come from {Egypt}. | A: Would you repeat that, please? | B: Sure. Egypt. | Egypt / Mexico / Korea / Taiwan / Japan / Canada","SW | Long ago, people {traveled by horse and cart}. Now we {travel by airplane}. Long ago, people didn't {use the Internet}. | Write about something people did long ago but don't do now."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":6,"title":"Tell Me a Story, Grandpa","bq":"How are things different now from long ago?","learn":["What does \"crowded\" mean? | full of too many people","What does \"arrive\" mean? | to get to a place","What does \"poor\" mean? | having very little money","Spell the word \"visit\". | v-i-s-i-t","Spell the word \"sick\". | s-i-c-k","Complete: ___ they travel by ship? Yes, they did. | Did","Complete: Did they arrive in two days? No, they ___. | didn't","Where did Carlo's family live in 1910? | in Italy","How long did the trip to New York take? | ten days","Do you want to visit a different country? Which one?"],"battle":["T | How did Carlo's family travel to the United States? | They traveled by ship.","B | They arrived at Ellis Island after ten days.","F | Did they traveled by ship? | Did they travel by ship?","F | Where did he traveled? | Where did he travel?","W | check | Make a sentence with the word check.","W | enter | Make a sentence with the word enter.","P | 🚢👴🇮🇹🗽 | What is Grandpa's story about? Tell it.","C | Is it better to travel by ship or by airplane? | By ship | By airplane","Z | Name three things in a living room.","S | Ask your partner a question about what he or she did yesterday."],"words":["arrive | ar·rive | ar/rive | 🛬","ask | ask | a/sk | ❓","enter | en·ter | en/ter | 🚪","poor | poor | p/oor | 💸","crowded | crowd·ed | crowd/ed | 👥","clerk | clerk | cl/erk | 🧑‍💼","visit | vis·it | vis/it | 👋","sick | sick | s/ick | 🤒","couch | couch | c/ouch | 🛋️","chair | chair | ch/air | 🪑","lamp | lamp | l/amp | 💡","clock | clock | cl/ock | 🕰️","bathtub | bath·tub | bath/tub | 🛁","sink | sink | s/ink | 🚰"],"reading":["> Tell Me a Story, Grandpa","> \"Tell me a story, Grandpa!\"","> \"Okay,\" says Grandpa. \"I'll tell you a story about my grandfather, Carlo. In 1910, Carlo was ten years old. He and his family lived in Italy. They were very poor, so they came to the United States for a better life. This was the first time that Carlo traveled to a place far away.\"","> \"Really? I'm ten, too,\" says Henry. \"And Mom, Dad, and I visit a different country every summer!\"","> \"Yes, Henry. Things are different now,\" says Grandpa.","> \"How did they travel here?\" asks Henry.","> \"They traveled by ship,\" says Grandpa. \"It wasn't an easy trip because the ship was crowded and dirty. There wasn't much food, and many people got sick. Carlo was sick too. They arrived at Ellis Island in New York after ten days.\"","> \"Wow! That's slow!\" says Henry. \"Now it only takes about nine hours in an airplane.\"","> \"I know,\" says Grandpa. \"It's very different today.\"","> \"Where did they live?\" asks Henry.","> \"They lived with Carlo's uncle in New York,\" says Grandpa.","> \"What happened at Ellis Island?\" asks Henry.","> \"Doctors checked everyone, and Carlo was very scared,\" says Grandpa.","> \"Why was he scared, Grandpa? Doctors help people,\" says Henry.","> \"Yes. But people who weren't healthy couldn't enter New York,\" says Grandpa. \"The clerks asked them many questions.\"","> \"What questions, Grandpa?\" asks Henry.","> \"Where are you from? Are you healthy or are you sick?\" says Grandpa. \"Luckily, Carlo was feeling better so they let him in. And that's why we live here today and not in Italy.\"","> \"That was a cool story, Grandpa!\" says Henry. \"I have an idea. Let's take a trip to Italy.\"","> \"That's a good idea, Henry,\" says Grandpa. \"Let's go next summer.\"","> \"Awesome, Grandpa! But let's take an airplane, not a ship!\"","RC | How old was Carlo in 1910? | ten | nine | twenty","RC | How did Carlo's family travel to the United States? | by ship | by airplane | by train","RC | How long did the trip on the ship take? | ten days | nine hours | two days","RT | Why did Carlo's family come to the United States? | They were very poor, so they came for a better life.","RT | Who checked everyone at Ellis Island? | Doctors checked everyone at Ellis Island.","RT | Where does Henry want to go next summer? | He wants to take a trip to Italy.","RS | Why couldn't some people enter New York?","RS | Was it easy going to a new country long ago? Why or why not?"],"grammar":["GT | Simple Past – Questions","R | **Did** they travel by ship?  Yes, they **did**.","R | **Did** they arrive in two days?  No, they **didn't**.","R | **What did** they do?  They liv**ed** with Carlo's uncle.","R | **Did** + verb (no -ed in the question)  →  Did they travel?  /  They travel**ed**.","G | Did they travel by ship?","G | Yes, they traveled by ship.","G | Did they arrive in two days?","G | No, they didn't arrive in two days.","G | What did they do yesterday?","G | They lived with Carlo's uncle.","G | Where did he travel?","G | He traveled to New York."],"sw":["SP | A: Where did you travel? | B: I traveled to Washington. | A: How did you travel there? | B: I traveled by {train} from New York. | train / ship / boat / bus / horse / airplane","SW | A hundred years ago, people traveled to {New York} by {ship}. It took {ten days}. Today we go there by airplane in {nine hours}. | Write about traveling to a place 100 years ago and today."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":7,"title":"Subtraction","bq":"How do we use numbers?","learn":["What does \"subtraction\" mean? | taking one number away from another number","What does \"take away\" mean? | to subtract or remove something","What does \"double-digit number\" mean? | a number with two digits, like 35","Spell the word \"column\". | c-o-l-u-m-n","Spell the word \"row\". | r-o-w","Complete: Alma ___ five cookies. (buy) | bought","Complete: She ___ her sister twenty stickers. (give) | gave","How many cookies were left after Alma's friends ate three? | two cookies","Olivia had thirty-five grapes and gave twenty away. How many were left? | fifteen grapes","Do you like math? Why or why not?"],"battle":["T | What is ten minus four? | Ten minus four is six.","B | Alma bought five cookies and her friends ate three.","F | Alma buyed five cookies. | Alma bought five cookies.","F | Olivia gived her sister twenty grapes. | Olivia gave her sister twenty grapes.","W | minus sign | Make a sentence with the words minus sign.","W | test score | Make a sentence with the words test score.","PT | 🍪➖🍪🟰 | Write a subtraction word problem about cookies.","C | Is subtraction easier in a row or in a column? | In a row | In a column","Z | Count backward from twenty to ten.","S | Tell your partner about something you subtract every day."],"words":["subtraction | sub·trac·tion | sub/trac/tion | ➖","column | col·umn | col/umn | 📊","row | row | r/ow | ➡️","left | left | l/eft | 🍎","number | num·ber | num/ber | 🔢","clean | clean | cl/ean | 🧼","dirty | dirt·y | dirt/y | 🧹","tired | tired | t/ired | 😴","hungry | hun·gry | hun/gry | 🍽️","thirsty | thirst·y | thirst/y | 🥤","full | full | f/ull | 😋"],"reading":["> Subtraction","> What is subtraction? When we add things, we join them together. When we subtract things, we take them away from other things. Then we can see how many things are left.","> Subtracting in Groups: Here are five apples. We take away two apples. There are 3 apples left.","> When we count backward, we're subtracting 1 each time. Count backward from 50 to 1. Now count backward by fives, subtracting 5 each time: 50, 45, 40, 35, 30, 25, 20, 15, 10. Now count backward by tens. How much are you subtracting each time now?","> Subtraction Math Problems: All subtraction math problems have a minus sign. The minus sign tells us to subtract 4 from 9. The answer tells how many are left. We write 9 - 4 = 5. We say \"Nine minus four equals five.\"","> Subtraction Math Problems in Rows and Columns: We usually write subtraction math problems for single-digit numbers in a row, and we usually write subtraction problems for double-digit numbers in a column.","> Subtraction Word Problems: Let's use subtraction to solve these problems. Alma bought five cookies. Her friends ate three. How many cookies were left? Olivia had thirty-five grapes. She gave twenty grapes to her little sister. How many grapes were left?","> Now think of some things that people subtract every day. My teacher subtracts numbers from 100 for my test score!","RC | What sign do all subtraction math problems have? | a minus sign | a plus sign | an equals sign","RC | How do we usually write subtraction problems for double-digit numbers? | in a column | in a row | in a circle","RC | How many cookies did Alma's friends eat? | three | five | two","RT | When we count backward by fives, how many do we subtract each time? | We subtract 5 each time.","RT | How do we say 9 - 4 = 5? | We say nine minus four equals five.","RT | How many grapes did Olivia give to her little sister? | She gave twenty grapes to her little sister.","RS | What happens when we subtract things?","RS | When do people use subtraction every day? Tell us one thing."],"grammar":["GT | Simple Past – Irregular Verbs","R | buy → **bought**    give → **gave**    eat → **ate**    see → **saw**","R | Alma **bought** five cookies.  She **didn't buy** four.","R | Olivia **gave** her sister twenty stickers.  She **didn't give** her twenty-six.","R | **didn't** + verb  →  didn't buy, didn't give, didn't eat","G | Alma bought five cookies.","G | She didn't buy four cookies.","G | Olivia gave her sister twenty stickers.","G | She didn't give her twenty-six.","G | May ate three carrots.","G | She didn't eat six carrots.","G | Jay didn't buy four pencils.","G | How many cookies were left on Billy's plate?"],"sw":["SP | A: Would you like some {fruit}? | B: No, thank you. I'm full. | A: How about some water? | B: Yes, please. I'm thirsty. | fruit / pasta / salad / soup / juice / tea","SW | I had {ten} {cookies}. I ate {four}. Now I have {six} left. | Write an interesting subtraction problem of your own."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":8,"title":"Bandar, the Greedy Monkey","bq":"How do we use numbers?","learn":["What does \"greedy\" mean? | wanting more than you need","What does \"steal\" mean? | to take something that is not yours","What does \"bored\" mean? | not interested and having nothing fun to do","Spell the word \"baker\". | b-a-k-e-r","Spell the word \"hide\". | h-i-d-e","Complete: ___ Bandar go to a candy store? Yes, he did. | Did","Complete: Did he let go of the candy? No, he ___. | didn't","How many cookies were in the bakery at first? | thirty cookies","Why couldn't Bandar get his hands out of the jars? | He didn't let go of the candy.","Was the candy maker right to catch Bandar? Why?"],"battle":["T | What did Bandar steal first? | He stole a cookie from the bakery.","B | Bandar stole food all over the town.","F | Bandar goed to a bakery and eated a cookie. | Bandar went to a bakery and ate a cookie.","F | Did he dig up a carrot? Yes, he digged. | Did he dig up a carrot? Yes, he did.","W | jar | Make a sentence with the word jar.","W | dig up | Make a sentence with the words dig up.","P | 🐒🍪🥕🍬 | Tell the story of Bandar the greedy monkey.","C | Is Bandar bad or just hungry? | Bad | Just hungry","Z | Thirty cookies minus fifteen cookies. How many are left?","S | Tell your partner three things you did last night."],"words":["steal | steal | st/eal | 🦝","hide | hide | h/ide | 🙈","jar | jar | j/ar | 🫙","greedy | greed·y | greed/y | 🐵","bored | bored | b/ored | 🥱","baker | bak·er | bak/er | 👨‍🍳","cook | cook | c/ook | 🍳","hand | hand | h/and | ✋","nose | nose | n/ose | 👃","face | face | f/ace | 🙂","arm | arm | a/rm | 💪","foot | foot | f/oot | 🦶","knee | knee | kn/ee | 🦵"],"reading":["> Bandar, the Greedy Monkey","> A monkey called Bandar lived in the woods near a small town. One day, Bandar was bored and decided to go into the town.","> Bandar went to a bakery and saw thirty beautiful cookies. He stole a cookie and ate it. It was good! He ate more and more cookies!","> The baker saw Bandar and chased him. \"You greedy little monkey!\" he cried. \"Now there are only fifteen cookies!\"","> Bandar ran up a tree and hid in the leaves. When he looked down, he saw sixty small carrots in a garden. When the gardener wasn't looking, Bandar ran down the tree, dug up a carrot, and ate it. It was good! He ate more and more carrots!","> The gardener saw Bandar and chased him. \"You greedy little monkey! Now there are only forty-four carrots!\"","> Bandar went to a restaurant and saw forty-two sausages. He stole a sausage and ate it. It was good! He ate more and more sausages!","> The cook saw Bandar and chased him. \"You greedy little monkey! Now there are only thirty sausages!\"","> Bandar stole food all over the town. Everyone was angry. They tried to catch Bandar, but he was too fast. Then the candy maker had an idea.","> The next day, Bandar went to the candy store. He saw two big jars of candy in every color, and it all looked good! Bandar put his hands in the jars and grabbed twenty pieces of candy. But he couldn't get the candy out of the jars.","> The candy maker ran in. \"You greedy little monkey! Let go of the candy and you can run away!\"","> Did Bandar let go of the candy? No, he didn't, and the candy maker caught him. He took him back to the woods and told him never to come to town again.","RC | Why did Bandar go into the town? | he was bored | he was lost | he was cold","RC | How many cookies were left at the bakery? | fifteen | thirty | sixty","RC | Who had an idea to catch Bandar? | the candy maker | the baker | the cook","RT | Where did Bandar hide after the baker chased him? | He hid in the leaves of a tree.","RT | What did Bandar grab in the candy store? | He grabbed twenty pieces of candy.","RT | Did Bandar let go of the candy? | No, he didn't let go of the candy.","RS | Why couldn't the people catch Bandar at first?","RS | What is the lesson of the story? Give one idea."],"grammar":["GT | Simple Past Irregular – Questions","R | **Did** Bandar **go** to a candy store?  Yes, he **did**.","R | **Did** he **let go** of the candy?  No, he **didn't**.","R | **What did** Bandar **do** with the cookies?  He **ate** them.","R | make → **made**    buy → **bought**    take → **took**    sell → **sold**","G | Did Bandar go to a candy store?","G | Did he let go of the candy?","G | No, he didn't let go.","G | What did Bandar do with the cookies?","G | He ate them all.","G | How many balloons did he sell?","G | He sold fifty-five balloons.","G | The baker made thirty cookies."],"sw":["SP | A: Twenty {cows} sat in some trees. | B: Five fell down and hurt their knees. | A: How many were left in the trees? | B: Fifteen were left in the trees. | cows / eagles / monkeys / frogs / rabbits / bears","SW | Last night I {ate dinner with my family}. Then I {did my homework}. After that, I {read a book}. | Write three things you did last night."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":9,"title":"Following Rules","bq":"How do people get along with each other?","learn":["What does \"polite\" mean? | kind and showing good manners","What does \"litter\" mean? | trash left on the ground","What does \"crossing guard\" mean? | a person who helps children cross the street safely","Spell the word \"principal\". | p-r-i-n-c-i-p-a-l","Spell the word \"librarian\". | l-i-b-r-a-r-i-a-n","Complete: Those are your things. Those things are ___. | yours","Complete: Whose book is this? It's ___. (she) | hers","Who makes the school rules? | teachers and the principal","What can't you do in the school library? | eat, drink, or be noisy","What is one important rule in your classroom? Why?"],"battle":["T | What do rules help us do? | Rules help keep us safe, happy, and healthy.","B | We should always be polite when we play games.","F | Whose book is this? It's her. | Whose book is this? It's hers.","F | They aren't my toys. They aren't mines. | They aren't my toys. They aren't mine.","W | take turns | Make a sentence with the words take turns.","W | clean up | Make a sentence with the words clean up.","P | 🚦🏊📚🦁 | Say one rule for each place you see.","C | Are rules at school too strict? | Yes, too strict | No, they help us","Z | Name three places that have rules.","S | Tell your partner about one rule at home and one at school."],"words":["polite | po·lite | po/lite | 🙏","librarian | li·brar·i·an | li/brar/i/an | 📚","litter | lit·ter | lit/ter | 🗑️","principal | prin·ci·pal | prin/ci/pal | 🏫","lifeguard | life·guard | life/guard | 🏊","kitchen | kitch·en | kitch/en | 🍳","cafeteria | caf·e·te·ri·a | caf/e/te/ri/a | 🍽️","classroom | class·room | class/room | 📝","crosswalk | cross·walk | cross/walk | 🚸","rules | rules | r/ules | 📋","safe | safe | s/afe | 🛡️"],"reading":["> Following Rules","> We follow rules every day. There are rules for things we do at home, at school, and in a lot of other places.","> Think about rules at home. Parents usually make these rules, and they make sure we follow them. Parents can ask us to wash our hands and clean up. They make other rules about eating unhealthy food, watching TV, or bedtime. What rules do you follow at home?","> There are rules at school, too. Teachers and the principal make the school rules. We should always be polite and take turns when we play games. Librarians help us follow the rules in the school library. We can't eat, drink, or be noisy there. Outside school, the crossing guard helps us cross the road safely, and we should pay attention to the traffic light. These rules help keep us happy and safe. Can you think of more rules at school?","> Zoos and other fun places have rules, too. At the zoo, you can't touch or feed the animals. You should never throw things at the animals.","> Swimming pools are fun places, too. These rules help make it safe for everyone there. You shouldn't run near the water and you can't eat, drink, or litter near the pool. You must always listen to the lifeguards because lifeguards make sure we follow the rules and that we are safe in and near the water.","> Rules tell us what we should and shouldn't do, and they help keep us safe, happy, and healthy. What rules do you think are important?","RC | Who usually makes the rules at home? | parents | librarians | lifeguards","RC | Who helps us cross the road safely? | the crossing guard | the principal | the cook","RC | What can't you do at the zoo? | feed the animals | look at the animals | take pictures","RT | Who makes the school rules? | Teachers and the principal make the school rules.","RT | What can't we do in the school library? | We can't eat, drink, or be noisy in the library.","RT | Why should we listen to the lifeguards? | Lifeguards make sure we are safe in and near the water.","RS | How do rules help us? Tell us one thing.","RS | What is one rule at the swimming pool?"],"grammar":["GT | Possessive Pronouns","R | your things  →  **yours**      my toys  →  **mine**","R | **Whose** book is this?  It's **hers**.","R | **Whose** pencils are these?  They're **his**.","R | mine · yours · his · hers · ours · theirs","G | Those things are yours.","G | They aren't my toys.","G | Whose book is this?","G | This book is hers.","G | Whose pencils are these?","G | These pencils are his.","G | That notebook is mine.","G | Those are your things."],"sw":["SP | A: It's my turn. | B: No, it isn't. It's {Felix's} turn. | A: Oh, you're right. I'm sorry. | B: That's all right. | Felix's / her / his / our / your / Layla's","SW | At my house, we {wash our hands before dinner}. We {clean up our toys}. We can't {watch TV after nine}. | Write three rules at your house."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":10,"title":"The Please and Thank You Book of Poems","bq":"How do people get along with each other?","learn":["What does \"thoughtful\" mean? | thinking about other people's feelings","What does \"rude\" mean? | not polite","What does \"grab\" mean? | to take something quickly and roughly","Spell the word \"knock\". | k-n-o-c-k","Spell the word \"share\". | s-h-a-r-e","Complete: ___ I come in? Yes, you may. | May","Complete: Can I play? No, you ___. | can't","Why does the ox always knock before opening a door? | Someone behind it might be sleeping.","What do bears always share? | their toys, honey, and jokes","What makes a good friend? Tell us one thing."],"battle":["T | What does Ricky Raccoon do when he comes over to play? | He helps put all of the toys away.","B | Bears share their toys with another bear.","F | May I to come in? | May I come in?","F | Can you passes the peach, please? | Can you pass the peach, please?","W | invite | Make a sentence with the word invite.","W | put away | Make a sentence with the words put away.","P | 🦝🐻🐂🦍 | Which animal is polite? Which animal is rude? Why?","C | Is it more important to share or to say please? | To share | To say please","Z | Say three polite words or phrases.","S | Ask your partner for something in a polite way."],"words":["knock | knock | kn/ock | 🚪","thoughtful | thought·ful | thought/ful | 💭","rude | rude | r/ude | 😠","grab | grab | gr/ab | ✊","pass | pass | p/ass | 🤲","invite | in·vite | in/vite | 💌","wash | wash | w/ash | 🧼","share | share | sh/are | 🤝","computer | com·put·er | com/put/er | 🖥️","laptop | lap·top | lap/top | 💻","camera | cam·er·a | cam/er/a | 📷","headphones | head·phones | head/phones | 🎧","tablet | tab·let | tab/let | 📱"],"reading":["> The Please and Thank You Book of Poems","> Welcome, Ricky Raccoon: When Ricky Raccoon comes over to play, he helps put all of the toys away. He asks his friend what he'd like to do, and is always careful with scissors and glue. He washes before he comes to the table, and helps his host whenever he's able. That's why almost every day, someone invites Ricky over to play.","> Don't Be Grabby, Gorilla: Gorillas are rude. They grab their food. They never say, \"Please pass the peach.\" They're so anxious, they just reach. They upset others by all they do. And sometimes... they upset the table, too.","> The Ox Always Knocks: The ox always knocks before opening a door. Because someone behind it might be sleeping, or wrapping a present, or sad or weeping. Then he always asks, \"May I come in?\" And everyone says, \"How thoughtful of him!\"","> Bears Always Share: Bears share their toys. Bears share their honey. Bears share a joke they think is funny. Whatever they do, whatever they wear, they always share it with another bear.","RC | What does Ricky do before he comes to the table? | washes | eats | plays","RC | What do the gorillas grab? | their food | their toys | their books","RC | What does the ox do before opening a door? | knocks | runs | shouts","RT | What does Ricky help put away? | He helps put all of the toys away.","RT | What do gorillas never say? | They never say, \"Please pass the peach.\"","RT | What is one thing that bears share? | Bears share their toys and their honey.","RS | Why does the ox always knock before opening a door?","RS | Which animal is rude? Why?"],"grammar":["GT | Can and May","R | **Can** I play?  Yes, you **can**.  /  No, you **can't**.","R | **May** I come in?  Yes, you **may**.  /  No, you **may not**.","R | **Can / May** + I + verb  →  asking politely","G | Can I play outside?","G | Yes, you can play outside.","G | May I come in?","G | No, you may not.","G | May I watch TV?","G | Can I have some juice?","G | Yes, you can have some.","G | Thank you for knocking."],"sw":["SP | A: Are you using that {computer}? | B: Yes, I am. But we can share. | A: Great. Thanks. | B: You're welcome. | computer / laptop / camera / tablet / cell phone","SW | {My grandma} is a thoughtful person. She always {shares her food}. She {helps me with my homework}. | Write about a thoughtful person you know."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":11,"title":"Natural Resources","bq":"Why should we take care of the Earth?","learn":["What does \"resources\" mean? | things from the Earth that we need to live","What does \"landfill\" mean? | a place where trash goes and stays forever","What does \"reduce\" mean? | to use less of something","Spell the word \"sunlight\". | s-u-n-l-i-g-h-t","Spell the word \"smoke\". | s-m-o-k-e","Complete: There's smoke in the air ___ the city. (higher than) | above","Complete: The trash can is ___ the tree. (at the back of) | behind","Name four natural resources from the text. | air, sunlight, water, and land","What makes the air dirty? | smoke from cars and factories","What can you do to help take care of the Earth?"],"battle":["T | Why do living things need clean air and water? | They need clean air to breathe and clean water to drink.","B | Trash is very bad for our natural resources.","F | The tree is in front the trash can. | The tree is in front of the trash can.","F | There's smoke in the air above of the city. | There's smoke in the air above the city.","W | reuse | Make a sentence with the word reuse.","W | wood | Make a sentence with the word wood.","P | 🌳☀️💧🗑️ | Which pictures show natural resources? Which one hurts them?","C | Which is more important to save, water or trees? | Water | Trees","Z | Name three things we make from wood.","S | Tell your partner two things you can reduce or reuse at home."],"words":["resources | re·sourc·es | re/sourc/es | 🌍","wood | wood | w/ood | 🪵","landfill | land·fill | land/fill | 🗑️","land | land | l/and | 🏞️","trash | trash | tr/ash | 🚮","smoke | smoke | sm/oke | 💨","sunlight | sun·light | sun/light | ☀️","reduce | re·duce | re/duce | ⬇️","reuse | re·use | re/use | ♻️","camp | camp | c/amp | ⛺","hike | hike | h/ike | 🥾","surf | surf | s/urf | 🏄","fish | fish | f/ish | 🎣","ski | ski | sk/i | ⛷️"],"reading":["> Natural Resources","> The Earth gives us special and important things that we need to help us live. We call these things natural resources. Air, sunlight, water, wood, and land are all natural resources.","> People Need Natural Resources: Living things need clean air to breathe and clean water to drink. Plants need sunlight and land to grow, and we need plants for food. When plants breathe, they clean the air around them. We use the wood from plants and trees to make a lot of things, like paper, some houses, and furniture.","> Hurting Our Natural Resources: We shouldn't hurt our natural resources because we can't usually make more of them. Smoke from cars and factories makes the air dirty. If the air is dirty, people can get sick and plants can't grow. If we cut down trees, we should plant new ones.","> Trash is very bad for our natural resources. Sometimes people throw trash into water, but we can't drink dirty water, and plants can't grow near it.","> Trash goes to places called landfills, and it stays there forever. Some landfills are dirty and they smell bad. People can't use that land, and farmers can't grow food on it.","> Taking Care of Our Natural Resources: We can all take care of Earth's resources. Here are some ideas. Use things until you can't use them anymore. Don't throw things away. Reuse them. Make toys from old things. Reduce the natural resources you use. Take your own bags to the store.","> What can you do today to help take care of our natural resources?","RC | What makes the air dirty? | smoke from cars | clean water | sunlight","RC | Where does trash go? | to landfills | to the store | into the sky","RC | What do we make from wood? | paper and furniture | clean air | sunlight","RT | Why should we take care of our natural resources? | We can't usually make more of them.","RT | What do plants need to grow? | Plants need sunlight and land to grow.","RT | What should we do if we cut down trees? | We should plant new trees.","RS | Why are landfills bad? Give one reason.","RS | What can you do today to help take care of our natural resources?"],"grammar":["GT | Prepositions of Place","R | There's smoke in the air **above** the city.","R | The landfill is **across from** the park.","R | The trash can is **behind** the tree.  ·  The tree is **in front of** the trash can.","R | above · across from · behind · in front of · between · next to","G | There's smoke in the air above the city.","G | The landfill is across from the park.","G | The trash can is behind the tree.","G | The tree is in front of the trash can.","G | There are birds above the pond.","G | There are trees behind the pond.","G | Where is the trash can?"],"sw":["SP | A: Please don't litter. Use the trash can. | B: Sorry. Where is it? | A: It's {in front of} that tree. | B: Oh, I see it. Thanks. | in front of / behind / near / next to / across from / above","SW | I see {sunlight} every day. I see {water} and {trees}, too. We need them to {live}. | Write about three natural resources you see every day."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":12,"title":"A Juice Carton's Diary","bq":"Why should we take care of the Earth?","learn":["What does \"carton\" mean? | a box made of hard paper for juice or milk","What does \"rescue\" mean? | to save someone or something from danger","What does \"recycling plant\" mean? | a place where old things are made into new things","Spell the word \"diary\". | d-i-a-r-y","Spell the word \"shelf\". | s-h-e-l-f","Complete: Where's the fountain? It's ___ the statue. (on the other side) | across from","Complete: Is there a trash can behind the tree? Yes, there ___. | is","What is the carton made of? | hard paper","What did the carton become at the end? | a notebook","Do you recycle at home? What do you recycle?"],"battle":["T | Where did the little girl leave the carton? | She left it in front of the lake.","B | The wind blew me into the water.","F | Where the fountain is? It's across from the statue. | Where's the fountain? It's across from the statue.","F | There is a trash can behind the tree? Yes, there is. | Is there a trash can behind the tree? Yes, there is.","W | machine | Make a sentence with the word machine.","W | paper | Make a sentence with the word paper.","P | 🧃🏞️🚤♻️ | Tell the story of the juice carton.","C | Is it worse to litter on land or in water? | On land | In water","Z | Name three things you can recycle.","S | Describe where three things are in this room. Use prepositions."],"words":["carton | car·ton | car/ton | 🧃","diary | di·a·ry | di/a/ry | 📔","paper | pa·per | pa/per | 📄","blow | blow | bl/ow | 🌬️","shelf | shelf | sh/elf | 🗄️","machine | ma·chine | ma/chine | ⚙️","rescue | res·cue | res/cue | 🛟","time | time | t/ime | ⏰","week | week | w/eek | 📅","recycle | re·cy·cle | re/cy/cle | ♻️","bottle | bot·tle | bot/tle | 🍾","notebook | note·book | note/book | 📓"],"reading":["> A Juice Carton's Diary","> January 15. Dear Diary, I'm sitting on a shelf in a big store! I can see many wonderful things. The little carton in front of me has a picture of an orange on it. I think I know what I am. I'm an orange juice carton! I'm made of hard paper.","> January 16. Dear Diary, This morning, something great happened. A little girl looked at my shelf for a long time, and then she chose me! She's taking me to a picnic by the lake, so I hope she's very thirsty.","> January 17. Dear Diary, I'm in a lake! The little girl drank the juice, but she left me in front of the lake. The wind blew me into the water. I don't like it here. There was a trash can behind the tree. Why didn't the little girl put me in it?","> January 18. Dear Diary, I saw a man taking litter out of the lake with a net. He saw my bright orange carton, and he rescued me! He caught me and a plastic bottle in his net. Now we're in the boat, and we aren't trash anymore! We're happy.","> January 19. Dear Diary, I'm at the recycling plant! It's a little scary here because there are large machines that make loud noises. Where's my plastic bottle friend? He's across from me. He's in a bin with other plastic bottles. I think this is a good place.","> January 20. Dear Diary, I'm sitting on a shelf in a stationery store! Everything here is made of paper! Yes, they recycled me into a notebook! I'm very happy and excited, and I really want to see the recycling plant again. Maybe next time I'll be a comic book!","RC | What is the juice carton made of? | hard paper | plastic | glass","RC | How did the carton get into the water? | the wind blew it | the girl threw it | a man dropped it","RC | What did the carton become at the end? | a notebook | a comic book | a plastic bottle","RT | Where was the carton on January 15? | It was on a shelf in a big store.","RT | Who rescued the carton from the lake? | A man with a net rescued the carton.","RT | Why was the recycling plant a little scary? | There were large machines that made loud noises.","RS | Where was the trash can at the lake? Why didn't the girl use it?","RS | Why is it important to recycle things?"],"grammar":["GT | Prepositions of Place – Questions","R | **Where's** the fountain?  It's **across from** the statue.","R | **Is there** a trash can **behind** the tree?  Yes, there is.","R | **Is there** a bicycle **in front of** the red bin?  No, there isn't.  There's a bicycle **next to** the green bin.","G | Where is the fountain?","G | It's across from the statue.","G | Is there a trash can behind the tree?","G | Where is my cat Charlie?","G | Is he under the trash can?","G | He is between the bench and the tree.","G | Is there a bicycle in front of the red bin?","G | There's a bicycle next to the green bin."],"sw":["SP | A: I {recycled my milk cartons} last week. Did you? | B: Yes, I did. I did that, too! | A: Great! Let's keep the Earth clean. | B: OK! Let's do it together. | recycled my milk cartons / reused my paper bags / cleaned the park / recycled my plastic bottles / reused my old boxes / picked up litter","SW | I was {a juice carton}. The wind blew me into {a lake}. Now I am {a notebook}! | Imagine you were recycled and write what you were and what you are now."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":13,"title":"How Music Makes Us Feel","bq":"How does music make us feel?","learn":["What does \"sleepy\" mean? | feeling like you want to sleep","What does \"excited\" mean? | very happy and full of energy","What does \"feelings\" mean? | things we feel inside, like happy or sad","Spell the word \"trumpet\". | t-r-u-m-p-e-t","Spell the word \"wolf\". | w-o-l-f","Complete: Pedro listens to slow music ___ night. | at","Complete: Amanda listens to fast music ___ the morning. | in","How can slow music make us feel? | sleepy","Why do mothers play flute music for babies at night? | It helps the babies sleep.","What is your favorite song? How does it make you feel?"],"battle":["T | When does Amanda listen to fast music? | She listens in the morning so she can wake up.","B | Some music is fast and some music is slow.","F | Pedro listens to slow music in night. | Pedro listens to slow music at night.","F | She listens to music on the morning. | She listens to music in the morning.","W | high | Make a sentence with the word high.","W | low | Make a sentence with the word low.","P | 🎵😴🎺🐺 | What kind of music do you imagine? How does it feel?","C | Which is better, fast music or slow music? | Fast music | Slow music","Z | Name three musical instruments.","S | Tell your partner what you do in the morning and in the evening."],"words":["high | high | h/igh | ⬆️","low | low | l/ow | ⬇️","excited | ex·cit·ed | ex/cit/ed | 🤩","sleepy | sleep·y | sleep/y | 😴","right | right | r/ight | ✅","wrong | wrong | wr/ong | ❌","wolf | wolf | w/olf | 🐺","trumpet | trum·pet | trum/pet | 🎺","feelings | feel·ings | feel/ings | 💗","proud | proud | pr/oud | 🏆","smile | smile | sm/ile | 😊","nervous | ner·vous | ner/vous | 😬","yawn | yawn | y/awn | 🥱","unhappy | un·hap·py | un/hap/py | 😢"],"reading":["> How Music Makes Us Feel","> People all around the world enjoy music. Some music is fast, and some music is slow. Some music is high, and some music is low. Listen to this piano music. What can you say about it? Is it fast or slow, high or low?","> Music and Feelings: When we listen to music, we feel different things. Slow music can make us feel sleepy, and fast music can make us feel excited. The same music can make one person feel sad and another person feel happy. There are no right or wrong feelings about music.","> Listen to this flute music. How does it make you feel? Mothers play this music for their babies at night because it helps the babies sleep. Now listen to this trumpet music. How does it make you feel?","> Pedro listens to slow music at night so he can fall asleep. Amanda listens to fast music in the morning so she can wake up.","> Music and Imagination: Music can help us imagine things, like animals. When the music is fast, we can imagine an animal running. When it's slow, we can imagine an animal sleeping. When it's low and slow, we can imagine an animal that is in danger. Listen. What animal does this sound like, a duck or a wolf? What do you imagine the animals are doing?","> Listen to this music. What did you hear, thunder or rain? Now listen again. What did you hear this time?","> Next time you listen to music, draw a picture of what you imagine. Look at it a week later. Does it help you to remember the music?","RC | How can slow music make us feel? | sleepy | excited | nervous","RC | Why do mothers play flute music for their babies at night? | it helps them sleep | it wakes them up | it makes them cry","RC | When does Amanda listen to fast music? | in the morning | at night | in the afternoon","RT | How can fast music make us feel? | Fast music can make us feel excited.","RT | Why does Pedro listen to slow music at night? | He listens to slow music so he can fall asleep.","RT | What can we imagine when the music is fast? | We can imagine an animal running.","RS | Are there right or wrong feelings about music? Why?","RS | How does music help us imagine things? Tell us one example."],"grammar":["GT | Prepositions of Time – in / on / at","R | **at** night      **in** the morning / afternoon / evening      **on** Monday","R | Pedro listens to slow music **at night**.","R | **When** does Amanda listen to slow music?  She listens **in the morning**.","G | Pedro listens to slow music at night.","G | When does Amanda listen to fast music?","G | She listens to fast music in the morning.","G | Does she go to her trumpet lesson in the evening?","G | Sandy has a dance lesson in the evening.","G | On Monday he goes to school with friends.","G | He doesn't listen to loud music at night.","G | What do you do in the morning on Saturdays?"],"sw":["SP | A: Please turn down {the music}! | B: Why? | A: I can't stand it. | B: Really? I love it! | the music / that song / the radio / that CD / the trumpet / the drums","SW | I listened to {a fast trumpet song}. It was {loud and fast}. It made me feel {excited}. | Write about a piece of music and how it made you feel."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":14,"title":"Olga's Flute","bq":"How does music make us feel?","learn":["What does \"notes\" mean? | the single sounds in a piece of music","What does \"worried\" mean? | feeling nervous that something bad will happen","What does \"solo\" mean? | music played by one person alone","Spell the word \"musician\". | m-u-s-i-c-i-a-n","Spell the word \"tears\". | t-e-a-r-s","Complete: ___ morning, Olga goes to school early. | This","Complete: When did Mark go to music class? He went ___ morning. | yesterday","Why does Olga have to play Alonso's part? | Alonso has the flu.","Whose flute music did Olga hear on the computer? | her own music","What should you do when you feel nervous? Tell us."],"battle":["T | What did Mr. Perez tell Olga at the end? | He told her to have fun and enjoy the music.","B | This morning Olga goes to school early.","F | He went to music class yesterday in the morning. | He went to music class yesterday morning.","F | Last week Gus plays the cymbals. | Last week Gus played the cymbals.","W | record | Make a sentence with the word record.","W | wait | Make a sentence with the word wait.","P | 🎶😰🦋🌧️ | How does Olga feel? What does the music sound like?","C | Is it better to practice alone or with friends? | Alone | With friends","Z | Name three things a musician does.","S | Tell your partner something you did yesterday and something you did today."],"words":["notes | notes | n/otes | 🎵","wait | wait | w/ait | ⏳","worried | wor·ried | wor/ried | 😟","flu | flu | fl/u | 🤒","tears | tears | t/ears | 😢","solo | so·lo | so/lo | 🎤","hummingbird | hum·ming·bird | hum/ming/bird | 🐦","record | re·cord | re/cord | 🎙️","musician | mu·si·cian | mu/si/cian | 🎻","concert | con·cert | con/cert | 🎶","autograph | au·to·graph | au/to/graph | ✍️","interview | in·ter·view | in/ter/view | 📺","fans | fans | f/ans | 👏","mistake | mis·take | mis/take | ❌"],"reading":["> Olga's Flute","> When Olga plays her flute she feels many things. High and slow notes make her feel happy and the low long notes can make her feel sleepy. When Olga plays a fast tune, she feels like she is flying.","> Olga's school is having a big concert tonight. Olga plays second flute, so if the first flute player gets sick, Olga can play his or her part. Today, Olga goes to school early for extra practice. Her music teacher is waiting for her.","> \"Alonso has the flu,\" Mr. Perez tells Olga. \"You must play his part tonight.\" Olga is very worried. \"Alonso is the best flute player in the school,\" she says. \"I'm not good enough.\"","> Mr. Perez smiles. \"You practice every day, Olga,\" he tells her. \"Alonso plays well, but so do you. Please try, Olga.\"","> She closes her eyes and begins to play, but this morning she feels nervous. The high notes are hard to reach and the fast notes are difficult to play. The quiet part seems too loud. When Olga finishes, her eyes fill with tears. \"I wish I could play like Alonso,\" she says.","> Mr. Perez pushes a button on his computer and Olga hears music. She thinks it is Alonso's flute solo. She imagines butterflies on the high notes. The fast notes sound like hummingbirds or rain. The low, quiet notes are like snow falling. \"That's beautiful. I wish I played like that!\" Olga says.","> Mr. Perez smiles. \"Olga, I recorded you just now. That's you playing!\" Olga is amazed. \"Do I really sound like that?\" she asks. Mr. Perez laughs. \"You should listen when you play.\" \"I do listen, but I'm often too nervous!\" Olga says.","> \"Don't worry tonight,\" Mr. Perez tells her. \"You work hard and you play well, but never forget to have fun and enjoy the music. You're a great musician!\"","RC | What notes make Olga feel happy? | high and slow notes | low long notes | fast notes","RC | Why must Olga play Alonso's part tonight? | Alonso has the flu | Alonso is late | Alonso moved away","RC | Whose music does Olga hear on the computer? | her own music | Alonso's music | Mr. Perez's music","RT | How does Olga feel when she plays a fast tune? | She feels like she is flying.","RT | Why does Mr. Perez think Olga plays well? | She practices every day.","RT | What does Mr. Perez say Olga should never forget? | She should never forget to have fun and enjoy the music.","RS | Why do Olga's eyes fill with tears this morning?","RS | Is Mr. Perez smart and kind? Why?"],"grammar":["GT | Adverbs of Time","R | **This morning**, Olga goes to school early.   (now → goes)","R | **When did** Mark go to music class?  He went **yesterday morning**.   (past → went)","R | last week · yesterday morning · yesterday afternoon · last night · this morning","G | This morning, Olga goes to school early.","G | Yesterday he played the trumpet.","G | Last week Gus played the cymbals.","G | When did Mark go to music class?","G | He went yesterday morning.","G | Did he practice the piano last week?","G | Last night he played the piano.","G | This morning he played the tambourine."],"sw":["SP | A: What did you do yesterday? | B: I gave a concert. I was {proud}. | A: What did you do then? | B: Then I signed autographs. I was excited. | proud / excited / nervous / happy / tired / worried","SW | My favorite music is {rock music}. It sounds {loud and fast}. When I listen to it, I feel {excited}. | Write about your favorite music and what it sounds like."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":15,"title":"Forces and Movement","bq":"What makes things move?","learn":["What does \"push\" mean? | to move something away from you","What does \"pull\" mean? | to move something toward you","What does \"speed\" mean? | how fast things move","Spell the word \"heavy\". | h-e-a-v-y","Spell the word \"ground\". | g-r-o-u-n-d","Complete: A ball is ___ than a desk. (light) | lighter","Complete: Is a desk heavier than a ball? Yes, it ___. | is","What does a big force cause? | a big movement","Why can we move a toy car with a small force? | because it's light","What is the fastest thing you know? Tell us."],"battle":["T | What happens when you push a door with a big force? | It opens quickly.","B | A horse is faster than a tortoise.","F | A ball is more light than a desk. | A ball is lighter than a desk.","F | A train is slow than an airplane. | A train is slower than an airplane.","W | throw | Make a sentence with the word throw.","W | movement | Make a sentence with the word movement.","P | 🚂🐢⚽🛒 | Which things are fast? Which are slow? Compare them.","C | Is it more fun to push or to pull things? | To push | To pull","Z | Name three things you can push.","S | Compare two things in this room. Use \"-er than\"."],"words":["push | push | p/ush | 👐","pull | pull | p/ull | 🪢","movement | move·ment | move/ment | 🏃","ground | ground | gr/ound | 🌍","throw | throw | thr/ow | 🏀","speed | speed | sp/eed | 🚄","heavy | heav·y | heav/y | 🏋️","light | light | l/ight | 🪶","easy | eas·y | eas/y | 👍","stapler | sta·pler | sta/pler | 📎","suitcase | suit·case | suit/case | 🧳","broom | broom | br/oom | 🧹","drawer | draw·er | draw/er | 🗄️","door | door | d/oor | 🚪"],"reading":["> Forces and Movement","> We see things move every day. We see people walking, birds flying, and leaves falling to the ground on a windy day. Things move in many ways. They move up and down, right and left, and over and under things. Look around your classroom. What things are moving?","> Force: A force makes something move. A push is a force, and it moves something away from you. We push people on swings. A pull is a force, too, and it moves something toward you. We pull things in wagons. Can you name something you push and something you pull?","> Movement: A small force causes a small movement and a big force causes a big movement. When we use a small force to throw a ball, it doesn't go far. When we use a big force to throw the same ball, it goes a long way.","> It is easier to move a light thing than a heavy thing. We can move a toy car with a small force because it's light. We need a big force to move a real car because it's heavy.","> Speed: Speed is how fast things move. Some things, like a train, move fast and some things, like a tortoise, move slowly. Can you name some things that move fast?","> A force can change the speed of things. When you push a door with a small force, it opens slowly, but when you push a door with a big force, it opens quickly.","> The next time you see something moving, ask yourself, \"What force is moving it, a push or a pull? Is the force small or big?\"","RC | What does a force do? | makes something move | makes something stop | makes something heavy","RC | Which force moves something toward you? | a pull | a push | a throw","RC | What is speed? | how fast things move | how heavy things are | how big things are","RT | What happens when we throw a ball with a small force? | The ball doesn't go far.","RT | Why can we move a toy car with a small force? | We can move it with a small force because it is light.","RT | What happens when you push a door with a big force? | The door opens quickly.","RS | Tell us something you push and something you pull.","RS | Why do we need a big force to move a real car?"],"grammar":["GT | Comparative Adjectives – -er than","R | adjective + **-er than**  →  A ball is light**er than** a desk.","R | ends in y → **-ier than**  →  Is a desk heav**ier than** a ball?  Yes, it is.","R | **What's** slow**er than** an airplane?  A train is slow**er than** an airplane.","G | A ball is lighter than a desk.","G | Is a desk heavier than a ball?","G | A train is slower than an airplane.","G | What's bigger than a car?","G | A bus is bigger than a car.","G | A horse is faster than a tortoise.","G | Is a book bigger than a chair?"],"sw":["SP | A: Phew! I can't move this. It's too heavy. | B: Let me help you. | A: Thanks. That would be {great}! | B: You're welcome. | great / cool / awesome / nice / kind / wonderful","SW | I push {a door} every day. I pull {a wagon}. The {wagon} is heavy, so I need a big force. | Write about something you push and something you pull."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":16,"title":"Two Stubborn Little Goats","bq":"What makes things move?","learn":["What does \"stubborn\" mean? | never changing your mind or saying sorry","What does \"horns\" mean? | the hard, pointed parts on a goat's head","What does \"forward\" mean? | toward the front","Spell the word \"mountain\". | m-o-u-n-t-a-i-n","Spell the word \"angry\". | a-n-g-r-y","Complete: I'm the ___ person in my family. (young) | youngest","Complete: Is the ___ grass on East Mountain? Yes, it is. (juicy) | juiciest","Why didn't the goats move forward or backward? | They pushed with the same force.","Where did the goats fall at the end? | into the river below the bridge","Are you sometimes stubborn? When?"],"battle":["T | Why did Black Goat move to West Mountain? | He was angry after the fight.","B | Brown Goat always crossed the bridge early.","F | I'm the most old brother in the family. | I'm the oldest brother in the family.","F | My father is the bigger person in my family. | My father is the biggest person in my family.","W | west | Make a sentence with the word west.","W | wet | Make a sentence with the word wet.","P | 🐐🐐🌉💦 | Tell the story of the two stubborn goats.","C | Which goat was more stubborn? | Brown Goat | Black Goat","Z | Say the superlative of big, fast, and juicy.","S | Talk about your family. Who is the youngest? Who is the tallest?"],"words":["stubborn | stub·born | stub/born | 😤","angry | an·gry | an/gry | 😠","goat | goat | g/oat | 🐐","mountain | moun·tain | moun/tain | ⛰️","west | west | w/est | 🧭","east | east | e/ast | 🌅","forward | for·ward | for/ward | ➡️","horns | horns | h/orns | 🐏","wet | wet | w/et | 💧","basketball | bas·ket·ball | bas/ket/ball | 🏀","soccer | soc·cer | soc/cer | ⚽","tennis | ten·nis | ten/nis | 🎾","baseball | base·ball | base/ball | ⚾","hockey | hock·ey | hock/ey | 🏒"],"reading":["> Two Stubborn Little Goats","> A long time ago, a family of goats lived on East Mountain. Two of the brothers, Black Goat and Brown Goat, always fought about who was the best in the family. They were very stubborn: they never said \"sorry\" or \"I'm wrong.\"","> One day, they were on a small patch of the greenest grass on East Mountain. It was only enough for one goat. Brown Goat said, \"I'm the oldest brother in the family, so I should eat the grass.\" Black Goat said, \"I'm the smartest brother in the family, so I should eat the grass.\"","> They pushed each other with their horns. They pushed with the same force, so they didn't move forward or backward. They pushed for a long time and then they both got tired and fell down. Black Goat was angry so he moved to West Mountain.","> There was a very narrow bridge between East Mountain and West Mountain. Every day Brown Goat crossed it to drink from the coldest water in the pond on West Mountain. Every day Black Goat crossed it to eat the juiciest grass on East Mountain. Brown Goat always crossed early, and Black Goat always crossed late.","> One day, Brown Goat got up late so both goats were on the bridge at the same time. Brown Goat said, \"Go back! I'm the oldest so I should cross first.\" Black Goat said, \"You go back! I'm the smartest so I should cross first.\"","> They pushed each other with their horns. They pushed with the same force so they didn't move forward or backward. They pushed for a long time and then they both got tired and fell into the river below the bridge.","> The goats swam to the riverbank. Then they slowly walked home to their mountains. They were angry, tired, wet, cold, and hungry. And that's what happens to stubborn little goats.","RC | Where did the family of goats live? | on East Mountain | on West Mountain | on a bridge","RC | What did the goats push each other with? | their horns | their legs | their heads","RC | Why didn't the goats move forward or backward? | the same force | a small force | a big force","RT | Why did Black Goat move to West Mountain? | He moved to West Mountain because he was angry.","RT | Why did Brown Goat cross the bridge every day? | He crossed it to drink the coldest water in the pond.","RT | How did the goats feel at the end of the story? | They were angry, tired, wet, cold, and hungry.","RS | Why didn't Black Goat and Brown Goat get along?","RS | Why did the goats fall into the river?"],"grammar":["GT | Superlative Adjectives – the -est","R | **the** + adjective + **-est**  →  I'm **the** young**est** person in my family.","R | ends in y → **the -iest**  →  Is **the** juic**iest** grass on East Mountain?  Yes, it is.","R | old → **the** old**est**    big → **the** bigg**est**    loud → **the** loud**est**","G | I'm the youngest person in my family.","G | Is the juiciest grass on East Mountain?","G | Brown Goat drinks the coldest water.","G | Is the man the oldest person?","G | My father is the biggest person in my family.","G | Black Goat is the smartest brother.","G | Brown Goat is the oldest brother in the family.","G | Each goat tried to shout the loudest."],"sw":["SP | A: I run, jump, and throw the ball. | B: You're playing {basketball}. | A: Yes! Do you like it? | B: Yes, I do. It's my favorite sport. | basketball / soccer / tennis / baseball / hockey / golf","SW | I like to play {soccer}. I {kick the ball} with a big force. The ball moves {fast}. | Write about the speed and movement in a sport you like."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":17,"title":"Shapes in Art","bq":"How do we make art?","learn":["What does \"crescent\" mean? | a shape like a thin moon with two curved sides","What does \"spiral\" mean? | a shape that goes around and around in circles","What does \"collage\" mean? | a picture made from lots of pieces of paper or things","Spell the word \"straight\". | s-t-r-a-i-g-h-t","Spell the word \"sculpture\". | s-c-u-l-p-t-u-r-e","Complete: There ___ a lot of shapes. | are","Complete: There ___ any red paint. | isn't","How many straight sides does a square have? | four","How are circles and ovals the same? | They don't have straight lines or corners.","What is your favorite shape? Why?"],"battle":["T | How are squares and rectangles different? | A square has four sides the same length, but a rectangle has two longer sides.","B | All triangles have three straight lines.","F | There is a lot of shapes in the picture. | There are a lot of shapes in the picture.","F | There aren't any paper on the table. | There isn't any paper on the table.","W | pattern | Make a sentence with the word pattern.","W | oval | Make a sentence with the word oval.","P | ⭐🌙🔺🔵 | Name the shapes. Where can you see them in nature?","C | Which is better, a painting or a sculpture? | A painting | A sculpture","Z | Name three shapes with straight lines.","S | Describe the shapes you can see in this room."],"words":["crescent | cres·cent | cres/cent | 🌙","star | star | st/ar | ⭐","spiral | spi·ral | spi/ral | 🌀","oval | o·val | o/val | 🥚","straight | straight | str/aight | 📏","nature | na·ture | na/ture | 🌳","collage | col·lage | col/lage | 🖼️","sculpture | sculp·ture | sculp/ture | 🗿","pattern | pat·tern | pat/tern | 🔷","photograph | pho·to·graph | pho/to/graph | 📷","origami | or·i·ga·mi | or/i/ga/mi | 🦢","drawing | draw·ing | d

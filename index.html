<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yvonne English Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: projector = battle stage (team territories) + teacher console; tablet = one-column habitat card */
:root{
  color-scheme: light;
  --ink:#1e2433; --muted:#667085; --paper:#fffdf8; --line:#e6dfcf; --white:#ffffff;
  --scene-bg:#cfeebd; --scene-deep:#2b7a3d; --scene-soft:#eef8e4;
  --ok:#2f9e44; --bad:#d9480f; --gold:#f2a900; --hp:#40c057; --hp-low:#fa5252; --armor:#868e96;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  --sky1:#7fd0f2; --sky2:#dff6c8; --mound:#7cc576; --mound2:#4f9e4c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--scene-bg);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--scene-deep);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
[hidden]{display:none!important}
.hab .he,.hab .av,.hab .spark,.hab .zz,.home .he,.home .av,.char-pick .e,.shop .it .e,.st-head .big,.s-amb span,.pfx,.overlay .who .av,.prow .av,.conn .e{font-family:var(--emoji)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--white);font-size:.85rem}
.btn{background:var(--white);padding:8px 14px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--scene-deep);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff0e6;color:var(--bad)}
.btn.gold{background:var(--gold);color:#3a2a00}
.btn.war{background:#c92a2a;color:#fff}
.bar{height:8px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--hp);border-radius:99px;transition:width .5s ease}
.bar i.low{background:var(--hp-low)}

/* ---------- HOST ---------- */
.host{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--scene-deep);color:#fff}
.brand{font-family:var(--display);font-size:1.55rem;font-weight:800;letter-spacing:.3px}
.topbar .sp{flex:1}
.topbar .chip{background:rgba(255,255,255,.18);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;background:#aaa;display:inline-block}
.dot.on{background:#69db7c}.dot.wait{background:#ffd43b}.dot.off{background:#ff8787}
.topbar .btn{background:rgba(255,255,255,.95);color:var(--ink);font-size:.92rem;padding:7px 12px}
.topbar .btn.war{background:#ffe3e3;color:#c92a2a}
.main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
.stage-wrap{padding:12px;min-width:0;min-height:0;display:flex}
.stage{position:relative;flex:1;min-width:0;container-type:size;border-radius:22px;background:linear-gradient(var(--sky1),var(--sky2));border:6px solid var(--scene-deep);box-shadow:0 10px 30px rgba(0,0,0,.2);overflow:hidden;display:flex;flex-direction:column;gap:1.6cqmin;padding:2.2cqmin 2.4cqmin}
.stage>*:not(canvas){position:relative;z-index:1}
.stage>.overlay{position:absolute;z-index:10}
.stage>.banner{position:absolute;z-index:25}
/* 3D stage: a WebGL layer under the 2D chrome; .is3d hides the 2D dioramas and effects */
.stage>#stage3d{position:absolute;inset:0;z-index:0;background:#dff3ff}.stage>#stage3d[hidden]{display:none}#stage3d canvas{display:block;width:100%!important;height:100%!important}
.stage.is3d>.terr-grid,.stage.is3d>.foot,.stage.is3d>.amb-canvas,.stage.is3d>.fx-canvas,.stage.is3d>.boss{visibility:hidden}
.stage.is3d>.st-head,.stage.is3d>.toprow,.stage.is3d>.qbar{z-index:3}
.stage.is3d>.toprow .infocard{display:none}.stage.is3d>.toprow{pointer-events:none}.stage.is3d>.toprow .qr-box{pointer-events:auto}
.stage>#p3d-ui{position:absolute;inset:0;z-index:4;pointer-events:none}.stage>#p3d-ui[hidden]{display:none}
.p3d-bar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;transition:opacity .3s}body.cine .p3d-bar,body.cine .stage>.st-head{opacity:0}
.p3d-bar .btn{font-size:.95rem;padding:7px 12px}
.stage .spottag{position:absolute;left:50%;bottom:66px;transform:translateX(-50%);display:none;font-family:var(--display);font-size:clamp(1.1rem,3cqmin,2rem);font-weight:900;color:#fff;background:var(--tc,#1c7ed6);padding:8px 24px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.18),inset 0 -4px 0 rgba(0,0,0,.15);white-space:nowrap}body.spot .stage .spottag{display:block}
.p3d-pop{position:absolute;left:12px;bottom:64px;background:#fffdf8;border-radius:16px;padding:10px 12px;pointer-events:auto;max-width:calc(100% - 24px);box-shadow:0 8px 24px rgba(0,0,0,.2)}.p3d-pop[hidden]{display:none}
.p3d-pop .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0}.p3d-pop .row b{font-size:.85rem;width:52px}.p3d-pop .chip{font-weight:900;color:var(--tc);width:52px}
.p3d-pop button{font:inherit;font-size:.85rem;font-weight:800;border:2px solid var(--tc,#888);background:#fff;color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}.p3d-pop button.sel{background:var(--tc);color:#fff}.p3d-pop button.taken{opacity:.35}
.prow .btn.mic{padding:4px 8px}
.amb-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.fx-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30!important}
.st-head{display:flex;align-items:center;gap:1.6cqmin}
.plate{display:flex;align-items:center;gap:1.4cqmin;background:rgba(255,255,255,.88);border-radius:2.2cqmin;padding:.6cqmin 2.2cqmin .6cqmin 1.2cqmin;box-shadow:0 .5cqmin 0 rgba(0,0,0,.12);backdrop-filter:blur(6px)}
.st-head .big{font-size:7cqmin;line-height:1;animation:bob2 3.4s ease-in-out infinite}
.st-head h1{font-size:4.8cqmin;color:var(--scene-deep)}
.st-head p{margin:0;font-size:1.8cqmin;color:var(--muted)}
.st-head .sp{flex:1}
.phase{font-family:var(--display);font-size:3cqmin;background:#fff;border-radius:2cqmin;padding:.8cqmin 2cqmin;display:flex;gap:1.4cqmin;align-items:center;box-shadow:0 .4cqmin 0 rgba(0,0,0,.08)}
.phase.battle{background:#c92a2a;color:#fff}
.phase .tm{font-variant-numeric:tabular-nums;background:rgba(0,0,0,.2);border-radius:1.2cqmin;padding:0 1.2cqmin}
.phase .tm.warn{background:#ffd43b;color:#5c3d00;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.toprow{display:flex;gap:1.6cqmin;min-height:0}
.qr-box{background:#fff;border-radius:1.6cqmin;padding:1.4cqmin;display:flex;flex-direction:column;align-items:center;gap:.6cqmin;flex:0 0 auto}
.qr-box .qr{width:19cqmin;height:19cqmin}
.qr-box .qr img,.qr-box .qr canvas{width:100%!important;height:100%!important}
.qr-box .code{font-family:var(--display);font-size:3.6cqmin;letter-spacing:.5cqmin;line-height:1}
.qr-box small{font-size:1.3cqmin;color:var(--muted);max-width:22cqmin;text-align:center;word-break:break-all}
.infocard{flex:1;min-width:0;background:rgba(255,255,255,.86);backdrop-filter:blur(6px);border-radius:1.6cqmin;padding:1.4cqmin 2cqmin;display:grid;gap:.8cqmin;align-content:start;font-size:2cqmin}
.infocard h3{font-size:2.8cqmin;color:var(--scene-deep)}
.infocard .rules{display:flex;flex-wrap:wrap;gap:.8cqmin}
.infocard .rules span{background:var(--scene-soft);border-radius:1cqmin;padding:.5cqmin 1.2cqmin}
.logline{display:grid;gap:.3cqmin;color:#374151;font-size:1.8cqmin}
.logline div:last-child{color:var(--ink);font-weight:900}
.qbar{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:1.8cqmin;padding:1.4cqmin 2cqmin;display:grid;gap:.8cqmin;box-shadow:0 .5cqmin 0 rgba(0,0,0,.08)}
.qbar .qt{display:flex;gap:1cqmin;align-items:center;flex-wrap:wrap;font-size:1.9cqmin}
.qbar .qt .kind{background:var(--scene-deep);color:#fff;border-radius:99px;padding:.3cqmin 1.4cqmin;font-weight:900;letter-spacing:.2cqmin}
.qbar .qt .kind.type{background:#3b5bdb}
.qbar .qt .cnt{margin-left:auto;color:var(--muted)}
.qbar .qp{font-family:var(--display);font-size:3.8cqmin;line-height:1.1}
.qbar .model{font-size:2.1cqmin;color:var(--ok)}
.qbar.idle .qp{color:var(--muted);font-size:3cqmin}
.terr-grid{flex:1;min-height:0;display:grid;gap:1.6cqmin;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto;align-content:end;padding-bottom:2cqmin}
.terr{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.12));border:.4cqmin solid rgba(255,255,255,.75);border-radius:2cqmin;padding:0 1.4cqmin 1.2cqmin;display:flex;flex-direction:column;gap:1cqmin;min-height:0;overflow:hidden;box-shadow:0 1cqmin 2.4cqmin rgba(0,0,0,.14)}
.terr-h{display:flex;align-items:center;gap:1.2cqmin;font-size:2.4cqmin;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 85%,#fff),var(--tc));color:#fff;margin:0 -1.4cqmin;padding:.8cqmin 1.6cqmin;box-shadow:0 .4cqmin 0 rgba(0,0,0,.12)}
.terr-h .tn{font-family:var(--display);font-size:3cqmin;color:#fff;text-shadow:0 .3cqmin 0 rgba(0,0,0,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.terr-h .bar{flex:1;height:1.6cqmin;min-width:6cqmin;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 .25cqmin rgba(255,255,255,.6)}
.terr-h .pts{font-family:var(--display);font-size:3cqmin;white-space:nowrap}
.terr-h .hpt{font-size:1.8cqmin;color:rgba(255,255,255,.95);white-space:nowrap;font-variant-numeric:tabular-nums}
.habs{display:flex;flex-wrap:wrap;gap:1cqmin;align-content:flex-start;min-height:0}
.hab{width:var(--hw,12cqmin);position:relative;border-radius:1.4cqmin;padding:calc(var(--hw,12cqmin)*.1) .5cqmin .8cqmin;display:grid;justify-items:center;gap:.2cqmin;transition:filter .3s,opacity .3s}
.hab::before{content:'';position:absolute;left:4%;right:4%;top:calc(var(--hw,12cqmin)*.5);height:calc(var(--hw,12cqmin)*.24);border-radius:50%;background:radial-gradient(ellipse at 50% 35%,var(--mound) 0 55%,var(--mound2) 70%,transparent 72%);z-index:0}
.hab::after{content:'';position:absolute;left:18%;right:18%;top:calc(var(--hw,12cqmin)*.62);height:calc(var(--hw,12cqmin)*.08);border-radius:50%;background:rgba(0,0,0,.18);filter:blur(2px);z-index:0}
.hab>*{position:relative;z-index:1}
.hab .flag{position:absolute;top:calc(var(--hw,12cqmin)*.02);right:14%;width:calc(var(--hw,12cqmin)*.025);height:calc(var(--hw,12cqmin)*.34);background:#6b4f3a;border-radius:2px;z-index:2}
.hab .flag::after{content:'';position:absolute;left:100%;top:0;border-left:calc(var(--hw,12cqmin)*.17) solid var(--tc);border-top:calc(var(--hw,12cqmin)*.065) solid transparent;border-bottom:calc(var(--hw,12cqmin)*.065) solid transparent;transform-origin:left center;animation:wave 1.3s ease-in-out infinite}
@keyframes wave{50%{transform:scaleX(.72) skewY(10deg)}}
.hab .lvl{font-size:calc(var(--hw,12cqmin)*.1);color:#f59f00;letter-spacing:.1em;line-height:1;text-shadow:0 1px 0 #fff}
.hab .spark{position:absolute;top:calc(var(--hw,12cqmin)*.06);left:22%;font-size:calc(var(--hw,12cqmin)*.13);animation:twinkle 1.8s ease-in-out infinite;z-index:2}
@keyframes twinkle{50%{transform:scale(1.4) rotate(20deg);opacity:.5}}
.hab .he{font-size:calc(var(--hw,12cqmin)*.46);line-height:1.05;animation:bob2 3.2s ease-in-out infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 .4cqmin .3cqmin rgba(0,0,0,.25))}
.hab .av{position:absolute;top:calc(var(--hw,12cqmin)*.34);left:2%;font-size:calc(var(--hw,12cqmin)*.24);line-height:1;filter:drop-shadow(0 .3cqmin .2cqmin rgba(0,0,0,.3));animation:hopidle 2.2s ease-in-out infinite;animation-delay:var(--d,0s);z-index:3}
@keyframes hopidle{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-22%) rotate(-6deg)}80%{transform:translateY(0)}}
.hab .hn{font-size:calc(var(--hw,12cqmin)*.12);font-weight:900;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--tc);color:#fff;border-radius:99px;padding:0 .8cqmin;margin-top:calc(var(--hw,12cqmin)*.04);box-shadow:0 .25cqmin 0 rgba(0,0,0,.15)}
.hab .bar{width:88%;height:calc(var(--hw,12cqmin)*.075);background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 .2cqmin rgba(255,255,255,.7)}
.bar i{background:linear-gradient(180deg,#69db7c,#2f9e44)}
.bar i.low{background:linear-gradient(180deg,#ff8787,#e03131)}
.wi{height:1.05em;width:auto;vertical-align:-.15em;display:inline-block}
.hab .wall{position:absolute;left:5%;right:5%;top:calc(var(--hw,12cqmin)*.5);--rh:calc(var(--hw,12cqmin)*.075);height:calc(var(--rh)*var(--r,1));background:var(--wall-img) repeat;background-size:calc(var(--rh)*8) calc(var(--rh)*2);border-radius:.5cqmin;box-shadow:0 .25cqmin .3cqmin rgba(0,0,0,.35);z-index:2;pointer-events:none;transition:height .3s}
.dio .wall{position:absolute;left:8%;right:8%;bottom:19%;--rh:min(3.6cqi,18px);height:calc(var(--rh)*var(--r,1));background:var(--wall-img) repeat;background-size:calc(var(--rh)*8) calc(var(--rh)*2);border-radius:6px;box-shadow:0 4px 5px rgba(0,0,0,.35);z-index:2;pointer-events:none;transition:height .3s}
.hab .ar{position:absolute;top:calc(var(--hw,12cqmin)*.02);left:2%;box-shadow:0 .2cqmin 0 rgba(0,0,0,.12);z-index:2;font-size:calc(var(--hw,12cqmin)*.12);background:#fff;border-radius:99px;padding:0 .6cqmin}
.hab .st{position:absolute;bottom:calc(var(--hw,12cqmin)*.3);right:.3cqmin;font-size:calc(var(--hw,12cqmin)*.16)}
.hab.down{opacity:.75}
.hab.down .he{filter:grayscale(1) brightness(.8)}
.hab .zz{position:absolute;top:8%;left:50%;font-size:calc(var(--hw,12cqmin)*.24);animation:zz 2s ease-in-out infinite;z-index:3}
@keyframes zz{0%{transform:translate(-50%,10%) scale(.8);opacity:.4}50%{transform:translate(-30%,-20%) scale(1.1);opacity:1}100%{transform:translate(-50%,10%) scale(.8);opacity:.4}}
.hab.ready{box-shadow:0 0 0 .5cqmin var(--gold);animation:readyglow 1.2s ease-in-out infinite}
@keyframes readyglow{50%{box-shadow:0 0 0 1cqmin color-mix(in srgb,var(--gold) 45%,transparent)}}
.terr .empty-t{color:var(--muted);font-size:1.8cqmin}
.foot{background:rgba(255,255,255,.88);backdrop-filter:blur(6px);border-radius:1.4cqmin;padding:1cqmin 1.6cqmin;font-size:1.9cqmin;display:grid;gap:.4cqmin}
.foot b{color:var(--scene-deep)}
.foot .sent{display:flex;gap:1cqmin;align-items:baseline}
.foot .sent .who{color:var(--muted);white-space:nowrap}
.overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--scene-soft) 88%,transparent);backdrop-filter:blur(8px);padding:4cqmin;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2cqmin;text-align:center;z-index:10!important}
.overlay:not([hidden]){animation:popin .38s cubic-bezier(.2,1.4,.4,1)}
.overlay .kind{font-family:var(--display);font-size:2.6cqmin;text-transform:uppercase;letter-spacing:.4cqmin;color:var(--scene-deep)}
.overlay .q{font-family:var(--display);font-size:5.4cqmin;line-height:1.1;max-width:80cqmin}
.overlay .ans{font-size:3cqmin;color:var(--ok);min-height:3.6cqmin}
.overlay .acts{display:flex;flex-wrap:wrap;gap:1.4cqmin;justify-content:center}
.overlay .acts .btn{font-size:2.4cqmin;padding:1.2cqmin 2.4cqmin;border-radius:1.4cqmin}
.overlay .hint{font-size:2cqmin;color:var(--muted)}
.podium{display:grid;gap:1.2cqmin;width:min(80cqmin,100%)}
.podium .pr{display:flex;align-items:center;gap:1.6cqmin;background:#fff;border-radius:1.6cqmin;padding:1.2cqmin 2cqmin;border-left:1.4cqmin solid var(--tc);font-size:3cqmin}
.podium .pr .m{font-size:4.6cqmin}
.podium .pr b{margin-left:auto;font-family:var(--display);font-size:4cqmin}
.podium .pr.first{transform:scale(1.04);box-shadow:0 1cqmin 2cqmin rgba(0,0,0,.12)}
.mvp{font-size:3cqmin;background:#fff3bf;border-radius:1.6cqmin;padding:1cqmin 2.4cqmin}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;z-index:25!important;pointer-events:none;animation:banner 1.9s cubic-bezier(.2,1,.3,1) forwards}
.banner .t{display:inline-block;font-family:var(--display);font-size:10cqmin;line-height:1;color:#fff;background:var(--bc,#c92a2a);padding:1.4cqmin 5cqmin;border-radius:3cqmin;box-shadow:0 1.4cqmin 0 rgba(0,0,0,.18);transform:rotate(-2deg)}
.banner .s{font-family:var(--display);font-size:3.4cqmin;margin-top:1.6cqmin;color:var(--ink)}
@keyframes banner{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.12)}25%{transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes popin{from{opacity:0;transform:scale(.86)}}
@keyframes bob2{50%{transform:translateY(-6%) rotate(-3deg)}}

.console{background:var(--paper);overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px 16px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.console h2{font-size:1.25rem;display:flex;align-items:center;gap:8px}
.console h2 .sp{flex:1}
.console h2 .btn{font-family:var(--body);font-size:.8rem;padding:5px 10px}
.panel{background:#fff;border-radius:14px;padding:12px;display:grid;gap:10px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel .big{font-size:1.05rem;padding:11px 14px;flex:1}
.panel input{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:8px 10px;flex:1;min-width:0}
.panel small{color:var(--muted)}
.subs{display:grid;gap:8px}
.sub{border:2px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:6px}
.sub.ok{border-color:var(--ok);background:#ebfbee}
.sub.no{border-color:#ffc9c9;background:#fff5f5}
.sub .who{font-weight:900;display:flex;gap:6px;align-items:center}
.sub .txt{font-size:1.02rem;font-weight:700;color:#212529;word-break:break-word}
.sub .chk{display:flex;gap:6px;flex-wrap:wrap;font-size:.78rem}
.sub .chk span{border-radius:99px;padding:2px 8px;background:#ebfbee;color:#2b8a3e}
.sub .chk span.x{background:#fff0f0;color:#c92a2a}
.sub .row{display:flex;gap:6px}
.sub .row .btn{padding:6px 12px;font-size:.88rem}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{background:#fff;border-radius:12px;padding:8px 10px;border-top:6px solid var(--tc);display:grid;gap:6px}
.tcard .tn{font-weight:900}
.tcard .ts{font-size:.88rem;color:var(--muted)}
.tcard .ts b{color:var(--ink);font-size:1.1rem}

<script>
/* 課堂導航・橋 v1 —— 不要改這段 */
(function () {
  var CR = window.CR = { inRunner: false, origin: null, init: null, screen: null, handlers: {} };
  CR.screen = new URLSearchParams(location.search).get('screen'); // 'board' | 'tablet' | null
  function target() { return (CR.origin && CR.origin !== 'null') ? CR.origin : '*'; }
  function post(msg) { if (window.parent !== window) window.parent.postMessage(msg, target()); }
  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m.type !== 'string' || m.type.indexOf('cr:') !== 0) return;
    if (m.type === 'cr:init') { CR.inRunner = true; CR.origin = e.origin; CR.init = m; }
    var h = CR.handlers[m.type]; if (h) h(m);
  });
  /* 收課堂導航的訊息:CR.on('cr:init', fn)、CR.on('cr:end', fn) */
  CR.on = function (type, fn) { CR.handlers[type] = fn; };
  /* 白板載好、可以讓平板連進來了;join = 平板要用的連線資訊(字串,內容你決定) */
  CR.ready = function (join) { post({ type: 'cr:ready', join: join == null ? null : String(join) }); };
  /* 回報一件事:CR.event('answer', {...}) */
  CR.event = function (kind, data) { post(Object.assign({ type: 'cr:event', kind: kind, at: Date.now() }, data || {})); };
  /* 啟動:在課堂導航裡會收到 init 再呼叫 onRunner(init);單獨打開就呼叫 onStandalone() */
  CR.start = function (onRunner, onStandalone) {
    if (window.parent === window) { onStandalone(); return; }
    var done = false;
    CR.on('cr:init', function (m) { if (!done) { done = true; onRunner(m); } });
    post({ type: 'cr:hello', screen: CR.screen || 'board' });
    setTimeout(function () { if (!done) { done = true; onStandalone(); } }, 2000);
  };
})();
</script>

its home safe and dry? Tell us."],"grammar":["GT | Where Questions","R | **Where's** the eagle?  **It's** under the tree.","R | **Where are** the chicks?  **They're** in the nest.","R | Where **is** → Where**'s**","G | Where is the eagle?","G | It is under the tree.","G | Where are the chicks?","G | They are in the nest.","G | Where are the honeybees?","G | They are in the hive.","G | Where is the pencil?","G | It is on the desk."],"sw":["SP | A: Watch out! Be careful! | B: Why? What is it? | A: It's a {beehive}. | B: OK. Thanks! | beehive / nest / crab / pond / eagle / frog","SW | The {eagle} lives in a {nest}. Its home is {high in a tree}. | Write two sentences about an animal and its home."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":6,"title":"My Friend Anak","bq":"Where do animals live?","learn":["What does \"take care of\" mean? | to help and look after someone","What does \"miss\" mean? | to feel sad because someone is not here","What does \"take a nap\" mean? | to sleep for a short time","Spell the word \"morning\". | m-o-r-n-i-n-g","Spell the word \"rainforest\". | r-a-i-n-f-o-r-e-s-t","Ask about a thing. ___ that? It's a tree. | What's","Ask about a person. ___ this? It's Anak. | Who's","What is Anak? | an orangutan","Who takes care of Anak? | Dian","Is Dian happy or sad at the end of the story? Why?"],"battle":["T | What time of day do you sleep? | I sleep at night.","T | What do you do in the morning? | I eat breakfast in the morning.","B | Anak lives and sleeps in the rainforest.","B | I give her milk from a bottle.","F | Who's that? It's a tree. | What's that? It's a tree.","F | What that is? | What is that? / What's that?","W | evening | Make a sentence with the word \"evening\".","W | reserve | Make a sentence with the word \"reserve\".","P | 🦧🌴🍼👩 | Tell the story of Anak and Dian.","C | Is it better to sleep in the day or at night? | In the day | At night","Z | Name four times of the day.","S | Point at something and ask your partner: What's that?"],"words":["orangutan | o·rang·u·tan | o/rang/u/tan | 🦧","rainforest | rain·for·est | rain/for/est | 🌴","reserve | re·serve | re/serve | 🏞️","teach | teach | t/each | 👩‍🏫","miss | miss | m/iss | 😢","day | day | d/ay | ☀️","night | night | n/ight | 🌙","morning | morn·ing | morn/ing | 🌅","midday | mid·day | mid/day | 🕛","afternoon | af·ter·noon | af/ter/noon | 🌤️","evening | eve·ning | eve/ning | 🌆"],"reading":["> My Friend, Anak","> This is a story about an orangutan called Anak.","> My name is Dian. I take care of young orangutans at the Happy House Reserve in the rainforest. These young orangutans don't have families. They can't live alone.","> Anak is a baby. I take care of her every day. I give her milk from a bottle. I teach Anak about the rainforest. We have fun together. Anak isn't sad or lonely.","> Anak is now four years old. She eats fruit, leaves, and flowers. She can climb trees. She plays with other orangutans. But I am still Anak's special friend.","> Anak is eight years old now. She sleeps and eats at the reserve. She plays in the rainforest a lot. Sometimes she takes a nap there.","> Anak is twelve years old now. She lives and sleeps in the rainforest. I put out Anak's favorite foods, but she doesn't come. I miss Anak!","> Look! Who's this? It's Anak. She's fifteen. She has a baby! Anak and I are happy to see each other.","> I miss Anak, but I'm happy. Anak lives in the rainforest and teaches her baby how to live there, too.","RC | Who takes care of Anak? | Dian | Anak's mother | a teacher","RC | What does baby Anak drink? | milk from a bottle | water | juice","RC | How old is Anak when she has a baby? | fifteen | eight | four","RT | Where does Dian work? | Dian works at the Happy House Reserve.","RT | What does Anak eat when she is four? | She eats fruit, leaves, and flowers.","RT | Where does Anak live when she is twelve? | She lives in the rainforest.","RS | Why is Anak at the reserve at the beginning of the story?","RS | At the end of the story, is Dian happy or sad? Why?"],"grammar":["GT | What and Who Questions","R | **What's** that?  It's a tree.","R | **Who's** this?  It's Anak.","R | What **is** → What**'s**      Who **is** → Who**'s**","G | What is that?","G | It is a tree.","G | Who is this?","G | It is Anak.","G | What is this animal?","G | It is an orangutan.","G | Who is that girl?","G | It is my friend."],"sw":["SP | A: I have three clues. It's small. It lives in the woods. It's brown. | B: What is it? Is it a {mouse}? | A: Yes, it is! | B: My turn now. | mouse / squirrel / frog / crab / chick / eagle","SW | What is it? It is a {squirrel}. It lives in the {woods}. It is {brown}. | Write about an animal: what it is, where it lives, and what color it is."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":7,"title":"The Four Seasons","bq":"How are seasons different?","learn":["What does \"warm\" mean? | a little hot","What does \"cool\" mean? | a little cold","What does \"snowy\" mean? | with a lot of snow","Spell the word \"winter\". | w-i-n-t-e-r","Spell the word \"cloudy\". | c-l-o-u-d-y","Finish the sentence: It ___ hot in the summer. | gets","Finish the sentence: It ___ snow in the summer. | doesn't","What color do leaves turn in the fall? | red, yellow, and orange","Which season comes after fall? | winter","What is your favorite season? Why?"],"battle":["T | What is the weather like today? | It's sunny and warm today.","T | Tell us about winter. | It gets cold and it snows.","B | Summer days are long and hot.","B | Flowers and plants grow in spring.","F | It don't snow in the summer. | It doesn't snow in the summer.","F | It get cold in the winter. | It gets cold in the winter.","W | rainy | Make a sentence with the word \"rainy\".","W | windy | Make a sentence with the word \"windy\".","P | 🌸☀️🍂❄️ | Name the four seasons and say one thing about each.","C | Is summer better than winter? | Summer | Winter","Z | Name the four seasons.","S | Say three things about the weather where you live."],"words":["warm | warm | w/arm | 🌤️","hot | hot | h/ot | 🔥","rain | rain | r/ain | 🌧️","snow | snow | sn/ow | ❄️","cool | cool | c/ool | 🍃","cold | cold | c/old | 🥶","long | long | l/ong | 📏","short | short | sh/ort | ✂️","weather | weath·er | weath/er | 🌦️","cloudy | cloud·y | cloud/y | ☁️","sunny | sun·ny | sun/ny | ☀️","windy | wind·y | wind/y | 💨","snowy | snow·y | snow/y | 🌨️","rainy | rain·y | rain/y | ☔"],"reading":["> The Four Seasons","> There are four seasons in a year: spring, summer, fall, and winter. Each season is special.","> Spring: Spring is a growing season. It gets warm outside. It rains a lot. The rain helps plants grow. Buds grow on trees and plants. Birds make nests in trees.","> Summer: Summer comes after spring. It gets hot outside. The days are long and the nights are short. The sun helps the buds grow into fruit and flowers. Animals eat the fruit.","> Fall: Fall comes after summer. It gets cool outside. Leaves turn red, yellow, and orange. Then they fall to the ground. Animals collect food for the winter.","> Winter: Winter comes after fall. The days are short and the nights are long. It gets cold outside and it snows. The snow covers the ground. Lots of trees don't have leaves now. The animals eat the food they collect in the fall.","> Then it's spring, and the seasons begin again.","RC | How many seasons are in a year? | four | three | two","RC | What helps plants grow in spring? | the rain | the snow | the leaves","RC | What colors do leaves turn in fall? | red, yellow, and orange | blue and green | white and black","RT | Which season comes after spring? | Summer comes after spring.","RT | What do birds make in spring? | Birds make nests in trees.","RT | What covers the ground in winter? | The snow covers the ground.","RS | What do animals do in the fall?","RS | How are summer days and winter days different?"],"grammar":["GT | Simple Present – It","R | It **gets** hot.  ·  It **doesn't get** cold.","R | It **snows** in the winter.  ·  It **doesn't snow** in the summer.","R | Does **not** → Does**n't**","G | It gets hot in the summer.","G | It doesn't get cold.","G | It snows in the winter.","G | It doesn't snow in the summer.","G | It rains a lot in spring.","G | It gets cool in the fall.","G | Does it snow in the winter?","G | The days are long and sunny."],"sw":["SP | A: Do you want to play in the {snow} with me? | B: Sure! | A: Great! Let's go! | snow / rain / park / garden / leaves / sun","SW | It gets {hot} in the {summer}. It doesn't {snow}. | Write two sentences about your favorite season."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":8,"title":"Arnold's Apple Tree","bq":"How are seasons different?","learn":["What does \"build a snowman\" mean? | to make a man out of snow","What does \"fly a kite\" mean? | to make a kite go up in the wind","What does \"grow\" mean? | to get bigger","Spell the word \"swing\". | s-w-i-n-g","Spell the word \"kite\". | k-i-t-e","Finish the sentence: I ___ a swing. I don't make apple pies. | make","Ask: ___ you watch honeybees? Yes, I do. | Do","What does Arnold build in the summer? | a tree house","What color are the apples in the fall? | red","What do you do in your favorite season?"],"battle":["T | What do you do in the summer? | I go to the beach in the summer.","T | Do you ride a bicycle? | Yes, I do. I ride a bicycle.","B | I build a tree house in my apple tree.","B | Red apples fall to the ground.","F | I builds a snowman in the winter. | I build a snowman in the winter.","F | Do you watches birds? | Do you watch birds?","W | ice cream | Make a sentence with the words \"ice cream\".","W | plant flowers | Make a sentence with the words \"plant flowers\".","P | 🍎🌳🏡⛄ | What does Arnold do with his apple tree?","C | Is a tree house better than a swing? | A tree house | A swing","Z | Name three things you do in the winter.","S | Ask your partner: What do you do in the spring?"],"words":["watch | watch | w/atch | 👀","grow | grow | gr/ow | 🌱","fall | fall | f/all | 🍂","bring | bring | br/ing | 🎁","build | build | b/uild | 🔨","make | make | m/ake | 🛠️","snowman | snow·man | snow/man | ⛄","swing | swing | sw/ing | 🎠","apple | ap·ple | ap/ple | 🍎","pie | pie | p/ie | 🥧","bicycle | bi·cy·cle | bi/cy/cle | 🚲","beach | beach | b/each | 🏖️","kite | kite | k/ite | 🪁","flowers | flow·ers | flow/ers | 🌸"],"reading":["> The Seasons of Arnold's Apple Tree","> My name is Arnold. I have an apple tree. It keeps me busy all year.","> It's spring. I watch small buds grow on my apple tree. They grow into apple blossoms. I watch honeybees collect nectar from the blossoms. I make a swing for my apple tree.","> It's summer. I build a tree house in my apple tree. My apple tree shades me from the hot sun. I watch small apples begin to grow. I juggle some green apples for my tree friend.","> It's fall. My apple tree now has big, red, tasty apples. I bring some leaves up to my tree house. I make a soft floor to lie on. I shake the branches. Red apples fall to the ground. I put them in a basket and take them home. My family and I make apple pies.","> It's winter. In the winter, snow falls. It's quiet. The branches of my apple tree are bare. I hang strings of popcorn and berries on the branches. The birds eat them. I build a snowman.","> The snow melts. It's spring again...","RC | What grows on the apple tree in spring? | buds | red apples | popcorn","RC | What does Arnold build in the summer? | a tree house | a snowman | a swing","RC | Who eats the popcorn and berries? | the birds | Arnold's family | the honeybees","RT | What does Arnold make in the spring? | He makes a swing for his apple tree.","RT | What color are the apples in the fall? | The apples are big and red.","RT | What does Arnold build in the winter? | He builds a snowman.","RS | What does Arnold's family make in the fall?","RS | Does Arnold like his apple tree? Why?"],"grammar":["GT | Simple Present – I and You","R | I **make** a swing.  ·  I **don't make** apple pies.","R | You **build** a snowman.  ·  You **don't build** a tree house.","R | **Do** you **watch** honeybees?  Yes, I **do**.  /  No, I **don't**.","G | I make a swing for my tree.","G | I don't make apple pies.","G | Do you watch honeybees?","G | You build a snowman.","G | You don't build a tree house.","G | I watch small apples grow.","G | Do you like the winter?","G | In the fall, I make an apple pie."],"sw":["SP | A: What do you do in the spring? | B: I {ride a bicycle} in the spring. | A: What do you do in the summer? | B: I eat ice cream! | ride a bicycle / fly a kite / plant flowers / go to the beach / build a tree house / watch birds","SW | In the {spring}, I {fly a kite}. I don't {build a snowman}. | Write two sentences about what you do in your favorite season."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":9,"title":"Working with Numbers","bq":"How do numbers help us?","learn":["What does \"plus sign\" mean? | the sign + that tells us to add","What does \"equals sign\" mean? | the sign = that shows the same amount","What does \"even numbers\" mean? | numbers like 2, 4, 6, 8, and 10","Spell the word \"pencil\". | p-e-n-c-i-l","Spell the word \"backpack\". | b-a-c-k-p-a-c-k","Finish the sentence: I ___ four shells. | have","Finish the sentence: They ___ have a pet. | don't","Two plus three equals what? | five","Is seven an odd number or an even number? | odd","Where do people add things together?"],"battle":["T | What school things do you have? | I have a pen and a ruler.","T | How old are you? | I'm seven years old.","B | We have ten shells together.","B | Four plus six is ten.","F | I has two pencils. | I have two pencils.","F | We doesn't have a ruler. | We don't have a ruler.","W | eraser | Make a sentence with the word \"eraser\".","W | notebook | Make a sentence with the word \"notebook\".","PT | ✏️➕📚🟰 | Make an addition problem with school things. Type it.","C | Is counting by twos faster than counting by ones? | By twos | By ones","Z | Say three even numbers.","S | Count your school things. Tell us how many you have."],"words":["numbers | num·bers | num/bers | 🔢","plus | plus | pl/us | ➕","sign | sign | s/ign | 🪧","problem | prob·lem | prob/lem | ❓","answer | an·swer | an/swer | ✅","odd | odd | o/dd | 🔴","even | e·ven | e/ven | 🔵","addition | ad·di·tion | ad/di/tion | 🧮","pen | pen | p/en | 🖊️","pencil | pen·cil | pen/cil | ✏️","eraser | e·ras·er | e/ras/er | 🧽","ruler | rul·er | rul/er | 📏","backpack | back·pack | back/pack | 🎒","notebook | note·book | note/book | 📓"],"reading":["> Working with Numbers","> Numbers: Look at the number line. It shows the numbers 1 to 20 in order. Some numbers are even, and some numbers are odd. The even numbers are blue, and the odd numbers are red.","> Counting: Read the even numbers aloud. When there are a lot of things in a group, we can use the even numbers to count the things by twos. This helps us to count fast. Count the fish by twos.","> Addition: We use addition every day. It helps us count things. We join groups of things with addition. This is a plus sign: +. It tells us to add the numbers together. This is an equals sign: =. It tells us that the numbers on both sides are the same amount. After the equals sign comes the answer. We say, \"Two plus three equals five.\" We write 2 + 3 = 5.","> Addition problems: Let's use addition to work out answers to these word problems. You have eight orange seashells. I have nine green seashells. How many seashells do we have? They have six red crabs, five blue crabs, and four yellow crabs. How many crabs do they have? How do you use addition every day?","RC | What color are the even numbers? | blue | red | green","RC | What does the plus sign tell us? | add the numbers | count by twos | stop counting","RC | Which numbers help us count by twos? | even numbers | odd numbers | red numbers","RT | What does the number line show? | It shows the numbers 1 to 20 in order.","RT | How do we say 2 + 3 = 5? | Two plus three equals five.","RT | How many seashells do we have? | We have seventeen seashells.","RS | Why do we count things by twos?","RS | How do you use addition every day?"],"grammar":["GT | Simple Present – Have","R | You **have** a seashell.  ·  I **don't have** a seashell.","R | They **have** T-shirts.  ·  We **don't have** T-shirts.","G | You have a seashell.","G | I don't have a seashell.","G | They have seven T-shirts.","G | We don't have T-shirts.","G | I have four shells.","G | You have six shells.","G | Together we have ten shells.","G | I don't have a pet."],"sw":["SP | A: Olly, how old are you? | B: I'm {seven} years old. How about you, Ben? | A: I'm seven, too! | six / seven / eight / nine / ten / eleven","SW | I have {two} {pencils}. I don't have {a ruler}. | Write two sentences about the things you have and don't have."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":10,"title":"Stone Soup","bq":"How do numbers help us?","learn":["What does \"pot\" mean? | a big thing we cook soup in","What does \"sausages\" mean? | long pieces of meat we eat","What does \"tasty\" mean? | very good to eat","Spell the word \"carrots\". | c-a-r-r-o-t-s","Spell the word \"soup\". | s-o-u-p","Ask: ___ you have potatoes? No, I don't. | Do","Ask: ___ do you have? I have carrots. | What","What does Hans put in the pot first? | water and stones","Why do the people have tasty soup at the end? | They add their food together.","What is the lesson of the story?"],"battle":["T | What is in your favorite soup? | My favorite soup has carrots and onions.","T | Do you have a notebook? | Yes, I do. I have a notebook.","B | They put the potatoes into the pot.","B | Do you have any food?","F | Do you has onions? | Do you have onions?","F | What you have? | What do you have?","W | onions | Make a sentence with the word \"onions\".","W | mango | Make a sentence with the word \"mango\".","P | 🥣🗿🥔🥕 | Tell the story of the stone soup.","C | Is fruit salad better than vegetable soup? | Fruit salad | Vegetable soup","Z | Name three vegetables.","S | Ask your partner: Do you have a pencil?"],"words":["pot | pot | p/ot | 🍲","stone | stone | st/one | 🪨","food | food | f/ood | 🍽️","sausages | sau·sa·ges | sau/sa/ges | 🌭","carrots | car·rots | car/rots | 🥕","onions | on·ions | on/ions | 🧅","potatoes | po·ta·toes | po/ta/toes | 🥔","soup | soup | s/oup | 🍜","tomato | to·ma·to | to/ma/to | 🍅","cucumber | cu·cum·ber | cu/cum/ber | 🥒","avocado | av·o·ca·do | av/o/ca/do | 🥑","orange | or·ange | or/ange | 🍊","mango | man·go | man/go | 🥭","peach | peach | p/each | 🍑"],"reading":["> Stone Soup","> Hans and his wife, Ann, and their daughter, Olga, walk to a town. They see a woman. \"We're very hungry,\" says Hans. \"Do you have any food?\" \"No,\" says the woman. \"I'm hungry, too!\"","> They see a man. Olga says, \"We're hungry. Do you have any food?\" \"No,\" says the man. \"I'm hungry, too!\"","> The family has a big pot. Hans puts water in it. Ann and Olga look for stones. They each find four stones and put them into the pot.","> \"What's that?\" ask the woman and her friend. \"It's stone soup,\" says Hans. \"It's tasty. You can try some, but we don't have any potatoes. It's good with potatoes.\" \"I have five!\" says the woman. \"I have seven,\" says her friend. They put the potatoes into the pot.","> \"What's that?\" ask the man and his son. \"It's stone soup,\" says Olga. \"It's tasty. You can try some, but we don't have any sausages. It's good with sausages.\" \"I have two,\" says the man. \"I have three,\" says his son. They put the sausages into the pot.","> Later, the people from the town smell the soup and come out to look. \"We have onions. We have carrots,\" they say, and put them into the pot.","> Everyone eats some soup. \"We didn't have enough food,\" say the people. \"But we added our food together, and now we all have tasty soup!\"","RC | What does Hans put in the big pot first? | water | potatoes | sausages","RC | How many potatoes does the woman have? | five | seven | four","RC | What do the people from the town add? | onions and carrots | stones | milk","RT | How many stones do Ann and Olga each find? | They each find four stones.","RT | What does the man put into the pot? | The man puts two sausages into the pot.","RT | Who eats the soup at the end? | Everyone eats some soup.","RS | Are the people hungry at the end of the story? Why not?","RS | What is the lesson of the story?"],"grammar":["GT | Simple Present Questions – Have","R | **Do** you **have** food?  Yes, I **do**.","R | **What do** you **have**?  I **have** carrots.","R | **Do** you **have** potatoes?  No, I **don't**.","G | Do you have any food?","G | Yes, I do.","G | What do you have?","G | I have four big onions.","G | Do you have potatoes?","G | No, I don't.","G | What do you have in your backpack?","G | I have carrots and onions."],"sw":["SP | A: I have two {oranges}. | B: I have one. How many do we have? | A: Two plus one equals three. | B: We have three! Yum! | oranges / tomatoes / peaches / mangoes / carrots / potatoes","SW | I have {potatoes} and {onions}. Let's make {potato} soup! It is tasty. | Write about the food you have and the soup you want to make."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":11,"title":"The Farmer and the Hat","bq":"What do we need?","learn":["What does \"farmer\" mean? | a person who grows food and keeps animals","What does \"fancy\" mean? | not plain; very special and beautiful","What does \"sell\" mean? | to give something and get money for it","Spell the word \"market\". | m-a-r-k-e-t","Spell the word \"cow\". | c-o-w","Finish the sentence: He ___ a hat. He doesn't want a cow. | wants","Finish the sentence: She ___ need a dress. | doesn't","What does Farmer Flores sell at the market? | his cow","What does the cow give them every day? | milk","What is the lesson of the story?"],"battle":["T | What do you want? | I want a new bicycle.","T | What does your friend have? | She has a comic book.","B | Never sell something you need.","B | He buys a very fancy hat.","F | She want a doll. | She wants a doll.","F | He don't need a hat. | He doesn't need a hat.","W | comic book | Make a sentence with the words \"comic book\".","W | stickers | Make a sentence with the word \"stickers\".","P | 👨‍🌾🐄🎩👗 | What happens to the farmer? Tell the story.","C | Is a fancy hat better than a plain hat? | A fancy hat | A plain hat","Z | Name three toys.","S | Ask your partner: Can I borrow your pencil, please?"],"words":["farmer | farm·er | farm/er | 👨‍🌾","cow | cow | c/ow | 🐄","milk | milk | m/ilk | 🥛","market | mar·ket | mar/ket | 🏪","sell | sell | s/ell | 💰","buy | buy | b/uy | 🛒","plain | plain | pl/ain | 🧢","fancy | fan·cy | fan/cy | 🎩","games | games | g/ames | 🎮","doll | doll | d/oll | 🪆","stickers | stick·ers | stick/ers | ⭐","pins | pins | p/ins | 📌"],"reading":["> The Farmer and the Hat","> Tomas Flores is a farmer. He doesn't have a lot of money. He grows carrots, potatoes, and onions. He and his wife, Rosa, work hard every day.","> Farmer Flores has a cow. It gives lots of milk every day. Mrs. Flores sells the milk at the market in town.","> One day, Mrs. Flores comes home from town. She's very excited. \"There's a dance in town on Saturday. Can we go?\"","> \"I'm sorry, but no,\" says Farmer Flores. \"We're plain people. It's too fancy for us!\" His wife is very sad.","> The next day, Farmer Flores has an idea. He takes the cow to town and sells it at the market. He buys a very fancy hat for himself and a beautiful dress for his wife.","> He runs home. He puts on the fancy hat. He gives his wife the beautiful dress. \"We can go to the dance,\" he says.","> His wife is angry! \"Our cow gives us milk every day!\" she says. \"We sell the milk. We get money to buy food!\"","> \"But you want beautiful clothes for the dance,\" says Farmer Flores. \"Can we eat the fancy hat and the beautiful dress?\" Mrs. Flores asks. \"No, we can't,\" says the farmer. \"We need our cow!\"","> Farmer Flores takes the dress and the hat back to the market. He buys his cow back. Now he tells people, \"Never sell something you need to buy something you want.\"","RC | What does Farmer Flores grow? | carrots and potatoes | apples and mangoes | milk and eggs","RC | What gives the family milk every day? | the cow | the market | the farmer","RC | What does Farmer Flores buy for himself? | a fancy hat | a beautiful dress | a new cow","RT | Where does Mrs. Flores sell the milk? | She sells the milk at the market in town.","RT | What does Farmer Flores buy for his wife? | He buys a beautiful dress for his wife.","RT | What does the farmer do at the end of the story? | He takes the hat and the dress back and buys his cow back.","RS | Why is Mrs. Flores angry?","RS | What is the lesson of the story?"],"grammar":["GT | Simple Present – He and She","R | He **has** a cow.  ·  He **doesn't have** a hat.","R | He **wants** a hat.  ·  He **doesn't want** a cow.","R | She **needs** a cow.  ·  She **doesn't need** a dress.","G | He has a cow.","G | He doesn't have a hat.","G | He wants a fancy hat.","G | He doesn't want a cow.","G | She needs a cow.","G | She doesn't need a dress.","G | She wants a pretty kite.","G | He wants sausages and soup."],"sw":["SP | A: Can I borrow your {comic book}, please? | B: Sure, Sara. Here you are. | A: Thanks, Ben. | B: Bring it back tomorrow, please. | comic book / board game / doll / stickers / pins / game","SW | I have {a doll}. I don't have {a board game}. I want {a comic book}. | Write about the things you have and the things you want."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":12,"title":"Wants and Needs","bq":"What do we need?","learn":["What does \"need\" mean? | something you must have to live","What does \"want\" mean? | something you would like to have","What does \"job\" mean? | the work people do to get money","Spell the word \"doctor\". | d-o-c-t-o-r","Spell the word \"juice\". | j-u-i-c-e","Ask: ___ she have a doll? Yes, she does. | Does","Ask: What ___ she want? She wants stickers. | does","What three things do we need to live? | a home, food and water, and clothes","What does a police officer do? | helps us and keeps us safe","What do you need? Do you have these things?"],"battle":["T | What do you need for school? | I need a pencil and a notebook.","T | What does your mother do? | My mother is a teacher.","B | We need food and water to grow.","B | Teachers help us learn.","F | Does she wants a kitten? | Does she want a kitten?","F | What do he need? | What does he need?","W | sandwich | Make a sentence with the word \"sandwich\".","W | money | Make a sentence with the word \"money\".","P | 🍎💧🏠👕 | Are these wants or needs? Tell us why.","C | Is soda a want or a need? | A want | A need","Z | Name three jobs that help people.","S | Say one thing you want and one thing you need."],"words":["job | job | j/ob | 💼","doctor | doc·tor | doc/tor | 👩‍⚕️","teacher | teach·er | teach/er | 👩‍🏫","help | help | h/elp | 🤝","money | mon·ey | mon/ey | 💵","clothes | clothes | cl/othes | 👕","water | wa·ter | wa/ter | 💧","sandwich | sand·wich | sand/wich | 🥪","grapes | grapes | gr/apes | 🍇","juice | juice | j/uice | 🧃","cookie | cook·ie | cook/ie | 🍪","chips | chips | ch/ips | 🍟","soda | so·da | so/da | 🥤"],"reading":["> Wants and Needs","> What do we want? Wants are things we would like to have. People want different things. Maria wants a kitten. Akif wants a new bicycle.","> What do we need? Needs are things we must have to live. People need the same things. We need a home to live in. We need food and water to grow and keep healthy. We need clothes to keep us warm.","> Needs are also things that are important to us and help us. Ji-Min needs a pencil to do her homework. Sam needs new sneakers to walk to school.","> We need money to buy the things we want and need. People have jobs to get money. Some people make or grow things to sell. A farmer grows food. A truck driver takes the food to the store. We go to the store to buy the food we need.","> Who do we need? Some people have service jobs. These are jobs that help other people get what they need. We need to learn, and to be safe and healthy. Police officers have a service job. They help us and keep us safe. Doctors have service jobs. They help keep us healthy. Teachers have service jobs, too. They help us learn. What other people have jobs that help us?","RC | What does Maria want? | a kitten | a bicycle | a pencil","RC | What do we need to keep us warm? | clothes | money | a pencil","RC | Who helps keep us healthy? | doctors | teachers | farmers","RT | Why do people have jobs? | People have jobs to get money.","RT | What does a farmer do? | A farmer grows food.","RT | What do teachers help us do? | Teachers help us learn.","RS | What is a service job? Tell us one example.","RS | What do you need? Do you have these things?"],"grammar":["GT | Simple Present Questions – He and She","R | **Does** Maria **have** a kitten?  No, she **doesn't**.","R | **What does** Akif **want**?  He **wants** a bicycle.","G | Does Maria have a kitten?","G | No, she doesn't.","G | What does Akif want?","G | He wants a bicycle.","G | Does she have a doll?","G | Yes, she does.","G | What does she want today?","G | She wants stickers from the teacher."],"sw":["SP | A: We want {soda}. | B: Yes! And we want chips! | A: We need fruit. | B: And we need water. | soda / chips / cookies / grapes / juice / sandwiches","SW | I need {water} and {food}. I want {a cookie}. | Write about the things you need and the things you want."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":13,"title":"Where's Your Home?","bq":"Where do we live?","learn":["What does \"neighborhood\" mean? | a place where families live, work, and play","What does \"the country\" mean? | a place with woods, farms, and fields","What does \"address\" mean? | words and numbers that tell us where a home is","Spell the word \"city\". | c-i-t-y","Spell the word \"street\". | s-t-r-e-e-t","Finish the sentence: Jenna___ house is in the country. | 's (Jenna's)","Ask: Is Ali___ house in the city? | 's (Ali's)","Where do many people live in a city? | in apartments","Are houses in the country close together or far apart? | far apart","Where would you like to live? Why?"],"battle":["T | Where do you live? | I live in an apartment in the city.","T | What is your neighborhood like? | My neighborhood is quiet and safe.","B | Houses in the country are far apart.","B | Everyone's home has an address.","F | Jenna house is in the country. | Jenna's house is in the country.","F | Is this Ali the house? | Is this Ali's house?","W | quiet | Make a sentence with the word \"quiet\".","W | dangerous | Make a sentence with the word \"dangerous\".","P | 🏙️🏡🌾🚜 | Is this the city or the country? Tell us how you know.","C | Is the city better than the country? | The city | The country","Z | Say three words from small to big: apartment, building, city.","S | Tell your partner your address."],"words":["street | street | str/eet | 🛣️","neighborhood | neigh·bor·hood | neigh/bor/hood | 🏘️","town | town | t/own | 🏡","city | cit·y | cit/y | 🏙️","country | coun·try | coun/try | 🌾","apartment | a·part·ment | a/part/ment | 🏢","building | build·ing | build/ing | 🏬","world | world | w/orld | 🌍","noisy | nois·y | nois/y | 🔊","quiet | qui·et | qui/et | 🤫","safe | safe | s/afe | 🛡️","dangerous | dan·ger·ous | dan/ger/ous | ⚠️","boring | bor·ing | bor/ing | 😴","interesting | in·ter·est·ing | in/ter/est/ing | 🤩"],"reading":["> Where's Your Home?","> The world is very big, and people live in all kinds of places. We all live in homes. Some homes are apartments. Some homes are houses. Some homes are big, and some homes are small.","> Homes are in neighborhoods. A neighborhood is where families live, work, and play. Some neighborhoods are in towns and cities, and some are in the country.","> Towns: There are a lot of neighborhoods in towns. In towns there are parks, trees, and a lot of small streets. Many people live in houses. Some people live in apartments. This is Matias. Matias's house is in a town. \"I live in Loreto. Loreto is a small town.\"","> The Country: In the country there are woods, farms, and fields. Many people live on farms. People live in houses, too. There are no apartment buildings. Houses in the country are far apart. This is Jenna's house. \"I live on a farm in the country.\"","> Cities: Cities are like very big towns. There are a lot of people, streets, and big buildings in cities. The buildings are close together. Many people live in apartments. This is Nada. Nada's apartment is in the city. \"I live in Cairo. Cairo is a big city.\"","> What's your address? Everyone's home has an address. It tells us where it is. \"My address is 19 Main Street, Rivertown.\" An address has a house number, a street name, and a town name.","> When do we use an address? We write an address on a letter. We use an address to find our friend's house.","RC | What is a neighborhood? | where families live | a big building | a letter","RC | Where are the buildings close together? | in the city | in the country | on a farm","RC | What do we write on a letter? | an address | a town | a park","RT | Where does Jenna live? | Jenna lives on a farm in the country.","RT | What is Cairo? | Cairo is a big city.","RT | What does an address tell us? | An address tells us where a home is.","RS | What is in a town? Tell us one thing.","RS | When do we use an address?"],"grammar":["GT | Possessive 's","R | Mason**'s** address is 19 Main Street, Rivertown.","R | Is this Jenna**'s** house?  Yes, it is.","G | Matias's house is in a town.","G | Jenna's house is in the country.","G | Nada's apartment is in the city.","G | Is this Jenna's house?","G | Where does Billy live?","G | Billy's house is at 18 Circle Road.","G | Mason's address is 19 Main Street.","G | Is Ali's address 48 Canal Street?"],"sw":["SP | A: This is my {house}. Come in. | B: Wow, Emma! Your home is really nice. | A: Thanks, Sara. | B: Let's go and play! | house / apartment / home / room / bedroom / kitchen","SW | I live in {Zhubei}. My home is {an apartment}. {Lily}'s home is in {the country}. | Write where you live and where your friend lives."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":14,"title":"City Mouse and Country Mouse","bq":"Where do we live?","learn":["What does \"orchard\" mean? | a place with many fruit trees","What does \"cornfield\" mean? | a field where corn grows","What does \"department store\" mean? | a big store that sells many things","Spell the word \"library\". | l-i-b-r-a-r-y","Spell the word \"museum\". | m-u-s-e-u-m","Finish the sentence: ___ home is in the city. (he) | His","Ask: Is ___ apartment small? (you) | your","Where do the two mice sleep in the city? | in a new hotel","Why does Country Mouse run? | He hears a loud noise. It is cats.","What is the lesson of the story?"],"battle":["T | Is there a park in your neighborhood? | Yes, there is a park near my home.","T | Tell us about your friend's home. | Her home is in the city.","B | The city is too dangerous for me.","B | We play in her cornfield.","F | Him home is in the city. | His home is in the city.","F | Is you apartment big? | Is your apartment big?","W | bakery | Make a sentence with the word \"bakery\".","W | supermarket | Make a sentence with the word \"supermarket\".","P | 🐭🏙️🐭🌾 | Tell the story of the two mice.","C | Is the country safer than the city? | The country | The city","Z | Name three places in a city.","S | Ask your partner: Is your home in the city?"],"words":["restaurant | res·tau·rant | res/tau/rant | 🍽️","hotel | ho·tel | ho/tel | 🏨","cornfield | corn·field | corn/field | 🌽","orchard | or·chard | or/chard | 🍎","new | new | n/ew | ✨","old | old | o/ld | 🏚️","park | park | p/ark | 🌳","library | li·brar·y | li/brar/y | 📚","supermarket | su·per·mar·ket | su/per/mar/ket | 🛒","drugstore | drug·store | drug/store | 💊","bakery | bak·er·y | bak/er/y | 🥐","museum | mu·se·um | mu/se/um | 🏛️"],"reading":["> City Mouse and Country Mouse","> City Mouse lives in the city. \"There are too many people and cars here. I want some fresh air! I can visit my cousin, Country Mouse,\" he says.","> City Mouse flies to the country. Country Mouse runs to him. \"Hello, City Mouse! Welcome to my home!\" \"Thanks, Country Mouse!\" says City Mouse. \"I'm hungry. What's for dinner?\"","> They go to the cornfield and eat some corn. Then they go to the orchard and eat some apples. \"This food is okay, but it's too plain for me!\" says City Mouse.","> It's bedtime, and they're tired. They sleep in an old barn.","> The next morning, they walk to the pond. \"The country is okay, but it's too boring for me,\" says City Mouse. \"Come with me to the city! It's interesting there.\" \"OK,\" says Country Mouse.","> City Mouse and Country Mouse take a train to the city. They go to a movie theater, a department store, and a restaurant. They eat cheese and cookies. \"This food is okay, but it's too fancy for me,\" says Country Mouse.","> It's bedtime, and they're tired. They sleep in a new hotel.","> The next morning, they hear a loud noise. \"Cats! Run!\" says City Mouse. City Mouse and Country Mouse run and run until they are safe.","> \"The city is okay, but it's too dangerous for me!\" says Country Mouse. \"Come with me to the country. It's safe there.\" \"No, the country is good for you, and the city is good for me,\" says City Mouse.","> The two mice say goodbye and go home happy.","RC | What do the mice eat in the country? | corn and apples | cheese and cookies | bread and milk","RC | Where do they sleep in the city? | in a new hotel | in an old barn | in a cornfield","RC | Who says \"Welcome to my home!\"? | Country Mouse | City Mouse | a cat","RT | How do the mice go to the city? | They take a train to the city.","RT | Why do the mice run in the city? | They run because they hear cats.","RT | What does City Mouse think about the country? | He thinks the country is too boring.","RS | Why does Country Mouse go home?","RS | How are City Mouse and Country Mouse different? Tell us one thing."],"grammar":["GT | Possessive Adjectives","R | **His** home is in the city.  ·  **Her** neighborhood isn't quiet.","R | Is **your** apartment small?  No, it isn't.","R | my · your · his · her · our · their","G | His home is in the city.","G | Her neighborhood isn't quiet.","G | Is your apartment small?","G | We like her house.","G | Her house is old and big.","G | Is your home in the city?","G | Her apartment is big.","G | We play in her cornfield."],"sw":["SP | A: Is there a {park} in your neighborhood? | B: Yes, there is. | A: Is there a library in your neighborhood? | B: No, there isn't. | park / library / supermarket / drugstore / bakery / museum","SW | My home is in {the city}. My neighborhood is {noisy}. There is a {park} in my neighborhood. | Write about your home and the places in your neighborhood."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":15,"title":"Percussion Instruments","bq":"How can we make music?","learn":["What does \"strike\" mean? | to hit something","What does \"shake\" mean? | to move something quickly up and down","What does \"xylophone\" mean? | an instrument with wooden bars","Spell the word \"drum\". | d-r-u-m","Spell the word \"loud\". | l-o-u-d","Finish the sentence: I'm ___ the drum. (play) | playing","Finish the sentence: She ___ shaking the tambourine. (no) | isn't","How do we play the cymbals? | We strike two cymbals together.","What shape is a triangle instrument? | a triangle","Which percussion instrument is your favorite? Why?"],"battle":["T | What are you doing now? | I'm sitting in the classroom.","T | How does a drum sound? | A drum sounds loud.","B | We strike or shake percussion instruments.","B | The girl is striking the xylophone.","F | I playing the drum. | I'm playing the drum. / I am playing the drum.","F | She are shaking the tambourine. | She is shaking the tambourine. / She's shaking the tambourine.","W | cymbals | Make a sentence with the word \"cymbals\".","W | soft | Make a sentence with the word \"soft\".","P | 🥁🎵👏🦶 | How can we keep the beat? Show and tell.","C | Is loud music better than soft music? | Loud music | Soft music","Z | Name three percussion instruments.","S | Clap a beat and say: I'm clapping my hands."],"words":["instruments | in·stru·ments | in/stru/ments | 🎵","cymbals | cym·bals | cym/bals | 🎶","tambourine | tam·bou·rine | tam/bou/rine | 🪘","drum | drum | dr/um | 🥁","triangle | tri·an·gle | tri/an/gle | 🔺","shake | shake | sh/ake | 🫨","xylophone | xy·lo·phone | xy/lo/phone | 🎹","strike | strike | str/ike | 👊","fast | fast | f/ast | 🐇","slow | slow | sl/ow | 🐢","loud | loud | l/oud | 🔊","soft | soft | s/oft | 🔈","awful | aw·ful | aw/ful | 😖","lovely | love·ly | love/ly | 😍"],"reading":["> Percussion Instruments","> Percussion instruments are a family of musical instruments. We strike or shake them. Percussion instruments are big and small. These instruments add special sounds to music.","> Percussion instruments keep the beat: 1, 2, 3, 4. We can keep the beat, too. Clap your hands to this beat: 1, 2, 3, 4. Can you stamp your feet to the beat? 1, 2, 3, 4.","> Drums: There are a lot of different drums in the world. We strike drums with our fingers, our hands, or with drumsticks or mallets. This keeps the beat. This big drum is called a bass drum. The boy is striking the big white drum with two mallets.","> The Tambourine: A tambourine is like a small drum. We strike it with our hands. We can shake it, too.","> The Xylophone: A xylophone has wooden bars. The girl is striking the xylophone with mallets.","> The Triangle: Why do you think this instrument is called a triangle? Its shape is a triangle. We strike it.","> Cymbals: When we play the cymbals, we strike two cymbals together. There are many kinds of cymbals. Some are big and some are small. They sound different. This boy is playing big cymbals.","RC | What do we do with percussion instruments? | strike or shake them | blow them | sing with them","RC | What does a xylophone have? | wooden bars | strings | a big drum","RC | What is like a small drum? | a tambourine | a triangle | a xylophone","RT | How do we play the cymbals? | We strike two cymbals together.","RT | What do we strike drums with? | We strike drums with our hands or mallets.","RT | Why is a triangle called a triangle? | Its shape is a triangle.","RS | How can we keep the beat without an instrument?","RS | Which percussion instrument is your favorite? Tell us how we play it."],"grammar":["GT | Present Continuous","R | You**'re playing** the drums.  ·  You **aren't playing** the xylophone.","R | I**'m shaking** the tambourine.  ·  I**'m not striking** it.","R | am / is / are + verb + **-ing**","G | You're playing the drums.","G | You aren't playing the xylophone.","G | I'm shaking the tambourine.","G | I'm not striking it.","G | Gus is playing the xylophone.","G | He isn't playing the drum.","G | Layla's playing the cymbals.","G | They are making music."],"sw":["SP | A: Can you help me, please? | B: Sure! Let's {play the drum} together. | A: Thanks a lot! | B: You're welcome! | play the drum / shake the tambourine / strike the triangle / play the cymbals / play the xylophone / clap the beat","SW | I'm playing the {drum}. I'm {striking} it. It sounds {loud} and {fast}. | Write about a percussion instrument you are playing."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":16,"title":"Let's Make Music","bq":"How can we make music?","learn":["What does \"concert\" mean? | a show where people play music","What does \"practice an instrument\" mean? | to play it again and again to get good","What does \"buy tickets\" mean? | to pay money to go to a show","Spell the word \"parade\". | p-a-r-a-d-e","Spell the word \"circus\". | c-i-r-c-u-s","Ask: ___ you singing? Yes, I am. | Are","Ask: ___ she dancing? No, she isn't. | Is","What do the students use to make drums? | buckets and pots","How do the students get money for new instruments? | They sell tickets to a concert.","Is it a good idea to ask friends and family for help? Why?"],"battle":["T | What are you doing? | I'm reading a book.","T | What kind of show do you like? | I like the circus.","B | They're buying tickets for the concert.","B | Our parents are taking pictures.","F | Is you singing? | Are you singing?","F | Are she dancing? | Is she dancing?","W | puppet show | Make a sentence with the words \"puppet show\".","W | give money | Make a sentence with the words \"give money\".","P | 🎟️🥁🎶📸 | What is happening at the concert? Tell us.","C | Is a concert better than a circus? | A concert | A circus","Z | Name three kinds of performances.","S | Act out a performance. Ask the class: What are we doing?"],"words":["dance | dance | d/ance | 💃","sing | sing | s/ing | 🎤","clap | clap | cl/ap | 👏","idea | i·de·a | i/de/a | 💡","practice | prac·tice | prac/tice | 🎻","tickets | tick·ets | tick/ets | 🎟️","money | mon·ey | mon/ey | 💰","pictures | pic·tures | pic/tures | 📷","parade | pa·rade | pa/rade | 🎺","concert | con·cert | con/cert | 🎶","ballet | bal·let | bal/let | 🩰","play | play | pl/ay | 🎭","puppet | pup·pet | pup/pet | 🧸","circus | cir·cus | cir/cus | 🎪"],"reading":["> Let's Make Music!","> January: I'm Maddie, and we're students in Ms. King's class. We want music lessons, but we don't have instruments. We can't buy instruments because we don't have any money. We have a big problem. We need a good idea.","> February: We think, and think, and think, and then get an idea. Let's make instruments and give a concert! We can sell tickets, get money, and buy new instruments. But how do we make instruments? We ask our friends and families. Aha! We can use things from our homes.","> April: We're making instruments that we can shake. We're using paper rolls and beads. Fay and Oscar are shaking them. Evan and Kate are using jars and candy. They're shaking them to a beat.","> May: We're all practicing our instruments. These buckets and pots are our drums. Bruno, Sara, and Dan are striking them. These are our cymbals. Aziz and I are striking them together. Ms. King is helping us. What do you think? Are we having fun?","> June: It's concert night. Look at all the people! They're buying tickets. Everyone is excited. We're all playing our instruments, singing, and dancing. Our parents are taking pictures. The people are clapping and giving money! It's a wonderful concert.","> September: Look! These are our new instruments! We're very happy. We're playing them, and we sound great. We still like our old instruments, too!","RC | What do the students want? | music lessons | new shoes | a puppet show","RC | What are the buckets and pots? | drums | cymbals | tickets","RC | Who is helping the students? | Ms. King | their parents | Maddie","RT | Why can't the students buy instruments? | They don't have any money.","RT | What are the parents doing at the concert? | They are taking pictures.","RT | What are the people doing at the concert? | They are clapping and giving money.","RS | What is the students' problem? What is their solution?","RS | Why are the students happy at the end of the story?"],"grammar":["GT | Present Continuous Questions","R | **Are** you **singing**?  Yes, I **am**.","R | **Is** she **dancing**?  No, she **isn't**.","R | **Are** they **playing** instruments?  Yes, they **are**.","R | **Are** we **having** fun?  Yes, we **are**!","G | Are you singing a song?","G | Yes, I am singing.","G | Is she dancing in the parade?","G | No, she isn't dancing.","G | Are they playing instruments?","G | Yes, they are playing instruments.","G | Is he clapping his hands?","G | Are we having fun?"],"sw":["SP | A: What are we doing? | B: You're playing instruments and walking. It's a {parade}! | A: Yes, that's right! | parade / concert / ballet / play / puppet show / circus","SW | My favorite performance is a {concert}. Are the people {singing}? Yes, they are! | Write about your favorite kind of performance."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":17,"title":"Living and Nonliving Things","bq":"What are living things?","learn":["What does \"living\" mean? | alive; it can grow, move, and breathe","What does \"nonliving\" mean? | not alive; it can't grow or breathe","What does \"breathe\" mean? | to take air in and out","Spell the word \"plant\". | p-l-a-n-t","Spell the word \"grass\". | g-r-a-s-s","Finish the sentence: An animal ___ grow. | can","Finish the sentence: A toy ___ grow. | can't","Can a plant breathe air? | Yes, it can.","Does a ball move by itself? | No, it doesn't.","Do all living things need a home?"],"battle":["T | Name one living thing. What can it do? | A tree is living. It can grow.","T | Name one nonliving thing. | A bicycle is a nonliving thing.","B | A tree can grow and change.","B | Sneakers can't breathe air.","F | A doll can grows. | A doll can't grow. / A doll cannot grow.","F | People can breathes. | People can breathe.","W | rose | Make a sentence with the word \"rose\".","W | fountain | Make a sentence with the word \"fountain\".","P | 🌳🐶⚽🛋️ | Which are living? Which are nonliving? Say why.","C | Is a plant a living thing? | Yes, it is | No, it isn't","Z | Name three living things in a park.","S | Say: I'm sorry. Then your partner says: That's OK."],"words":["living | liv·ing | liv/ing | 🌱","nonliving | non·liv·ing | non/liv/ing | 🪨","breathe | breathe | br/eathe | 🌬️","move | move | m/ove | 🏃","change | change | ch/ange | 🦋","air | air | a/ir | 💨","bench | bench | b/ench | 🪑","bush | bush | b/ush | 🌳","statue | stat·ue | stat/ue | 🗽","grass | grass | gr/ass | 🌿","rose | rose | r/ose | 🌹","fountain | foun·tain | foun/tain | ⛲"],"reading":["> Living and Nonliving Things","> We see many things in our world every day. All of these things are living or nonliving. Let's read about how they are different.","> Living things: A living thing can grow and change. Look at the caterpillar and butterfly. What is different?","> A plant is a living thing. An animal is a living thing. You are a living thing! Living things breathe air, and they need food and water.","> People and animals can move by themselves. They can get food and water from different places. Where can animals get water?","> Plants can't move by themselves. They make their food from sunlight, water, and air. They can grow tall to get sunlight. Water comes to them. What living things do you see every day?","> Nonliving things: A nonliving thing doesn't need food, air, or water. It can't breathe. A toy is a nonliving thing.","> A nonliving thing doesn't grow, but it can change. Look at the sneakers. What's different?","> A ball can move. Is a ball a living thing? No, it isn't. A ball can only move if we move it. It can't move by itself. It can't breathe, and it doesn't grow. It's a nonliving thing.","> What nonliving things do you move every day? Look around you. What nonliving things do you see?","> All living and nonliving things in our world are important. It is good to take care of all of them.","RC | What can a living thing do? | grow and change | sing and dance | read and write","RC | Which one is a nonliving thing? | a toy | a plant | an animal","RC | What do plants make their food from? | sunlight, water, and air | milk and bread | toys and balls","RT | What do living things breathe? | Living things breathe air.","RT | Can plants move by themselves? | No, plants can't move by themselves.","RT | Can a ball move by itself? | No, a ball can only move if we move it.","RS | How are living and nonliving things different? Tell us one thing.","RS | What living things do you see every day?"],"grammar":["GT | Can and Can't","R | An animal **can** grow.  ·  A toy **can't** grow.","R | People **can** breathe.  ·  Sneakers **can't** breathe.","G | An animal can grow.","G | A toy can't grow.","G | People can breathe air.","G | Sneakers can't breathe.","G | A tree can grow tall.","G | A house can't move.","G | Can a ball move by itself?","G | Plants can't move by themselves."],"sw":["SP | A: Oh, no! My {drum} is broken! | B: I'm sorry. That's OK. I can fix it. | A: Thank you! | B: I can help. | drum / bike / toy / doll / bench / fountain","SW | A {tree} is a living thing. It can {grow and change}. A {ball} is a nonliving thing. It can't {breathe}. | Write about one living thing and one nonliving thing."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":true},{"n":18,"title":"The Gingerbread Man","bq":"What are living things?","learn":["What does \"chase\" mean? | to run after someone","What does \"catch\" mean? | to get and hold someone who is running","What does \"junk food\" mean? | food that is not healthy, like chips and soda","Spell the word \"bake\". | b-a-k-e","Spell the word \"healthy\". | h-e-a-l-t-h-y","Finish the sentence: You ___ run away! | should","Finish the sentence: You ___ stay here. (no) | shouldn't","Who makes the gingerbread man? | an old woman","Who eats the gingerbread man at the end? | the fox","Why does the fox tell the gingerbread man to climb on his nose?"],"battle":["T | What should you do to be healthy? | I should eat healthy food.","T | What shouldn't you do in school? | I shouldn't run in the classroom.","B | You can't catch me, I'm the gingerbread man!","B | You should go to bed early.","F | You should to eat healthy food. | You should eat healthy food.","F | He don't should talk to the fox. | He shouldn't talk to the fox.","W | run away | Make a sentence with the words \"run away\".","W | play outside | Make a sentence with the words \"play outside\".","P | 🍪👵🐔🦊 | Tell the story of the gingerbread man.","C | Should you go to bed early or late? | Early | Late","Z | Name three things you should do to take care of yourself.","S | Give your partner advice. Say: You should ... You shouldn't ..."],"words":["run | run | r/un | 🏃","chase | chase | ch/ase | 🐕","catch | catch | c/atch | 🧤","stop | stop | st/op | 🛑","cross | cross | cr/oss | 🚸","bake | bake | b/ake | 🍪","smell | smell | sm/ell | 👃","open | o·pen | o/pen | 🚪","early | ear·ly | ear/ly | 🌅","late | late | l/ate | 🌙","healthy | health·y | health/y | 🥗","outside | out·side | out/side | 🌳","bed | bed | b/ed | 🛏️"],"reading":["> The Gingerbread Man","> Narrator: One day, an old woman makes a gingerbread man cookie. She bakes it in the oven.","> Old Man: It smells good! I'm hungry!","> Narrator: The old woman opens the oven door. The gingerbread man jumps up and runs out the door!","> Old Woman: Stop! Don't run away! We want to eat you!","> Narrator: The old woman and old man chase the gingerbread man. He should run fast!","> Gingerbread Man: Run, run as fast as you can! You can't catch me, I'm the gingerbread man!","> Narrator: The gingerbread man sees a chicken in the yard.","> Chicken: Stop! Don't run away! I want to eat you!","> Narrator: The old woman, old man, and chicken all chase the gingerbread man. But he's too fast.","> Gingerbread Man: Run, run as fast as you can! You can't catch me, I'm the gingerbread man!","> Narrator: He sees a cow in a grassy field.","> Cow: Stop! Don't run away! I want to eat you!","> Narrator: The old woman, old man, chicken, and the cow all chase the gingerbread man. But he's too fast.","> Gingerbread Man: Run, run as fast as you can! You can't catch me, I'm the gingerbread man!","> Narrator: He sees a horse next to a tree.","> Horse: Stop! Don't run away! I want to eat you!","> Narrator: The old woman, old man, chicken, cow, and the horse all chase the gingerbread man. But he's too fast.","> Gingerbread Man: Run, run as fast as you can! You can't catch me, I'm the gingerbread man!","> Narrator: The gingerbread man comes to a river. He should swim across it!","> Gingerbread Man: Oh, no! I can't swim!","> Narrator: The gingerbread man sees a fox. He shouldn't talk to the fox!","> Fox: You really shouldn't stay here. I can help you. Climb on my nose, and we can cross the river.","> Gingerbread Man: OK!","> Narrator: The gingerbread man jumps on the fox's nose. The fox throws the gingerbread man up in the air and...","> Fox: Yum! Delicious!","> Narrator: And that's the end of the gingerbread man!","RC | Who bakes the gingerbread man? | an old woman | a fox | a chicken","RC | Where does the gingerbread man see the cow? | in a grassy field | in the yard | next to a tree","RC | Who eats the gingerbread man? | the fox | the horse | the old man","RT | Why can't the gingerbread man swim across the river? | He can't swim.","RT | Why can't they catch the gingerbread man? | He is too fast.","RT | What does the fox tell the gingerbread man to do? | The fox tells him to climb on his nose.","RS | Why does everyone chase the gingerbread man?","RS | Why does the fox tell the gingerbread man to climb on his nose?"],"grammar":["GT | Should and Shouldn't","R | You **should** run away!","R | You **shouldn't** stay here.","G | You should run away!","G | You shouldn't stay here.","G | She should close the door.","G | He should run fast.","G | You shouldn't talk to the fox.","G | Should I go to bed early?","G | You should eat healthy food.","G | You shouldn't eat junk food."],"sw":["SP | A: Stop! You shouldn't {run} in the classroom. | B: Oh, I'm sorry. | A: You should walk! | B: OK, you're right. | run / shout / jump / eat / push / play","SW | We should {give plants water}. We shouldn't {throw junk in the park}. | Write what you should and shouldn't do to take care of living things."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false}]},"OD2":{"units":[{"n":1,"title":"Amazing Animals","bq":"How are animals different from one another?","learn":["What does \"gills\" mean? | t

 crops for people? | Save wild animals | Grow more crops","Z | Name three extinct animals from the story.","S | Why do we protect animals? Give two reasons."],"words":["dodo | do·do | do/do | 🦤","quagga | quag·ga | quag/ga | 🦓","mammoth | mam·moth | mam/moth | 🦣","tiger | ti·ger | ti/ger | 🐯","extinct | ex·tinct | ex/tinct | 🦖","survive | sur·vive | sur/vive | 💪","exploit | ex·ploit | ex/ploit | ⚠️","endangered | en·dan·gered | en/dan/gered | 🐼","habitat | hab·i·tat | hab/i/tat | 🌳","species | spe·cies | spe/cies | 🐾","sanctuary | sanc·tu·ar·y | sanc/tu/ar/y | 🏞️","mammals | mam·mals | mam/mals | 🐘","atmosphere | at·mos·phere | at/mos/phere | 🌫️","rare | rare | r/are | 💎"],"reading":["> Dreaming of Dodos","> Mina was in bed, feeling sleepy. She read the first few words of her book. \"The dodo was a bird that couldn't fly...\"","> Whoosh! The window flew wide open. Mina sat up, and through the window she saw a dodo, a real live dodo, right there in her yard!","> \"I existed over four hundred years ago,\" the dodo said. \"But then terrible things happened. Sailors arrived. They cut down the forests, so there was nothing for us to eat, and they had cats that killed us. Dodos didn't survive. We all died.\" The dodo made a sniffing noise and sat down.","> There was a sound of hooves, and into the yard galloped a quagga, missing the dodo's head by a centimeter.","> \"I existed 150 years ago,\" said the quagga, with a tear in its eye. \"Quaggas were a species of zebra, but hunters killed us and made our skins into bags, and farmers ate us. These humans exploited us. Eventually, we all became extinct.\"","> The quagga stood by Mina's swing, swishing its tail.","> Soon came a sound of water gushing and a flip-flap of flippers. From the bottom of Mina's pool emerged a sea wolf. It looked like a big seal.","> \"I've been looking for you!\" said the sea wolf to the dodo. \"Sea wolves haven't existed for almost 70 years.\"","> \"Why's that?\" asked the dodo.","> The sea wolf flopped out of the pool. A puddle of water spread across the grass.","> \"We were hunted by explorers, fishermen, and hunters who killed and ate us. They made shoes and boots from our skin, and used our fat to cook with. That's why!\"","> \"I'm very sorry,\" said the dodo. The dodo felt bad that these sea mammals had suffered so much.","> Suddenly, a crashing noise made Mina jump. There at the gate was a woolly mammoth. With one big push, it stumbled into the yard.","> \"Sorry about the noise,\" it said. \"I've been looking for you! I lived thousands of years ago, but now I'm extinct.\"","> \"Why's that?\" asked the quagga.","> \"No one is sure,\" replied the mammoth. \"Scientists think the weather changed, changing our habitat. We ate grass, but as the atmosphere grew warmer, forests spread and there was less grass to eat.\"","> Mina heard wings flapping. Seconds later, an elephant bird came crashing through the trees and landed beside the pool, splashing water over the dodo.","> \"I weigh half a ton,\" the elephant bird said proudly. \"I'm the heaviest bird that's ever existed. You could make 30 omelets from one of my eggs! But I've been extinct for over a thousand years.\"","> Well, the animals all looked miserable, but before they had time to say another word, a tiger came roaring in.","> \"Ah-hah!\" it said, peering around with its bright, fiery eyes. \"I have many friends here.\"","> \"Are you extinct, too?\" asked the elephant bird.","> \"Not yet,\" replied the tiger, flashing its shiny teeth. \"But I'm rare and endangered! Tigers are lucky. They have sanctuaries where they can live.\"","> The dodo, the quagga, the sea wolf, the woolly mammoth, and the elephant bird all stared at the tiger. \"Sanctuaries?\" they asked.","> \"Yes, sanctuaries,\" replied the tiger. \"They are places where no one can hurt you.\"","> \"What a great idea!\" thought Mina. \"Maybe if we have sanctuaries, fewer animals will become extinct.\"","> The window blew shut, and Mina woke up with a start. There was no one and nothing to see, except the book by her bed.","RC | Where was Mina at the start of the story? | in bed | in the yard | at the gate","RC | Why are tigers lucky? | they have sanctuaries | they have shiny teeth | they can fly","RC | Why did the woolly mammoth become extinct? | the weather changed | sailors cut down forests | hunters wanted its skin","RT | Why did the dodos have nothing to eat? | Sailors cut down the forests, so there was nothing for the dodos to eat.","RT | What did hunters make from the quaggas' skins? | Hunters made the quaggas' skins into bags.","RT | What is a sanctuary? | A sanctuary is a place where no one can hurt you.","RS | Why did the sea wolves become extinct? Tell us one reason.","RS | What does the author want you to learn from this story?"],"grammar":["GT | Present Perfect and Present Perfect Continuous","R | present perfect  →  done in your life up to now:  I **have read** books about dodos.","R | present perfect continuous  →  started in the past, still doing it now:  I **have been reading** this book for an hour.","G | I have read books about dodos.","G | I have been reading this book for an hour.","G | They've been playing basketball since three o'clock.","G | We've read books about mountains and oceans.","G | Have you been to the new store yet?","G | I've been learning English for four years.","G | Sea wolves haven't existed for almost 70 years.","G | I've been looking for you!"],"sw":["SP | A: In my opinion, the most interesting animal is the {Goliath frog}. | B: Why do you say that? | A: I say that because it is very big and very rare. | B: I agree. In my opinion, it is a very interesting animal. | Goliath frog / tiger / dodo / elephant bird / polar bear / panda","SW | The {tiger} is an endangered animal. It lives in {the jungle}. We can protect it by {building sanctuaries}. | Write three sentences about an endangered animal and how we can protect it."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":2,"title":"Save Our Tigers!","bq":"Why do we protect animals?","learn":["What does \"poaching\" mean? | hunting animals illegally","What does \"conservation\" mean? | protecting nature and wild animals so they are not lost","What does \"diverse\" mean? | many different kinds","Spell the word \"protect\". | p-r-o-t-e-c-t","Spell the word \"population\". | p-o-p-u-l-a-t-i-o-n","Which tense is this: People have cleared forests to grow crops. | present perfect","Change to the present perfect: The animals' habitat ___ (suffer). | The animals' habitat has suffered.","Why did some tigers in the foothills start eating people? | They had injuries from poachers and could not hunt other animals.","How many tigers were in India in the early 20th century, and how many now? | About 40,000 then, and maybe as few as 2,000 now.","Do you think hunters can become good conservationists? Why or why not?"],"battle":["T | Who was Jim Corbett? | Jim Corbett was a hunter who became a conservationist.","B | People have cleared the forests to grow crops.","B | There are now more than 35 tiger reserves in India.","F | Tigers have always live in thick jungles. | Tigers have always lived in thick jungles.","F | Jim Corbett has shot nineteen tigers between 1907 and 1938. | Jim Corbett shot nineteen tigers between 1907 and 1938.","W | poaching | Explain why poaching is a problem for tigers.","PT | 🐯🏞️🔫🚫 | Write a sentence about what is happening in this picture.","C | Should hunting wild animals be against the law everywhere? | Yes, always | No, sometimes it is needed","Z | Name three animals that used to live in the foothills of the Himalayas.","S | How can students help protect endangered animals? Give two ideas."],"words":["diverse | di·verse | di/verse | 🌈","damaged | dam·aged | dam/aged | 💥","identify | i·den·ti·fy | i/den/ti/fy | 🔍","conservation | con·ser·va·tion | con/ser/va/tion | 🌱","tracker | track·er | track/er | 👣","protect | pro·tect | pro/tect | 🛡️","naturalist | nat·u·ral·ist | nat/u/ral/ist | 🔬","poaching | poach·ing | poach/ing | 🚫","preservation | pres·er·va·tion | pres/er/va/tion | 🏞️","inspire | in·spire | in/spire | ✨","population | pop·u·la·tion | pop/u/la/tion | 📊","reserve | re·serve | re/serve | 🌳","wildlife | wild·life | wild/life | 🦌","jungle | jun·gle | jun/gle | 🌴"],"reading":["> Save Our Tigers!","> The Foothills of the Himalayas: The Himalayas are the highest range of mountains on Earth. Below this range, there are foothills containing jungles, forests, rivers, and lakes. These hills once provided a home to many diverse types of wildlife: tigers, leopards, rhinoceroses, and deer. In the last 75 years, however, many of those animals have disappeared. People have cleared the forests to grow crops, and the animals' habitat has suffered.","> Man-Eaters: Usually, it's humans who scare and kill animals, but it can be the other way around. About a hundred years ago, a few starving tigers and leopards terrified the people who lived in the foothills. Instead of eating other animals, like buffalo and antelopes, some of these big cats started killing and eating people! The cats had names like the Tiger of Chowgarh, the Thak Man-Eater, the Champawat Tigress, and the Panard Leopard.","> Corbett, the Hunter: As a small boy, Jim Corbett was fascinated by wildlife. He taught himself to identify animals and birds by the sounds they made. Later, Jim became a tracker and hunter. The government asked him to track and shoot the man-eating tigers to protect people. Between 1907 and 1938, Corbett shot and killed nineteen tigers and fourteen leopards. He did this on foot, sometimes accompanied by his dog, and he took many risks to save people's lives. The first tiger he shot was the Champawat Tiger, a tiger that killed more than 436 people. Jim was a hero!","> Corbett, the Naturalist: Jim wondered why the tigers and leopards were killing people. When he examined the cats that he had shot, he made an important discovery. They all had injuries. Some had gunshot wounds from poachers who hunted them illegally. Poaching was common because people could sell tiger skins for decoration and tiger bones for medicine. One tiger had a gunshot wound in its mouth, and its teeth were damaged. It could no longer attack buffalo and antelopes. Other tigers had injuries and infections from porcupine quills getting stuck in their skin. The reason they were eating people was that they couldn't hunt other animals.","> Corbett National Park and Corbett's Tiger: After his discoveries, Jim became interested in conservation. He had a new mission: the preservation of tigers. He gave lectures and inspired people to respect wildlife, especially the big cats, which he loved and respected. Two years after he died in 1955, the oldest national park in India got a new name: Corbett National Park. It's a sanctuary for tigers, leopards, and other endangered animals. There's even a species of tiger named after Jim, called Corbett's Tiger. No one is sure what the total population of Corbett's Tigers is, but there may only be 350 worldwide.","> Saving the Tiger: In the early 20th century, there were about 40,000 tigers in India. Now there may be as few as 2,000. But thanks to conservationists like Jim Corbett, there are now more than 35 tiger reserves in India. Saving the tiger means preserving the entire food chain. First, we need to save the tigers' food, and that means protecting deer and other animals. Next, we need to save plants, trees, and grasses so that these animals can eat. By saving the plants, trees, and grasses, we protect our forests and rivers and all the birds, animals, and insects that live there. Very importantly, this means we are saving our water because, as you know, nothing on Earth can live without water.","RC | Why have many animals disappeared from the foothills? | people cleared the forests | the weather got colder | tigers ate them all","RC | Why did the government ask Jim Corbett to shoot tigers? | to protect people | to sell tiger skins | to make medicine","RC | What did Corbett discover about the man-eating cats? | they all had injuries | they were very young | they had no homes","RT | What did the starving big cats start eating instead of buffalo and antelopes? | They started killing and eating people.","RT | Why was poaching common? | People could sell tiger skins for decoration and tiger bones for medicine.","RT | How many tiger reserves are there in India now? | There are now more than 35 tiger reserves in India.","RS | Why did Jim Corbett change from a hunter into a conservationist?","RS | Why is it important to save tigers? Tell us one reason."],"grammar":["GT | Review of Tenses","R | Simple Present:  Tigers **go** to the river every day.","R | Present Continuous:  Tigers **are going** to the river to drink.","R | Simple Past:  Tigers **went** to the river yesterday.","R | Present Perfect:  People **have cleared** forests.  The animals' habitat **has suffered**.  Tigers **have always lived** in thick jungles.","G | Tigers go to the river every day.","G | Tigers are going to the river to drink.","G | Tigers went to the river yesterday.","G | People have cleared forests to grow crops.","G | The animals' habitat has suffered.","G | Tigers have always lived in thick jungles.","G | How long have you lived here?","G | I have studied English for five years."],"sw":["SP | A: Do you think tigers will survive? | B: Yes, I think tigers will survive. | A: Why do you say that? | B: I think it's because {people protect them in reserves}. | people protect them in reserves / poaching is illegal now / there are many sanctuaries / naturalists study them / people respect wildlife","SW | We should protect {tigers}. They are endangered because {poachers hunt them}. We can help by {making more reserves}. | Write three sentences about an animal we should protect and why."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":3,"title":"Teeth: The Cavity and Have You Any Idea?","bq":"What are teeth for?","learn":["What does \"carnivore\" mean? | an animal that eats meat","What does \"herbivore\" mean? | an animal that eats plants","What does \"cavity\" mean? | a hole in a tooth","Spell the word \"incisor\". | i-n-c-i-s-o-r","Spell the word \"omnivore\". | o-m-n-i-v-o-r-e","Make the sentence about past ability: I ___ (read) by the time I was four. | I could read by the time I was four.","Make the sentence about future ability: Next year, I ___ ride my bike to school. | Next year, I will be able to ride my bike to school.","In the poem, what did the boy eat before the ache started? | A big bite of yummy chocolate cake.","What are molars useful for? | Grinding the food that we eat.","Do you think going to the dentist is scary? Why or why not?"],"battle":["T | What did the dentist do for the boy with the cavity? | The dentist gave him a little filling.","B | Humans have eight incisor teeth in their mouths.","B | Canine teeth are good for ripping food apart.","F | I can ride a bike when I was four. | I could ride a bike when I was four.","F | Next year, I can able to drive a car. | Next year, I will be able to drive a car.","W | crush | Make a sentence using the word crush.","P | 🦷🍰😖🩺 | What happened to the boy? Tell the story.","C | Which is more useful for a human, incisors or molars? | Incisors | Molars","Z | Name the three kinds of teeth in a human mouth.","S | Say three things you could not do five years ago but can do now."],"words":["incisor | in·ci·sor | in/ci/sor | 🦷","canine | ca·nine | ca/nine | 🐺","molar | mo·lar | mo/lar | 🦷","carnivore | car·ni·vore | car/ni/vore | 🦁","herbivore | her·bi·vore | her/bi/vore | 🐄","omnivore | om·ni·vore | om/ni/vore | 🐻","slice | slice | sl/ice | 🔪","grip | grip | gr/ip | ✊","crush | crush | cr/ush | 🧊","cavity | cav·i·ty | cav/i/ty | 🕳️","gums | gums | g/ums | 👄","jaw | jaw | j/aw | 🐊","filling | fill·ing | fill/ing | 🩹","detective | de·tec·tive | de/tec/tive | 🕵️"],"reading":["> The Cavity","> It started late one night. / I felt a nasty ache / Just after a big bite / Of yummy chocolate cake.","> \"It's dentist time for you,\" / Dad told me the next day. / And since I couldn't chew, / I said, \"I guess, OK.\"","> My canines are bright white / Like tigers' teeth, I'd say. / I scrub my gums noon and night / And at the break of day!","> My molars are all shiny. / I brush them hard and long! / Maybe the hole is tiny. / Maybe Dad is wrong.","> I sat in the big chair. / My jaws were open wide. / I told the dentist where / I had a pain inside.","> Is my tooth defective? / Dear dentist, please explain! / You are the great detective / Who cures all dental pain.","> He said I had a cavity / Right inside my tooth. / He said so with such gravity / It had to be the truth!","> \"Is it in my incisor?\" / I asked him with a smile. / I should have been much wiser / And kept quiet for a while.","> \"You'll need a little filling,\" / The dentist softly said, / And then he started drilling / Right inside my head!","> I heard a funny buzz, / Like an angry bee, / But that's what the drill does. / It didn't worry me!","> And when the hole was filled, / I jumped down off the chair, / For I was really thrilled / To get right out of there!","> Have You Any Idea?","> Have you any idea / What the carnivore saw / Scurrying through the trees? / A snack, a snack, a snack, a snack / That's tastier than cheese!","> Have you any idea / What the carnivore did / When it gripped its prey? / Attack, attack, attack, attack / Before the prey could stray!","> \"I have canine teeth, you see, dear prey, / And they will tear you up!\"","> Have you any idea / What the herbivore saw / Growing towards the sun? / A treat, a treat, a treat, a treat, / Big and green and fun!","> Have you any idea / What the herbivore said / When it saw the grass? / \"No meat, no meat, no meat, no meat, / Just grass that is first class!\"","> \"I have incisor teeth, you see, dear grass, / And they will slice you up!\"","> Have you any idea / What the omnivore saw / Reaching up to the skies? / A lunch, a lunch, a lunch, a lunch, / A mountain of tasty pies!","> Have you any idea / What the omnivore said / When it saw all kinds of food? / \"I'll munch, I'll munch, I'll munch, I'll munch / Because I'm in the mood!\"","> \"I have molar teeth, you see, dear food, / And they will crush you up!\"","RC | What did the boy eat before the ache started? | chocolate cake | an apple | hard candy","RC | What did the dentist say the boy needed? | a little filling | a new tooth | a big bandage","RC | Who finds food growing towards the sun? | the herbivore | the carnivore | the omnivore","RT | Why did the boy agree to go to the dentist? | He agreed because he couldn't chew.","RT | What did the drill sound like? | The drill sounded like an angry bee.","RT | What does the carnivore do with its canine teeth? | The carnivore tears up its prey with its canine teeth.","RS | How did the boy feel at the end of the poem? Why?","RS | Which teeth does the omnivore use, and what do they do to food?"],"grammar":["GT | Modals of Ability","R | past:  **could / couldn't**  →  I **could** read by the time I was four.  I **couldn't** chew after I got a cavity.","R | future of can / can't:  **will / won't be able to**  →  Next year, I **will be able to** ride my bike to school.  I **won't be able to** drive a car.","G | I could read by the time I was four.","G | I couldn't chew after I got a cavity.","G | Next year, I will be able to ride my bike to school.","G | I won't be able to drive a car.","G | Could you use a computer when you were four?","G | Last year, my sister couldn't ride a bike.","G | We won't be able to go to the party tomorrow.","G | Ten years ago, I could crawl, but I couldn't walk."],"sw":["SP | A: Is it important to take care of your teeth? | B: Yes. It's important to {brush your teeth} every day. | A: What could happen if you don't take care of your teeth? | B: If we don't take care of our teeth, we could get cavities. | brush your teeth / go to the dentist / use toothpaste / floss your teeth / eat healthy food / drink less soda","SW | I'm good at {math}. I'm interested in {animals}. I'm afraid of {spiders}. | Write three sentences about you using an adjective and a preposition."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":4,"title":"Teeth: Not Just for Eating","bq":"What are teeth for?","learn":["What does \"fang\" mean? | a long, sharp front tooth","What does \"venom\" mean? | poison that an animal pushes through its fangs","What does \"gnaw\" mean? | to bite and chew something hard again and again","Spell the word \"tusk\". | t-u-s-k","Spell the word \"shelter\". | s-h-e-l-t-e-r","Complete with must or can't: It has comb-like lower teeth. It ___ be a prosimian. | It must be a prosimian.","Complete with must or can't: It only has four legs. It ___ be a spider. | It can't be a spider.","How long can an elephant's tusks grow? | Over three meters long.","What do beavers build with the logs they gnaw? | A home called a lodge and a dam to protect it.","Which animal in the article uses its teeth in the most interesting way? Why?"],"battle":["T | How do vampire bats use their fangs? | Vampire bats use fangs to pierce holes in their prey's skin.","B | A poisonous snake can push venom through its fangs.","B | Beavers use their teeth to create a dam.","F | It has eight legs. It can't be a spider. | It has eight legs. It must be a spider.","F | That animal must be a shark, but I'm not sure. | That animal might be a shark, but I'm not sure.","W | prey | Make a sentence about an animal and its prey.","P | 🦈🦷🦷🦷 | What is special about a shark's teeth? Explain.","C | Which is more important for an animal, sharp teeth or strong jaws? | Sharp teeth | Strong jaws","Z | Name three ways animals use their teeth besides eating.","S | Describe an animal and let your team guess it. Use must, might and can't."],"words":["fang | fang | f/ang | 🐍","tusk | tusk | t/usk | 🐘","venom | ven·om | ven/om | ☠️","shelter | shel·ter | shel/ter | 🏠","dam | dam | d/am | 🦫","prey | prey | pr/ey | 🦌","gnaw | gnaw | gn/aw | 🐭","pierce | pierce | p/ierce | 📌","create | cre·ate | cre/ate | 🎨","powerful | pow·er·ful | pow/er/ful | 💪","intruder | in·trud·er | in/trud/er | 🚷","supply | sup·ply | sup/ply | 📦","lodge | lodge | l/odge | 🪵","achievement | a·chieve·ment | a/chieve/ment | 🏆"],"reading":["> Teeth: Not Just for Eating","> What are teeth used for? \"That's easy,\" you say. \"Teeth are for eating.\" You're partially right. For people, that's the purpose of teeth: biting off and chewing food (and occasionally ripping into that package of cookies). For animals, teeth are good for more than just eating. They might be used for fighting, communicating, or even building a home.","> Some animals have a continuous supply of teeth. The shark has two sets of teeth, so a missing tooth is automatically replaced. Many reptiles, like lizards, also have a constant supply of new teeth replacing the old ones.","> Many animals use their teeth to battle. Walruses have two ivory teeth called tusks that can grow up to almost a meter long. Male walruses fight each other over females, and the one with the longest tusks usually wins. Elephants also have tusks, though theirs can grow to be over three meters long! They use them to protect mates and young, even fending off lions if necessary.","> Other animals may attack prey with their teeth. Alligators and crocodiles don't use their teeth to chew, but to seize prey, which they swallow whole. They may lose teeth, but backups are waiting to move up and fill the empty spots.","> Some animals have sharp front teeth called fangs, which kill. A poisonous snake can push venom through its fangs, leaving its victim helpless. Vampire bats use fangs to pierce holes in their prey's fur and skin. Then they lap up the blood (their food) with their tongues. Hyenas' small teeth are set in powerful jaws that can crush the bones of a much larger animal.","> Some animals use their teeth to send a message. Horses show teeth to express different feelings. They might talk tough, welcome others, or show respect. Porcupines click their teeth to warn others to stay away, while hippos yawn to threaten. Baboons scream and show a mouth full of huge, pointed teeth to both frighten intruders and make their young behave. Angry bison grind their teeth, making a squeaky sound. Stay away!","> A few animals use their teeth to supply shelter. Naked mole rats use four razor-sharp teeth to dig tunnels, which serve as a home. (Their lips seal behind their teeth so that soil doesn't enter their mouths.) Their teeth are constantly growing, but wear down as the top and bottom teeth scrape together while digging through hard soil. Beavers also have four front teeth that continually grow. These teeth wear down from gnawing through trees. After toppling a tree, beavers use their teeth to drag logs to the water. They use these logs to build a home, or lodge, and also to create a dam, which protects the lodge.","> Some animals also use their teeth to groom, or clean, themselves. For example, there is a group of animals called prosimians, which means \"before the monkeys.\" They're monkey-like creatures, but they aren't monkeys. There are about 50 animals in this group, including lemurs, aye-ayes, and lorises. The type of teeth and the way they use them tell us that they must be prosimians. Almost all prosimians have comb-like lower front teeth that they use to clean the fur on their bodies.","> So, as you can see, teeth are not only used for eating. They're also useful for building shelters, digging holes, warning off predators, catching and killing prey, fighting, and keeping clean!","RC | Which animal has two sets of teeth, so a missing tooth is replaced? | the shark | the horse | the beaver","RC | What do walruses and elephants fight with? | tusks | fangs | claws","RC | What do beavers build with logs? | a lodge and a dam | a nest | a tunnel","RT | How do alligators and crocodiles use their teeth? | They use their teeth to seize prey, which they swallow whole.","RT | What do porcupines do to warn others to stay away? | Porcupines click their teeth to warn others to stay away.","RT | What do naked mole rats use their teeth for? | They use four razor-sharp teeth to dig tunnels, which serve as a home.","RS | How do vampire bats get their food? Tell us the steps.","RS | How do prosimians use their teeth? Why is this useful?"],"grammar":["GT | Modals of Certainty","R | sure it's true:  **must / has to**  →  It **must** be a prosimian.  It **has to** be a spider.","R | sure it isn't true:  **can't**  →  That **can't** be a spider!  It only has four legs.","R | not sure:  **might**  →  It **might** be a spider, but I'm not sure.","G | It must be a giraffe.","G | It has to be a spider.","G | That can't be a spider!","G | It might be a snake, but I'm not sure.","G | It has long, poisonous fangs.","G | It can't be an ostrich because it doesn't have feathers.","G | Is it a zebra?","G | This animal must be a beaver."],"sw":["SP | A: Which animal is more dangerous? | B: I think {snakes} are more dangerous than lions. | A: Why do you think so? | B: Because they have sharp teeth and powerful jaws. | snakes / killer whales / alligators / hyenas / walruses / baboons","SW | I enjoy {swimming}, {reading}, and {drawing}. I don't like {waiting} or cleaning. | Write two sentences about what you like and don't like, using a list of -ing words."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":5,"title":"A Revolution in History: Wheels","bq":"Why are wheels important?","learn":["What does \"rotate\" mean? | to turn around a center point","What does \"haul\" mean? | to pull or carry something very heavy","What does \"gear\" mean? | a small wheel with teeth that fits together with other wheels","Spell the word \"axle\". | a-x-l-e","Spell the word \"technology\". | t-e-c-h-n-o-l-o-g-y","Complete with will: The sun ___ (rise) at 6:05 tomorrow. | The sun will rise at 6:05 tomorrow.","Complete with going to: I ___ (visit) my uncle next week. | I am going to visit my uncle next week.","What are the oldest wheels that we know about? | Potter's wheels.","Where was the wheel and axle invented about 5,000 years ago? | In Sumer, the place we now call southern Iraq.","Which invention do you think is more important, the wheel or the computer? Why?"],"battle":["T | How did the Egyptians make wheels lighter and faster? | The Egyptians made ring-shaped wheels with spokes.","B | Chariots were the first cars in history.","B | A water mill could grind wheat into flour quickly.","F | Look at those black clouds. It will rain. | Look at those black clouds. It's going to rain.","F | I going to visit my uncle next week. | I'm going to visit my uncle next week. / I am going to visit my uncle next week.","W | transportation | Make a sentence about transportation in your city.","P | ⚙️🚲🏺🚗 | Which things use wheels? Explain how.","C | Would life be better without wheels? | Yes, simpler | No, much harder","Z | Name three things in your house that have wheels.","S | What are you going to do this weekend? Say three plans."],"words":["transportation | trans·por·ta·tion | trans/por/ta/tion | 🚌","transfer | trans·fer | trans/fer | 🔁","haul | haul | h/aul | 🚚","axle | ax·le | ax/le | 🛞","rotate | ro·tate | ro/tate | 🔄","spoke | spoke | sp/oke | 🚲","rim | rim | r/im | ⭕","traction | trac·tion | trac/tion | 🏎️","gear | gear | g/ear | ⚙️","grind | grind | gr/ind | 🌾","technology | tech·nol·o·gy | tech/nol/o/gy | 💻","rod | rod | r/od | 📏","vehicle | ve·hi·cle | ve/hi/cle | 🚗","durable | du·ra·ble | du/ra/ble | 🧱"],"reading":["> A Revolution in History","> What would your world be like without wheels? Think of all the things you do every day that use a wheel or wheels. Wheels help you get to many places where you want to go. But did you know that we depend on wheels for much more than just transportation? We need wheels for the presses that print our magazines and books. We need them for the washers and driers that clean our clothes, the mills that make flour for our bread. And of course, we need them to have fun on skateboards and roller coasters.","> The oldest wheels that we know about are potter's wheels. A potter's wheel looks like a small, round table without legs. To make a pot, a piece of clay is placed on the center of the wheel. The potter rotates the wheel while the clay is shaped. Potter's wheels make it easier and faster to shape the round objects that you use every day, such as bowls, plates, and vases.","> Before the invention of the wheel, it was difficult to transport heavy things, such as building stones. These stones had to be hauled on a platform. The platform was rolled forward on top of logs. It was hard work, and it took a long time. However, about 5,000 years ago, someone living in Sumer, which is the place we now call southern Iraq, had a great idea. What if pegs were used to hold the rolling logs in place? And what if wooden disks were fastened to the end of each log to make them stronger? That way, animals such as oxen could easily pull a heavy load on the new wheeled cart. Today, we call this a wheel and axle system, and it works really well.","> Early wheels were made out of solid disks of wood. They were heavy and didn't turn fast. Then the Egyptians found a solution to this problem by making ring-shaped wheels, which were lighter and turned faster. They discovered that adding metal to the rim made the wheel more durable and gave it better traction. They attached straight rods called spokes to the center of the wheel to make it strong. These new wheels were used in light horse-drawn carts called chariots. Chariots were like the first cars. People used them to get around, but they also became popular for racing.","> The wheel didn't just change the way people got from place to place. In Syria and Asia, people started using the running water of a river to turn large water wheels. When the wheel turned, it created the power to operate a simple machine called a mill. A water mill could grind wheat into flour much faster than a person could. This invention means that millions of loaves of bread are made all around the world every single day!","> Lots of machines of every size and shape, from watches to printing presses, wouldn't work without wheels. Many machines depend on small wheels that fit together, called gears. This is great because when one wheel turns, the next wheel turns. The energy is transferred from one gear to another. That is the same mechanical movement that keeps a watch ticking, a car engine running, a bicycle's wheels turning, and a press printing.","> Even today, the wheel is still inspiring new technology. Did you know that there's an electric unicycle and an automatic suitcase that will move by itself? There's even a new metal wheel that is designed especially for vehicles that are going to explore the surface of the planet Mars. Wheels will always be a central part of life, and the need for them is going to grow as long as humans think, invent, and change.","RC | What are the oldest wheels that we know about? | potter's wheels | water wheels | chariot wheels","RC | Where was the first wheel and axle system invented? | in Sumer | in Egypt | in Syria","RC | What do we call small wheels that fit together? | gears | spokes | rims","RT | What change did the Egyptians make to the wheel? | The Egyptians made ring-shaped wheels, which were lighter and turned faster.","RT | What could a water mill do? | A water mill could grind wheat into flour much faster than a person could.","RT | What new technology can move by itself? | An automatic suitcase can move by itself.","RS | How were heavy stones transported before the wheel was invented?","RS | What is the most important use of wheels? Give your reasons."],"grammar":["GT | Future with Will and Going To","R | **will**  →  a future fact / a prediction you believe:  The sun **will rise** at 6:05 tomorrow.  Wheels **will** always **be** a central part of life.","R | **going to**  →  a plan / a prediction about what you see:  I'm **going to visit** my uncle next week.  Look at those clouds. It's **going to rain**.","G | The sun will rise at 6:05 tomorrow.","G | Wheels will always be a central part of life.","G | I'm going to visit my uncle next week.","G | Look at those big, black clouds.","G | It's going to rain tonight.","G | Someone will find a cure for cancer someday.","G | He's going to travel to Spain this summer.","G | Who do you think will win the race?"],"sw":["SP | A: Where are you going on your trip? | B: We're going to {the beach}. | A: How will you get there? | B: First, we'll take the bus. Then we'll take the train. | the beach / another country / the mountains / the zoo / the city / the museum","SW | This summer, I plan {to visit my grandma}. I hope {to swim in the sea}. I promise {to study English every day}. | Write three sentences about your plans using a verb followed by to."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":6,"title":"Planet SinRota","bq":"Why are wheels important?","learn":["What does \"tedious\" mean? | boring and taking a long time","What does \"fragile\" mean? | easy to break or hurt","What does \"courageous\" mean? | brave","Spell the word \"determined\". | d-e-t-e-r-m-i-n-e-d","Spell the word \"fascinated\". | f-a-s-c-i-n-a-t-e-d","Use the present continuous for a future arrangement: We ___ (meet) our friends at 2:00 on Friday. | We are meeting our friends at 2:00 on Friday.","Which form is used for a future arrangement at a specific time: will, going to, or the present continuous? | the present continuous","How did Zoog travel to school on planet SinRota? | He hopped to school on a pogo stick, 5.36 kilometers each way.","What did Zoog see through his telescope on the blue planet? | Machines with circles, like cars, bicycles, trains and planes.","Would you like to live on a planet with no books, clocks or computers? Why?"],"battle":["T | Why was Zoog's life tedious? | His planet had no books, no clocks, no computers and no TV.","B | Planet SinRota now has wheels because of Zoog.","B | It was dark 17.7 hours a day on SinRota.","F | Tomorrow at ten, we will meeting our friends in the park. | Tomorrow at ten, we are meeting our friends in the park.","F | I'm seeing my teacher at 3:30 yesterday. | I'm seeing my teacher at 3:30 tomorrow. / I saw my teacher at 3:30 yesterday.","W | daring | Make a sentence about a daring thing someone did.","P | 🔭🪐🛹🚂 | What did Zoog discover? Tell the story.","C | Is a pogo stick or a bicycle better for getting to school? | A pogo stick | A bicycle","Z | Name three machines with wheels that Zoog drew.","S | What are you doing after school tomorrow? Say two arrangements."],"words":["obedient | o·be·di·ent | o/be/di/ent | 🐕","fortunate | for·tu·nate | for/tu/nate | 🍀","tedious | te·di·ous | te/di/ous | 😴","exciting | ex·cit·ing | ex/cit/ing | 🎢","fragile | frag·ile | frag/ile | 🥚","determined | de·ter·mined | de/ter/mined | 💪","daring | dar·ing | dar/ing | 🪂","foolish | fool·ish | fool/ish | 🤪","thrilling | thrill·ing | thrill/ing | 🎉","courageous | cou·ra·geous | cou/ra/geous | 🦁","risky | risk·y | risk/y | ⚠️","fascinated | fas·ci·nat·ed | fas/ci/nat/ed | 🔭","settlement | set·tle·ment | set/tle/ment | 🏘️","blurry | blur·ry | blur/ry | 🌫️"],"reading":["> Planet SinRota","> \"Zoog, hurry!\" yelled Zoog's dad. \"Your grandmother is sick. She has a fever and purple spots. Take your pogo stick and fetch Doctor P721.\"","> The obedient Zoog bounced off to the doctor's house as fast as his pogo stick would carry him. The doctor and his four assistants came and carried Zoog's fragile grandmother away on a special bed to make her better. Fortunately, people always got better on planet SinRota, where illness rarely lasted more than 15 hours.","> Zoog was tired. Earlier, he'd taken his pogo stick and hopped to school and back, a distance of 5.36 kilometers each way. He went up to his bedroom and looked through the brand-new telescope he'd received for his birthday the previous week. Zoog's life was tedious. His planet had no books, no clocks, no computers, and no TV. Far away in another settlement, Zoog had cousins, but there was no mail, so he couldn't communicate with them. Although he longed for a more exciting life, he felt fortunate that he had good friends and no serious problems.","> It was dark 17.7 hours a day on SinRota. Zoog searched the night sky. He was determined to find the magical planet he'd seen many nights in a row. Suddenly, there it was! The blue planet! Zoog gazed at it. The picture was blurry, but he could see areas of water, distant mountains, and patches of bright light. \"Who lives there,\" he wondered, \"and what do they do?\" If he looked hard at one spot for a long time, he occasionally glimpsed small figures with strange, circular objects propelling them along.","> Not only did Zoog have to go to school on a pogo stick, but it was also his job to do the shopping for his parents every evening. This meant dragging a heavy sled behind him to and from the store. At the store, he stacked up delicious orange munchballs and green yumsters on the sled and pulled it home before darkness fell. Everything he bought was grown in his settlement because it was too risky to bring food from other parts of Planet SinRota. Nobody could drag sleds further than a few kilometers, and the food would be spoiled long before it could reach another settlement. Even the animoogs couldn't drag sleds very far, so it was foolish to attempt long journeys. Zoog had never left the area he lived in: 5.36 kilometers was his limit, but he was courageous, and dreamed of exploring further.","> Zoog looked through his telescope again. He adjusted it slightly, and he was fascinated to see activity on the blue planet. The blurry figures he'd seen before suddenly came into sharp focus! There were figures driving around in vehicles of all shapes, sizes, and colors. There were figures riding bicycles. There were huge airplanes zooming fast up runways and flying into the air. It was thrilling! He also saw figures sitting on buses and trains, moving fast from one city to another. In a park, he could see small figures, children, playing on skateboards and in-line skates. They were leaping through the air. It looked incredibly daring. It was then that he had his big idea.","> \"I know what I'm going to do!\" said Zoog. He began to draw pictures of everything he could see, these wonderful machines with circles that made them move! Trains, planes, bicycles, skateboards, cars, buses, wheelchairs, ambulances, taxis, carts, wheelbarrows, motorcycles, trucks, roller coasters, Ferris wheels, helicopters, strollers, windmills... Zoog drew all night long.","> In the morning, Zoog ran downstairs and showed his parents the pictures. And in just a few short days, the history of SinRota changed completely and forever.","> Thanks to Zoog and his telescope, planet SinRota now has wheels! Things will never be the same again.","RC | How does Zoog go to school? | on a pogo stick | by bus | in his dad's car","RC | Why does SinRota's history change? | Zoog sees wheels | Zoog has a pogo stick | Zoog sees oceans","RC | What is the blue planet? | Earth | Mars | Jupiter","RT | Why was Zoog's life tedious? | His planet had no books, no clocks, no computers, and no TV.","RT | How does Zoog bring the groceries home? | He drags a heavy sled behind him to and from the store.","RT | What did Zoog do all night long? | Zoog drew pictures of the machines with circles all night long.","RS | Why was it too risky to bring food from other parts of SinRota?","RS | What did Zoog see on the blue planet? Tell us two things."],"grammar":["GT | Future with Present Continuous","R | **present continuous** + a time or place  →  an arrangement:  We **are meeting** our friends at 2:00 on Friday.","R | **will**  →  a future fact / belief:  The moon **will rise** at ten o'clock tonight.","R | **going to**  →  a plan / what you see:  I'm **going to take** a music class next year.","G | We are meeting our friends at 2:00 on Friday.","G | I'm seeing a movie on Tuesday afternoon.","G | The moon will rise at ten o'clock tonight.","G | Things will never be the same again.","G | I'm going to take a music class next year.","G | What are you doing after school?","G | How old will you be in five years?","G | I'm meeting my friends at the pizza place tomorrow."],"sw":["SP | A: Oh, no! {I missed the bus}. What should I do? | B: Why don't you ask your dad for help? | A: Good idea. Anything else? | B: You should tell your teacher what happened. | I missed the bus / My bicycle has a flat tire / I forgot my homework / I lost my key / I broke my skateboard / I'm late for school","SW | Last week, I {drew a picture of a car}. Yesterday, I {felt very happy} because {my team won the game}. | Write three sentences about last week using past tense verbs like drew, felt, became, dug, gave, and lit."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":7,"title":"Magdi and the Dolphin","bq":"How do animals communicate?","learn":["What does \"glide\" mean? | to move smoothly and quietly through water or air","What does \"paddle\" mean? | to move through water using your hands or a flat board","What does \"sprint\" mean? | to run very fast for a short distance","Spell the word \"dolphin\". | d-o-l-p-h-i-n","Spell the word \"propel\". | p-r-o-p-e-l","Change to reported speech: \"It's a beautiful day,\" said Magdi. | Magdi said that it was a beautiful day.","In reported speech with said that, what happens to the present tense verb? | It changes to the past tense.","Who are the two main characters in the story \"Magdi and the Dolphin\"? | A boy named Magdi and a dolphin.","What kind of text is \"Magdi and the Dolphin\"? | Narrative fiction, a story.","Would you like to swim with a dolphin? Why or why not?"],"battle":["T | What did Magdi say about the day? | Magdi said that it was a beautiful day.","B | Magdi said that it was a beautiful day.","B | The dolphin dived and splashed in the water.","F | Magdi said that it is a beautiful day. | Magdi said that it was a beautiful day.","F | She said that she like the dolphin. | She said that she liked the dolphin.","W | dive | Make a sentence with the word dive.","P | 🐬🌊👦🎣 | What is happening? Tell the story in your own words.","C | Which is more fun, swimming in the sea or jogging on the beach? | Swimming | Jogging","Z | Name three ways to move in water.","S | Tell us something your friend said yesterday. Use said that."],"words":["race | race | r/ace | 🏁","drift | drift | dr/ift | ☁️","glide | glide | gl/ide | 🐟","wade | wade | w/ade | 🚶","paddle | pad·dle | pad/dle | 🛶","dive | dive | d/ive | 🤿","splash | splash | spl/ash | 💦","propel | pro·pel | pro/pel | 🐋","float | float | fl/oat | 🛟","sprint | sprint | spr/int | 🏃","jog | jog | j/og | 👟","plod | plod | pl/od | 🐴","hook | hook | h/ook | 🪝","rough | rough | r/ough | 🌊"],"reading":["> Magdi and the Dolphin","> Magdi looked out of the window and saw clear blue skies. \"Yes!\" he shouted. \"It's a beautiful day! I can go fishing.\" \"Hi, Dad! Bye, Dad! It's a beautiful day! See you later!\" shouted Magdi. He was so excited that he was speaking very, very fast. He sprinted out of the house with his fishing rod.","> \"What did he say?\" asked his sister as she plodded slowly towards the window to look out at him.","> \"He said that it was a beautiful day for fishing,\" chuckled Magdi's dad with a big smile on his face. \"He's always happy when he goes fishing.\"","> Magdi raced to the beach and untied his little red fishing boat. Maybe today I'll catch a fish for dinner! he thought. He waded out into the warm, blue water, pushing the boat until it floated. Then he jumped into it and paddled toward some rocks.","> Magdi looked over the side of the boat and saw a lion fish. He knew that lion fish were very dangerous; they could sting you. Magdi sat and watched quietly as it dove under the boat and disappeared under a rock. Next, he saw a parrot fish, with its shiny blue, purple, and green scales, gliding through the water. Parrot fish are tasty, he thought. Maybe today I'll catch a parrot fish. Magdi put a piece of bread on the hook of his fishing rod and threw the fishing line into the water. Then he threw more bread into the water to attract the fish. Suddenly, hundreds of fish swam up to the boat. There were bright yellow fish, black-and-white fish that looked like zebras, fish with long noses, and big, fat puffer fish. Magdi knew all their names. He beamed with delight. Maybe I won't catch any fish today, he thought. They're beautiful! Maybe today I'll just watch them. Magdi pulled his paddles into the boat, turned onto his stomach to watch the fish, and fell asleep in the warm sun.","> Magdi woke up feeling chilly. Looking up, he saw black skies. Big waves were shaking his little red fishing boat, and it was drifting out to sea.","> Two of Magdi's friends, Malik and Ali, were jogging along the beach. They looked scared. \"Hey, Magdi! Magdi!\" they shouted. \"Come back! There's a storm!\" Their words floated across the water, carried by the wind.","> \"What did you say?\" Magdi yelled.","> \"We said that there was a storm!\" shouted Malik and Ali. \"Come back!\"","> Uh-oh! thought Magdi. He tried to paddle towards the beach, but the waves pushed him further away. A huge wave crashed onto his boat, throwing him into the water.","> \"Oh, no! Help! Help!\" Magdi cried. But just at that moment, he felt something under the water. A very big something! Then, to his surprise, he was moving through the waves at high speed, heading straight for the beach. He looked down and saw a beautiful, grinning face. It was a dolphin! The dolphin splashed and jumped through the water, carrying Magdi on its back. The dolphin used its powerful tail to propel its body through the water.","> When they got to the shallow water, the dolphin dropped Magdi on the sand and then swam up and down in front of him.","> \"Thank you, my friend,\" whispered Magdi. Every day afterward, Magdi and the dolphin played in the ocean. The dolphin taught Magdi tricks, such as how to dive deep down to the ocean floor, how to float, how to glide through the water, and how to stay away from a storm!","RC | What did Magdi see when he looked out of the window? | clear blue skies | black skies | a big storm","RC | What did Magdi put on the hook of his fishing rod? | bread | a worm | a small fish","RC | Who carried Magdi back to the beach? | a dolphin | his friends | a parrot fish","RT | Why was Magdi chilly when he woke up in the boat? | A storm was coming and the skies were black.","RT | What did Malik and Ali shout to Magdi? | They said that there was a storm.","RT | How did the dolphin move through the water? | The dolphin used its powerful tail to propel its body.","RS | Why did Magdi whisper \"thank you\" to the dolphin?","RS | What tricks did the dolphin teach Magdi? Tell us two."],"grammar":["GT | Reported Speech with Said That","R | \"It's a beautiful day,\" said Magdi.  →  Magdi **said that** it **was** a beautiful day.","R | \"I'm working,\" said Tom.  →  Tom **said that** he **was** working.","R | present  →  **past** in reported speech","G | Magdi said that it was a beautiful day.","G | Tom said that he was working.","G | He said that he was going fishing.","G | She said that she didn't like cats.","G | They said that there was a storm.","G | His dad said that Magdi was always happy.","G | What did he say to his sister?","G | My friend said that she liked dolphins."],"sw":["SP | A: When I was five, I {fell out of a tree}. | B: How did that happen? | A: I was climbing with my brother. Suddenly, I slipped! | B: Oh, no! What happened next? | fell out of a tree / fell off my bike / got lost at the beach / broke my arm / fell into a pool / lost my dog","SW | We had a big storm last night, but {it cleared up this morning}. {Magdi} went fishing; {a dolphin} saved him. | Write two sentences that join two ideas with a comma and a conjunction or with a semicolon."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":true},{"n":8,"title":"Chatterboxes: Animal Communication","bq":"How do animals communicate?","learn":["What does \"communicative\" mean? | willing and able to share information with others","What does \"locate\" mean? | to find where something is","What does \"threaten\" mean? | to show that you may hurt someone","Spell the word \"collaborate\". | c-o-l-l-a-b-o-r-a-t-e","Spell the word \"attract\". | a-t-t-r-a-c-t","Change to reported speech: He told us, \"Kanzi is learning new things every day.\" | He told us that Kanzi was learning new things every day.","Which two verbs do we use to report speech to a person: ___ or ___? | told or asked","Why do honeybees do the waggle dance? | The dance helps other bees locate the nectar, water or pollen.","How loud can a hippo's bellow be on land? | Up to 115 decibels, as loud as thunder or a jet plane.","Do you think animals can really talk to each other? Why?"],"battle":["T | How do rabbits warn other rabbits of danger? | Rabbits thump their powerful back paws on the ground.","B | Honeybees dance to communicate with other bees.","B | Vervet monkeys have alarm signals for each predator.","F | He told us that Kanzi learns new things every day. | He told us that Kanzi was learning new things every day.","F | She asked me what I am doing. | She asked me what I was doing.","W | defend | Make a sentence about how an animal defends its territory.","P | 🐝💃🌸📍 | What are the bees doing? Explain the waggle dance.","C | Which is the better way to communicate, sounds or body movements? | Sounds | Body movements","Z | Name three reasons that animals communicate.","S | Tell us what your teacher told you to do today. Use told that."],"words":["communicative | com·mu·ni·ca·tive | com/mu/ni/ca/tive | 🗣️","locate | lo·cate | lo/cate | 📍","collaborate | col·lab·o·rate | col/lab/o/rate | 🤝","attract | at·tract | at/tract | 🧲","threaten | threat·en | threat/en | 🐍","defend | de·fend | de/fend | 🛡️","imitate | im·i·tate | im/i/tate | 🦜","behave | be·have | be/have | 😇","indicate | in·di·cate | in/di/cate | 👉","approach | ap·proach | ap/proach | 🦁","express | ex·press | ex/press | 😊","produce | pro·duce | pro/duce | 🐯","territory | ter·ri·to·ry | ter/ri/to/ry | 🗺️","signal | sig·nal | sig/nal | 🚨"],"reading":["> Chatterboxes","> Do you think animals can communicate? No? Think again! There are three main types of animal communication, and they all happen for different reasons.","> Communication Between Animals of the Same Species. Defending Territory and Attracting a Mate: Many animals are communicative. Hippos, for example, communicate underwater and on land, but mostly they communicate underwater, by making noises called grunts and bellows. On land, the volume of their bellows can reach 115 decibels. That's as loud as thunder or a jet plane! They communicate with each other to defend their territory, which is their own space. Hippos bellow when they fight other hippos and when they want to attract a mate.","> Food: Honeybees do a special kind of dance called the waggle dance when they find nectar, water, or pollen. The dance is like a map of their journey. The dance helps other bees locate the nectar, water, or pollen.","> Danger! Most animals have predators that want to kill and eat them. Lions, cheetahs, and eagles prey on vervet monkeys, so the monkeys have alarm signals for each predator. When vervet monkeys hear the lion or cheetah signal, they climb trees to protect themselves. When they hear the eagle signal, they hide on the forest floor. Rabbits thump their powerful back paws on the ground to warn other rabbits of danger. Beavers slap their tails hard against the water to scare away any foxes and alligators that approach.","> Communication Between Animals of Different Species. Warning! Predators threaten their prey, so what animals need is a warning sign. Rattlesnakes have a rattle on the end of their bodies that they shake when they feel threatened. The loud noise scares away predators. Similarly, wolves growl and show their teeth to warn enemies that they will fight.","> Food: A type of lizard, called a gecko, and an insect, called a treehopper, cooperate with each other. They both eat honeydew, a sweet, sticky liquid that trees produce. The gecko sees the treehopper vibrating its stomach, so it knows that the treehopper is eating honeydew. The gecko shakes its head to indicate to the treehopper that it wants honeydew. The treehopper throws honeydew toward the gecko, which catches it in its mouth. Why does the hopper behave like this? It's possible that the gecko protects the hopper from predators.","> The honeyguide is a bird that eats beeswax and helps honey badgers find honey. Although it is good at finding beehives, the honeyguide has difficulty getting into the hives. The honey badger eats honey, but it has trouble finding hives, and so these two animals collaborate. The honeyguide expresses itself by making noises and flapping its wings to attract a honey badger. Once the honey badger has climbed a tree and broken open the hive, it eats the honey, and the honeyguide gets to eat, too!","> Communication Between Humans and Animals: Dolphins, apes, and parrots are the animals that have communicated the most with humans. A famous bonobo ape, Kanzi, was the first non-human to learn language the way a child does, by listening and observing. A scientist said that Kanzi had learned 450 words using a keyboard. He also told us that Kanzi was learning new things every day.","> Alex was a grey parrot who, like most parrots, could imitate words, but he could also identify objects, colors, and shapes. He died when he was 31. His last words to his trainer, Dr. Pepperberg, were: \"You be good. I love you.\" Dr. Pepperberg said Alex had started to learn the alphabet. Every time Alex got a letter right, he told Dr. Pepperberg that he wanted a nut!","RC | Where do hippos mostly communicate? | underwater | in trees | on the sand","RC | How do honeybees communicate? | with a dance | with grunts | with a song","RC | What do vervet monkeys' alarm signals warn about? | danger | food | the weather","RT | Why do hippos bellow? | Hippos bellow to defend their territory and to attract a mate.","RT | What do rabbits do to warn other rabbits of danger? | Rabbits thump their powerful back paws on the ground.","RT | How many words did Kanzi learn using a keyboard? | Kanzi learned 450 words using a keyboard.","RS | How do the honeyguide and the honey badger collaborate?","RS | What could Alex the parrot do? Tell us two things."],"grammar":["GT | Reported Speech with Told or Asked","R | **told** + person + **that**:  He **told us that** Kanzi **was** learning new things every day.","R | **asked** + person:  A classmate **asked the scientist** what Kanzi **was** learning.","R | present  →  **past** in reported speech","G | He told us that Kanzi was learning new things.","G | A classmate asked the scientist what Kanzi was learning.","G | She said that she was learning about animal communication.","G | He told me that he was studying about crocodiles.","G | I asked my father what time it was.","G | Wei told me that he was interested in wild animals.","G | Alex told Dr. Pepperberg that he wanted a nut.","G | How many words do you know?"],"sw":["SP | A: What did you learn about animals? | B: I learned that {honeybees communicate by dancing}. | A: What else did you learn? | B: I learned that hippos bellow to defend their territory. | honeybees communicate by dancing / hippos bellow underwater / rabbits thump their back paws / rattlesnakes shake their rattles / wolves growl and show their teeth / parrots imitate words","SW | {Dolphins} are communicative animals. {They} use sounds and movement. Everybody {likes} dolphins. | Write three sentences about an animal, and make sure each pronoun and verb matches its noun."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":9,"title":"Journey Back in Time: Ancient Civilizations","bq":"What can we learn from ancient civilizations?","learn":["What does \"civilization\" mean? | a society with its own culture, cities and way of life","What does \"contribution\" mean? | something a person or group gives to make something better","What does \"tradition\" mean? | a custom or belief passed from older people to younger people","Spell the word \"ceremony\". | c-e-r-e-m-o-n-y","Spell the word \"achievement\". | a-c-h-i-e-v-e-m-e-n-t","In the question \"Who saw Finn?\", is who the subject or the object? | the subject","Answer the question with the picture clue: Who did Finn see? | Finn didn't see anybody.","Where did the Olympic Games start? | In Greece, a country in Europe.","What kind of text is \"Journey Back in Time\"? | A historical narrative, nonfiction.","Which invention from the past do you think is the most important? Why?"],"battle":["T | What is the difference between \"Who saw Finn?\" and \"Who did Finn see?\" | In the first question who is the subject, in the second who is the object.","B | Who did you write to yesterday afternoon?","B | Greece is a country in Europe.","F | Who did see Finn? | Who saw Finn?","F | Who you saw at the party? | Who did you see at the party?","W | culture | Make a sentence about your country's culture.","PT | 🏛️📜⚱️🏺 | Write a question about this ancient civilization.","C | Is it better to keep old traditions or to make new ones? | Keep old traditions | Make new ones","Z | Name three question words.","S | Ask your partner three questions about what they did yesterday."],"words":["culture | cul·ture | cul/ture | 🎭","civilization | civ·i·li·za·tion | civ/i/li/za/tion | 🏛️","contribution | con·tri·bu·tion | con/tri/bu/tion | 🎁","process | proc·ess | proc/ess | ⚙️","tradition | tra·di·tion | tra/di/tion | 🎎","development | de·vel·op·ment | de/vel/op/ment | 🌱","achievement | a·chieve·ment | a/chieve/ment | 🏆","device | de·vice | de/vice | 🧭","custom | cus·tom | cus/tom | 👘","benefit | ben·e·fit | ben/e/fit | 👍","ceremony | cer·e·mo·ny | cer/e/mo/ny | 💒","product | prod·uct | prod/uct | 📦","voyage | voy·age | voy/age | ⛵","ancient | an·cient | an/cient | 🏺"],"reading":["> Journey Back in Time","> Imagine traveling back in time! Who do you see? Who sees you? Where would you go? What amazing things might you discover there? Many countries have made contributions to our modern life. Some have invented things; others have given us art, music, and stories.","> Mesopotamia: You start your journey in ancient Mesopotamia. That's a place we now call Iraq. Mesopotamia was between two huge rivers: the Euphrates and the Tigris. The people there needed good boats to travel on these rivers so they could explore and trade. So, five thousand years ago, the Mesopotamians invented a new type of sailboat. Their design is still being used today!","> One of these sailboats can take you to many different places along the route of your journey. Before you leave Mesopotamia, be sure to visit a city called Sumer. Many things were invented there. What Sumerian invention can you take on your journey? Their most important invention was something you can take with you anywhere: writing! The Mesopotamians in Sumer found a way to make pictures on clay tablets (flat pieces of clay) to tell a story.","> Egypt: From the Tigris River, you sail all the way to the Mediterranean Sea. Now you can see the coast of Egypt. The Egyptians were very good at math, medicine, architecture, and sculpture. They had a rich culture of art, music, and a form of writing called hieroglyphics. They learned to make paper from a plant called papyrus. This development means that today, we benefit from the invention of paper in books, magazines, and newspapers.","> China: The next country you visit cannot be reached by sailboat. China is over 5,000 miles away from Egypt. You will be tired when you reach China, but your trip is not finished. You have one more long voyage to make, across the Pacific Ocean. Luckily, the Chinese have invented a device called a compass. This is a very important invention. It helps you find your way on land or sea by always pointing to the north. It was originally invented to help Chinese sailors navigate. Now we have compasses in many products we use, like our cell phones and in our cars, so no one needs to get lost.","> Mexico: Using your compass, you can sail all the way across the Pacific Ocean to Mexico. Take a look at a map. That's quite an achievement! There, you will explore another ancient civilization: the Maya. This was a very advanced civilization, with many interesting customs and traditions. The Maya created and discovered many important things using only very simple tools. They were excellent astronomers and mathematicians. They developed a written language using hieroglyphs, and they built huge pyramids and sculptures. The Maya produced many different goods, including tools, jewelry, and cloth. They also made a new kind of drink by mixing cocoa beans with spices, water, and chilies. They used the drink in special ceremonies and to make people healthy. Though the special Mayan drink tasted bitter, what they made using this process was actually a kind of chocolate. Until the Maya made this contribution, no one had ever tasted chocolate before.","> You have sailed on a Sumerian boat, found your way with a Chinese compass, and you can write all about your journey on some Egyptian papyrus!","RC | What did the Mesopotamians invent five thousand years ago? | a sailboat | a compass | paper","RC | Where was paper invented? | Egypt | China | Mexico","RC | Which device always points to the north? | a compass | a clay tablet | a telescope","RT | What two things did the ancient Mesopotamians invent? | They invented a new type of sailboat and writing.","RT | Why is a compass important? | It helps you find your way on land or sea by always pointing to the north.","RT | What did the Maya mix to make their chocolate drink? | They mixed cocoa beans with spices, water, and chilies.","RS | What were the Egyptians good at? Tell us two things.","RS | Which invention in the narrative do you think is the most important? Why?"],"grammar":["GT | Asking Questions","R | **Who saw** Finn?   (Who = the subject)  →  Finn's mom saw Finn.","R | **Who did** Finn **see**?   (Who = the object)  →  Finn didn't see anybody.","R | who · where · when · why · what · which · how","G | Who did Finn see?","G | Who saw Finn at home?","G | Who did you write to?","G | What are you watching?","G | Who helped you with your homework?","G | Who are you traveling with?","G | Where are you going tomorrow?","G | Who did you see yesterday?"],"sw":["SP | A: What invention do you think is important? | B: I think the {compass} is a very important invention. | A: Who invented it? | B: It was invented a long time ago, and we still use it today. | compass / sailboat / paper / whiteboard / telephone / computer","SW | {Madrid} ({the capital of Spain}) is a beautiful city. {Mr. Sonn} ({my math teacher}) lives near my house. | Write two sentences that use parentheses to give extra information."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":true},{"n":10,"title":"Choco Choco Boom Boom!","bq":"What can we learn from ancient civilizations?","learn":["What does \"creamy\" mean? | smooth and thick like cream","What does \"crunchy\" mean? | hard and making a noise when you bite it","What does \"booming\" mean? | very loud and deep","Spell the word \"delicious\". | d-e-l-i-c-i-o-u-s","Spell the word \"spicy\". | s-p-i-c-y","Give the short answer: Is there a chocolate shop near here? Yes, ___. | Yes, there is.","Give the short answer: Do you like my new sneakers? Yes, ___. | Yes, I do.","Which city did Akiko visit to find chocolate? | Brussels, the capital of Belgium.","What colors are on the flag Akiko saw on the palace? | Black, yellow and red.","Do you think chocolate is a good gift? Why or why not?"],"battle":["T | Why did Akiko want to visit Brussels? | Everyone said that Belgian chocolate was the best in the world.","B | The air was full of delicious, nutty smells.","B | Akiko loved chocolate more than anything else.","F | Is there a chocolate shop near here? Yes, it is. | Is there a chocolate shop near here? Yes, there is.","F | Do you like chocolate? Yes, I like. | Do you like chocolate? Yes, I do.","W | sticky | Make a sentence about something sticky.","P | 🚂🍫🏰🇧🇪 | Where is Akiko going? Tell the story.","C | Which is better, crunchy chocolate or smooth chocolate? | Crunchy | Smooth","Z | Name three words that describe how food tastes.","S | Ask your partner two yes or no questions about food and get short answers."],"words":["delicious | de·li·cious | de/li/cious | 😋","creamy | cream·y | cream/y | 🍦","spicy | spic·y | spic/y | 🌶️","nutty | nut·ty | nut/ty | 🥜","ladle | la·dle | la/dle | 🥄","sticky | stick·y | stick/y | 🍯","crunchy | crunch·y | crunch/y | 🍎","runny | run·ny | run/ny | 🧈","smooth | smooth | sm/ooth | 🍫","whirring | whir·ring | whir/ring | 🌀","booming | boom·ing | boom/ing | 📢","spot | spot | sp/ot | 👀","dizzy | diz·zy | diz/zy | 😵","famous | fa·mous | fa/mous | ⭐"],"reading":["> Choco Choco Boom Boom!","> The wheels on the train seemed to be talking to Akiko. They made a rhythmic, whirring noise: choco boom boom, choco choco boom boom, choco boom boom.","> \"Brussels. Capital of Belgium. Next stop!\" said the guard in a booming voice. \"Is this your stop?\" he asked.","> \"Yes, it is,\" replied Akiko excitedly. \"Chocolate City!\" Akiko loved chocolate, but what she wanted to taste most of all was Belgian chocolate. Everyone said that it was the best chocolate in the world.","> Akiko glanced quickly at her map and ran down a long street. The air was full of delicious smells, creamy, nutty smells. Akiko breathed deeply. Soon, she thought, she would find a store and she would buy a selection of Belgian chocolates. Akiko turned a corner. In front of her, there was a palace belonging to the King and Queen of Belgium. Looking up at the roof, Akiko spotted a black, yellow, and red flag, and beyond the palace, a big town square. Maybe I'll find my chocolate there, she thought.","> As Akiko skidded into the square, she couldn't believe her eyes. All around her, there were massive buildings decorated with statues, and flower sellers were selling red, yellow, and white flowers.","> \"Excuse me,\" Akiko said to a man selling French fries and spicy sausages. \"Is there a chocolate store near here?\"","> \"Yes, there is,\" laughed the man. \"There's one right down that street. It makes crunchy chocolate, smooth chocolate - all kinds of chocolate!\"","> Akiko zoomed straight into the store. Her heart was pounding: choco boom boom, choco choco boom boom.","> \"May I please have five of your best chocolates?\" Akiko asked the man behind the counter.","> \"Of course,\" he replied, selecting the chocolates. \"And this extra one,\" he said, handing her a perfectly round chocolate, \"is extremely special. It's called a praline.\" Akiko closed her eyes and bit the chocolate exactly in half. Everything went dark and she felt slightly dizzy. Her heart was racing again: choco boom boom, choco choco boom boom. She opened her eyes, and to her astonishment, she saw a strange kitchen with a large stove, a wooden table, and shiny pots and pans everywhere. Stirring hot, sticky, runny chocolate in one of the pots was a man who looked just like the man in the store, but he was wearing strange, old-fashioned clothes. \"Welcome,\" he said softly. \"I've been expecting you.\"","> Akiko approached the man, sniffing the delicious smells around her.","> \"Do you smell that?\" he whispered. \"It's a praline, my latest invention. People will love it!\"","> Akiko was confused. Pralines had been invented in 1912 by someone called Jean Neuhaus. Unless ... that was it! The special praline she'd bitten in half had taken her back in time! And the man standing before her was the famous Jean Neuhaus.","> \"Let's make some,\" said Jean. Together, Jean and Akiko mixed butter, sugar, chocolate, and almonds, and ladled it into small molds to set. Akiko was the happiest she'd been in her life. Not only had she tasted Belgian chocolates, but now she knew the recipe for pralines.","> \"Time to go now,\" said Jean as he poured out the last drop of chocolate. \"You know what to do, don't you?\" \"Yes, I do,\" said Akiko. And she swallowed the other half of the praline she'd been given.","> Everything went dark again, and the dizziness Akiko had felt earlier returned. Choco boom boom, choco choco boom boom went her heart, and suddenly there she was, back in the store. The man behind the counter winked at her, and with a big smile, he said, \"Never forget. Belgian chocolate is the very best in the world.\"","RC | How does Akiko travel to Belgium? | by train | by bus | by plane","RC | Where does Akiko find chocolate? | in a store | in a palace | in a square","RC | How did Akiko feel when she bit the praline in half? | dizzy | sick | hungry","RT | Who invented pralines, and when? | Jean Neuhaus invented pralines in 1912.","RT | What did Jean and Akiko mix to make pralines? | They mixed butter, sugar, chocolate, and almonds.","RT | What did Akiko spot on the roof of the palace? | She spotted a black, yellow, and red flag.","RS | How did Akiko go back in time? Tell us what happened.","RS | Why was Akiko the happiest she'd been in her life?"],"grammar":["GT | Short Answers","R | Is there a chocolate shop near here?  →  **Yes, there is.**","R | Do you like my new sneakers?  →  **Yes, I do!**","R | Has it stopped raining?  →  **No, it hasn't.**","G | Is there a chocolate store near here? Yes, there is.","G | Do you like my new sneakers? Yes, I do!","G | Has it stopped raining? No, it hasn't.","G | Did you have pizza for dinner last night?","G | Can you snowboard? No, I can't.","G | Are you fifteen years old? No, I'm not!","G | Have you ever made chocolate? Yes, I have.","G | Did your family ever go to Belgium?"],"sw":["SP | A: How about we {go to a movie} together? | B: That's a great idea! | A: Should we have a snack first? | B: OK, let's do that. | go to a movie / have a snack / watch a TV show / go to the mall / study for the test / make chocolate","SW | I like many different foods, for example, {chocolate}, {apples}, and {pizza}. I can do several things well, such as {swimming} and {drawing}. | Write two sentences that give examples with for example, for instance, or such as."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":true},{"n":11,"title":"What's So Good About Mountains?","bq":"Why are mountains important?","learn":["What does \"glacier\" mean? | a very large, slow-moving river of ice","What does \"altitude\" mean? | the height of a place above the sea","What does \"terrace\" mean? | a flat step built into a steep hillside to grow crops","Spell the word \"valley\". | v-a-l-l-e-y","Spell the word \"vapor\". | v-a-p-o-r","Change to the passive: People find corn in the mountains. | Corn is found in the mountains.","Change to the passive: Do farmers grow potatoes in the Andes? | Are potatoes grown in the Andes?","Why are mountains called the water towers of the world? | They store water as snow and ice and provide fresh water for over half of all people.","Where did potatoes first come from? | From the Andes, the world's longest mountain range.","Would you like to live in the mountains? Why or why not?"],"battle":["T | Where does the Ganges River start? | The Ganges River starts in the Himalayan mountain range.","B | Mountains provide fresh water for billions of people.","B | Potatoes are grown in the Andes Mountains.","F | Corn is find in the mountains. | Corn is found in the mountains.","F | Are potatoes grow in the Andes? | Are potatoes grown in the Andes?","W | peak | Make a sentence about the peak of a mountain.","P | 🏔️❄️💧🌾 | How do mountains give us water and food? Explain.","C | Which is more important, mountains for water or mountains for food? | Water | Food","Z | Name three animals that live in the mountains.","S | Describe the water cycle in three sentences."],"words":["glacier | gla·cier | gla/cier | 🧊","peak | peak | p/eak | ⛰️","altitude | al·ti·tude | al/ti/tude | 🏔️","valley | val·ley | val/ley | 🏞️","steep | steep | st/eep | 🧗","slope | slope | sl/ope | ⛷️","hill | hill | h/ill | 🌄","terrace | ter·race | ter/race | 🌾","effective | ef·fec·tive | ef/fec/tive | ✅","vapor | va·por | va/por | 💨","resources | re·sourc·es | re/sourc/es | 🪵","condenses | con·dens·es | con/dens/es | 💧","impossible | im·pos·si·ble | im/pos/si/ble | 🚫","impatient | im·pa·tient | im/pa/tient | ⏳"],"reading":["> What's So Good About Mountains?","> Water! When you're thirsty, you drink water. When you want to take a shower, you turn on a faucet. But did you ever think about where all the water comes from? One reason mountains are important is that they provide fresh water for over half of all the people in the world. That's about three-and-a-half billion people! Can you imagine how much water is used by all those people?","> When the sun warms water in rivers and oceans, the liquid is transformed into water vapor that rises into the air. When enough water vapor cools, it condenses, and small drops of water are formed. The drops of water turn into clouds. In the clouds, small drops of water join to make larger drops. When those drops become too heavy, they are released as rain or snow. Some rain soaks into the ground, and some of the rain runs over the ground into streams, rivers, lakes, and the ocean. This process is called the water cycle.","> Mountains can affect the water cycle. The size and shape of a mountain pushes the water vapor up toward the mountaintop. When water drops fall on mountains, most of the water is stored as snow, and as ice in glaciers. When the snow melts in the spring, the water flows down the slopes into streams, waterfalls, and rivers. Mountains are effective in storing water and are sometimes called the \"water towers\" of the world.","> All of the big rivers on Earth start in the mountains. For example, in India, the Ganges River starts in the Himalayan mountain range and flows for 2,500 kilometers into the Bay of Bengal and the Indian Ocean. Another example is the Rio Grande, which begins in the Rocky Mountains in the United States and flows all the way down to the Gulf of Mexico.","> Animals! Mountains are also important because they provide homes to many animals that don't exist anywhere else on Earth. You can find mountain gorillas in the mountains of East Africa and special bears called spectacled bears in the Andes. There are also snow leopards in the Himalayas.","> Mount Cameroon is a mountain that is also one of Africa's largest active volcanoes, rising to more than 4,000 meters at its peak. It has 210 different species of birds and 70 species of butterflies. Mountains are home to many amazing animals and birds. Unfortunately, some of these animals are becoming rare. This is happening because people are taking more land and using more resources, such as water and wood. They are building farms and roads in the mountains. This means animals have less space to make their homes and find food.","> Food! Did you know that 80 percent of the food we eat comes from just 20 types of plants? Six of these plants are found in the mountains! Do you like French fries? Well, guess what? Potatoes first came from the Andes, the world's longest mountain range, which stretches 7,000 kilometers through South America. Today, farmers in the Andes grow 2,000 different types of potatoes.","> In the mountains of Nepal, about 2,000 different types of rice are farmed. Corn is found in the Sierra Mountains of Mexico. And the best quality tea and coffee are grown at an altitude of about 1,500 meters. Farmers sometimes build terraces into steep mountainsides and hills to grow crops and help control the flow of water. The terraces made by Inca Indians 500 years ago are still used by farmers in the Andes Mountains in Peru.","> Remember how water from rain and snow flows down mountains? With rich soil and a lot of water, mountain valleys are often good places to grow fruits, vegetables, and other crops.","RC | In the mountains, where is most of the water stored? | in snow and ice | in the trees | in rocks","RC | How many species of birds live on Mount Cameroon? | 210 | 70 | 2,000","RC | Which food first came from the Andes? | potatoes | oranges | seaweed","RT | Why are mountains called the water towers of the world? | Mountains are effective in storing water.","RT | Where does the Ganges River start? | The Ganges River starts in the Himalayan mountain range.","RT | Why do farmers build terraces into steep mountainsides? | They build terraces to grow crops and help control the flow of water.","RS | Why are some mountain animals becoming rare?","RS | Why are mountains important? Tell us two reasons."],"grammar":["GT | Passive","R | active:  People **find** corn in the mountains.  →  passive:  Corn **is found** in the mountains.","R | active:  **Do** farmers **grow** potatoes in the Andes?  →  passive:  **Are** potatoes **grown** in the Andes?","G | People find corn in the mountains.","G | Corn is found in the mountains.","G | Are potatoes grown in the Andes?","G | Potatoes are eaten all over the world.","G | Pizza is eaten in many countries.","G | Mountains are called the water towers of the world.","G | Rice is not grown in England.","G | French fries are made from potatoes."],"sw":["SP | A: Where would yo

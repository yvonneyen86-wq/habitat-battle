their hands. An orchestra snare drum is usually 15 centimeters deep, but a djembe can be over 60 centimeters deep.","RC | How many strings does an erhu have? | two | four | six","RC | Where are the panpipes traditionally played? | Peru | China | Australia","RC | What is the didgeridoo made of? | wood | metal | bamboo","RT | How does a string instrument make music? | It makes music when its strings vibrate.","RT | What do djembe drummers use to make a sound? | Djembe drummers use their hands.","RT | What are the four families of instruments? | They are strings, woodwinds, brass, and percussion.","RS | How are the flute and the panpipes different? Tell us one thing.","RS | How are the tuba and the didgeridoo alike?"],"grammar":["GT | Comparative Adjectives with As","R | **as** + adjective + **as**  →  the same:  The sound of the didgeridoo is **as low as** the tuba's sound.","R | **not as** + adjective + **as**  →  different:  The didgeridoo is **not as curved as** the tuba.","G | The drum is as loud as the falling rain.","G | The flute is as sharp as a whistle from a train.","G | The tuba is as low as the traffic in the street.","G | The didgeridoo is not as curved as the tuba.","G | A violin is not as big as a cello.","G | Is a clarinet as long as a bassoon?","G | My pencil isn't as long as yours.","G | I'm as happy as my dancing feet."],"sw":["SP | A: My instrument is shiny. It's as long as my arm. | B: Is it a {flute}? | A: Yes, it is! Now it's your turn. | B: My instrument is round, and you hit it with your hands. | flute / violin / tuba / djembe / clarinet / erhu","SW | My favorite instrument is the {djembe}. It's a {percussion} instrument. Its sound is {as steady as my heartbeat}. | Write about an instrument using it's and its."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":13,"title":"Simple Machines","bq":"How do inventions change our lives?","learn":["What does \"lever\" mean? | a board that rests on a point and lifts things when you push one end","What does \"wedge\" mean? | a tool with a sharp edge that pushes things apart","What does \"ramp\" mean? | a flat surface with one high end and one low end","Spell the word \"seesaw\". | s-e-e-s-a-w","Spell the word \"screw\". | s-c-r-e-w","Finish the sentence: I loved that movie! I did, ___. | too","Finish the sentence: I didn't do well on the test. I didn't, ___. | either","Which simple machine is a hammer? | a lever","Name two things that use a wheel and axle. | cars and bicycles","Which invention is the most important in your life? Why?"],"battle":["T | Agree with this sentence: I like riding my bike. | I do, too.","T | Why are hills and mountains called ramps? | They have one high end and one low end.","B | A knife and a fork are both wedges.","F | Harry doesn't fall off and Jay doesn't, too. | Harry doesn't fall off and Jay doesn't, either.","F | I climbed up the stairs. I did, either. | I climbed up the stairs. I did, too.","W | doorknob | Make a sentence about a doorknob.","PT | 🔨🔧🔪🔩 | Which simple machine is each tool? Type one sentence.","C | Is a ramp more useful than a ladder? | A ramp | A ladder","Z | Name three simple machines.","S | Explain how a seesaw works in two sentences."],"words":["lever | le·ver | le/ver | ⚖️","ramp | ramp | r/amp | ♿","wedge | wedge | w/edge | 🔪","screw | screw | scr/ew | 🔩","doorknob | door·knob | door/knob | 🚪","slide | slide | sl/ide | 🛝","axe | axe | a/xe | 🪓","seesaw | see·saw | see/saw | 🎠","crowbar | crow·bar | crow/bar | 🛠️","wagon | wag·on | wag/on | 🛒","nails | nails | n/ails | 🔨","stairs | stairs | st/airs | 🪜"],"reading":["> Simple Machines in Our Daily Lives","> What are simple machines? They are inventions that people thought of thousands of years ago to make their lives easier. Did you know that we use those same simple machines every day in our modern world? Let's look at some of our modern inventions that are actually simple machines!","> The Lever: There are many modern inventions that are levers. A hammer is a lever that can pull out nails. A pair of scissors is a lever, too. When you ride on a seesaw in the playground, you're using a lever. The board rests on a point in the middle. When you push down on one end of the board, the other end goes up.","> The Wheel and Axle: A wheel and axle is a simple machine, but important for many modern inventions. An axle goes into the middle of a wheel, making it easy to turn. Many vehicles use a wheel and axle: cars, trucks, and bicycles. Without the wheel and axle, we wouldn't have Ferris wheels. We wouldn't have doorknobs, either. They both use a wheel and axle.","> The Wedge: A wedge is like two ramps put together, so that one edge is sharp. You might ask, \"When would I need a wedge?\" If you enjoy eating, you need one almost every day! A knife and a fork are both wedges which cut into food. So is an axe, which people use for chopping wood. We use the sharp edge to push things apart.","> The Ramp: A ramp is a flat surface that has one high end and one low end. This simple machine makes it easier and safer to go up or down. People in wheelchairs use ramps to go in and out of buildings. Another example of a ramp is a slide. It allows you to move quickly and safely from a high place to a low place. There are many ramps in nature, too. They are called hills and mountains!","> The Screw: A screw is a ramp that winds around and around in a circle. When you turn the screw, it moves and pushes against something else. Some light bulbs have screws. You turn the light bulb one way to push it tightly against the lamp, and you turn it the opposite way to remove it. Jar lids and some pens also have screws to keep them in place. Without the screw, it would be very difficult to hold things together tightly.","RC | What simple machine is a hammer? | a lever | a wedge | a screw","RC | A knife and a fork are both what? | wedges | ramps | levers","RC | Which simple machine has one high end and one low end? | a ramp | a screw | a lever","RT | What happens when you push down on one end of a seesaw? | The other end of the board goes up.","RT | What do people in wheelchairs use to go in and out of buildings? | They use ramps to go in and out of buildings.","RT | What simple machine does a doorknob use? | A doorknob uses a wheel and axle.","RS | Why do you need a wedge almost every day?","RS | What are the ramps in nature? Tell us one more ramp from the text."],"grammar":["GT | Too and Either","R | positive + **too**:  A hammer is a lever.  A seesaw is a lever, **too**.","R | negative + **either**:  The wedge isn't a new invention.  The ramp isn't, **either**.","G | A hammer is a lever.","G | A seesaw is a lever, too.","G | The wedge isn't a new invention.","G | The ramp isn't, either.","G | Cars use a wheel and axle, and bicycles do, too.","G | Harry likes the seesaw and Jay does, too.","G | Harry doesn't fall off and Jay doesn't, either.","G | Is a slide a ramp, too?"],"sw":["SP | A: Airplanes make it easier to travel all around the world. | B: That's true. I was thinking about {cell phones}. We can use them to call our friends. | A: That's a good one. I was also thinking about light bulbs. | B: Yes! They make our nights bright. | cell phones / computers / cars / bicycles / televisions / scissors","SW | {The screw} and {the lever} are simple machines. I use {a screw} every day when I {turn on a lamp}. | Write about two simple machines you use every day."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":14,"title":"Clara's Invention","bq":"How do inventions change our lives?","learn":["What does \"glassblower\" mean? | a person who makes glass items by blowing air into hot glass","What does \"delicate\" mean? | easy to break","What does \"workshop\" mean? | a room where someone makes or fixes things","Spell the word \"eyeglasses\". | e-y-e-g-l-a-s-s-e-s","Spell the word \"furnace\". | f-u-r-n-a-c-e","Give the comparative adverb of \"fast\". | faster than","Give the superlative adverb of \"carefully\". | the most carefully","What did Antonio Rossi make? | beautiful glass items such as vases and pitchers","What did Clara invent? | eyeglasses","What invention would you like to make? Why?"],"battle":["T | Compare how you and a friend run. | I run faster than my friend.","T | What happened when Clara bumped the vases? | The vases fell to the ground and broke.","B | Antonio made his glassware faster than before.","F | He ran more fast than me in the race. | He ran faster than me in the race.","F | Our class walked quietly than their class. | Our class walked more quietly than their class.","W | wire | Make a sentence with the word wire.","P | 🏺💥👓📖 | What did Clara do? Tell the story.","C | Are eyeglasses a better invention than the telephone? | Eyeglasses | The telephone","Z | Name three things made of glass.","S | Tell us who gets up the earliest in your family and who gets up the latest."],"words":["eyeglasses | eye·glass·es | eye/glass/es | 👓","vase | vase | v/ase | 🏺","furnace | fur·nace | fur/nace | 🔥","wire | wire | w/ire | 🔌","workshop | work·shop | work/shop | 🛠️","frames | frames | fr/ames | 🕶️","glass | glass | gl/ass | 🪟","glassblower | glass·blow·er | glass/blow/er | 🫧","glassware | glass·ware | glass/ware | 🥛","pitcher | pitch·er | pitch/er | 🫗","computer | com·put·er | com/put/er | 💻","airplane | air·plane | air/plane | ✈️","television | tel·e·vi·sion | tel/e/vi/sion | 📺"],"reading":["> Clara's Invention","> Many people in Venice knew who Antonio Rossi was. Like his father, Antonio was a very talented glassblower. He made many beautiful glass items such as vases and water pitchers. With his new furnace, Antonio now made his popular glassware faster than before.","> Antonio's daughter Clara liked her father's workshop. She loved to look at all of the beautiful and colorful items he created. One day, she walked into the workshop and her father was there, standing beside two delicate glass vases.","> \"Do you like them, Clara?\" he asked proudly. \"I have made them for Mr. Lombardi, the great writer here in Venice.\"","> \"They're beautiful, Father,\" Clara said.","> \"I must go and get Mr. Lombardi,\" said her father. Then, he left the workshop.","> Clara looked at the vases. Beside them was a note. Clara read the note and smiled. As she turned, she bumped the vases. \"No!\" she gasped. She tried to catch them, but it was too late. They fell to the ground and broke into many pieces. Only the round bases at the bottom were not broken.","> Clara reached down and picked up one of the round bases. \"What will I tell Father?\" she thought. She held the piece in front of her as big wet tears fell down her cheeks.","> It was then that she saw Mr. Lombardi's note as she looked through the glass. The letters were BIG! Clara looked at the base. It was flat on one side and curved on the other. She picked up the other base and looked through it. It worked, too! The words looked bigger!","> Clara thought quickly. She found a length of wire and pounded it flat, then carefully wrapped it around the two glass pieces. As Clara finished, she heard footsteps. Mr. Lombardi and her father walked in.","> \"Now let me show you the... Clara!\" Clara's father stopped, and stared at the broken vases on the floor. \"I'm so sorry, Father,\" Clara whispered.","> Mr. Lombardi looked at the two pieces of glass in a wire frame in Clara's hand. \"What do you have there?\" he asked. \"I made it from the broken pieces,\" said Clara. \"Look through them.\" She held up the note for him to see.","> Mr. Lombardi's eyes opened wide. \"The words! They're big!\" He looked at Clara's father. \"My wife can't read my books because of her eyes. This will be my gift to her! It will be the greatest gift ever!\"","> Clara's father smiled. \"I don't know how you did it, Clara,\" he said, \"but you made something very useful.\"","> Clara had made something very useful indeed. She had invented eyeglasses.","RC | What was Antonio Rossi's job? | glassblower | writer | teacher","RC | What did Clara see when she looked through the glass base? | big letters | small letters | her father","RC | What did Clara invent? | eyeglasses | a vase | a furnace","RT | Who were the two vases for? | They were for Mr. Lombardi, the great writer in Venice.","RT | What did Clara wrap around the two glass pieces? | She wrapped a flat piece of wire around the two glass pieces.","RT | Why couldn't Mr. Lombardi's wife read his books? | She couldn't read his books because of her eyes.","RS | How did Clara turn a problem into something useful?","RS | How do you think Clara's father felt about the broken vases? Why?"],"grammar":["GT | Comparative and Superlative Adverbs","R | fast  →  **faster than**  →  **the fastest**","R | carefully  →  **more carefully than**  →  **the most carefully**","R | Antonio made his glassware **faster than** before.","G | Antonio made his glassware faster than before.","G | I came earlier than you.","G | Harry came the earliest.","G | He ran faster than everyone in the race.","G | Our class walked more quietly than their class.","G | Clara worked the most carefully of all.","G | Who gets up the latest?","G | I get up later than you in the morning."],"sw":["SP | A: What did you do when you were little? | B: When I was little, I used to {play in the park} with my grandmother. | A: Do you still do that? | B: No, I don't do that anymore. | play in the park / sleep with a teddy bear / color pictures with crayons / watch cartoons / ride a tricycle / sing songs","SW | Before the invention of {eyeglasses}, {many people couldn't see well}. After the invention of {the airplane}, {the world became a smaller place}. | Write about how life was before and after an invention."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":15,"title":"The Life of a Sunflower","bq":"What do plants give us?","learn":["What does \"sprout\" mean? | to begin to grow from a seed","What does \"pollen\" mean? | yellow powder in a flower that helps make new seeds","What does \"oxygen\" mean? | the gas in the air that people and animals breathe","Spell the word \"petal\". | p-e-t-a-l","Spell the word \"oxygen\". | o-x-y-g-e-n","Choose the measure word: a ___ of bread. | loaf","Choose the measure word: a ___ of jam. | jar","How long does a sunflower seed take to sprout? | about one week","What do the leaves make when they turn sunlight into energy? | oxygen","What part of your breakfast came from plants?"],"battle":["T | What are you going to buy at the store? | I'm going to buy a loaf of bread and a jar of jam.","T | What do bees bring to the sunflower? | Bees bring pollen from other flowers.","B | Fill a pot with a bag of soil.","F | I bought a bag of apple. | I bought a bag of apples.","F | Moisten the soil with a cup water. | Moisten the soil with a cup of water.","W | seeds | Make a sentence about seeds.","P | 🌱💧☀️🌻 | How does a sunflower grow? Tell the steps.","C | Are flowers more important than vegetables? | Flowers | Vegetables","Z | Name three parts of a plant.","S | Explain two things plants give us."],"words":["soil | soil | s/oil | 🟫","seeds | seeds | s/eeds | 🌰","roots | roots | r/oots | 🌱","stem | stem | st/em | 🌿","leaves | leaves | l/eaves | 🍃","petals | pet·als | pet/als | 🌸","nectar | nec·tar | nec/tar | 🍯","pollen | pol·len | pol/len | 🐝","oxygen | ox·y·gen | ox/y/gen | 💨","humans | hu·mans | hu/mans | 🧑","sunflower | sun·flow·er | sun/flow/er | 🌻","warmth | warmth | w/armth | ☀️","strength | strength | str/ength | 💪","length | length | l/ength | 📏"],"reading":["> The Life of a Sunflower","> A sunflower's life begins with a seed. To turn that seed into a plant, we first need to fill a pot with a bag of soil. Plant the seed about one or two centimeters under the soil. Moisten the soil with a cup of water. With the right amount of water and warmth, the seed will sprout in about one week.","> As the sunflower grows up out of the soil, its roots grow down. These roots get water and food from the soil, helping the sunflower to grow. A single smooth stem grows higher and higher above the ground, with wide leaves growing out of the stem along the way. Water and food go up through the roots, through the stem, and into the leaves.","> Thirty days after the plant comes out of the ground, the flower of the sunflower plant begins to grow. The flower is round and flat, with bright yellow petals that grow around it. When bees come to get nectar from the flower, they bring pollen with them from other flowers. This pollen helps new sunflower seeds to grow in the flat part of the flower.","> Did you know that a sunflower always turns toward the sun? The sunflower, like all plants, uses sunlight in a special way. The leaves of the sunflower turn sunlight into energy for the plant. When leaves make this energy, they make oxygen, too.","> As the sunflower comes to the end of its life, the sunflower seeds dry up. Some of them fall into the soil, where they will grow into new sunflowers the next year. Birds eat some of the seeds. People take the sunflower seeds and eat them, too. The seeds also have sunflower oil in them, which people use for cooking.","> Like all plants, the sunflower is very important for life on Earth. It gives us oxygen, it provides food for humans and animals, and it brings color and beauty to our planet. We must remember to take care of the plants in our world because they take care of us!","RC | What does a sunflower's life begin with? | a seed | a leaf | a petal","RC | What do bees bring to the sunflower? | pollen | oxygen | soil","RC | What do leaves make when they make energy from sunlight? | oxygen | nectar | soil","RT | Where do the roots get water and food? | The roots get water and food from the soil.","RT | When does the flower begin to grow? | The flower begins to grow thirty days after the plant comes out of the ground.","RT | What do people use sunflower oil for? | People use sunflower oil for cooking.","RS | What happens when you plant and water a sunflower seed?","RS | Why is the sunflower important for life on Earth? Tell us one reason."],"grammar":["GT | Measure Words","R | can't count:  a **bag** of soil,  a **cup** of water","R | a big number you can count:  a **box** of seeds,  a **kilogram** of apples","R | loaf · bag · jar · bottle · box · kilogram","G | Fill a pot with a bag of soil.","G | Moisten the soil with a cup of water.","G | I bought a box of seeds.","G | I need a loaf of bread and a jar of jam.","G | What do you have in your shopping bag?","G | I have a bottle of fresh, cold milk.","G | We bought a kilogram of apples."],"sw":["SP | A: May I borrow your {pencil}? | B: Sure. Here you are. | A: Thanks! Are you using those scissors? | B: No, I'm not. Here, you can use them. | pencil / eraser / ruler / glue / crayons / notebook","SW | First, {fill a pot with soil}. Second, {plant the seed under the soil}. Finally, {water the soil and wait for it to sprout}. | Write the steps to grow a plant using first, second, and finally."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":16,"title":"The Garden of Happiness","bq":"What do plants give us?","learn":["What does \"community\" mean? | all the people who live in one place","What does \"curious\" mean? | wanting to know or learn about something","What does \"bloom\" mean? | when a flower opens","Spell the word \"teenagers\". | t-e-e-n-a-g-e-r-s","Spell the word \"garden\". | g-a-r-d-e-n","Finish the sentence: Marisol is curious ___ her plant. | about","Finish the sentence: She was surprised ___ the big sunflower. | at","What did Marisol plant in the Garden of Happiness? | a single seed","What happened to the sunflower when autumn came? | Its leaves turned brown and dry.","How does a garden bring happiness to people?"],"battle":["T | What are you curious about? | I'm curious about life on other planets.","T | What did Mrs. Rodriguez tell Marisol to do? | She told Marisol to save the seeds and plant again next spring.","B | The flower was as big as a plate.","F | I'm curious at gardening. | I'm curious about gardening.","F | He is happy about his painting of his grandmother. | He is happy with his painting of his grandmother.","W | vines | Make a sentence about vines.","P | 🌻🏙️👧🎨 | What happened at the end of the story? Tell it.","C | Is a community garden better than a park? | A community garden | A park","Z | Name three vegetables people grew in the garden.","S | Say what you are happy with and what you are surprised at this week."],"words":["gardener | gar·den·er | gar/den/er | 👩‍🌾","beans | beans | b/eans | 🫘","vines | vines | v/ines | 🌿","garden | gar·den | gar/den | 🪴","haze | haze | h/aze | 🌫️","teenagers | teen·ag·ers | teen/ag/ers | 🧑‍🎤","community | com·mu·ni·ty | com/mu/ni/ty | 🏘️","crowd | crowd | cr/owd | 👥","cotton | cot·ton | cot/ton | 👕","bamboo | bam·boo | bam/boo | 🎋","linen | lin·en | lin/en | 🧺","sunflower | sun·flow·er | sun/flow/er | 🌻","petals | pet·als | pet/als | 🌸","empty | emp·ty | emp/ty | 🫙"],"reading":["> The Garden of Happiness","> A young girl named Marisol plants a single seed in the Garden of Happiness, a small community garden in her city. She waters it daily, and it grows and grows. Marisol is curious about her plant. What kind of plant is it? Meanwhile, a group of teenagers wants to paint a mural nearby. They aren't sure what to paint.","> One morning, Marisol saw an amazing sight from halfway down the block. She ran the rest of the way. Standing higher than all the plants and vines in the garden was a flower as big as a plate! Her bud had turned into petals of yellow and gold.","> \"A sunflower!\" Mrs. Anderson exclaimed as she pushed her shopping cart by. \"Reminds me of when I was a girl.\"","> The flower was a glowing circle, brighter than a yellow taxi. A flower of sunshine, Marisol thought, the happiest plant in the Garden of Happiness. All summer long, it made the people on the street stop and smile.","> Soon the air became cool and crisp with autumn. Mr. Castro picked the last of his tomatoes. Mr. Singh carried away a basket full of beans. Mrs. Willie Mae Washington dug up orange potatoes. \"I can almost smell my sweet potato pie.\" She winked at Marisol. \"I'm gonna save an extra big slice for a good little gardener I know.\"","> But something terrible was happening to Marisol's flower. Its leaves were turning brown and dry. \"My flower of sunshine is sick,\" Marisol cried. \"What should I do?\"","> \"Oh, child,\" Mrs. Willie Mae Washington said. \"Its season is over. There's a time to bloom and a time to die.\"","> \"No! I don't want my flower to die!\"","> \"My dear, don't cry,\" Mrs. Rodriguez said. \"That's the way of a garden. You must save the seeds and plant again next spring.\"","> Marisol was too sad to go to the empty lot anymore. For a whole week, she couldn't even look down the block where her beautiful flower used to be. Then one day, she heard people calling her name.","> \"Marisol! Come quick!\" \"Marisol! Hurry!\" A golden haze shone on the street. There was a big crowd, like on a holiday. Music from the bodega, a small store, was loud and bright. And what she saw made Marisol laugh and dance and clap her hands.","RC | What kind of flower did Marisol grow? | a sunflower | a rose | a tulip","RC | Where did Marisol plant her seed? | in a community garden | in a city park | on a farm","RC | What happened to the flower in autumn? | its leaves turned brown | it grew taller | it turned blue","RT | How often did Marisol water her plant? | She watered it every day.","RT | What did Mrs. Rodriguez tell Marisol to do? | She told her to save the seeds and plant again next spring.","RT | What did Mr. Singh carry away from the garden? | He carried away a basket full of beans.","RS | Why was Marisol too sad to go to the empty lot?","RS | What do you think Marisol saw at the end of the story? Why did it make her happy?"],"grammar":["GT | Adjectives with Prepositions","R | Marisol is **curious about** her plant.","R | She was **surprised at** the big sunflower.","R | She was very **happy with** the mural.","G | Marisol is curious about her plant.","G | She was surprised at the big sunflower.","G | She was very happy with the mural.","G | I'm curious about rain forests.","G | Are you happy with your painting?","G | The teacher was surprised at my spelling mistakes.","G | What are you curious about?"],"sw":["SP | A: Which plant is important to you? | B: I chose the {banana} plant because I like it a lot. | A: Nice. My first choice is an oak tree because I like to climb trees. | B: Oh, me too! | banana / apple / rice / tomato / bamboo / cotton","SW | {Apples} grow {on trees}. {Carrots} grow {in the ground}. | Write two sentences about where plants grow, using in or on."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":17,"title":"My Journey with Captain Magellan","bq":"Why do we explore?","learn":["What does \"explorer\" mean? | a person who travels to new places to learn about them","What does \"strait\" mean? | a narrow area of water between two pieces of land","What does \"coast\" mean? | the land next to the sea","Spell the word \"lightning\". | l-i-g-h-t-n-i-n-g","Spell the word \"waterfall\". | w-a-t-e-r-f-a-l-l","Finish the sentence: Walk ___ this street and ___ the park. (down, through) | Walk down this street and through the park.","Finish the sentence: Go ___ to the deck and check the sails. | up","Where was Magellan from? | Portugal","Why did Europeans go to Indonesia? | to trade for spices","Where would you like to explore? Why?"],"battle":["T | Give directions from the door to your desk. | Walk through the door and go around the table.","T | What happened to Captain Magellan? | He died in a battle on the island of Mactan.","B | We sailed down the coast of South America.","F | Go up the deck and check the sails. | Go up to the deck and check the sails.","F | Juan walked the stairs down and into the kitchen. | Juan walked down the stairs and into the kitchen.","W | storm | Make a sentence about a storm at sea.","P | ⛵🌩️🌊🗺️ | Tell the story of Juan's journey.","C | Is it braver to explore the ocean or outer space? | The ocean | Outer space","Z | Name three weather words from the unit.","S | Describe the weather today and the weather yesterday."],"words":["island | is·land | is/land | 🏝️","windy | wind·y | wind/y | 💨","waterfall | wa·ter·fall | wa/ter/fall | 🏞️","clouds | clouds | cl/ouds | ☁️","hail | hail | h/ail | 🧊","coast | coast | c/oast | 🏖️","fog | fog | f/og | 🌫️","storm | storm | st/orm | ⛈️","lightning | light·ning | light/ning | ⚡","river | riv·er | riv/er | 🛶","journey | jour·ney | jour/ney | 🧭","strait | strait | str/ait | 🗺️","sail | sail | s/ail | ⛵","healthy | health·y | health/y | 💪"],"reading":["> My Journey with Captain Magellan","> Juan is a ten-year-old boy traveling on Ferdinand Magellan's ship, the Trinidad. Magellan is an explorer from Portugal who wants to sail west to find a new route to Indonesia. Europeans go to Indonesia to trade for spices. Juan writes about his trip in his journal.","> September 20, 1519: We sail from Spain today, with 250 men and five ships! The sky is blue, and the clouds are white. I am not afraid. Captain Magellan is a brave man. I brought him his dinner of salted beef and beans. He gave me a coin.","> The five ships sail toward South America. The journey is long. There are many storms with thunder and lightning. In November, the ships can't move because there is no wind to fill the sails.","> November 10, 1519: The ocean is different today. It looks like glass. Every day, Captain Magellan says, \"Juan, go up to the deck and check the sails.\" I always go up and look around and bring back the same news. There is no wind.","> The ships reach the coast of South America in December 1519. They stay there for one year. Then they sail through a narrow area of water called a strait and reach the Pacific Ocean. They lose one ship in a storm. Another ship sails back to Spain.","> November 27, 1520: We are in a new ocean! Captain Magellan calls it the Pacific Ocean. I am sad to leave this land. Winter was cold and windy, with fog and hail, but I saw many rivers and beautiful waterfalls. Now it is spring. It is time to sail west again.","> The trip is long. There is very little food and water. The men are not healthy, and some men die. The three ships reach the island of Guam on March 6, 1521. Then they sail west to other islands.","> April 27, 1521: Captain Magellan died today in a battle on the island of Mactan. We have lost a great man, but I must be strong. We must get back to Spain.","> Two ships remain. The men get to Indonesia on November 6, 1521. They fill the ships with spices. The Trinidad is damaged and can't sail. Only one ship sails back to Spain. Over 250 men started the journey, but only 18 men come home.","> September 6, 1522: We are home today, after three long years. I am now 13 years old. I will never forget Captain Magellan. I really looked up to him. I have sailed around the world. I have seen many new places and learned so much. I'm excited to tell everyone about my travels.","RC | How many ships left Spain in 1519? | five | three | one","RC | Why couldn't the ships move in November 1519? | there was no wind | there was a storm | the men were sick","RC | Where did Captain Magellan die? | on Mactan | in Spain | in Indonesia","RT | What did Juan bring Captain Magellan for dinner? | He brought him salted beef and beans.","RT | What did the men fill the ships with in Indonesia? | They filled the ships with spices.","RT | How many men came home to Spain? | Only 18 men came home to Spain.","RS | Why did Magellan want to sail west? Tell us.","RS | How do you think Juan felt when he got home? Why?"],"grammar":["GT | Prepositions of Movement","R | Go **up** to the deck.      We sailed **down** the coast of South America.","R | up · down · into · out of · to · around · through","G | Go up to the deck and check the sails.","G | We sailed down the coast of South America.","G | Walk down this street and through the park.","G | First, he gets out of bed.","G | Then he runs into the kitchen.","G | The ships sailed through the strait.","G | How do I get to the Pizza Palace?","G | She walked around the pond."],"sw":["SP | A: Congratulations on winning the {race}! | B: Thank you! | A: You did a great job! We're very proud of you. | B: Thanks. Great job on your math test, too! | race / contest / game / prize / medal / match","SW | I {brushed my teeth} before I {went to bed}. I {ate an apple} after I {got home}. | Write two sentences about your day using before and after."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":18,"title":"Jacques Cousteau","bq":"Why do we explore?","learn":["What does \"goggles\" mean? | special glasses that let you see underwater","What does \"diver\" mean? | a person who goes underwater with special equipment","What does \"kelp\" mean? | a kind of seaweed that grows in the ocean","Spell the word \"dolphin\". | d-o-l-p-h-i-n","Spell the word \"octopus\". | o-c-t-o-p-u-s","Choose want to or need to: I ___ exercise to stay healthy. | need to","Choose want to or have to: They ___ be on time for school. | have to","What did Cousteau and Emile Gagnan create? | the Aqua-Lung, a machine that lets a diver breathe underwater","What did a friend give young Jacques? | a pair of goggles","Would you like to explore under the ocean? Why?"],"battle":["T | What do you want to do this summer? | I want to go swimming in the ocean.","T | Why did doctors tell young Jacques to swim? | They wanted him to build up his strength.","B | Cousteau wanted to stay underwater longer.","F | He needs to eats ice cream. | He wants to eat ice cream.","F | I want study hard for the test. | I want to study hard for the test. / I need to study hard for the test.","W | humpback whale | Make a sentence about a humpback whale.","P | 🤿🐙🐬🐧 | What did Cousteau see under the sea? Tell the story.","C | Is it more important to explore the ocean or protect it? | Explore it | Protect it","Z | Name three sea animals from the unit.","S | Tell us two things you need to do this week and one thing you want to do."],"words":["goggles | gog·gles | gog/gles | 🥽","kelp | kelp | k/elp | 🌿","penguin | pen·guin | pen/guin | 🐧","squid | squid | squ/id | 🦑","otter | ot·ter | ot/ter | 🦦","coral | cor·al | cor/al | 🪸","dolphin | dol·phin | dol/phin | 🐬","octopus | oc·to·pus | oc/to/pus | 🐙","diver | div·er | div/er | 🤿","hose | hose | h/ose | 🚿","seaweed | sea·weed | sea/weed | 🌊","seagull | sea·gull | sea/gull | 🐦","swordfish | sword·fish | sword/fish | 🐟","shipwreck | ship·wreck | ship/wreck | 🚢"],"reading":["> The Fantastic Undersea Life of Jacques Cousteau","> Jacques Cousteau loved the sea. He spent his whole life exploring it. He wanted to share its beauty with the world. Growing up in France, little Jacques was weak and sick. Doctors encouraged him to swim to build up his strength. He discovered that he loved the water.","> A friend gave him a pair of goggles so that he could see underwater. Those goggles changed his life forever. \"Sometimes we are lucky enough to know that our lives have been changed. It happened to me that summer's day when my eyes opened to the world beneath the surface of the sea.\"","> Cousteau wanted to stay underwater longer to see even more. The diving suits of his day were heavy and big. They didn't allow much freedom of movement, and an air hose tethered the diver to a boat.","> Cousteau and his friend Emile Gagnan created a breathing device they called the Aqua-Lung. It was the first machine that would let a diver breathe underwater for a long time. \"I flew without wings.\" Now Cousteau was free to explore. A silent world opened up to him.","> Cousteau bought a boat and turned it into a research lab and film studio. He sailed all over the world. \"What is a scientist after all? It is a curious man looking through a keyhole, the keyhole of nature, trying to know what's going on.\"","> Cousteau explored the freezing waters of Antarctica and found them filled with penguins, humpback whales, and squid.","> Jacques Cousteau was the world's king of the oceans. He produced fifty books, two encyclopedias, and dozens of documentary films. His TV series, The Undersea World of Jacques Cousteau, brought whales, octopuses, otters, and dolphins right into people's living rooms.","> While exploring off the coast of Australia, Cousteau and his crew saw coral reefs, kelp forests, and sponge gardens. They came face to face with the leafy sea dragon.","> Cousteau created the Cousteau Society. This group teaches people about ocean life and protecting our seas from pollution. \"We protect what we love.\"","> Jacques Cousteau loved the sea. He shared its beauty with the world so that everyone could love and care for it, too.","RC | What did a friend give young Jacques? | a pair of goggles | a boat | a camera","RC | What did Cousteau and Emile Gagnan create? | the Aqua-Lung | a diving suit | a TV show","RC | What did Cousteau find in the freezing waters of Antarctica? | penguins and whales | coral reefs | sponge gardens","RT | Why did doctors encourage little Jacques to swim? | They wanted him to build up his strength.","RT | What did Cousteau turn his boat into? | He turned it into a research lab and film studio.","RT | What does the Cousteau Society teach people? | It teaches people about ocean life and protecting the seas from pollution.","RS | Why did the goggles change Cousteau's life?","RS | Cousteau said, \"We protect what we love.\" What do you think he meant?"],"grammar":["GT | Want to / Need to / Have to","R | **want to**  →  you have a choice:  Cousteau **wanted to** stay underwater longer.","R | **need to / have to**  →  no choice, you must:  He **needed to** (**had to**) use the Aqua-Lung.","G | I want to swim underneath the waves.","G | Cousteau wanted to stay underwater longer.","G | He needed to use the Aqua-Lung.","G | I need to study hard to get good grades.","G | We have to be on time for school.","G | What do you want to do?","G | She wants to take a dolphin ride.","G | Do you need to clean your room?"],"sw":["SP | A: Look! Isabella is on a beach. | B: Now she's in the water. | A: She's looking at {kelp}. | B: Wow! She's a real explorer! | kelp / coral / dolphins / otters / squid / penguins","SW | Although {it was hot outside}, {I played in the park}. Although {I was tired}, {I finished my homework}. | Write two sentences about yourself using although."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false}]},"OD4":{"units":[{"n":1,"title":"The Universe: Bella's Home","bq":"Where are we in the universe?","learn":["What does \"galaxy\" mean? | a huge group of billions of stars, like the Milky Way","What does \"observatory\" mean? | a building where people use telescopes to study the sky","What does \"meteorite\" mean? | a piece of rock from space that lands on Earth","Spell the word \"universe\". | u-n-i-v-e-r-s-e","Spell the word \"telescope\". | t-e-l-e-s-c-o-p-e","Make a prediction with \"will\" about space travel. | Scientists will send a person to Mars someday.","Is this a prediction or a fact? \"Eric wants to go to space camp next summer.\" | It is not a prediction; it is about what Eric wants now.","Where did Charles Kunayak and his daughter Bella live? | In Nome, Alaska.","In the poem, what did Alaska look like from the sky? | It looked like a bear.","If you had a spacecraft, where in the universe would you go first?"],"battle":["T | What do you think scientists will discover in space in the future? | I think scientists will find new solar systems in our galaxy.","S | Describe what you can see in the night sky where you live.","B | Our sun is just one of billions of stars.","F | Bella will visits those places again. | Bella will visit those places again.","W | spacecraft | Make a sentence about a spacecraft flying through the universe.","P | 🔭🌙⭐🚀 | A girl looks through a telescope. Tell her story.","C | Is Earth a big place or a tiny speck in the universe? | A big place | A tiny speck","Z | Name three things that circle the sun.","S | Explain why Charles wrote the poem \"Bella's Home\" for his daughter."],"words":["moon | moon | m/oon | 🌙","asteroid | as·ter·oid | as/ter/oid | 🪨","comet | com·et | com/et | ☄️","meteorite | me·te·or·ite | me/te/or/ite | 🌠","star | star | st/ar | ⭐","galaxy | gal·ax·y | gal/ax/y | 🌌","universe | u·ni·verse | u/ni/verse | ✨","spacecraft | space·craft | space/craft | 🚀","telescope | tel·e·scope | tel/e/scope | 🔭","observatory | ob·ser·va·to·ry | ob/ser/va/to/ry | 🏛️","vast | vast | v/ast | 🌍","speck | speck | sp/eck | 🔸","disk | disk | d/isk | 💿","sleigh | sleigh | sl/eigh | 🛷"],"reading":["> Bella's Home","> Charles Kunayak was a high school science teacher who lived with his family in a quiet neighborhood in Nome, Alaska. In his free time, he studied the secrets of the universe. Charles had a powerful telescope, and he often visited observatories, so he learned more and more about the universe. It was an amazing universe!","> Yet how could Charles help his daughter Bella understand that our sun was just one of billions of stars? How could she realize that the small meteorite on display in his classroom traveled to Earth from beyond Mars? How could he explain that we live in a universe so vast, it would take a spacecraft 100,000 years to cross our Milky Way galaxy while traveling at the speed of light!","> Charles decided that the best way to show Bella was not through numbers and charts, but through a poem. He sat down and wrote what he knew about the universe. He called it \"Bella's Home.\"","> Bella lived in a white wooden house on a street in the city of Nome. Bella sat in her bedroom and thought to herself, Where in the world is my home?","> What I need, she thought, is a spacecraft to give me a better view. So in her mind, she climbed inside and up in the sky she flew.","> Her white wooden house was tiny indeed, and Nome was as small as a pie. As Bella flew up, she saw that Alaska looked like a bear from the sky.","> Higher she flew, and Alaska, too, became part of something so grand. She saw islands, countries, and continents with blue oceans around the land.","> Bella now saw her beautiful planet, a blue ball floating in space, and a shining moon that circled the Earth with the light of the sun on its face.","> She noticed the Earth was not alone; with seven more planets it dwelled. In a great solar system, they circled the sun with asteroids and comets as well.","> Bella's spacecraft flew higher and higher. Now the sun was a speck of bright light in the Milky Way galaxy shaped like a disk. Bella thought, what a wondrous sight!","> Then billions of galaxies appeared everywhere, each one filled with billions of stars! What Bella observed was the vast universe. Her spacecraft had taken her far.","> Suddenly Bella was back in her room in her white wooden house in Nome. I will visit those places again, Bella thought, for wherever I go is my home!","RC | Where did Charles and his family live? | Nome, Alaska | Mars | the moon","RC | What looked like a bear from the sky? | Alaska | the moon | Nome","RC | What was shaped like a disk? | the Milky Way galaxy | the Earth | the sun","RT | What did Charles write to help Bella understand the universe? | He wrote a poem called \"Bella's Home.\"","RT | How many more planets circle the sun with the Earth? | Seven more planets circle the sun with the Earth.","RT | What did Bella see at the end of her journey? | She saw billions of galaxies filled with billions of stars.","RS | Why did Charles write a poem instead of using numbers and charts?","RS | How did Bella's house and Nome look from the sky? Tell us one thing."],"grammar":["GT | Predictions with Will","R | **will** + verb  →  a prediction (something you believe about the future, not a fact)","R | I **will** visit those places again, Bella thought.","G | I will visit those places again.","G | Scientists will send a person to Mars someday.","G | She will become an astronaut when she grows up.","G | I think scientists will find new solar systems in our galaxy.","G | I will miss my bed too much.","G | Do you want to sleep under the stars tonight?","G | People will travel through the universe one day."],"sw":["SP | A: Look at the two pictures. What do you see? | B: In the first picture, I see the Milky Way. | A: What about the second picture? | B: The second picture doesn't have the Milky Way, but it has {the moon}. | the moon / a comet / a telescope / a spacecraft / many stars / an observatory","SW | The universe is {a beautiful place}. It has {more stars than we can count}. Look in the sky and you will see {the Milky Way}. | Write three complete sentences about the universe."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":2,"title":"Traveling Together Around the Sun","bq":"Where are we in the universe?","learn":["What does \"orbit\" mean? | a planet's path around the sun","What does \"gravity\" mean? | the force that pulls things toward a planet or the sun","What does \"space probe\" mean? | a machine without people that explores space","Spell the word \"astronomer\". | a-s-t-r-o-n-o-m-e-r","Spell the word \"diameter\". | d-i-a-m-e-t-e-r","Complete the future real conditional: \"If I become an astronaut, I ___ walk on Mars.\" | will","In \"If technology continues to grow, we will travel to these places ourselves\", which part is the future possibility? | If technology continues to grow","How many days does Mercury take to complete one orbit? | 88 days","Which space probe landed on Mars on August 6, 2012? | Curiosity","Would you like to travel to Mars one day? Why or why not?"],"battle":["T | What will you do if you get a telescope? | If I get a telescope, I will search the sky every night.","S | Compare the inner planets and the outer planets.","B | Earth completes one orbit in 365 days.","F | If technology continue to grow, we will travel to Mars. | If technology continues to grow, we will travel to Mars.","W | craters | Make a sentence about the craters on Mercury or the moon.","PT | 🪐🌍☀️🛰️ | Type two sentences about our solar system.","C | Which planet is more interesting to explore, Mars or Saturn? | Mars | Saturn","Z | Name three bodies that travel around the sun besides planets.","F | Jupiter is the bigger planet in the solar system. | Jupiter is the biggest planet in the solar system."],"words":["astronomer | as·tron·o·mer | as/tron/o/mer | 🔭","core | core | c/ore | 🌋","gravity | grav·i·ty | grav/i/ty | 🍎","orbit | or·bit | or/bit | 🪐","matter | mat·ter | mat/ter | 🧱","distance | dis·tance | dis/tance | 📏","diameter | di·am·e·ter | di/am/e/ter | ⭕","surface | sur·face | sur/face | 🌍","crater | cra·ter | cra/ter | 🌑","unique | u·nique | u/nique | 🌟","explore | ex·plore | ex/plore | 🧭","inner | in·ner | in/ner | 🔘","outer | out·er | out/er | 🔵","distant | dis·tant | dis/tant | 🛸"],"reading":["> Traveling Together Around the Sun","> The sun is a star, and it is very important for our planet Earth. It gives us light and heat. However, Earth is not alone. It shares the sun with seven other planets. Together, these planets revolve around the sun in a solar system. Other bodies travel in this solar system, such as moons, asteroids, and comets. They all move around the sun because the sun's gravity is very strong.","> Each planet's path around the sun is called an orbit. The planets that are closer to the sun have smaller orbits, so they take less time to go around it. Mercury takes 88 days to complete one orbit. Earth completes one orbit in 365 days, or one year. Neptune's orbit takes 60,200 days, or almost 165 years! Each planet in our solar system is unique. For example, Mercury is the smallest planet. It has lots of craters, just like our moon. Jupiter is the biggest planet. Its diameter is eleven times bigger than Earth's. Saturn has giant rings of matter around it. Neptune is the farthest planet from the sun.","> Mars is a neighboring planet, and scientists are learning a lot about it. They send many space probes to Mars. A space probe called Curiosity landed on Mars on August 6, 2012. Curiosity is as big as a car, and it moves over the surface of Mars. It recently found rocks that had strange shapes. Running water made these shapes. This is an important discovery. Space probes like Curiosity continue to explore the planets, moons, and other bodies in our solar system. If technology continues to grow, we will travel to these places ourselves.","> Iron and rock make up most of the four smaller inner planets of our solar system. Gas and water make up most of the four larger outer planets. This means that you can stand on the surface of Earth, but you can't stand on Saturn. In fact, if you tried to stand on Saturn, you would sink down to the core of the planet.","> Drawings of our solar system show the planets close to the sun. However, the distance between the planets and the sun is very far. For example, it would take 176 years to drive a car from Earth to the sun. It would take 5,300 years to drive from Neptune to the sun!","> Astronomers think that there are many solar systems in our Milky Way galaxy. However, our solar system is special to us. It is our home.","> The Asteroid Belt: An asteroid belt runs between the inner and outer planets. Scientists have discovered over 7,000 asteroids there, and there may be millions more. Asteroids travel around the sun, just like planets.","> The Sister Planets: Did you know that Earth and Venus are called \"sister planets\"? This is because they are almost the same size, and Venus is the closest planet to Earth. However, Venus is much hotter than Earth, and it is always covered in thick clouds.","RC | How many other planets share the sun with Earth? | seven | eight | eleven","RC | Which planet is the biggest? | Jupiter | Mercury | Neptune","RC | What landed on Mars on August 6, 2012? | a space probe | an astronaut | a comet","RT | Why do all the bodies in the solar system move around the sun? | They move around the sun because the sun's gravity is very strong.","RT | How long does Earth take to complete one orbit? | Earth completes one orbit in 365 days, or one year.","RT | What makes up most of the four inner planets? | Iron and rock make up most of the inner planets.","RS | Why can't you stand on the surface of Saturn?","RS | How are Earth and Venus alike and different? Tell us one thing."],"grammar":["GT | Future Real Conditional","R | **If** + future possibility,  **will** + result","R | **If** technology continues to grow, we **will** travel to these places ourselves.","R | We **will** travel to these places ourselves **if** technology continues to grow.","G | If I become an astronaut, I will go to Mars.","G | If technology continues to grow, we will travel to these places ourselves.","G | Wendy will search the sky if she gets a telescope.","G | If we study hard, the teacher will show us a video.","G | If I study hard, I will get good grades.","G | I will explore the planet's surface if I go into space.","G | If you look through a telescope, you will see the moon's craters."],"sw":["SP | A: How many {planets} are in our solar system? | B: I'm not sure, but I think there are a lot. | A: How much water is on Jupiter? | B: I don't know. Let's look it up! | planets / moons / stars / asteroids / comets / space probes","SW | Is {Mars} a moon or a planet? It's {a planet}. Is {Jupiter} bigger or smaller than Earth? It's {bigger}. | Write two choice questions about the solar system and answer them."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":3,"title":"Hidden Army: Clay Soldiers of Ancient China","bq":"How do we know what happened long ago?","learn":["What does \"archaeologist\" mean? | a scientist who digs up and studies things from the past","What does \"tomb\" mean? | a place where a dead person is buried","What does \"armor\" mean? | a hard covering that protects a soldier's body in battle","Spell the word \"emperor\". | e-m-p-e-r-o-r","Spell the word \"treasure\". | t-r-e-a-s-u-r-e","Complete the sentence with an infinitive: \"The archaeologists tried ___ more soldiers.\" | to find","What is an infinitive? | a verb with the word \"to\" in front of it, like \"to study\"","What are the clay soldiers made of? | terracotta, a strong kind of clay","How old was the emperor when he died? | 49 years old","Should scientists open the emperor's tomb? Why or why not?"],"battle":["T | What do you promise to do this year at school? | I promise to study hard for every history test.","S | Describe the clay soldiers. How are they different from each other?","B | No two clay soldiers in the army are alike.","F | The emperor decided build a clay army. | The emperor decided to build a clay army.","W | jade | Make a sentence using the word jade.","P | 🏺⚔️🏛️🔍 | An archaeologist finds something amazing. Tell the story.","C | Which is more exciting to find, an ancient tomb or a dinosaur bone? | An ancient tomb | A dinosaur bone","Z | Name three things a soldier wears or carries.","S | Explain why the generals had the most elegant uniforms."],"words":["army | ar·my | ar/my | 🪖","soldier | sol·dier | sol/dier | 💂","uniform | u·ni·form | u/ni/form | 👔","emperor | em·per·or | em/per/or | 👑","armor | ar·mor | ar/mor | 🛡️","treasure | trea·sure | trea/sure | 💰","archaeologist | ar·chae·ol·o·gist | ar/chae/ol/o/gist | ⛏️","tomb | tomb | t/omb | 🪦","jade | jade | j/ade | 💚","clay | clay | cl/ay | 🏺","battle | bat·tle | bat/tle | ⚔️","general | gen·er·al | gen/er/al | 🎖️","coffin | cof·fin | cof/fin | ⚰️","tourist | tour·ist | tour/ist | 🧳"],"reading":["> Hidden Army: Clay Soldiers of Ancient China","> It is 210 BC and the moment before battle. The Chinese emperor's army is ready to charge. The soldiers, thousands of them, are lined up, row after row, as far as the eye can see. However, the army will never attack.","> The soldiers are not real. They are the size of real soldiers. But they are made of terracotta, a strong kind of clay. They are more than 2,000 years old.","> Amazingly, no two soldiers are alike. Their faces are different. Some are old; some are young. Some look tired; some look like they can't wait for the battle to start.","> Their uniforms are different. The uniforms are exact copies of what real soldiers wore. The archers and foot soldiers were the lowest-ranking soldiers, so they have the plainest uniforms.","> The generals, of course, wore the most elegant uniforms. Some of their caps had feathers. Sometimes their shoes turned up at the toes. Their armor had small iron rings that look like fish scales.","> Every single soldier in the emperor's army was painted with bright colors. So were the terracotta horses. Now most of the soldiers have only tiny traces of paint left. Scientists are trying to create a special varnish to brush over painted figures to hold the paint in place.","> Today, craftsmen near the pits where the soldiers were found make copies of the soldiers. This helps archaeologists learn more about how people made the original army. Modern craftsmen have much better kilns than those in ancient times. Kilns are ovens that bake clay until it hardens. Yet no copies ever come out as hard or shiny as the originals. Why? Nobody knows. It is a mystery.","> An even bigger mystery is what lies inside the emperor's tomb. Nobody knows the answer because the tomb has never been opened. The Chinese government plans to keep it closed for now. Work will not start until archaeologists are sure the tomb can be opened without damaging any of the treasures inside.","> As for the emperor's body, according to historical records, it rests in a heavy, bronze coffin. In ancient times, the custom was to dress the dead body of someone important in a suit the Chinese made from hundreds of pieces of thin jade. At that time, jade was more precious than gold.","> The emperor died when he was 49 years old. Three years after his death, peasants rose up against the empire. One of their leaders started a new royal family.","> Yet now, millions of people come to the emperor's burial place. They visit the covered pits to see the clay soldiers. The emperor lives on in the memory of all who see his amazing hidden army.","RC | What are the soldiers made of? | terracotta clay | iron | jade","RC | Who wore the most elegant uniforms? | the generals | the archers | the foot soldiers","RC | What was more precious than gold at that time? | jade | bronze | paint","RT | How old are the clay soldiers? | They are more than 2,000 years old.","RT | Why does nobody know what is inside the emperor's tomb? | Nobody knows because the tomb has never been opened.","RT | How old was the emperor when he died? | The emperor died when he was 49 years old.","RS | How are the clay soldiers different from each other? Tell us one thing.","RS | Why do modern craftsmen make copies of the soldiers?"],"grammar":["GT | Verbs Followed by Infinitives","R | verb + **to** + verb (infinitive)","R | The Chinese government **plans to keep** it closed for now.","R | plan · promise · try · decide · forget  +  **to** …","G | The Chinese government plans to keep it closed for now.","G | All the students promised to study hard for the history test.","G | The archaeologists tried to find more terracotta soldiers.","G | The emperor decided to build the clay army.","G | I forgot to pack my lunch today.","G | I promise to share my treasures with you.","G | Do you want to visit the clay soldiers?","G | I love to study the past."],"sw":["SP | A: If you had a time machine, where would you go? | B: I'd like to go back to {ancient China}. | A: Why would you choose that place? | B: I'd like to see how people lived there. What about you? | ancient China / ancient Greece / ancient Egypt / ancient Rome / the dinosaur age / my grandparents' village","SW | Last year, {a farmer} found {an old coin} in {his garden}. It was over {600} years old. He took it to a museum. | Write three sentences in the past tense about someone who found something old."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":4,"title":"Stumbling upon the Past","bq":"How do we know what happened long ago?","learn":["What does \"paleontologist\" mean? | a scientist who studies dinosaurs and fossils","What does \"excavate\" mean? | to dig carefully in the ground to find old things","What does \"pastime\" mean? | an activity you enjoy doing in your free time","Spell the word \"dinosaur\". | d-i-n-o-s-a-u-r","Spell the word \"ravine\". | r-a-v-i-n-e","Complete the sentence with a gerund: \"Javier enjoyed ___ with his friends.\" | playing","Which verbs are often followed by gerunds? Name two. | enjoy, finish, practice, like","Where did Javier live? | In Ademuz, in the province of Valencia, Spain","What name did they give the new dinosaur? | the Javiersaurus","Do you think children can make important discoveries? Why?"],"battle":["T | What do you enjoy doing on a summer morning? | I enjoy exploring the hills near my town.","S | Tell the story of how Javier found the dinosaur bone.","B | Paleontologists found the largest dinosaur in Europe.","F | The museum staff finished to clean the bones. | The museum staff finished cleaning the bones.","W | layers | Make a sentence about layers of sedimentary rock.","P | 🦕🦴⛏️🪁 | A boy is flying a kite and trips on something. What happens next?","C | Is it better to pull a bone out of the ground or leave it for scientists? | Pull it out | Leave it for scientists","Z | Name three things a paleontologist might find in the ground.","PT | 🔬🗿📜 | Type one sentence about how we learn about the past."],"words":["dinosaur | di·no·saur | di/no/saur | 🦖","skull | skull | sk/ull | 💀","ravine | ra·vine | ra/vine | 🏞️","examine | ex·am·ine | ex/am/ine | 🔍","discover | dis·cov·er | dis/cov/er | 💡","excavate | ex·ca·vate | ex/ca/vate | ⛏️","layers | lay·ers | lay/ers | 🧅","paleontologist | pa·le·on·tol·o·gist | pa/le/on/tol/o/gist | 🦴","ash | ash | a/sh | 🌋","pastime | pas·time | pas/time | 🪁","determine | de·ter·mine | de/ter/mine | 🧐","tripped | tripped | tr/ipped | 🤕","piece | piece | p/iece | 🧩"],"reading":["> Stumbling upon the Past","> Javier was a nine-year-old boy who lived with his parents in the hillside town of Ademuz in the province of Valencia, in Spain. Javier was a curious and energetic boy. His favorite pastime was to explore the hills and open fields around his town. The neighboring village of Riodeva, just 26 kilometers away from Ademuz, was famous because of a great discovery there. In 2003, paleontologists found the bones of the largest dinosaur in Europe in a wheat field near the little village. When it was alive, this animal was over 38 meters long and had the weight of seven elephants.","> Javier liked dinosaurs more than anything else in the world. He also believed that there was an amazing dinosaur bone buried somewhere near his own town of Ademuz. His dream was to be the first person to find it.","> One summer morning, Javier was exploring in a field near a ravine just outside of the town. He looked up to see his two friends, Fernando and Pepe, running toward him with a colorful kite.","> \"Let's fly it, Javier!\" they shouted.","> Javier enjoyed playing with his friends. He quickly forgot about his exploring and grabbed the string of the kite. As he ran, the kite lifted into the sky. The boys cheered. Suddenly the kite spun around and dove into the ravine.","> \"I'll get it,\" shouted Javier. He ran down into the ravine. As he reached for the kite, his foot caught on something. He fell to the rocky ground with a crash. His two friends ran up as he rubbed his head. \"Are you okay?\" Pepe asked.","> \"I think so,\" said Javier. He looked down at a rough, gray object sticking out of the ground. \"I tripped on that,\" he said.","> \"It looks like a rock,\" said Fernando.","> Javier looked carefully at the object. \"I don't think it's a rock,\" he said excitedly. \"I think it's something else!\" \"Let's pull it out,\" said Pepe.","> \"No,\" said Javier. \"It's better to leave it right here.\"","> Javier and the boys ran home to tell Javier's parents. Javier's father spoke to the mayor of the town, who contacted the Paleontology Foundation. The next day, a paleontologist from the foundation came to the town. He followed Javier to the ravine and examined the boy's discovery.","> \"It could be a dinosaur bone,\" he said. \"If it is, we'll need to determine how old it is.\"","> \"How do you do that?\" asked Javier.","> \"This bone was buried in sedimentary rock, which lies in layers under the ground. We'll look for volcanic ash below and above this rock layer. Through a special process, we can find out the ages of those layers of ash. Then we'll know that the dinosaur died sometime between those two ages.\"","> Soon, many paleontologists began excavating the area around the bone. They found more bones, as well as a skull. It was a unique dinosaur they didn't know about. Television reporters came to the town and spoke to Javier about the bone he discovered.","> \"This dinosaur will need a name,\" said one reporter. \"What do you think it should be called?\"","> \"That's easy,\" said the man from the Paleontology Foundation. \"We'll call it the Javiersaurus!\"","RC | Where did Javier live? | Ademuz | Riodeva | Madrid","RC | What did Javier trip on in the ravine? | a dinosaur bone | a rock | a kite","RC | What did the paleontologists find next to the bone? | a skull | a gold ring | a dinosaur egg","RT | How was the dinosaur in Riodeva special? | It was the largest dinosaur in Europe.","RT | Why was Javier in the field when Fernando and Pepe ran up to him? | He was exploring in a field near a ravine.","RT | What do paleontologists look for above and below sedimentary rock? | They look for volcanic ash above and below the rock layer.","RS | What was Javier's dream? Did it come true?","RS | Why did they call the dinosaur the Javiersaurus?"],"grammar":["GT | Verbs Followed by Gerunds","R | verb + verb**-ing** (gerund)","R | Javier **enjoyed playing** with his friends.","R | enjoy · finish · practice · like · begin  +  **-ing**","G | Javier enjoyed playing with his friends.","G | I don't like getting my hands dirty.","G | Now they enjoy digging in the garden.","G | The museum staff finished cleaning the dinosaur bones.","G | Thomas liked examining fossils as a pastime.","G | The paleontologist doesn't like working in the rain.","G | Do you enjoy exploring the hills?","G | When it began raining, the team went inside."],"sw":["SP | A: What did {dinosaurs} sound like? | B: They probably sounded very loud. | A: What do you think they looked like? | B: I think they looked big and scary. | dinosaurs / elephants / lions / volcanoes / airplanes / big trucks","SW | {The skull} is very old. {Many bones} are buried under the ground. {A little water} is in the ravine. | Write three sentences about a discovery, using count and noncount nouns with the correct verb."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":5,"title":"The Breakfast Quest","bq":"Where does our food come from?","learn":["What does \"ingredients\" mean? | the foods you mix together to make a dish","What does \"plantation\" mean? | a very large farm where one crop grows, like sugar cane","What does \"spoil\" mean? | to go bad and become unsafe to eat","Spell the word \"cinnamon\". | c-i-n-n-a-m-o-n","Spell the word \"vanilla\". | v-a-n-i-l-l-a","Complete the sentence about a future plan: \"We ___ soccer after school today.\" | are playing","Change this to a future plan with the present continuous: \"I will bake a cake tomorrow.\" | I am baking a cake tomorrow.","Where does the best butter come from in the story? | Denmark","Which country grows the finest vanilla in the story? | Madagascar","What is the best breakfast you have ever eaten?"],"battle":["T | What are you making for dinner this weekend? | I'm making pancakes with my family on Saturday morning.","S | Tell us how to make your favorite food. What ingredients do you need?","B | My chickens lay wonderful eggs every morning.","F | I make a special breakfast tomorrow. | I'm making a special breakfast tomorrow. / I am making a special breakfast tomorrow.","W | wheat | Make a sentence about wheat and flour.","P | 🥚🧈🌾🥐 | Tell the story of the breakfast quest with these ingredients.","C | Which ingredient is more important for cinnamon buns, butter or cinnamon? | Butter | Cinnamon","Z | Name three ingredients in Granny's Famous Cinnamon Buns.","S | Explain why the farmers travel to so many countries in the story."],"words":["wheat | wheat | wh/eat | 🌾","cinnamon | cin·na·mon | cin/na/mon | 🟤","butter | but·ter | but/ter | 🧈","vanilla | va·nil·la | va/nil/la | 🍦","ingredients | in·gre·di·ents | in/gre/di/ents | 🥣","bark | bark | b/ark | 🌳","plantation | plan·ta·tion | plan/ta/tion | 🌱","steamship | steam·ship | steam/ship | 🚢","spoil | spoil | sp/oil | 🤢","leopard | leop·ard | leop/ard | 🐆","gather | gath·er | gath/er | 🧺","peel | peel | p/eel | 🍌","introduce | in·tro·duce | in/tro/duce | 🤝"],"reading":["> The Breakfast Quest","> I'm making a special breakfast today: Granny's Famous Cinnamon Buns. \"To make the best buns, you need the best ingredients,\" I tell my sister Sam. So we hop on my bike and ride across town to Farmer Ray's.","> \"You've come to the right place,\" says the farmer, pulling on his bushy beard. \"My chickens lay wonderful eggs.\"","> At the chicken coop, I gather two smooth, brown eggs and a nervous chicken.","> \"Cinnamon buns, you say?\" Farmer Ray smiles slyly. \"If it's butter you're after, you'll need to pack your bags. The best butter I know comes from Denmark.\"","> We all hop on his tractor, catch a plane, and watch as we zoom over the Atlantic Ocean.","> In Denmark, we head to rolling green fields where we find an enormous, sleepy cow. I introduce myself, my sister Sam, Farmer Ray, and the chicken to the cow's owner, explaining that my grandmother's cinnamon buns are not to be missed.","> \"Well, you've come to the right place,\" says Farmer Lena, spilling some milk from a pail. \"My butter is the creamiest in the world. Cinnamon buns, you say?\" She pauses. \"If it's flour you need, the heartiest wheat I know comes from France.\"","> We all ride the cow to the train to France, where we find an amber field of warm, dry grain and meet a French farmer who listens very closely to our plan.","> \"Well, you've come to the right place,\" says Farmer Francois, twirling his mustache. \"My wheat makes the very best flour in the entire world!\" I grab two armfuls. \"Cinnamon buns, you say? If it's vanilla you need, the finest vanilla in all the world comes from Madagascar. Come with me!\"","> We all hop in his hot air balloon and set off over Africa, looking down on a magnificent leopard roaming the plains.","> In Madagascar, we march through the lush hills. There we meet Sabine, a vanilla grower, and I tell her the plan.","> \"Well, if you're making famous cinnamon buns, you've come to the right place,\" says Farmer Sabine, her eyes sparkling. \"My vines produce the most fragrant vanilla beans in all the world!\"","> I scoop up a handful of the heavy, brown vanilla beans. \"Madagascar grows sugar cane and cinnamon, too,\" says Farmer Sabine. \"Let me take you to my friend Patrick's plantation.\" Patrick listens to the plan.","> \"True, I have the sweetest sugar cane and the very best cinnamon in the world,\" he says. \"Sugar cane I can give you, but...\" He looks sad. \"I'm afraid I can't help you with cinnamon. I'm all out! We harvested it yesterday.\" \"No cinnamon for the cinnamon buns!\" we cry. \"Now what?\"","> Something high atop a tree catches my eye: a small area of bark. I climb the tree and peel some off. \"This will do,\" I say, grinning at the relieved crowd. We coax the cow and the chicken onto a steamship and head home before the ingredients spoil, mixing up a batch of Granny's Famous Cinnamon Buns along the way.","> \"Well?\" I ask as everyone chews and smiles.","> \"You were right!\" say the farmers. \"These are truly the very best cinnamon buns in all the world!\" Now, what should I make for lunch?","RC | What is the boy making for breakfast? | cinnamon buns | vanilla pudding | apple pie","RC | Where does the best butter come from? | Denmark | France | Madagascar","RC | What does the boy peel off the tree in Madagascar? | bark | vanilla beans | sugar cane","RT | Why does the boy go to so many different places? | He wants the best ingredients for the cinnamon buns.","RT | How did everyone get from Denmark to France? | They rode the cow to the train to France.","RT | Why did the boy climb a tree in Madagascar? | He climbed the tree to peel off some cinnamon bark.","RS | Why can't Patrick give the boy any cinnamon?","RS | How do they all get home? Why do they hurry?"],"grammar":["GT | Present Continuous for Future Plans","R | **am / is / are** + verb**-ing**  +  a future time  →  a plan","R | I**'m making** a special breakfast **today**.","G | I'm making a special breakfast today.","G | We're making vanilla pudding tomorrow.","G | We're playing soccer after school today.","G | My parents are having dinner at a French restaurant tomorrow.","G | I'm meeting my friends at the station tomorrow.","G | Carol and I are baking cinnamon cookies next week.","G | I'm cleaning my bedroom on Saturday morning.","G | Are you visiting your grandmother this weekend?"],"sw":["SP | A: Do you want some fruit? | B: Sure. I love fruit. Thank you. | A: I have oranges or bananas. Which one do you like? | B: I like oranges, but I prefer {bananas} because they are sweeter. | bananas / apples / grapes / strawberries / pears / mangoes","SW | My chickens lay {wonderful} eggs. The pumpkins in my garden are {enormous}. I put {creamy} butter on my toast. | Write three sentences about food, using interesting adjectives instead of good, big, or nice."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":6,"title":"From the World to Your Table","bq":"Where does our food come from?","learn":["What does \"export\" mean? | to send food or goods to another country to sell","What does \"local\" mean? | from the area near where you live","What does \"convenient\" mean? | easy and quick to use or do","Spell the word \"agriculture\". | a-g-r-i-c-u-l-t-u-r-e","Spell the word \"chemical\". | c-h-e-m-i-c-a-l","Make a polite offer with \"Would you like\" and an action. | Would you like to try my cheesecake?","Choose the correct word: \"Would you like (to / a) banana for a snack?\" | a","What are \"food miles\"? | the distance that food travels to get to us","Name two things you can do to help keep food healthy and save energy. | Buy local food and buy organic food.","Is it better to buy local food or food from far away? Why?"],"battle":["T | Where does the food in your kitchen come from? | Some of our rice comes from a local farm near my town.","S | Tell us about a food that comes from another country.","B | Would you like to know where your food comes from?","F | Would you like eat a piece of pizza? | Would you like to eat a piece of pizza? / Would you like a piece of pizza?","W | package | Make a sentence about how companies package food.","P | 🍎🚢✈️🛒 | Tell the story of an apple traveling from a farm to a supermarket.","C | Which is better, a small family farm or a large corporate farm? | A small family farm | A large corporate farm","Z | Name three foods and the countries they come from.","PT | 🥝🇯🇵🇳🇿 | Type a sentence about food miles."],"words":["convenient | con·ven·ient | con/ven/ient | 🏪","agriculture | ag·ri·cul·ture | ag/ri/cul/ture | 🚜","export | ex·port | ex/port | 🚢","local | lo·cal | lo/cal | 📍","process | proc·ess | proc/ess | ⚙️","package | pack·age | pack/age | 📦","decrease | de·crease | de/crease | 📉","century | cen·tu·ry | cen/tu/ry | 💯","chemical | chem·i·cal | chem/i/cal | 🧪","organic | or·gan·ic | or/gan/ic | 🥬","environment | en·vi·ron·ment | en/vi/ron/ment | 🌍","geography | ge·og·ra·phy | ge/og/ra/phy | 🗺️"],"reading":["> From the World to Your Table","> The next time you eat dinner, look closely at the food on your plate. If you are eating in the summertime, it's possible that some of the food comes from your own garden. Some might come from the local farmer's market. However, most of your food probably comes from far away.","> For centuries, people grew their own food and ate it themselves, keeping some for the long winter. In some countries, people continue to do this. However, agriculture has changed a great deal in the last 100 years. Most people no longer grow their own food. They buy it in supermarkets and grocery stores. Some of the food they buy comes from small family farms, but much of it comes from large corporate farms. Companies process and package most of this food before it gets to the supermarket. For example, they make orange juice from oranges. They also make flour from wheat, and then they make bread from the flour!","> Would you like to know where your food comes from? You can check yourself. Most food labels give this information. You may be surprised at what you discover. Many countries export food to places around the world. Thanks to modern agriculture, people around the world can enjoy apples from South Africa, pineapples from Costa Rica, and tomatoes from Mexico. They can eat pasta from Italy, kimchi from Korea, and cheese from Holland. They can enjoy this food without traveling to these places. Instead, the food travels to them.","> \"Food miles\" is the distance that food travels to get to us. For example, a person who lives in Japan may buy kiwi fruit that comes from New Zealand. This kiwi fruit has to travel 5,800 miles (9,300 kilometers) to get to this person. Airplanes, ships, trains, and trucks may bring this food. This transportation uses a lot of fuel that can cause pollution. When food travels, some of it needs to stay cool, which takes more energy and fuel. Also, companies put chemicals on food to help it last longer while it travels. These chemicals may not be good for our health.","> In our modern world, most people can't grow all the food they need. However, there are four things you can do to help decrease energy and keep food healthy and delicious. First, buy food that farmers grow in your area. Second, buy organic food, which doesn't have chemicals on it. Third, buy whole food with less processing and packaging. Fourth, try to grow more of your own food!","> It's convenient to buy food from all around the world. However, there may be farmers very close to you who grow the same food. By choosing local food, you can save energy, improve your health, and help local businesses. As people say, \"Eat locally, think globally!\"","RC | Where does most of our food probably come from? | far away | our own garden | the farmer's market","RC | What are \"food miles\"? | the distance food travels | the price of food | the weight of food","RC | Which food doesn't have chemicals on it? | organic food | processed food | packaged food","RT | What is a quick way to find out where food in a supermarket comes from? | You can read the food labels.","RT | Why don't people have to travel to other countries to get the food they want? | The food travels to them instead.","RT | Why do companies put chemicals on food? | They put chemicals on food to help it last longer while it travels.","RS | Why can food miles be bad for the Earth? Tell us one reason.","RS | Why is buying food from local farmers a good idea?"],"grammar":["GT | Polite Offers","R | **Would you like** + **to** + verb?  (an action)  →  Would you like **to know** where your food comes from?","R | **Would you like** + a thing?  →  Would you like **a delicious apple** from South Africa?","G | Would you like to try my cheesecake?","G | Would you like strawberries on top?","G | Would you like me to call Harry?","G | Would you like to know where your food comes from?","G | Would you like a delicious apple from South Africa?","G | Would you like to bake a cake with me?","G | Would you like a piece of apple pie?"],"sw":["SP | A: People often grow {tomatoes} where I live. | B: What do people make with them? | A: Many people make soup or salad. | B: I like both, but I really like soup. | tomatoes / rice / corn / strawberries / potatoes / apples","SW | The {garden} is {behind the house}. The {asparagus} is {near the carrots}. | Write two sentences that tell where food or plants are, using prepositional phrases of location."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":7,"title":"Art Through New Eyes","bq":"Why do we make art?","learn":["What does \"sculptor\" mean? | an artist who makes three-dimensional art from wood, stone, or other materials","What does \"prodigy\" mean? | a child with amazing skills, like a nine-year-old painter","What does \"canvas\" mean? | the strong cloth that artists paint on","Spell the word \"paintbrushes\". | p-a-i-n-t-b-r-u-s-h-e-s","Spell the word \"carpenter\". | c-a-r-p-e-n-t-e-r","Choose the indefinite pronoun: \"Did you meet (everything / anyone) at the art gallery?\" | anyone","Which indefinite pronoun means all of the people? | everyone","What does Edgar Mueller use to paint on the street? | washable paint or chalk","What are Patrick Dougherty's sculptures made of? | young trees, or saplings","Which kind of art would you like to make: a street painting, a sculpture, or a paper collage?"],"battle":["T | What is something you want to paint or draw? | I want to paint something beautiful in my bedroom.","S | Describe an artist from the reading and the art they make.","B | Anyone can be an artist and make art from anything.","F | Everyone want to see the street painting. | Everyone wants to see the street painting.","W | sketch | Make a sentence about making a sketch.","P | 🎨🖌️🧵🌳 | An artist makes something new. Tell the story.","C | Is street art real art? | Yes, it is real art | No, it is not real art","Z | Name three things an artist uses to make art.","S | Explain why Sung Hee Cho glues thousands of paper pieces onto her canvas."],"words":["sketch | sketch | sk/etch | ✏️","pastels | pas·tels | pas/tels | 🖍️","canvas | can·vas | can/vas | 🖼️","paintbrushes | paint·brush·es | paint/brush/es | 🖌️","shapes | shapes | sh/apes | 🔷","string | string | str/ing | 🧵","prodigy | prod·i·gy | prod/i/gy | 🌟","carpenter | car·pen·ter | car/pen/ter | 🔨","sculptor | sculp·tor | sculp/tor | 🗿","complex | com·plex | com/plex | 🧩","washable | wash·a·ble | wash/a/ble | 🧼","fascination | fas·ci·na·tion | fas/ci/na/tion | ✨","disorganized | dis·or·gan·ized | dis/or/gan/ized | 🗂️","dishonest | dis·hon·est | dis/hon/est | 🤥"],"reading":["> Art Through New Eyes","> Can anyone make art? Can artists make art from anything? Let's look at art through the eyes of some very inspiring modern artists to answer these questions.","> The Painting Prodigy: When Kieron Williamson was five years old, he went with his family on a trip to Cornwall, England. He drew sketches of the boats he saw there. This was the start of Kieron's love of drawing. The more he drew, the more complex his drawings became. Kieron wanted to learn more about art, so he spent time with local artists in his home county of Norfolk, England. They helped him build his skills in drawing and painting. He started to create paintings using oil paints, pastels, and watercolors. By the age of nine, Kieron was considered to be a child prodigy.","> Today, seventeen-year-old Kieron continues to create beautiful paintings. People around the world admire his artwork. Kieron says, \"The things that inspire me include nature, big skies, a

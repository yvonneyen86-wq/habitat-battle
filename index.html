raw/ing | ✏️","mobile | mo·bile | mo/bile | 🎐","mosaic | mo·sa·ic | mo/sa/ic | 🧩"],"reading":["> Shapes in Art","> We can see shapes in people, animals, nature, art, and much more in our world. They are all around us.","> Kinds of Shapes: Squares and rectangles have four straight sides and four corners. How are squares and rectangles different? A square has four corners and all four sides are the same length. A rectangle also has four corners, but two sides are longer than the other two.","> Circles and ovals don't have straight lines or corners. How are circles and ovals different? All triangles have three straight lines and three corners.","> Stars, crescents, and spirals are all very different kinds of shapes. Stars have lots of sides. Crescents have two sides, but they aren't straight. Spirals don't have sides, and they don't have straight lines or corners. What shapes do you see in this nature collage?","> Art Shapes: George W. Hart made this sculpture from wood. He uses math to help him make all his sculptures. What shapes can you see in this sculpture?","> This picture is made from lots of circles, and each circle has one color inside it. The artist, Ben Heine, used a computer to make this picture.","> A famous painter called Piet Mondrian inspired people to use shapes and straight lines in their paintings. Some things today, like dresses, use his patterns and colors. How many different shapes can you see in the painting?","> The next time you paint, draw, or make a piece of art, look for the shapes in your world to help you.","RC | How many corners does a square have? | four | three | two","RC | Which shape has three straight lines and three corners? | a triangle | a circle | a crescent","RC | What did George W. Hart make his sculpture from? | wood | paper | stone","RT | What shapes did Ben Heine use to make his picture? | He used lots of circles to make his picture.","RT | What does George Hart use to help him make his sculptures? | He uses math to help him make his sculptures.","RT | Which artist inspired people to use shapes and straight lines? | Piet Mondrian inspired people to use shapes and straight lines.","RS | How are squares and rectangles different?","RS | How are crescents and spirals different from squares? Tell us one thing."],"grammar":["GT | Quantifiers – a lot of / any","R | things we can count:  There **are a lot of** shapes.  ·  There **aren't any** triangles.","R | things we can't count:  There **is a lot of** paper.  ·  There **isn't any** red paint.","R | count → **are / aren't any**      can't count → **is / isn't any**","G | There are a lot of shapes.","G | There is a lot of paper.","G | There aren't any triangles.","G | There isn't any red paint.","G | Are there any stars in the painting?","G | Your collage has green triangles.","G | There's a lot of snow in this collage.","G | But there aren't any flowers."],"sw":["SP | A: Wow! That's a really great {mobile}! | B: Thank you. | A: You're very good at art. | B: Thanks. And you're good at math! | mobile / collage / sculpture / drawing / photograph / mosaic","SW | My favorite kind of art is {collage}. I use {circles} and {triangles}. There are a lot of {colors} in my art. | Write about your favorite kind of art and the shapes you use."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":18,"title":"Origami","bq":"How do we make art?","learn":["What does \"fold\" mean? | to bend paper so one part lies on another part","What does \"crumple\" mean? | to press paper into a messy ball","What does \"crane\" mean? | a tall bird with long legs, often made in origami","Spell the word \"shiny\". | s-h-i-n-y","Spell the word \"golden\". | g-o-l-d-e-n","Complete: ___ many seals were there? There was one seal. | How","Complete: How much paper was there? There was ___ of paper. | a lot","What did Maki make first with the red square? | a crane","Who was looking for Maki in the origami world? | her sister Akiko","What would you like to make with paper? Why?"],"battle":["T | What did Maki make with the blue paper? | She made water and crumpled it to make waves.","B | Maki folded a red square and made a crane.","F | How many paper was there? | How much paper was there?","F | How much seals were there? There was one seal. | How many seals were there? There was one seal.","W | edge | Make a sentence with the word edge.","W | seal | Make a sentence with the word seal.","P | 📄🕊️🐬⛵ | Tell the story of Maki's origami world.","C | Is origami easier than painting? | Yes, easier | No, harder","Z | Name three things you use to make art.","S | Ask your partner how much or how many of something there is in the classroom."],"words":["shiny | shin·y | shin/y | ✨","fold | fold | f/old | 📄","edge | edge | e/dge | 📐","crane | crane | cr/ane | 🦢","seal | seal | s/eal | 🦭","crumple | crum·ple | crum/ple | 🗞️","climb | climb | cl/imb | 🧗","golden | gold·en | gold/en | 🌟","waves | waves | w/aves | 🌊","markers | mark·ers | mark/ers | 🖊️","scissors | scis·sors | scis/sors | ✂️","glue | glue | gl/ue | 🧴","watercolors | wa·ter·col·ors | wa/ter/col/ors | 🎨","chalk | chalk | ch/alk | 🖍️"],"reading":["> Origami","> Maki woke up early. Her room was quiet. Everyone was sleeping, even her little sister Akiko in the bed next to hers. What could she do? I know, she thought. I can do origami! On the table was some colored paper.","> Maki got out of bed quietly. The paper was shiny, and there were a lot of colors. Maki folded a red square, bending the paper in the middle and at the edges. She worked until it was done. Suddenly, it was a crane!","> The crane looked lonely, so she made another, this time a blue one. Soon she had a whole row of origami cranes! \"Would you like some friends?\" Maki asked the cranes. \"Oh, yes!\" said the cranes. \"You can speak?\" Maki laughed. \"Of course. You're in our origami world now!\" So Maki picked up more paper.","> She made an orange seal. Seals like to play, Maki knew, so she made him a purple ball. \"Thanks,\" said the seal. And he rolled the ball back to her. They played and played until Maki had another idea.","> With blue paper, Maki made water, crumpling it to make waves. Maki dived into the water and swam happily with the cranes and seal. A green fish jumped through the air.","> But something was missing. Maki remembered her sister, Akiko. She missed her and wanted to see her.","> Maki saw a sailboat. The boat came near, and Maki heard a voice. \"All aboard!\" the voice said. Maki looked up. It was her sister's voice! Akiko was awake and looking for her in the origami world.","> She climbed into the sailboat. \"Hello, Akiko!\" she said. Her new friends looked at her from the water, smiling.","> In Maki's hands was one last piece of paper. It was golden. Maki folded it, threw it high into the air, and made a big, round sun.","RC | What color ball did Maki make for the seal? | purple | red | blue","RC | What did Maki make with blue paper? | water and waves | a crane | a sun","RC | Whose voice did Maki hear from the sailboat? | her sister's | her mother's | the seal's","RT | When Maki woke up, what did she see on the table? | She saw some colored paper on the table.","RT | What animals did Maki make? | She made cranes and an orange seal.","RT | What did Maki make with the golden paper? | She made a big, round sun.","RS | Why did Maki make a second crane?","RS | Why did Maki get onto the sailboat?"],"grammar":["GT | Quantifiers – Questions","R | **Did** Maki have **any** pencils?  No, she didn't.","R | **How many** seals were there?  There was **one** seal.   (count)","R | **How much** paper was there?  There was **a lot of** paper.   (can't count)","G | Did Maki have any pencils?","G | No, she didn't have any pencils.","G | How many seals were there?","G | There was one orange seal.","G | How much paper was there?","G | There was a lot of paper.","G | Do you have any green paint?","G | How many paintbrushes do you have?"],"sw":["SP | A: It's a picture of the rainforest. | B: What did you use to make it? | A: I used {watercolors} for the trees. | B: Wow! You made a beautiful painting! | watercolors / markers / chalk / glue / paper / stone","SW | I usually use {markers}, {scissors}, and {glue} in my art projects. I like {markers} best. | Write about the art tools you usually use in your art projects."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false}]},"OD3":{"units":[{"n":1,"title":"Having Fun","bq":"How do people have fun?","learn":["What does \"festival\" mean? | a special time when people celebrate with food, music, and dancing","What does \"family reunion\" mean? | a time when aunts, uncles, cousins, and grandparents come together","What does \"championship\" mean? | the final game that decides the best team","Spell the word \"wedding\". | w-e-d-d-i-n-g","Spell the word \"festival\". | f-e-s-t-i-v-a-l","Which is correct: The game is exciting, or The game is excited? | The game is exciting.","Finish the sentence: The people are ___ (excite). | excited","What do children in China often get at Chinese New Year? | money in red paper envelopes","How often do people watch the World Cup soccer championships? | every four years","What is your favorite way to have fun in each season?"],"battle":["T | Tell us about a festival you know. | At Chinese New Year, families clean their homes and eat delicious food.","T | What did you do at your last family reunion? | I played volleyball with my cousins at the family reunion.","B | Children often get money in red paper envelopes.","F | The soccer game was very excited. | The soccer game was very exciting.","F | I am so boring with this long race. | I am so bored with this long race.","W | wedding | Make a sentence about a wedding you went to.","P | 🎆🏮🥟🧧 | What festival is this? Tell the story.","C | Is a festival more fun than a sports game? | A festival | A sports game","Z | Name three sports with a ball.","S | Describe your favorite festival in two sentences."],"words":["festival | fes·ti·val | fes/ti/val | 🎉","wedding | wed·ding | wed/ding | 💒","fair | fair | f/air | 🎡","team | team | t/eam | 👥","winner | win·ner | win/ner | 🏆","race | race | r/ace | 🏃","score | score | sc/ore | 🔢","player | play·er | play/er | ⚽","athlete | ath·lete | ath/lete | 🏅","band | band | b/and | 🎺","laugh | laugh | l/augh | 😂","answer | an·swer | an/swer | ✅","paint | paint | p/aint | 🎨","place | place | pl/ace | 📍"],"reading":["> Having Fun","> It's important to have fun if you want a happy and healthy life. Here are some ways people enjoy life all over the world.","> Festivals: Some people think the Chinese New Year is the most important festival in China. Families clean their homes and then enjoy delicious food. Children often get money in red paper envelopes.","> In Korea and Japan, Children's Day is on May 5th. Children and their parents spend the day together and go to zoos and parks. Some families fly kites.","> In India, families enjoy Diwali, the festival of lights. Families light candles and decorate their homes with flowers. People give gifts, and there is dancing and music.","> Sports: These men are playing an exciting game called soccer. Every four years, people watch their favorite players at the World Cup soccer championships. The team that wins the championship game is the best team in the world!","> Another popular game is volleyball. People play volleyball in 211 countries. You can play volleyball inside or on the beach. The first team to reach a score of 25 is the winner.","> Many people watch the summer and winter Olympic Games. Almost every country in the world sends its best athletes to race and play at these games. Some athletes swim, and others run or jump to see which athletes are the best.","> Family Celebrations: When a girl turns 15 years old in Mexico, her family and friends often celebrate with food and dancing. This also happens in many parts of Central and South America.","> A wedding is always a big celebration! In Egypt, dancers and musicians gather around the married couple and dance for up to one hour! Then people eat a special dinner.","> People celebrate family reunions all over the world. Aunts, uncles, cousins, and grandparents come together to eat and have fun.","> Community Events: Folk dance is popular around the world. In Turkey, folk dancers wear colorful costumes and dance at weddings and festivals. People like to watch folk dances, but they also like to dance themselves!","> A fair is a great place for people to come together and have fun. Many fairs have farm animals, delicious food, fun games, and bands that play music.","RC | What do children often get at Chinese New Year? | money in red envelopes | new kites | farm animals","RC | What score does a volleyball team need to win? | 25 | 15 | 211","RC | Where do folk dancers wear colorful costumes? | in Turkey | in Egypt | in Mexico","RT | When is Children's Day in Korea and Japan? | Children's Day is on May 5th.","RT | What do families do at Diwali? | Families light candles and decorate their homes with flowers.","RT | Who comes together at a family reunion? | Aunts, uncles, cousins, and grandparents come together to eat and have fun.","RS | Why is it important to have fun? Tell us what the reading says.","RS | What happens at a wedding in Egypt? Tell us one thing."],"grammar":["GT | Adjectives with -ed and -ing","R | **-ed** → how we feel:  tir**ed**, bor**ed**, excit**ed**","R | **-ing** → about a thing (a game, a movie):  tir**ing**, bor**ing**, excit**ing**","R | The people are **excited**.  The game is **exciting**.","G | That race was really tiring.","G | I'm so tired after the race.","G | The people are excited.","G | The game is exciting.","G | Are you interested in soccer?","G | Animals are very interesting.","G | Jay thinks races are boring.","G | We are excited to go to the festival."],"sw":["SP | A: Look at the two weddings. What is the same? | B: Everyone is {dancing} in both pictures. | A: What is different? | B: The colors of the dresses are different. | dancing / eating / smiling / singing / happy / outside","SW | {Last Saturday}, I went to {a fair} with my family. We {ate delicious food and played fun games}. It was {exciting}! | Write three sentences about a fun event you went to, using a time word and past tense verbs."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":2,"title":"The Red Rubber Ball","bq":"How do people have fun?","learn":["What does \"bounce\" mean? | to hit the ground and come back up again","What does \"toss\" mean? | to throw something gently","What does \"balance\" mean? | to keep steady and not fall over","Spell the word \"canyon\". | c-a-n-y-o-n","Spell the word \"bounce\". | b-o-u-n-c-e","Change the verb to a gerund: Ashanti's friends like (skip). | Ashanti's friends like skipping.","Fill in the blank: ___ a ball is lots of fun. (bounce) | Bouncing a ball is lots of fun.","Who is Da Ga in Ashanti's game? | the boa constrictor in the center of the circle","How does Hyo win Omok? | He lines up five of his stones.","Why are games often more fun when you play with other people?"],"battle":["T | What game do you like playing with friends? | I like playing tag with my friends after school.","T | How does Maria keep her balance in La Thunkuna? | She puts her arms out to keep her balance.","B | Ashanti bounces the ball as hard as she can.","F | Maria likes land on one foot. | Maria likes landing on one foot. / Maria likes to land on one foot.","F | Kick the ball high is fun. | Kicking the ball high is fun.","W | toss | Make a sentence with the word toss.","P | 🔴⚽🏔️🌊 | Where does the red rubber ball fly? Tell the story.","C | Is a ball game better than a board game? | A ball game | A board game","Z | Name three things the ball flew over.","S | Explain the rules of a game you play. Use two sentences."],"words":["kick | kick | k/ick | 🦵","tag | tag | t/ag | 🏃","skip | skip | sk/ip | 🤸","bounce | bounce | b/ounce | 🏀","drop | drop | dr/op | ⬇️","plain | plain | pl/ain | 🌾","lake | lake | l/ake | 🏞️","canyon | can·yon | can/yon | 🏜️","cliff | cliff | cl/iff | 🧗","stream | stream | str/eam | 💧","toss | toss | t/oss | 🤾","balance | bal·ance | bal/ance | ⚖️"],"reading":["> The Red Rubber Ball","> High up on Antuco Mountain, Carlos kicks his red rubber ball so hard that it flies high in the sky like a shooting star.","> Far across the world, Ashanti is playing Da Ga with her friends. It's Ashanti's turn to be Da Ga, the boa constrictor, so she goes into the center of the circle. Her friends dance and skip around her while she acts like a snake and tries to tag the next Da Ga. It's fun to catch them. Ashanti is tagging a friend when something red drops out of the sky into the circle. Where did this come from? There is no ball in Da Ga!","> Ashanti laughs. She bounces the ball as hard as she can. It flies high and fast across the sky until she can't see it anymore. It flies over a forest, white cliffs, and a big blue ocean.","> Far away, Hyo and his brother are playing Omok. Hyo plays with little dark pebbles, and his brother plays with little white ones. Hyo tries to line up five of his stones to win. Winning isn't easy. Hyo is finding the perfect place to put his stone when something red rolls into the middle of the game. What's this? You don't need a ball to play Omok!","> Hyo smiles. Then he throws the ball as hard as he can. It flies far into the sky, over plains and seas.","> The Fernandez family is playing La Thunkuna. Papa draws boxes in the sand. Mama writes names in the boxes, one for each day of the week. Matias tosses a stone, and Maria jumps over it. She lands in the next box without stepping on the line. Maria likes landing on one foot, and she puts her arms out to keep her balance. Something round bounces on her foot. Hey! What's this? There is no ball in this game!","> Everyone laughs. Maria tosses the ball in the air, and Matias kicks it up into the sky. The whole family watches as the ball goes up and up until they can't see it anymore.","> High in the sky, the ball flies over lakes, canyons, and streams. Carlos holds out his arms and catches his red rubber ball. He is the only boy playing on Antuco Mountain today, but he is not sad. Carlos has friends all over the world.","RC | In Da Ga, what does the player in the middle act like? | a snake | a bird | a ball","RC | How many stones does Hyo need to line up to win Omok? | five | three | ten","RC | What does Papa draw in the sand for La Thunkuna? | boxes | circles | stars","RT | Where is Carlos playing with his ball? | Carlos is playing on Antuco Mountain.","RT | What does Maria do to keep her balance? | She puts her arms out to keep her balance.","RT | What does the ball fly over at the end of the story? | The ball flies over lakes, canyons, and streams.","RS | What is the main idea of the story? Tell us in one sentence.","RS | Why isn't Carlos sad at the end of the story?"],"grammar":["GT | Gerunds","R | verb + **-ing** = a noun (gerund):  skip → skipp**ing**,  land → land**ing**","R | Ashanti's friends like **skipping**.","R | Maria likes **landing** on one foot.","G | Running and jumping are lots of fun.","G | Do you like to bounce a ball?","G | Bouncing a ball is lots of fun.","G | Kicking it high in the sky is fun.","G | Ashanti's friends like skipping.","G | Maria likes landing on one foot.","G | Cleaning is hard work.","G | I really like cooking."],"sw":["SP | A: I'm worried about {tomorrow's game}. | B: Don't worry. You can do it! | A: I'm afraid I will make a mistake. | B: Don't give up. Just do your best! | tomorrow's game / the race / the test / the show / swimming in the lake / my piano lesson","SW | {What} is your favorite game? {Where} do you play it? {Why} do you like it? | Write three questions about games, each starting with who, what, when, where, or why."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":3,"title":"Letters to a Friend","bq":"Why do people move to new places?","learn":["What does \"neighbor\" mean? | a person who lives next to you or near your house","What does \"surgeon\" mean? | a doctor who does operations in a hospital","What does \"classmate\" mean? | a student who is in your class","Spell the word \"neighbor\". | n-e-i-g-h-b-o-r","Spell the word \"fishing\". | f-i-s-h-i-n-g","Which is correct: When I was five, I can ride a bike, or I could ride a bike? | When I was five, I could ride a bike.","Finish the sentence: Sati couldn't ice skate before, but now she ___ ice skate. | can","Where did Sati move from and to? | from Mumbai, India to St. Cloud, Minnesota","What is Sati's father's new job? | He is a surgeon at the hospital.","Would you like to move to a new country? Why or why not?"],"battle":["T | What could you do when you were younger? | When I was younger, I could read short words.","T | What winter activity did Sati do with Emily? | Sati went ice skating on a lake with Emily.","B | Emily is my neighbor and my classmate.","F | When I was three, I can't catch a ball. | When I was three, I couldn't catch a ball.","F | Now I am eight, and I could ride a bike. | Now I am eight, and I can ride a bike.","W | ice skating | Make a sentence about ice skating.","P | ✈️🏠❄️💌 | What happened to Sati? Tell the story.","C | Is it better to live in a quiet town or a big city? | A quiet town | A big city","Z | Name three things Sati can do at summer camp.","S | Tell us about something you couldn't do before but can do now."],"words":["packing | pack·ing | pack/ing | 📦","moving | mov·ing | mov/ing | 🚚","shopping | shop·ping | shop/ping | 🛍️","dancing | danc·ing | danc/ing | 💃","sledding | sled·ding | sled/ding | 🛷","fishing | fish·ing | fish/ing | 🎣","skating | skat·ing | skat/ing | ⛸️","neighbors | neigh·bors | neigh/bors | 🏘️","snowballs | snow·balls | snow/balls | ⛄","unpacked | un·packed | un/packed | 📭","untied | un·tied | un/tied | 👟","monsoon | mon·soon | mon/soon | 🌧️","surgeon | sur·geon | sur/geon | 🩺","classmate | class·mate | class/mate | 🎒"],"reading":["> Letters to a Friend","> July 25th. Dear Nisha, Moving is hard work! Mom and I are still unpacking boxes. She and I were packing them just eight weeks ago! Your picture is on my desk. I miss you!","> Our new house is in a town called St. Cloud, Minnesota. It's very quiet compared to Mumbai. The weather in July is warm and sunny, and there are no rainy monsoons. Sunil and I can play together, but I don't have any friends here. Meeting neighbors isn't easy for me. School starts in September.","> Dad started his new job as a surgeon at the hospital here. He's happy working here. I'm not happy. I just feel lonely. Please write soon! Your best friend, Sati","> October 15th. Dear Nisha, I really miss you! The weather is getting much colder. The leaves are falling from the trees. Sunil and I rake leaves every Saturday in our yard. It's hard work.","> I go to Maple Hill Elementary School. I'm the only student from India in my class. Today a boy said that my lunch smelled funny. It was my Mom's lentil curry, which is my favorite. I couldn't say anything because I was so angry. I DON'T LIKE IT HERE! I want to go back to Mumbai. Your best friend, Sati","> January 12th. Dear Nisha, It snowed 30 centimeters last night! Today, Sunil and I threw snowballs and went sledding with Emily. Emily is my neighbor and my classmate. We went ice skating last week on a lake. Someone made a hole in the ice and was fishing! It was so cold!","> Tonight Emily and I watched one of my favorite Bollywood movies. Mom made curry. Emily liked it! Your best friend, Sati","> April 5th. Dear Nisha, Happy Birthday! I miss you so much! Guess what? I'm taking tap dance lessons with Emily. I'm happy to be dancing again.","> On Saturday, we went to Minneapolis. Emily came with us. Emily and I went shopping for clothes. We ate at a fun restaurant there. We had so much fun! Emily, Ashli, and Rachel are coming over on Sunday to work on our science project. I'm making some good friends. Your best friend, Sati","> June 20th. Dear Nisha, School is over, but I'm getting ready to go to summer camp with Emily. We can go fishing, swimming, hiking, and canoeing there. I'm so excited!","> The weather is warm and sunny again. When can you visit me in Minnesota? There are so many fun things to do here. My new friends want to meet you, too! Please come! Your best friend, Sati","RC | What is Sati's dad's new job? | a surgeon | a teacher | a dancer","RC | Who is Emily? | Sati's neighbor and classmate | Sati's sister | Sati's friend in India","RC | What did Sati and Emily do in Minneapolis? | went shopping | went sledding | went fishing","RT | Where did Sati live before she moved? | Sati lived in Mumbai, India.","RT | What do Sati and Sunil do every Saturday in October? | They rake leaves in their yard.","RT | What lessons is Sati taking with Emily? | Sati is taking tap dance lessons with Emily.","RS | How did Sati's feelings change through the year?","RS | Why was Sati angry at school in October?"],"grammar":["GT | Can and Could","R | **can** = now (present)      **could** = before (past)","R | Then: Sati **couldn't** ice skate.  →  Now: Sati **can** ice skate.","R | Then: Sati **could** play with Nisha.  →  Now: Sati **can't** play with Nisha.","G | When I was younger, I couldn't ride a bike.","G | Now I can ride a bike.","G | Sati couldn't ice skate before.","G | Now Sati can ice skate.","G | Sati could play with Nisha in India.","G | Sati can't play with Nisha now.","G | Could you catch a ball when you were five?","G | I could read short words when I was younger."],"sw":["SP | A: I'm sorry to bother you, but can you help me? | B: Sure. I can help you. What do you need? | A: Can you help me {pack this box}? | B: Yes, I can. Let's do it together! | pack this box / find my book / rake the leaves / carry these bags / unpack the boxes / find the post office","SW | In {India}, the summers are {rainy}, but in {Minnesota} the summers are {sunny}. | Write two sentences that use but to show how two places or people are different."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":4,"title":"Moving from Here to There","bq":"Why do people move to new places?","learn":["What does \"rural area\" mean? | a place in the country with farms and few people","What does \"suburb\" mean? | an area near the outside of a city where many families live","What does \"immigrant\" mean? | a person who moves to another country to live there","Spell the word \"hospital\". | h-o-s-p-i-t-a-l","Spell the word \"suburb\". | s-u-b-u-r-b","Finish the sentence: If I'm sleepy, I ___ to the park. | run","Match the parts: When I'm hungry, ___. | I have a snack.","Why do people move from rural areas to cities? | to find jobs and a better life","What do suburbs have more space for? | schools, hospitals, clinics, shopping malls, and zoos","Would you rather live in a suburb or in the center of a city? Why?"],"battle":["T | What do you do when you feel thirsty? | When I'm thirsty, I drink a glass of water.","T | Why did the boy's family move to Chengdu? | His father moved to Chengdu to find work.","B | People move to find jobs and a better life.","F | If ice gets warm, it melt. | If ice gets warm, it melts.","F | When you get sick, you goes to the clinic. | When you get sick, you go to the clinic.","W | shopping mall | Make a sentence about a shopping mall.","PT | 📦🚚🏙️🏡 | Why is this family moving? Type one sentence.","C | Is it better to move for a job or stay near family? | Move for a job | Stay near family","Z | Name three places in a community.","S | Give two reasons why people move to new places."],"words":["country | coun·try | coun/try | 🌏","suburb | sub·urb | sub/urb | 🏘️","university | u·ni·ver·si·ty | u/ni/ver/si/ty | 🎓","hospital | hos·pi·tal | hos/pi/tal | 🏥","factory | fac·to·ry | fac/to/ry | 🏭","clinic | clin·ic | clin/ic | 🩺","rural | ru·ral | ru/ral | 🌾","urban | ur·ban | ur/ban | 🏙️","belongings | be·long·ings | be/long/ings | 🧳","immigrant | im·mi·grant | im/mi/grant | ✈️","experiences | ex·pe·ri·enc·es | ex/pe/ri/enc/es | 🎢","services | ser·vic·es | ser/vic/es | 🛎️","weather | weath·er | weath/er | ☀️","abroad | a·broad | a/broad | 🌍"],"reading":["> Moving from Here... to There","> Do you know someone who moved to your city or town? Maybe they came from a rural area, or from another city. Perhaps they came from another country. Every day, people pack their belongings and move to new places. Why do people move? Let's look at three important reasons.","> Jobs: People move to find jobs and a better life. Sometimes, people move from rural areas to urban areas to get a job. In 1990, about a quarter of the people in China lived in cities. Today, over half of the Chinese people live in cities. People move abroad to find a better way of life, too. For example, immigrants from Europe moved to Brazil in the 1950s to work in factories.","> \"Last year my father moved to the city of Chengdu to find work. My mother and I stayed in our small town. It felt lonely without my father. Now we all live together in an apartment in Chengdu. I'm in a good school, and I really like my new friends.\"","> Services: When another city has good services, people want to move there. Sometimes people move from a city to areas called suburbs. Suburbs are near the outside of a city. Suburbs have more space for schools, hospitals, clinics, shopping malls, and zoos. Families with children like to live in suburbs.","> \"When I was three, my parents sold their flat in central London and bought a house in the suburbs. My dad has to drive further to work now, but I can walk to school. There's lots of space to play football with my friends here.\"","> New Experiences: Finally, people move when they want a change in their lives, or to find new experiences. Older people often move to places with better weather. If students want to learn about other places, they sometimes go to universities in other countries. As you can see, people move for many reasons. Maybe someday you, or someone you know, will move, too!","> \"My grandparents moved to Portugal when I was five. They visit us here in Stockholm in the summer, but in the winter they stay in Portugal. They love the warm weather there.\"","RC | Why did immigrants from Europe move to Brazil in the 1950s? | to work in factories | to study at universities | to find better weather","RC | Where are suburbs? | near the outside of a city | in the center of a city | far away from any city","RC | Why do older people often move? | for better weather | to find jobs | to go to school","RT | Why do people move from rural areas to urban areas? | They move to urban areas to get a job.","RT | Why do families with children like to live in suburbs? | Suburbs have more space for schools, hospitals, and shopping malls.","RT | Where did the grandparents move to? | The grandparents moved to Portugal.","RS | What are the three main reasons people move? Tell us one.","RS | Why do students sometimes go to universities in other countries?"],"grammar":["GT | Present Real Conditional","R | **If** / **When** + one thing happens,  another thing happens","R | **If** I'm sleepy, I run to the park.","R | **When** another city has good services, people want to move there.","G | If I'm sleepy, I run to the park.","G | When you run, you feel more awake.","G | When another city has good services, people want to move there.","G | If ice gets warm, it melts.","G | If you get sick, you go to the clinic.","G | When I'm hungry, I have a snack.","G | When I'm thirsty, I drink a glass of milk.","G | What do you do when you feel sleepy?"],"sw":["SP | A: What kind of community do you like the most? | B: I like {suburban} areas because there is lots of space to play. | A: Not me. I like urban areas because there are many shopping malls. | B: Me too. I also like the big hospitals and universities. | suburban / urban / rural / city / country / quiet","SW | I want to move to {Australia} because {the weather there is often sunny}. I also like it because {there are beautiful beaches}. | Write two complete sentences with because about a place you want to move to."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":5,"title":"Three Poets","bq":"Why do people write poems?","learn":["What does \"insect\" mean? | a small animal with six legs, such as a bee or a beetle","What does \"thicket\" mean? | a group of bushes or small trees growing close together","What does \"escape\" mean? | to get away from a place","Spell the word \"butterfly\". | b-u-t-t-e-r-f-l-y","Spell the word \"grasshopper\". | g-r-a-s-s-h-o-p-p-e-r","Finish the sentence: What were they doing last night? They ___ watching television. | were","Change to past continuous: I (eat) breakfast at seven this morning. | I was eating breakfast at seven this morning.","In Michael Rosen's poem, what escaped from the jar? | a raisin","What did Aileen Fisher love to write about? | insects","Which poem did you like best? Why?"],"battle":["T | What were you doing this morning at seven o'clock? | I was eating breakfast with my mom at seven o'clock.","T | What was the raisin doing in the poem? | The raisin was leaping in the air like a kangaroo.","B | The birds were singing and the sun was shining.","F | What was Sarah doing yesterday? She playing in the park. | What was Sarah doing yesterday? She was playing in the park.","F | The crickets was singing in the thickets. | The crickets were singing in the thickets.","W | kangaroo | Make a sentence with the word kangaroo.","P | 🍇🏃🦘😲 | What is the dangerous raisin doing? Tell the story.","C | Are funny poems better than poems about nature? | Funny poems | Nature poems","Z | Name three insects from the poem \"But I Wonder.\"","S | Say what you were doing last night at eight o'clock. Use two sentences."],"words":["ladybug | la·dy·bug | la/dy/bug | 🐞","cricket | crick·et | crick/et | 🦗","grasshopper | grass·hop·per | grass/hop/per | 🦗","beetle | bee·tle | bee/tle | 🪲","katydid | ka·ty·did | ka/ty/did | 🌿","bee | bee | b/ee | 🐝","butterfly | but·ter·fly | but/ter/fly | 🦋","thicket | thick·et | thick/et | 🌳","kangaroo | kan·ga·roo | kan/ga/roo | 🦘","raisin | rai·sin | rai/sin | 🍇","handle | han·dle | han/dle | 🚪","gentle | gen·tle | gen/tle | 🤗","bubble | bub·ble | bub/ble | 🫧","single | sin·gle | sin/gle | 1️⃣"],"reading":["> Three Poets","> People write poems to share what they see. They want us to feel the joy or sadness that they feel. The following three poets come from two countries, the United States and the United Kingdom. However, the language they use is the same: English!","> Michael Rosen is a British children's book writer and poet. He enjoys writing poetry and reading it aloud with his children. One day, Michael Rosen and his daughter are eating at a table. A raisin \"escapes.\" It seems to run away from its jar!","> A Dangerous Raisin (but my daughter Elsie is helpful) by Michael Rosen: A raisin has escaped from the raisin jar. / It's whooshing across the table like a shooting star. / Now, it's leaping in the air like a kangaroo. / \"Look out Dad, it's coming for YOU!\"","> Michael Rosen writes very creative poems. His poem \"Colour\" encourages children to be creative, too. In the United States, the word is spelled color. In the United Kingdom, the word is spelled colour.","> Colour by Michael Rosen: Take a brush: / the sky is green / the grass is blue / you are purple / the house is silver / the sun is black / the river is gold / the world has changed. / Did you do that?","> Aileen Fisher was an award-winning American children's poet, book writer, and playwright. She loved nature and liked to go hiking and mountain climbing. Do you like grasshoppers and beetles? Aileen Fisher loved to write about insects.","> But I Wonder... by Aileen Fisher: The crickets in the thickets, / and the katydids in trees, / and ants on plants, and butterflies, / and ladybugs and bees / don't smell with little noses / but with feelers, if you please. / They get along quite nicely, / but I wonder how they sneeze.","> Robert Louis Stevenson was a famous Scottish poet and book writer who lived in the 1800s. He wrote many books, including the famous Treasure Island. Do you notice how winter days are short and summer days are long? Robert Louis Stevenson noticed it, too, and wrote about it in his poem \"Bed in Summer.\"","> Bed in Summer by Robert Louis Stevenson: In winter I get up at night / And dress by yellow candle-light, / In summer, quite the other way, / I have to go to bed by day. / I have to go to bed and see / The birds still hopping on the tree, / Or hear the grown-up people's feet / Still going past me in the street. / And does it not seem hard to you, / When all the sky is clear and blue, / And I should like so much to play, / To have to go to bed by day?","RC | In \"A Dangerous Raisin,\" what is the raisin leaping like? | a kangaroo | a shooting star | a butterfly","RC | In \"But I Wonder...,\" how do insects smell? | with feelers | with little noses | with their wings","RC | Which famous book did Robert Louis Stevenson write? | Treasure Island | Colour | A Dangerous Raisin","RT | Which two countries do the three poets come from? | They come from the United States and the United Kingdom.","RT | What did Aileen Fisher love to write about? | She loved to write about insects.","RT | In \"Bed in Summer,\" when does the boy have to go to bed in summer? | He has to go to bed by day.","RS | Why do people write poems? Tell us one reason from the text.","RS | Why does the boy in \"Bed in Summer\" think summer bedtime is hard?"],"grammar":["GT | Past Continuous","R | **was / were** + verb + **-ing**  →  what was going on at a time in the past","R | What were they doing last night?  They **were watching** television.","G | The birds were singing this morning.","G | My dad was frying eggs in the kitchen.","G | The bus driver was honking his horn.","G | What were they doing last night?","G | They were watching television.","G | What was Sarah doing yesterday afternoon?","G | She was playing in the park.","G | I was eating breakfast with my mom."],"sw":["SP | A: Look. There are three {butterflies} in this picture. | B: Yes, I see. In this picture, there are only two. | A: What else is different? | B: The ladybug is red here, but it's green there. | butterflies / beetles / bees / crickets / grasshoppers / ladybugs","SW | I see a {big green} {grasshopper}. It is {jumping in the thicket}. I wonder {how it sings}. | Write three short lines about an insect, with the size word before the color word."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":6,"title":"You Can Be a Poet","bq":"Why do people write poems?","learn":["What does \"syllable\" mean? | one part of a word that has one vowel sound","What does \"observe\" mean? | to watch something carefully","What does \"rhyming words\" mean? | words that end with the same sound, like cat and hat","Spell the word \"snowflakes\". | s-n-o-w-f-l-a-k-e-s","Spell the word \"adjective\". | a-d-j-e-c-t-i-v-e","Finish the sentence: I was walking to school when I ___ an orange butterfly. (see) | saw","Which part tells what was going on: I was reading a book when the phone rang? | I was reading a book","How many lines does a cinquain poem have? | five lines","Where does the haiku poem come from? | Japan","Do you prefer writing poems or reading poems? Why?"],"battle":["T | Tell us about a time something surprised you. | I was walking in the park when I saw a snake.","T | What does a good poet do? | A good poet observes things carefully.","B | A haiku poem is often about nature.","F | Jen was going to the movies when her phone rings. | Jen was going to the movies when her phone rang.","F | Mike reading a book when he fell asleep. | Mike was reading a book when he fell asleep.","W | robin | Make a sentence about a robin.","PT | ❄️🏔️🌨️🐦 | Write one line of a poem about this picture.","C | Is a haiku easier to write than an acrostic poem? | A haiku | An acrostic poem","Z | Name three kinds of poems from the reading.","S | Describe the sky right now like a poet. Use two sentences."],"words":["sentence | sen·tence | sen/tence | 📝","verb | verb | v/erb | 🏃","syllable | syl·la·ble | syl/la/ble | 🔤","letter | let·ter | let/ter | 🔡","noun | noun | n/oun | 🍎","adjective | ad·jec·tive | ad/jec/tive | 🎨","robin | rob·in | rob/in | 🐦","angelfish | an·gel·fish | an/gel/fish | 🐠","snowflakes | snow·flakes | snow/flakes | ❄️","television | tel·e·vi·sion | tel/e/vi/sion | 📺","thermometer | ther·mom·e·ter | ther/mom/e/ter | 🌡️","calendar | cal·en·dar | cal/en/dar | 📅","automobile | au·to·mo·bile | au/to/mo/bile | 🚗","understand | un·der·stand | un/der/stand | 💡"],"reading":["> You Can Be a Poet","> Poets write about the world in a special way. They want to share the beauty and joy of life. You can be a poet, too. Just remember these three points:","> 1. A good poet observes things carefully. When you were going to school this morning, what did you notice? Many poets write about the things they see around them. 2. A good poet has a good imagination. When you imagine, you create something in your mind. Then, when you write about it, others can enjoy your imagination, too! 3. A good poet knows how to describe things. How does something look, smell, or feel? Does it make a sound? Writing about these things can make a poem interesting.","> There are many different kinds of poems. Here are three examples that you can try right away. They are fun to write and fun to read. Try them, and you can become a poet, too.","> Acrostic: Acrostic is pronounced ah-cross-stick. An acrostic poem uses all the letters of the topic word to describe the topic. How to write an acrostic poem: Find one topic word that is interesting to you. Write the word vertically (up and down). Use each letter as the beginning of a new word. The new words should tell us something about the topic word. They don't have to be rhyming words.","> Here's an example of an acrostic poem using the topic word \"Hawaii\": Hot / Aloha / Waves / Angelfish / Interesting / Islands","> Cinquain: Cinquain is pronounced sing-cane. A cinquain poem has five lines. How to write a cinquain poem: Line 1: One noun for the topic word. Line 2: Two adjectives that describe the topic word. Line 3: Three action verbs that end in -ing. Line 4: A sentence about the topic word. Line 5: One new noun that is similar to the topic word.","> Snow: Snow / Cold, silent / Falling, dancing, glittering / Tiny snowflakes kiss my nose. / Crystals","> Haiku: Haiku is pronounced hi-ku. Haiku comes from Japan. Haiku poems use an exact number of syllables in each line. Haiku poems are often about nature and one of the four seasons. How to write a haiku poem: Line 1: Use five syllables. Line 2: Use seven syllables. Line 3: Use five syllables.","> Summer: Summer sings hello / A robin hops through the grass / Looking for a worm","> Remember to choose a topic that interests you, and carefully choose your words. Have fun sharing your poems!","RC | How many lines does a cinquain poem have? | five | three | seven","RC | Where does haiku come from? | Japan | Hawaii | the United States","RC | In an acrostic poem, how do you write the topic word? | vertically | in a circle | backwards","RT | What are haiku poems often about? | Haiku poems are often about nature and the seasons.","RT | What does a good poet do with the things around them? | A good poet observes things carefully.","RT | What goes on line 3 of a cinquain poem? | Line 3 has three action verbs that end in -ing.","RS | What are the three points a good poet remembers? Tell us one.","RS | How is a haiku different from an acrostic poem?"],"grammar":["GT | Past Continuous and Simple Past","R | past continuous (what was going on)  +  **when**  +  simple past (what happened)","R | I **was walking** to school this morning **when** I **saw** an orange butterfly.","G | I was dreaming of the ocean when the rain came down.","G | I was walking to the circus when I met a funny clown.","G | I was searching for my sock when I saw my shoe.","G | I was running in the park when I saw a beautiful blue bird.","G | Jen was going to the movies when her phone rang.","G | Mike was reading a book when he fell asleep.","G | What were you doing when the fire engine went past?","G | I was walking in the park when I saw a snake."],"sw":["SP | A: Which poem do you like best? | B: I like the {haiku} best. | A: What do you think of the acrostic poem? | B: I think it's fun and easy to write. | haiku / cinquain / acrostic / song / story / rhyme","SW | The {snow} is {dancing} in the air. The {stars} are {winking} at me. | Write two sentences with action verbs that make nature come to life."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":7,"title":"Time and the Earth","bq":"How do we measure time?","learn":["What does \"orbit\" mean? | to travel around something, like the Earth around the sun","What does \"time zone\" mean? | an area of the world that has the same time","What does \"noon\" mean? | twelve o'clock in the middle of the day","Spell the word \"minute\". | m-i-n-u-t-e","Spell the word \"multiply\". | m-u-l-t-i-p-l-y","Finish the sentence: It's 7:00 a.m. now. In four hours, it ___ 11:00 a.m. | will be","Make a future fact: Now it's 8:00 p.m. In two hours ... | In two hours, it will be 10:00 p.m.","What is the imaginary line that the Earth spins on called? | an axis","How many minutes are there in one day? | 1,440 minutes","How long does it take you to get to school in the morning?"],"battle":["T | What time will it be in three hours? | In three hours, it will be five o'clock.","T | How did people tell time before clocks? | People watched the sun move across the sky.","B | There are 24 hours in a day.","F | In two hours, it is be noon here. | In two hours, it will be noon here.","F | Tomorrow will is my birthday. | Tomorrow will be my birthday.","W | hour | Make a sentence with the word hour.","P | 🌍☀️🕛🌙 | Explain why it is day here and night there.","C | Is it better to measure time with the sun or with a clock? | The sun | A clock","Z | Name three words for measuring time.","S | Say what time it is now and what time it will be in ten hours."],"words":["january | jan·u·ar·y | jan/u/ar/y | 📅","second | sec·ond | sec/ond | ⏱️","minute | min·ute | min/ute | ⏲️","hour | hour | h/our | 🕐","month | month | m/onth | 🗓️","year | year | y/ear | 🎆","noon | noon | n/oon | 🕛","spin | spin | sp/in | 🔄","orbit | or·bit | or/bit | 🪐","multiply | mul·ti·ply | mul/ti/ply | ✖️","sunrise | sun·rise | sun/rise | 🌅","sunset | sun·set | sun/set | 🌇","planet | plan·et | plan/et | 🌍","axis | ax·is | ax/is | 📏"],"reading":["> Time and the Earth","> What time is it? That's a very good question! From morning until night, clocks help us to plan our day. They tell us when things begin and when they end.","> Before clocks, people told time by watching the sun move across the sky. They started work when the sun came up in the east. At noon, when the sun was very high, they ate and rested. When the sun disappeared in the west, they went to bed.","> Today, we know that the sun doesn't move around the Earth. The Earth turns, or spins, on an imaginary line called an axis. As the Earth turns, the sun seems to be moving across the sky. The time it takes for the Earth to make one complete turn is called a day.","> A day is divided into hours, minutes, and seconds. There are 24 hours in a day. There are 60 minutes in an hour. How many minutes are there in a day? Multiply 24 hours times 60 minutes to get the answer. 24 x 60 = 1,440. There are 1,440 minutes in one day!","> The Planets: We measure time by other movements, too. The Earth travels around, or orbits, the sun. The time it takes for the Earth to go around the sun once is called a year. One year is equal to 12 months, or just over 52 weeks. To be very accurate, it takes the Earth 365 days, 5 hours, 49 minutes, and 12 seconds to go around the sun.","> Time Zones: We divide the Earth into 24 time zones. Each time zone is one hour apart from the next time zone. For example, when it is 10:00 a.m. where you live, it is 10:00 p.m. on the opposite side of the world. In two hours, it will be noon where you live, but on the other side of the world, it will be 12:00 at night!","> Thanks to clocks and calendars, we can measure time very easily. However, it is the movement of the Earth that really allows us to measure time.","RC | What is the imaginary line the Earth spins on called? | an axis | an orbit | a time zone","RC | How many hours are there in a day? | 24 hours | 60 hours | 12 hours","RC | How long does it take the Earth to go around the sun once? | one year | one day | one month","RT | How did people tell time before clocks? | People watched the sun move across the sky.","RT | How many minutes are there in an hour? | There are 60 minutes in an hour.","RT | What do we call the time it takes the Earth to make one complete turn? | We call it a day.","RS | Why does the sun seem to move across the sky?","RS | When it is 10:00 a.m. where you live, what time is it on the opposite side of the world? Why?"],"grammar":["GT | Future Facts with Will","R | **will** + verb  →  a future fact (something that is true)","R | In two hours, it **will be** noon where you live.","R | On the other side of the world it **won't be** noon.","G | In two hours, it will be noon.","G | It will be 12:00 at night there.","G | Tomorrow the sun will rise at 6:00.","G | In four hours, it will be two o'clock.","G | What time will it be in Tokyo?","G | It won't be noon on the other side of the world.","G | The weather tomorrow will be sunny and windy."],"sw":["SP | A: What time will the sun rise tomorrow in {Taipei}? | B: It will rise at 6:00 a.m. and set at 5:30 p.m. | A: What will the weather be like? | B: It will be sunny and windy. | Taipei / Tokyo / London / New York / Sydney / Paris","SW | In {Taipei}, the sun will rise tomorrow at {6:00 a.m.} and it will set at {5:30 p.m.}. The weather tomorrow will be {sunny and warm}. | Write about the sunrise, the sunset, and the weather tomorrow in a city you choose."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":8,"title":"Doctor Molly","bq":"How do we measure time?","learn":["What does \"passenger\" mean? | a person who travels in a plane, bus, or car but does not drive it","What does \"destination\" mean? | the place where someone is going","What does \"fever\" mean? | when you are sick and your body feels very hot","Spell the word \"passport\". | p-a-s-s-p-o-r-t","Spell the word \"medicine\". | m-e-d-i-c-i-n-e","Finish the sentence: I ___ call my friend tonight. (going to) | am going to","Change to a future plan: My mom cooks today. Tomorrow my dad ... | Tomorrow my dad is going to cook.","How many hours ahead of Los Angeles is Tokyo? | sixteen hours","What was wrong with Molly's father in the morning? | He had a bad earache.","What do your parents do when you are sick?"],"battle":["T | What are you going to do this weekend? | I'm going to read a good book this weekend.","T | How did Molly take care of her father? | She put a cold washcloth on his forehead.","B | Passengers can only check two bags.","F | She is going play soccer again today. | She is going to play soccer again today.","F | My mom going to give me a present. | My mom is going to give me a present.","W | earache | Make a sentence with the word earache.","P | 🤒🌡️💊🛏️ | What should this person do? Give advice.","C | Is it better to call a doctor or rest at home when you have a cold? | Call a doctor | Rest at home","Z | Name three things you can have when you are sick.","S | Tell us two plans you have for next summer."],"words":["airport | air·port | air/port | ✈️","passenger | pas·sen·ger | pas/sen/ger | 🧳","passport | pass·port | pass/port | 🛂","destination | des·ti·na·tion | des/ti/na/tion | 📍","sick | sick | s/ick | 🤒","earache | ear·ache | ear/ache | 👂","headache | head·ache | head/ache | 🤕","fever | fe·ver | fe/ver | 🌡️","doctor | doc·tor | doc/tor | 👩‍⚕️","medicine | med·i·cine | med/i/cine | 💊","nurse | nurse | n/urse | 🧑‍⚕️","washcloth | wash·cloth | wash/cloth | 🧼","forehead | fore·head | fore/head | 🙂"],"reading":["> Doctor Molly","> Molly's mother was worried. As she packed for her business trip to Japan, Molly stood beside her with a notebook and a pencil.","> \"Do you have your passport, Mom?\" she asked. \"I do.\"","> \"Good,\" said Molly. \"Your destination is Tokyo, so you should be at the airport two hours early. Remember, passengers can only check two bags.\"","> \"Molly, thanks for trying to help, but I'm worried about your father,\" replied her mother. \"He isn't feeling well, and I have to go on this trip. Please take good care of him while I'm gone.\"","> \"I'll be a good doctor and look after him, Mom. Just like you look after me,\" Molly said. \"Thank you,\" said her mother. Soon, Molly's mother left for the airport.","> The next morning, Molly's father came to the breakfast table. He didn't look well. \"How do you feel, Dad?\" Molly asked. \"I have a bad earache. I think I'm sick,\" her father answered.","> \"Then you should take some medicine and go back to bed,\" said Molly. \"I'm going to take care of you all day.\" \"I don't think so, Molly. I've got things to do,\" replied her father. \"Dad!\" said Molly. \"Mom put me in charge. I'm the doctor.\" \"OK, you win. Thank you, Molly,\" replied her father.","> Molly looked at the kitchen clock. It was 9:00 a.m. Should she call her mom? What time was it in Japan? She remembered what her mother told her the day before. Tokyo is sixteen hours ahead of Los Angeles. Molly added some numbers in her notebook. It was 1:00 in the morning in Tokyo! Her mom was asleep. Molly sent a text message to her mother.","> Saturday, 9:00 a.m. Hi Mom! Dad is sick now. He has an earache, so I put him to bed and gave him medicine. Don't worry! I know you're sleeping. Love, Doctor Molly","> Molly's messages continued through the day. Saturday, 11:00 a.m. Hi Mom. Now Dad has a headache and a fever, so I'm giving him LOTS of water to drink. I also put a cold washcloth on his forehead. I know it's 3:00 in the morning in Tokyo. Don't worry! Love, Doctor Molly","> Saturday, 2:00 p.m. Hi Mom. Dad has a cold now. He's sneezing a lot. He's very noisy. I gave him lots of tissues. It's 2:00 p.m. here, so I know it's 6:00 in the morning in Tokyo. Love, Doctor Molly","> At 5:00 in the afternoon, the phone rang. Molly picked it up. \"Hello. This is Doctor Molly speaking.\" \"Molly, it's Mom. How's your dad?\"","> \"He's just fine, Mom. His fever is gone, his headache is gone, his earache is gone, and his sneezing is almost gone. He's watching TV and drinking orange juice.\"","> \"That's great! I was so worried. Good job, Molly,\" replied her mother. \"You're welcome, Mom. And the cell phone says that it's 5:00 p.m. here, so it's 9:00 a.m. in Tokyo. You should eat some breakfast.\"","> \"Ha! Thank you, Molly, and maybe you should study for that science test tomorrow,\" replied her mother.","RC | Where was Molly's mother going on her business trip? | Tokyo, Japan | Los Angeles | New York","RC | What was wrong with Molly's father in the morning? | an earache | a broken leg | a toothache","RC | How many hours ahead of Los Angeles is Tokyo? | sixteen hours | two hours | nine hours","RT | What did Molly put on her father's forehead? | She put a cold washcloth on his forehead.","RT | Why did Molly give her father lots of tissues? | She gave him tissues because he was sneezing a lot.","RT | What was Molly's father doing at 5:00 p.m.? | He was watching TV and drinking orange juice.","RS | Why didn't Molly call her mother at 9:00 in the morning?","RS | How did Molly take care of her father? Tell us two things."],"grammar":["GT | Future Plans with Going To","R | **am / is / are going to** + verb  →  a plan for the future","R | I**'m going to** take care of you all day.","R | My mom **is going to** give me a present.","G | I'm going to take care of you all day.","G | My mom is going to give me a present.","G | I'm going to call her tonight.","G | My mom is going to cook tomorrow.","G | She's going to play soccer again today.","G | What's your dad going to give you?","G | I'm going to buy a new pair of shoes.","G | Are you going to read a good book?"],"sw":["SP | A: Excuse me. Which way is the {cafeteria}? | B: It's down the hall, next to the gymnasium. | A: Thank you very much. | B: You're welcome. | cafeteria / library / gym / airport / doctor's office / restroom","SW | {Tomorrow}, I'm going to {visit my grandmother}. Then I'm going to {play soccer with my friends}. | Write about two plans you have for this weekend using going to."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":9,"title":"Green Energy","bq":"Where does energy come from?","learn":["What does \"pollution\" mean? | dirty air, water, or land that is bad for the Earth","What does \"renewable\" mean? | something that won't run out, like wind or sunlight","What does \"wind turbine\" mean? | a machine with blades that uses wind to make electricity","Spell the word \"electricity\". | e-l-e-c-t-r-i-c-i-t-y","Spell the word \"pollution\". | p-o-l-l-u-t-i-o-n","Change the sentence to show you are not sure: I will go to soccer practice on Saturday. | I may go to soccer practice on Saturday. / I might go to soccer practice on Saturday.","Which word shows something is not sure: We might see solar panels, or We will see solar panels? | might","What are fossil fuels made from? | plants that grew millions of years ago","What does hydropower use to make electricity? | moving water in rivers and dams","What is the best way to save energy at school?"],"battle":["T | What might you do this weekend? | I might go jogging with my dad on Sunday.","T | Why is green energy important? | Green energy is clean and it won't run out.","B | Solar power comes from the sun.","F | Coal and oil is fossil fuels. | Coal and oil are fossil fuels.","F | We may to find new sources of energy. | We may find new sources of energy.","W | power plant | Make a sentence about a power plant.","PT | 💨🌬️⚡🏡 | How does this house get energy? Type one sentence.","C | Is solar power better than wind power? | Solar power | Wind power","Z | Name three kinds of green energy.","S | Explain one way you can save energy at home."],"words":["windmill | wind·mill | wind/mill | 🌬️","sailboat | sail·boat | sail/boat | ⛵","turbine | tur·bine | tur/bine | 🌀","coal | coal | c/oal | ⚫","oil | oil | o/il | 🛢️","pollution | pol·lu·tion | pol/lu/tion | 🏭","electricity | e·lec·tric·i·ty | e/lec/tric/i/ty | ⚡","energy | en·er·gy | en/er/gy | 🔋","fuel | fu·el | fu/el | ⛽","solar | so·lar | so/lar | ☀️","biomass | bi·o·mass | bi/o/mass | 🌽","renewable | re·new·a·ble | re/new/a/ble | ♻️","reduce | re·duce | re/duce | 📉","increase | in·crease | in/crease | 📈"],"reading":["> Green Energy for Today and Tomorrow","> Did you know that most of the energy we use comes from the sun? For example, the sun helps plants to grow. Plants that grew millions of years ago turned into coal, oil, and natural gas. We call these fossil fuels. We use fossil fuels to drive our cars and trucks. They are also burned in power plants to make electricity for our homes and schools.","> However, fossil fuels make pollution. This is bad for the Earth. Fossil fuels are also nonrenewable. Some day they will be gone. So, scientists want people to use green energy.","> Why is green energy important? First, it is clean. It doesn't hurt the Earth. Next, it is renewable. It won't run out. Green energy gives us almost 25% of the electricity we use today. What are the main sources of green energy?","> Hydropower: Hydropower uses moving water in rivers and dams. Moving water has energy. This water pushes the blades of a turbine. The blades spin and make electricity. Hydropower makes 16.6% of the electricity we use.","> Wind Power: Is wind power new? No, it isn't. People used wind power many years ago. Sailboats moved with the wind. Windmills made flour from grain. Today, wind turbines make electricity. Wind farms have many wind turbines in one area. Wind power makes 4% of the electricity we use.","> Biomass: Biomass is energy that we get from plants around us. For example, dead wood or grass is burned in power plants. This makes electricity. Scientists can also turn corn into fuel for our cars. Biomass is green energy because we plant new trees or crops after we use it. Biomass makes 2% of the electricity we use.","> Solar Power: Solar power comes from sunlight. The sun shines on solar panels, and electricity is made. Solar power is now as cheap as some fossil fuels. It makes 1.5% of the electricity we use. However, we are building more solar panels each day. If you look carefully, you might see solar panels in your area!","> New Green Energy: Oceans rise and fall each day. Wind also makes big waves on the ocean. This moving water can make electricity. There is also heat under the Earth's surface. Scientists can use this heat for energy. We may find other sources of green energy in the future.","> Some day, green energy could make 100% of the electricity we use. It is clean, and it won't run out. That's good news for our Earth!","RC | What do we call coal, oil, and natural gas? | fossil fuels | green energy | biomass","RC | What does hydropower use to make electricity? | moving water | sunlight | dead wood","RC | Where does solar power come from? | sunlight | wind | corn","RT | Why is green energy important? | Green energy is clean and it is renewable.","RT | What did windmills do many years ago? | Windmills made flour from grain.","RT | What is biomass? | Biomass is energy that we get from plants around us.","RS | Why are fossil fuels bad for the Earth? Tell us one reason.","RS | What are two sources of green energy? How do they make electricity?"],"grammar":["GT | May and Might","R | **may / might** + verb  →  not sure it will happen","R | We **may** find other sources of green energy.","R | Renewable energy **might** reduce our need for fossil fuels.","G | We may find other sources of green energy.","G | You might see solar panels in your area.","G | I might visit my aunt on Sunday.","G | My family may see a movie this weekend.","G | I may get up early and go jogging.","G | I might do my homework on Sunday afternoon.","G | We might have more electric cars soon."],"sw":["SP | A: What will you do after school today? | B: I'll probably {do my homework}. | A: Will you play outside, too? | B: Yes, I'll play soccer with my friends. | do my homework / read a book / watch TV / play soccer / ride my bike / visit my grandma","SW | This weekend, I may {go to the park}. I might {ride my bike} with {my brother}. | Write two sentences about what you may or might do this weekend."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":10,"title":"Hector the Energy Saver","bq":"Where does energy come from?","learn":["What does \"traffic jam\" mean? | a long line of cars that cannot move on the road","What does \"carpool\" mean? | a group of people who travel to work or school in one car","What does \"escalator\" mean? | moving stairs that carry people up or down","Spell the word \"helicopter\". | h-e-l-i-c-o-p-t-e-r","Spell the word \"ambulance\". | a-m-b-u-l-a-n-c-e","Choose a little or a few: I have ___ pencils. | a few","Choose a little or a lot of: Mr. Big uses ___ energy. | a lot of","What did Hector's bicycle Lightning turn into? | a helicopter","Where did Hector take the ambulance? | to the hospital","Would you like to be a superhero who saves energy? Why?"],"battle":["T | What do you have in your pencil case? | I have a few pencils and a little glue.","T | How can Mr. Big's company save energy? | It can use solar panels for electricity.","B | There were only a few cars on the road.","F | I have a few water in my bottle. | I have a little water in my bottle.","F | There were a little cars on the road. | There were a few cars on the road.","W | subway | Make a sentence about the subway.","P | 🦸🚲🚁🏥 | What is Hector doing? Tell the story.","C | Is a subway better than a taxi in a big city? | A subway | A taxi","Z | Name three kinds of transportation from the unit.","S | Describe a traffic jam in two sentences."],"words":["subway | sub·way | sub/way | 🚇","carpool | car·pool | car/pool | 🚗","ambulance | am·bu·lance | am/bu/lance | 🚑","escalator | es·ca·la·tor | es/ca/la/tor | 🏬","train | train | tr/ain | 🚆","taxi | tax·i | tax/i | 🚕","elevator | el·e·va·tor | el/e/va/tor | 🛗","helicopter | hel·i·cop·ter | hel/i/cop/ter | 🚁","mask | mask | m/ask | 🎭","button | but·ton | but/ton | 🔘","pedal | ped·al | ped/al | 🚲","blades | blades | bl/ades | 🌀","recycle | re·cy·cle | re/cy/cle | ♻️","energy | en·er·gy | en/er/gy | ⚡"],"reading":["> Hector the Energy Saver!","> Hector Morales was not your normal nine-year-old boy. \"Hector, come and eat your breakfast!\" said his mom. \"But Mom, I have to go out and help people save energy!\" said Hector.","> The phone rang. It was Mr. Big from the Big Company. \"Hector, our company needs to find ways to save energy. Can you help us?\" \"Yes, sir! I'll be there right away.\" \"Eat your breakfast first, young man,\" said Mom.","> After breakfast, Hector quickly put on his mask and cape, made from old curtains from Uncle Jack's bedroom. He ran outside to his bicycle, Lightning. Lightning was not an ordinary bicycle. It had bells, recycled whistles, and fancy buttons. It had pedals made out of old potato mashers, and a seat made from an ironing pad. \"Let's help Mr. Big save energy, Lightning!\" The boy and bicycle sped off into the city.","> On the way, Hector noticed that something was wrong. A long line of cars, trucks, and taxis stood still on the road. It was a traffic jam! Hector saw an ambulance stuck among the cars. He rode Lightning along the bicycle path and up to the ambulance. \"My wife is going to have a baby!\" cried a man. \"Have no fear! I can help you!\"","> Hector pressed a button on Lightning. Bang! Wham! Lightning was now a helicopter! He connected a cable from Lightning to the ambulance. Hector jumped on the bike and began to pedal. The blades that once held an umbrella together were spinning up in the air. The helicopter went high into the sky, carrying the ambulance with it. As they went over the cars, Hector shouted to the people below, \"Carpools reduce traffic jams and save fossil fuels! You can also take the train or the subway!\"","> After he dropped off the ambulance at the hospital, Hector rode Lightning to the Big Company. Elevators and escalators were everywhere, carrying people up and down. \"Thank you for coming, Hector. My company needs lights and elevators, but they use a lot of energy.\" \"Let's go to the roof, Mr. Big.\" \"But there's nothing on the roof.\" \"Exactly.\"","> The roof was hot and sunny. \"The sun gives us lots of heat and energy. You can put solar panels on your roof. They'll make electricity to help run your lights and elevators. Solar water heaters can give your company hot water for washing and cleaning. You can be an energy saver, too.\" \"Excellent ideas, Hector! You're a hero!\" \"I'm just happy to help our planet. And now I must go to help others save energy. Goodbye, Mr. Big!\"","RC | What was Hector's bicycle called? | Lightning | Thunder | Big","RC | What did Hector see stuck in the traffic jam? | an ambulance | a fire engine | a train","RC | What did Hector tell Mr. Big to put on the roof? | solar panels | a wind turbine | an elevator","RT | What were Hector's mask and cape made from? | They were made from old curtains.","RT | What did Lightning turn into when Hector pressed the button? | Lightning turned into a helicopter.","RT | Why does Hector save energy? | He wants to help the planet.","RS | How do carpools help the city? Tell us one thing.","RS | Why did Hector take Mr. Big to the roof?"],"grammar":["GT | Quantifiers","R | **a little** → a small amount, can't count (energy, wood)","R | **a few** → a small amount, can count (cars, nails)","R | **a lot of / lots of** → a big amount, can or can't count","R | Hector uses **a little** energy.  There were only **a few** cars on the road.","G | Hector uses a little energy.","G | There were only a few cars on the road.","G | Mr. Big uses a lot of energy.","G | There were lots of cars in the traffic jam.","G | I have a few pencils and a little paper.","G | Do you have a lot of books in your bag?","G | You're going to need a lot of wood.","G | We only have a little wood and a few nails."],"sw":["SP | A: I see a {bus}. It can carry a lot of people. That saves energy. | B: That's true. What else do you see? | A: I see a train and a subway, too. | B: You're right. They save energy, too. | bus / train / subway / carpool / bicycle / taxi","SW | I want to be an energy saver like Hector. At home, I can {turn off the lights}. In my city, I can {take the subway} instead of {a taxi}. | Write three ways you can save energy at home and in your city."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":11,"title":"Mystery in the Gym","bq":"How do people make music?","learn":["What does \"conductor\" mean? | a person who stands in front of an orchestra and leads the musicians","What does \"deafening\" mean? | so loud that you cannot hear anything else","What does \"orchestra\" mean? | a large group of musicians who play together","Spell the word \"trombone\". | t-r-o-m-b-o-n-e","Spell the word \"scientist\". | s-c-i-e-n-t-i-s-t","Give the comparative and superlative of \"loud\". | louder than, the loudest","Give the comparative of \"beautiful\". | more beautiful than","What did Lisa hear first in the gym? | a low, deep booming sound like thunder","Who was the mystery guest? | a conductor with an orchestra","What is your favorite instrument to listen to? Why?"],"battle":["T | Compare two instruments you know. | A tuba is louder than a flute.","T | What did Marco think was in the gym? | Marco thought there was an elephant in the gym.","B | The conductor holds a thin white baton.","F | The tuba is more loud than the violin. | The tuba is louder than the violin.","F | She is the most smart student in our class. | She is the smartest student in our class.","W | baton | Make a sentence about a baton.","P | 🎻🥁🎺🎩 | What is happening in the gym? Tell the story.","C | Is loud music better than quiet music? | Loud music | Quiet music","Z | Name three instruments in an orchestra.","S | Say who is the funniest person you know and why."],"words":["cello | cel·lo | cel/lo | 🎻","timpani | tim·pa·ni | tim/pa/ni | 🥁","trombone | trom·bone | trom/bone | 🎺","bassoon | bas·soon | bas/soon | 🎶","orchestra | or·ches·tra | or/ches/tra | 🎼","conductor | con·duc·tor | con/duc/tor | 🎩","baton | ba·ton | ba/ton | 🪄","astronaut | as·tro·naut | as/tro/naut | 🧑‍🚀","scientist | sci·en·tist | sci/en/tist | 🔬","mystery | mys·ter·y | mys/ter/y | ❓","gym | gym | g/ym | 🏀","deafening | deaf·en·ing | deaf/en/ing | 🔊","beekeeper | bee·keep·er | bee/keep/er | 🐝","soprano | so·pran·o | so/pran/o | 🎤"],"reading":["> Mystery in the Gym","> There is a poster on the wall at school: Surprise Guest Today at 2:00 in the Gym! \"Lisa, who do you think it could be? I think it's an astronaut,\" says Marco. \"You don't know who it is,\" I say. \"Nobody knows who it is because it's a mystery.\"","> Marco blows bubbles into his milk through a straw. I try hard not to laugh. He makes a face at me, and when I'm sure he is looking, I cross my eyes. \"I read in a magazine that if you close your eyes, you can hear things more clearly. If we close our eyes, maybe we can hear things in the next room,\" I tell Marco. \"The gym is next to the lunch room, so I'm going to listen and find out who the special guest is.\"","> I close my eyes. I hear a low, deep booming sound, but I have no idea what it could be. \"It sounds like thunder,\" I tell Marco. \"Maybe it's a scientific machine for making thunderstorms or something. The mystery guest must be a scientist.\" \"I want to listen,\" Marco says. He closes his eyes and tries to listen, too.","> \"I hear the sound of a loud trumpet call,\" Marco tells me with confidence. \"There is an elephant in the gym. The mystery guest is obviously a circus trainer.\" \"A trumpeting elephant is more deafening than that,\" I tell Marco. I like to use big words like trumpeting and deafening in front of Marco. I listen again.","> There is a humming, buzzing sound that makes me feel warm right down to my toes. \"I hear a hum,\" I exclaim. \"It sounds like lots of bees. The mystery guest is a beekeeper!\" \"No, it isn't,\" Marco declares. He closes his eyes even tighter. \"I'm positive this time,\" he tells me. \"I hear an enormous hungry cow. The mystery guest is a farmer and his giant cow.\"","> \"What are you talking about? There is no hungry cow noise.\" \"Yes, there is,\" Marco argues. He takes a deep breath and shouts, \"Moooooo!\" Suddenly the school bell rings, and we both realize that it is already 2:00. It's time to see the special guest! Marco and I race each other to the gym and look inside the door.","> \"Wow! This is so cool!\" Marco yells. \"How exciting!\" I agree, smiling. There is no machine that makes weather, no elephant, no bees, and no hungry cow. We see a man in a long, fancy black jacket holding a thin white baton. All around him are musicians playing timpani drums, bassoons, cellos, trombones, and many more instruments. \"They're musical instruments!\" Marco and I say at the same time. The conductor hears us. He turns around and says, \"Welcome to the orchestra!\"","RC | Where is the surprise guest at 2:00? | in the gym | in the lunch room | in the library","RC | What does Lisa hear first? | a low, deep boom | a loud trumpet | a hungry cow","RC | Who is the mystery guest really? | an orchestra | a scientist | a beekeeper","RT | Where did Lisa learn about closing your eyes to hear better? | She read it in a magazine.","RT | What does Marco think the loud trumpet call is? | He thinks it is an elephant in the gym.","RT | What is the man in the black jacket holding? | He is holding a thin white baton.","RS | Why does Lisa think the guest is a beekeeper?","RS | How do Lisa and Marco feel about the orchestra? How do you know?"],"grammar":["GT | Comparative and Superlative Adjectives","R | loud  →  **louder than**  →  **the loudest**","R | beautiful  →  **more beautiful than**  →  **the most beautiful**","R | comparative = **two** things      superlative = **three or more** things","G | The trombone is louder than the cello.","G | A cello is more beautiful than a drum.","G | The timpani drums are the loudest instruments.","G | You're funnier than other students.","G | You're the most interesting person I know.","G | Is a trumpeting elephant more deafening than a trombone?","G | The guys in the magazine are smarter than I am.","G | Being a good friend is more important than those things."],"sw":["SP | A: Is the {trombone} as big as the cello? | B: No, it isn't. It's smaller. | A: Is a soprano voice higher or lower than an alto? | B: It's higher than an alto. | trombone / bassoon / baton / flute / clarinet / trumpet","SW | My favorite instrument is the {cello}. Its sound is {low and beautiful}. I think it is {more beautiful than} a trombone. | Write about your favorite instrument and compare it with another one."],"sound":[],"story":[],"sort":[],"pairs":[],"build":[],"partial":false},{"n":12,"title":"The World of Instruments","bq":"How do people make music?","learn":["What does \"vibrate\" mean? | to move very quickly from side to side","What does \"pitch\" mean? | how high or low a sound is","What does \"traditional\" mean? | something people in a place have done for a long time","Spell the word \"violin\". | v-i-o-l-i-n","Spell the word \"didgeridoo\". | d-i-d-g-e-r-i-d-o-o","Finish the sentence: The didgeridoo's sound is ___ low ___ the tuba's sound. | as, as","Make a sentence with not as ... as: A violin / big / a cello. | A violin is not as big as a cello.","How many strings does an erhu have? | two strings","What are the four instrument families? | strings, woodwinds, brass, and percussion","Which instrument from the unit would you like to play? Why?"],"battle":["T | Compare two things in your pencil case. | My pencil is not as long as my ruler.","T | How is a djembe different from a snare drum? | Djembe drummers use their hands, but snare drummers use drumsticks.","B | The didgeridoo is not as curved as the tuba.","F | A clarinet is not as long a bassoon. | A clarinet is not as long as a bassoon.","F | The flute sound is as sharp a whistle. | The flute sounds as sharp as a whistle.","W | panpipes | Make a sentence about panpipes.","P | 🎷🥁🎸🌏 | Which instrument is from which place? Talk about it.","C | Are string instruments better than drums? | String instruments | Drums","Z | Name three instruments from around the world.","S | Describe your favorite instrument in two sentences."],"words":["zummara | zum·ma·ra | zum/ma/ra | 🎶","flute | flute | fl/ute | 🪈","djembe | djem·be | djem/be | 🪘","tuba | tu·ba | tu/ba | 🎺","panpipes | pan·pipes | pan/pipes | 🎋","violin | vi·o·lin | vi/o/lin | 🎻","didgeridoo | didg·er·i·doo | didg/er/i/doo | 🪵","erhu | er·hu | er/hu | 🎼","clarinet | clar·i·net | clar/i/net | 🎷","drum | drum | dr/um | 🥁","traditional | tra·di·tion·al | tra/di/tion/al | 🏮","vibrate | vi·brate | vi/brate | 📳","material | ma·te·ri·al | ma/te/ri/al | 🧱","pitch | pitch | p/itch | 🎚️"],"reading":["> The World of Instruments","> All around the world, people play musical instruments. Some instruments are known everywhere, such as the modern clarinet. Other instruments are known in certain parts of the world, such as the Middle Eastern zummara. One thing is the same for all instruments. They make music!","> Most instruments fall into one of four families: strings, woodwinds, brass, and percussion. Let's compare instruments from the orchestra with traditional instruments. We will see how they are alike and different.","> Strings: The Violin and the Erhu. A string instrument makes music when its strings vibrate, or move very quickly from side to side. The violin is in this family. The erhu is also in this family. It is a traditional string instrument from China. The shapes of the violin and the erhu are alike. However, the instruments are different in one way. Most violins have four strings. The erhu only has two strings.","> Woodwinds: The Flute and the Panpipes. A woodwind instrument makes music when air vibrates in a tube. The flute is a woodwind instrument. So are the panpipes, a traditional instrument played in Peru and other parts of South America. The two instruments make similar sounds, but they are different in other ways. Flutes have one tube, while panpipes have many tubes. Flutes are usually made of metal. Panpipes are usually made of a different material such as bamboo or cane.","> Brass: The Tuba and the Didgeridoo. Brass players make music by vibrating their lips as they blow air into the instrument. The tuba is a brass instrument. The pitch, or sound, of the tuba is low when you hear it. The didgeridoo is from Australia. The sound of the didgeridoo is as low as the tuba's sound. However, unlike the metal tuba, the didgeridoo is made of wood. Also, the didgeridoo is not as curved as the tuba.","> Percussion: The Snare Drum and the Djembe. Percussion instruments vibrate and make a sound when something hits them. An orchestra snare drum and the West African djembe are both drums. However, they are different in some ways. Snare drummers use drumsticks to make a sound, but djembe drummers use

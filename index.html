  const rl=u.reading||[];if(rl.length){const paras=rl.filter(l=>l.startsWith('>')).map(l=>l.slice(1).trim()).filter(Boolean);const qs=rl.filter(l=>/^R[CTS]\s*\|/i.test(l)).map(l=>{const p=l.split('|').map(x=>x.trim());const t=p[0].toUpperCase().slice(1);return t==='C'?{type:'C',text:p[1],opts:p.slice(2).filter(Boolean)}:t==='T'?{type:'T',text:p[1],model:p[2]||''}:{type:'S',text:p[1]};}).filter(q=>q.text);
    if(paras.length||qs.length)o.reading={title:paras[0]||u.title,paras:paras.slice(1),qs};}
  (u.grammar||[]).forEach(l=>{const p=l.split('|').map(x=>x.trim());const t=p[0].toUpperCase();if(t==='GT'){o.rules.push({title:p.slice(1).join(' | '),lines:[]});return;}if(t==='R'){if(!o.rules.length)o.rules.push({title:'',lines:[]});const line=p.slice(1).filter(Boolean).join('  |  ');if(line)o.rules[o.rules.length-1].lines.push(line);return;}const s=t==='G'?p[1]:p[0];if(s)o.grammar.push(s);});
  const sl=u.sw||[];if(sl.length){const sw={dlg:[],keys:[],model:'',prompt:''};sl.forEach(l=>{const p=l.split('|').map(x=>x.trim());const t=p[0].toUpperCase();
    if(t==='SP'){const body=p.slice(1);const last=body[body.length-1];if(body.length>1&&last.includes('/')&&!/^[AB]:/i.test(last)){sw.keys=last.split('/').map(x=>x.trim()).filter(Boolean);body.pop();}body.forEach(ln=>{const m=/^([AB])\s*:\s*(.+)$/i.exec(ln);if(m)sw.dlg.push({r:m[1].toUpperCase(),t:m[2]});});}
    else if(t==='SW'){sw.model=p[1]||'';sw.prompt=p[2]||'';}});
    if(sw.dlg.length||sw.model)o.sw=sw;}
  if(/^OPW/i.test(level||'')||(u.story||[]).length||(u.sort||[]).length){o.phon=true;
    o.sound=(u.sound||[]).map(l=>{const p=l.split('|').map(x=>x.trim());return {let:p[0]||'',label:p[1]||'',key:p[2]||''};}).filter(x=>x.let);
    o.words=(u.words||[]).map(l=>{const p=l.split('|').map(x=>x.trim());if(!p[0])return null;const four=p.length>=4;const chunks=((four?p[2]:p[1])||p[0]).split('/').map(x=>x.trim()).filter(Boolean);return {w:p[0],syl:[p[0]],chunks,pic:(four?p[3]:p[2])||''};}).filter(Boolean);
    const st=u.story||[];const panels=st.filter(l=>/^P\s*\|/i.test(l)).map(l=>{const p=l.split('|').map(x=>x.trim());return {t:p[1]||'',img:p[2]||''};});const qs=st.filter(l=>/^RC\s*\|/i.test(l)).map(l=>{const p=l.split('|').map(x=>x.trim());return {type:'C',text:p[1],opts:p.slice(2).filter(Boolean)};}).filter(q=>q.text);
    o.reading=(panels.length||qs.length)?{title:u.title,paras:[],qs,panels}:null;
    const bks=[],items=[];(u.sort||[]).forEach(l=>{const p=l.split('|').map(x=>x.trim());if(!p[0]||!p[1])return;if(!bks.includes(p[1]))bks.push(p[1]);items.push({w:p[0],b:p[1]});});o.sort=items.length?{buckets:bks,items}:null;o.grammar=[];
    o.pairs=(u.pairs||[]).map(l=>l.split('|').map(x=>x.trim()).filter(Boolean)).filter(p=>p.length>=2);
    const bl=(u.build||[]).map(l=>{const p=l.split('|').map(x=>x.trim());const g=p[0].toUpperCase()==='G';return {t:g?p[1]:p[0],pic:(g?p[2]:p[1])||''};}).filter(b=>b.t);
    o.build=bl.map(b=>b.t);
    const norm=t=>String(t).toLowerCase().replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ').trim();
    o.buildPic=bl.map(b=>{if(b.pic)return b.pic;const nb=norm(b.t);const pn=nb.length>5&&(o.reading&&o.reading.panels||[]).find(p=>p.img&&(' '+norm(p.t)+' ').includes(' '+nb+' '));if(pn)return pn.img;const ws=norm(b.t).split(' ');const hit=o.words.filter(w=>ws.includes(w.w)&&w.pic);const ref=hit.find(w=>isPicRef(w.pic));return ref?ref.pic:hit.slice(0,4).map(w=>w.pic).join(' ');});
    o.alpha=/^OPW1$/i.test(level||'');o.letters=o.sound.map(x=>x.let);
    if(o.alpha){const say=[];o.letters.forEach(L=>{const w=o.words.find(w=>w.w[0]===L&&w.pic);if(w&&!say.includes(w))say.push(w);});o.words.forEach(w=>{if(say.length<4&&w.pic&&!say.includes(w))say.push(w);});o.say=say.slice(0,4);}
    o.sw=(o.pairs.length||o.build.length||(o.say&&o.say.length))?{dlg:[],keys:[],model:'',prompt:''}:null;}
  return o;}
function ltUnits(){return Array.isArray(S.ltUnits)?S.ltUnits:[];}
function ltUnit(){const us=ltUnits();if(!us.length)return null;return us[Math.max(0,Math.min(us.length-1,S.ltU||0))];}
function ltOn(cat){return !!(S.phase==='gather'&&S.lt&&S.lt.cat&&(!cat||S.lt.cat===cat));}
function ltHas(u,cat){if(u&&u.phon)return !!(cat==='words'?u.words.length:cat==='reading'?(u.reading&&(u.reading.panels.length||u.reading.qs.length)):cat==='grammar'?(u.sort&&u.sort.items.length):cat==='sw'?(u.build.length||u.pairs.length||(u.say&&u.say.length)):false);return !!(u&&(cat==='words'?u.words.length:cat==='reading'?(u.reading&&u.reading.qs.length):cat==='grammar'?u.grammar.length:cat==='sw'?u.sw:false));}
function ltStart(cat){const u=ltUnit();if(!u||!ltHas(u,cat))return toast('This unit has no '+ltCats(u)[cat][1]+' content yet.');
  S.lt={cat,u:u.n,level:u.level,i:cat==='reading'?(u.phon&&u.reading?-u.reading.panels.length||-1:-1):0,prog:{},subs:{},pairs:{},started:Date.now()};H.ltHideText=cat!=='reading';S.card=null;
  if(cat==='sw'){const byTeam={};Object.values(S.players).filter(p=>!p.pre).sort((a,b)=>a.pid.localeCompare(b.pid,undefined,{numeric:true})).forEach(p=>{(byTeam[p.team]=byTeam[p.team]||[]).push(p.pid);});
    Object.values(byTeam).forEach(ids=>{for(let k=0;k<ids.length;k+=2){const a=ids[k],b=ids[k+1]||ids[0];if(a===b){S.lt.pairs[a]={partner:null,role:'A'};continue;}S.lt.pairs[a]=Object.assign({},S.lt.pairs[a]||{},{partner:b,role:'A'});if(!S.lt.pairs[b])S.lt.pairs[b]={partner:a,role:'B'};}});}
  log(`${ltCats(u)[cat][0]} ${ltCats(u)[cat][1]} · U${u.n} ${u.title}`);crStart();changed();}
function ltStop(){if(!S.lt)return;S.lt=null;H.ltHideText=false;changed();}
function ltNext(){const u=ltUnit();if(!S.lt||S.lt.cat!=='reading'||!u||!u.reading)return;if(S.lt.i<u.reading.qs.length-1){S.lt.i++;beep(500,.1);}else{toast('That was the last question.');}changed();}
function ltPrev(){const u=ltUnit();if(!S.lt||S.lt.cat!=='reading')return;const lo=u&&u.phon&&u.reading?-(u.reading.panels.length||1):-1;if(S.lt.i>lo)S.lt.i--;changed();}
function ltProg(pid){const l=S.lt;if(!l.prog[pid])l.prog[pid]={done:{},ok:0,tries:{}};return l.prog[pid];}
function ltCoin(pid,n,why){const p=P(pid);if(!p||n<=0)return;p.coins+=n;if(p.crId)crEvent('points',{student:p.crId,delta:n,reason:why||'learning time'});floatText(pid,`+${n} 🪙`);burst(pid,['🪙'],Math.min(6,n*2),{speed:18});flashRow(pid);}
/* a tablet reports progress on the current activity */
function ltMsg(pid,m){const l=S.lt,u=ltUnit(),p=P(pid);if(!l||!u||!p||!m)return;const k=String(m.k||'');
  if(k==='word'&&l.cat==='words'){const i=+m.i;const w=u.words[i];if(!w)return;const pr=ltProg(pid);if(pr.done[i])return;pr.tries[i]=(pr.tries[i]||0)+1;if(m.ok){pr.done[i]=1;pr.ok++;ltCoin(pid,1,'word');if(pr.ok===u.words.length)log(`${p.name} finished all ${u.words.length} words! 🔤`);}changed();return;}
  if(k==='gram'&&l.cat==='grammar'){const i=+m.i;if(!u.grammar[i])return;const pr=ltProg(pid);if(pr.done[i])return;pr.tries[i]=(pr.tries[i]||0)+1;if(m.ok){pr.done[i]=pr.tries[i]===1?2:1;pr.ok++;ltCoin(pid,pr.tries[i]===1?2:1,'grammar');if(pr.ok===u.grammar.length)log(`${p.name} built all ${u.grammar.length} sentences! 🧩`);}changed();return;}
  if(k==='sort'&&l.cat==='grammar'&&u.sort){const i=+m.i;if(!u.sort.items[i])return;const pr=ltProg(pid);if(pr.done[i])return;pr.tries[i]=(pr.tries[i]||0)+1;if(m.ok){pr.done[i]=1;pr.ok++;ltCoin(pid,1,'sound sort');if(pr.ok===u.sort.items.length)log(`${p.name} sorted all ${u.sort.items.length} words! 🧩`);}changed();return;}
  if(k==='build'&&l.cat==='sw'&&u.build){const i=+m.i;if(!u.build[i])return;const pr=ltProg(pid);if(pr.done[i])return;pr.tries[i]=(pr.tries[i]||0)+1;if(m.ok){pr.done[i]=pr.tries[i]===1?2:1;pr.ok++;ltCoin(pid,pr.tries[i]===1?2:1,'build');if(pr.ok===u.build.length)log(`${p.name} built all ${u.build.length} sentences! 💬`);}changed();return;}
  if(l.cat==='reading'&&u.reading){const qi=l.i,q=u.reading.qs[qi];if(!q||qi<0)return;const pr=ltProg(pid);
    if(k==='choice'&&q.type==='C'){if(pr.done[qi]!=null)return;const ok=+m.c===0;pr.done[qi]=ok?1:0;pr.tries[qi]=1;if(ok){pr.ok++;ltCoin(pid,1,'reading');}else{sendTo(pid,{t:'fx',k:'wrong'});}changed();return;}
    if(k==='type'&&q.type==='T'){const text=String(m.text||'').replace(/\s+/g,' ').trim().slice(0,200);if(!text)return;const sb=l.subs[qi]=l.subs[qi]||{};if(sb[pid]&&sb[pid].ok)return;sb[pid]={text,ok:null,at:Date.now()};beep(600,.05);changed();return;}
    if(k==='hand'&&q.type==='S'){pr.hand=qi;changed();return;}}
  if(k==='write'&&l.cat==='sw'){const text=String(m.text||'').replace(/\s+/g,' ').trim().slice(0,300);if(!text)return;const sb=l.subs.write=l.subs.write||{};if(sb[pid]&&sb[pid].ok)return;sb[pid]={text,ok:null,at:Date.now()};beep(600,.05);changed();return;}}
/* teacher grades a typed answer / a piece of writing: ✓ +2, ⭐ +3 (and the class item), ✗ sends it back */
function ltGrade(pid,key,tier){const l=S.lt;if(!l)return;const sb=l.subs[key]&&l.subs[key][pid];if(!sb)return;const p=P(pid);
  if(tier===0){sb.ok=false;sendTo(pid,{t:'fx',k:'wrong'});changed();return;}
  if(sb.ok)return;sb.ok=tier;const pr=ltProg(pid);if(key!=='write'){pr.done[key]=tier;pr.ok++;}
  if(tier>=2)greatJob(pid);ltCoin(pid,2,key==='write'?'writing':'reading');
  if(p&&p.crId)crEvent('grade',{student:p.crId,question:-1,level:tier>=2?'great':'good',points:tier>=2?3:2,auto:false});changed();}
function ltPub(){const l=S.lt,u=ltUnit();if(!l||!u||S.phase!=='gather')return null;const o={cat:l.cat,i:l.i,unit:'U'+u.n+' '+u.title,phon:!!u.phon,alpha:!!u.alpha,letters:u.letters||[]};
  if(l.cat==='words'){o.words=u.words;if(u.phon)o.sound=u.sound;}else if(l.cat==='grammar'){if(u.phon)o.sort=u.sort;else{o.grammar=u.grammar;o.rules=u.rules||[];}}
  else if(l.cat==='reading'&&u.reading)o.reading={title:u.reading.title,paras:u.reading.paras,panels:u.reading.panels||[],qs:u.reading.qs.map(q=>({type:q.type,text:q.text,opts:q.opts||null}))};
  else if(l.cat==='sw'&&u.sw){if(u.phon){o.pairs=u.pairs;o.build=u.build;o.buildPic=u.buildPic||[];o.say=u.say||[];}else o.sw={dlg:u.sw.dlg,keys:u.sw.keys,model:u.sw.model,prompt:u.sw.prompt};}
  return o;}
function ltMy(pid){const l=S.lt;if(!l||!pid)return null;const pr=l.prog[pid]||{done:{},ok:0,tries:{}};const o={done:pr.done,ok:pr.ok,tries:pr.tries};
  if(l.cat==='reading'){const sb=l.subs[l.i]&&l.subs[l.i][pid];o.sub=sb?{text:sb.text,ok:sb.ok}:null;o.hand=pr.hand===l.i;}
  if(l.cat==='sw'){const pr2=l.pairs[pid];if(pr2){const q=pr2.partner&&P(pr2.partner);o.partner=q?q.name:'';o.role=pr2.role;}const sb=l.subs.write&&l.subs.write[pid];o.write=sb?{text:sb.text,ok:sb.ok}:null;}
  return o;}
function ltCount(u,cat){if(u.phon)return cat==='words'?u.words.length:cat==='grammar'?(u.sort?u.sort.items.length:0):cat==='reading'?(u.reading?u.reading.qs.length:0):(u.build.length||(u.pairs.length?1:0));return cat==='words'?u.words.length:cat==='grammar'?u.grammar.length:cat==='reading'?(u.reading?u.reading.qs.length:0):u.sw?1:0;}
/* teacher console panel (Learning Time only) */

  const unitSel=us.length>1?`<select id="lt-unit" data-act="lt-unit">${us.map((x,i)=>`<option value="${i}" ${(S.ltU||0)===i?'selected':''}>U${x.n} ${esc(x.title)}</option>`).join('')}</select>`:`<b>U${u.n} ${esc(u.title)}</b>`;

    const chips=ps.map(p=>{const pr=l.prog[p.pid]||{done:{},ok:0};const n=Object.keys(pr.done).length;const wr=l.cat==='sw'&&!u.phon;return `<span class="chipx${wr?'':n>=total&&total?' ok':''}" style="border-left:5px solid ${teamColor(p.team)}">${esc(p.name)} ${wr?(l.subs.write&&l.subs.write[p.pid]?(l.subs.write[p.pid].ok?'✓':'✍️'):'…'):`${pr.ok}/${total}`}${l.cat==='reading'&&pr.hand===l.i?' 🙋':''}</span>`;}).join('');

      <div class="ltq">${q?`<b>Q${l.i+1}/${r.qs.length}</b> ⚖️ ${esc(q.text)}<small>Answer: ${esc(q.opts[0])}</small>`:`<b>Panel ${k+1}/${P}</b> ${esc((r.panels[k]||{}).t||'')}<small>Read the panel together, then press Next.</small>`}</div>`;}
    else if(l.cat==='reading'){const q=u.reading.qs[l.i];ctl=`<div class="row"><button class="btn" data-act="lt-prev" ${l.i<0?'disabled':''}>◀</button><button class="btn primary big" data-act="lt-next" ${l.i>=u.reading.qs.length-1?'disabled':''}>${l.i<0?'▶ First question':'Next question ▶'}</button><button class="btn" data-act="lt-text">${H.ltHideText?'📖 Show text':'🙈 Hide text'}</button><button class="btn" data-act="lt-stop">⏹ Stop</button></div>

function onHostClick(e){

  switch(a){
    case 'qr-toggle':S.showQR=!S.showQR;changed();break;
    case '3d':S.ui3d=!S.ui3d;apply3d();changed();break;
    case '3d-retry':$('#modal-root').innerHTML='';H.no3d=false;H.no3dWhy='';S.ui3d=true;apply3d();changed();break;

    case 'bases':{const pop=$('#p3d-pop');pop.hidden=!pop.hidden;if(!pop.hidden&&ui3d())H.hb3d.renderBases();break;}
    case 'qr-big':openBigQR();break;
    case 'card':{const q=pick(gatherQs,'qOrder','qPtr');S.card=q||{q:'Ask your own question!',a:''};S.card.ci=crIndex(S.card.src);H.showAns=false;crStart();changed();break;}
    case 'card-close':S.card=null;changed();break;

    case 'lt-stop':ltStop();break;
    case 'lt-next':ltNext();break;
    case 'lt-prev':ltPrev();break;

    case 'lt-grade':ltGrade(pid,b.dataset.key,+b.dataset.t);break;
    case 'show-ans':H.showAns=!H.showAns;renderOverlay();break;

    case 'defense':startDefense();break;

    case 'boss':summonBoss();break;

    case 'vote-reveal':revealVote();break;
    case 'vote-close':closeVote();break;
    case 'spell-ok':castSpell(pid,true);break;
    case 'spell-no':castSpell(pid,false);break;
    case 'model':H.showModel=!H.showModel;render();break;
    case 'resolve':resolveRound();break;
    case 'ok':markCorrect(pid,1);break;
    case 'no':markCorrect(pid,0);break;
    case 'approve-good':approveAllGood();break;
    case 'm-act':onAct(pid,b.dataset.k,b.dataset.t);$('#modal-root').innerHTML='';break;
    case 'fx':{if(FX.on&&!FX.lite){FX.lite=true;store('habitat-fx','lite');}else if(FX.on&&FX.lite){FX.on=false;FX.lite=false;store('habitat-fx',false);}else{FX.on=true;FX.lite=false;store('habitat-fx',true);}
      FX.parts=[];FX.amb=[];FX.projs.forEach(p=>p.res());FX.projs=[];document.body.classList.toggle('nofx',!fxOn());document.body.classList.toggle('lite',FX.lite);renderHeader();break;}
    case 'sound':H.sound=!H.sound;renderHeader();break;

    case 'm-close':if(e.target===b||b.tagName==='BUTTON'){$('#modal-root').innerHTML='';H.confirm=null;applyScene(S.scene);}break;
    case 'd-scene':readSetupInputs();H.setupDraft.scene=b.dataset.k;applyScene(b.dataset.k);renderSetup();break;
    case 'd-teams':readSetupInputs();H.setupDraft.teamCount=+b.dataset.n;renderSetup();break;
    case 'd-min':readSetupInputs();H.setupDraft.battleMin=+b.dataset.n;renderSetup();break;
    case 'd-tab3d':readSetupInputs();H.setupDraft.tab3d=b.dataset.v==='1';renderSetup();break;
    case 'd-save':{readSetupInputs();const d=H.setupDraft;S.scene=d.scene;S.teamCount=d.teamCount;S.teams=d.teams;S.qText=d.qText;S.bText=d.bText;S.battleMin=d.battleMin;S.tab3d=!!d.tab3d;S.qOrder=[];S.bOrder=[];
      Object.values(S.players).forEach(p=>{if(p.team>=S.teamCount)p.team=0;});log(`Welcome to ${SCENES[S.scene].name}!`);$('#modal-root').innerHTML='';changed();break;}
    case 'reset-game':if(H.confirm==='reset'){Object.values(S.players).forEach(p=>Object.assign(p,{coins:0,lv:1,hp:HPMAX[1],armor:0,inv:{atk:0,def:0,heal:0},items:0,powers:0,dash:false,warp:false,down:false,pts:0}));S.phase='gather';S.battle=null;S.results=null;S.card=null;S.log=['New game! Answer questions to collect supplies.'];H.confirm=null;$('#modal-root').innerHTML='';changed();}else{readSetupInputs();H.confirm='reset';renderSetup();}break;
    case 'new-game':if(H.confirm==='new'){readSetupInputs();const d=H.setupDraft;S=newState({scene:d.scene,teamCount:d.teamCount,teams:d.teams,qText:d.qText,bText:d.bText,battleMin:d.battleMin});H.confirm=null;H.conns.forEach((_,c)=>{try{c.close();}catch(e){}});H.conns.clear();$('#modal-root').innerHTML='';makeQR($('#qr'),220);changed();startHost();}else{readSetupInputs();H.confirm='new';renderSetup();}break;
  }
}

function avKey(){return CR.inRunner&&CR.init&&CR.init.me?'habitat-av-'+CR.init.me.id:'habitat-av';}
const ST={s:null,me:null,my:null,view:'',team:null,char:null,name:'',av:store('habitat-av')?cleanAv(store('habitat-av')):randomAv(),peer:null,conn:null,status:'Connecting to the game…',retry:null,qKey:'',draft:'',prev:null};
function cid(){let c=store('habitat-cid-'+JOIN);if(!c){c=Math.random().toString(36).slice(2)+Date.now().toString(36);store('habitat-cid-'+JOIN,c);}return c;}
function sSend(m){if(ST.conn&&ST.conn.open){try{ST.conn.send(m);return true;}catch(e){}}toast('Not connected. Trying again…');return false;}
function studentConnect(){
  if(typeof Peer==='undefined'){ST.status='No internet connection. Check the Wi-Fi and reload.';sRender();return;}
  clearTimeout(ST.retry);try{ST.peer&&ST.peer.destroy();}catch(e){}
  const peer=new Peer(undefined,peerOpts());ST.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect(peerIdFor(JOIN),{reliable:true,serialization:'json'});ST.conn=conn;
    const to=setTimeout(()=>{if(!conn.open){ST.status='Still trying to reach the teacher…';sRender();retrySoon();}},9000);
    conn.on('open',()=>{clearTimeout(to);conn.send({t:'hello',cid:cid()});});
    conn.on('data',sRecv);
    conn.on('close',()=>{ST.status='Connection lost. Reconnecting…';ST.s=null;ST.view='';sRender();retrySoon();});
  });
  peer.on('error',e=>{ST.status=e.type==='peer-unavailable'?`Game ${JOIN} is not open yet. Waiting for the teacher…`:'Connection problem. Retrying…';sRender();retrySoon();});

   const cl=u.flag.userData.cloth,pa=cl.geometry.attributes.position.array,ba=cl.userData.base;for(let i=0;i<pa.length;i+=3){pa[i+2]=Math.sin(t*5+ba[i]*3)*.12*ba[i];}cl.geometry.attributes.position.needsUpdate=true;

/* ===== embed API: index.html owns the game state and pushes it in with sync(); the stage only animates ===== */
function byPid(pid){return players.find(g=>g.userData.p.pid===pid)||null;}
function parseCol(c){if(typeof c==='number')return c;const m=/^#?([0-9a-f]{6})$/i.exec(String(c||''));return m?parseInt(m[1],16):0x888888;}
let lastKey='',syncing=false;
function sync(h){if(syncing)return;syncing=true;try{
 const tc=Math.max(2,Math.min(4,h.teamCount||2));
 TEAMS=(h.teams||[]).slice(0,tc).map((t,i)=>({name:String(t.name||'Team '+(i+1)).replace(/\s+Team$/i,''),color:parseCol(t.color),css:t.color||'#888'}));while(TEAMS.length<tc)TEAMS.push(TEAM_DEFS[TEAMS.length]);
 const list=Object.values(h.players||{}).filter(p=>p.team>=0&&p.team<tc).map(p=>({pid:p.pid,name:p.name,char:p.char,cls:p.cls||'animal',team:p.team,lv:Math.max(1,Math.min(3,p.lv||1)),av:p.av||null}));
 const sites=TEAMS.map((t,i)=>{const s=h.teams[i]&&h.teams[i].site;return Number.isInteger(s)&&s>=0?s:i;});
 const sceneKey=ENV[h.scene]?h.scene:'jungle';
 const key=[sceneKey,tc,sites.join(),list.map(p=>[p.pid,p.name,p.char,p.team,p.cls,JSON.stringify(p.av)].join('|')).join(';')].join('#');
 /* a player whose level went DOWN (reset) is rebuilt; a level UP plays the expansion animation below */
 const downs=players.filter(g=>{const q=h.players&&h.players[g.userData.p.pid];return q&&q.lv<g.userData.p.lv;});
 if(sceneKey!==current||!env||key!==lastKey||downs.length){lastKey=key;HOST_ROSTER=list.map(p=>{const g=byPid(p.pid);const cur=g?g.userData.p.lv:p.lv;return Object.assign({},p,{lv:Math.max(1,Math.min(3,Math.min(cur,p.lv)))});});
  teamCount=tc;teamSite=sites.concat([0,1,2,3].slice(sites.length));
  spotEnd(false);if(sceneKey!==current||!env)loadScene(sceneKey);else buildTeams();}
 players.forEach(g=>{const u=g.userData,q=h.players&&h.players[u.p.pid];if(!q)return;
  if(q.lv>u.p.lv&&!u.down&&!u.building){if(!levelUp(g))u.p.lv=q.lv;}
  if(u.inFlight||u.building)return;
  u.hp0=q.max||HPMAX[u.p.lv-1];if(q.down&&!u.down)knockOut(g);else if(!q.down&&u.down)revive(g);setHp(g,q.down?0:Math.max(0,Math.min(u.hp0,q.hp|0)));});
 const hb=h.boss;if(hb&&!boss)summonBoss(hb.name);if(!hb&&boss){world.remove(boss);boss=null;}
}finally{syncing=false;}}
function hitPromise(g,go,ms){return new Promise(res=>{if(!g){res();return;}g.userData.inFlight=true;g.userData.onLand=()=>{g.userData.inFlight=false;g.userData.onLand=null;res();};go();later(()=>{if(g.userData.onLand){const f=g.userData.onLand;g.userData.onLand=null;g.userData.inFlight=false;f();}},ms);});}

 TEAMS=[{name:String(v.teamName||'Team').replace(/\s+Team$/i,''),color:parseCol(v.teamColor),css:v.teamColor||'#888'}];

 if(!mp||k!==miniKey){if(mp){world.remove(mp);players=players.filter(g=>g!==mp);}miniKey=k;mp=makePlayer({pid:v.pid,name:v.name,char:v.char,cls:v.cls||'animal',team:0,lv:Math.max(1,Math.min(3,v.lv||1)),av:v.av||null,i:null},env.sites[0],0,1);bendTree(mp);mp.userData.hp0=v.max||HPMAX[mp.userData.p.lv-1];setHp(mp,v.down?0:v.hp|0);if(v.down)knockOut(mp);return;}
 const u=mp.userData;if(v.lv>u.p.lv&&!u.down&&!u.building){if(!levelUp(mp))u.p.lv=v.lv;}else if(v.lv<u.p.lv){miniKey='';return miniShow(v);}
 if(u.building)return;u.hp0=v.max||HPMAX[u.p.lv-1];if(v.down&&!u.down)knockOut(mp);else if(!v.down&&u.down)revive(mp);setHp(mp,v.down?0:Math.max(0,Math.min(u.hp0,v.hp|0)));}

 if(kind==='happy'){setFace(u.ch,'happy',2600);jump(mp);spawn(hp,0xffd43b,10+(tier||1)*8,4,6,1.2);if((tier||1)>=2)spawn(hp,TEAMS[0].color,10,4,6,1.1);if(tier===3)ring(mp.position,0xffd43b,6,.9);}
 else if(kind==='ouch'){setFace(u.ch,'ouch',2200);u.shake=1.2;shakeCam=.8;spawn(hp,0xff6b6b,14,5,5,1);}
